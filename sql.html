<!doctype html><html lang="fr"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>

<script>
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v===false||v==null)continue;
    if(k==='class')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  for(const k of kids.flat())if(k!=null&&k!==false)el.append(k.nodeType?k:document.createTextNode(k));
  return el;
}
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3000);}
const KEYS={act:'atelier-sql-cpge-v1'};
const LSOK=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
const MEM={};
function lsGet(k,d){try{const v=LSOK?localStorage.getItem(k):MEM[k];return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{const s=JSON.stringify(v);if(LSOK)localStorage.setItem(k,s);else MEM[k]=s;}catch(e){MEM[k]=JSON.stringify(v);}}
const cm=t=>'<code class="k">'+t+'</code>';
const fmt=n=>(Math.round(n*100)/100).toString().replace('.',',');

/* ===== base de données : scolarité (style concours) ===== */
const DB={
 etudiants:{cols:['ine','nom','ville'],pk:'ine',
  rows:[[1,'Alice','Lyon'],[2,'Bruno','Paris'],[3,'Chloé','Lyon'],[4,'David','Marseille'],[5,'Emma','Paris'],[6,'Farid','Lyon'],[7,'Gaël','Nantes'],[8,'Hélène','Lyon']]},
 modules:{cols:['code','intitule','credits'],pk:'code',
  rows:[['AN201','Analyse',6],['ECO201','Économie',4],['IN301','Informatique',4],['MA101','Algèbre linéaire',6],['PH101','Physique',5]]},
 notes:{cols:['etudiant','module','valeur'],pk:null,
  rows:[[1,'MA101',14],[1,'AN201',11],[1,'IN301',16],[2,'MA101',9],[2,'AN201',12],[2,'ECO201',7],[3,'MA101',17],[3,'AN201',15],[3,'IN301',18],[3,'PH101',13],[4,'PH101',11],[5,'AN201',13],[5,'ECO201',15],[6,'MA101',12],[6,'IN301',10],[8,'MA101',15],[8,'PH101',16]]}
};
const SCHEMA_NOTE='notes(<i>etudiant</i>, <i>module</i>, valeur)  — clé primaire (etudiant, module)';

/* ===== mini moteur SQL (testé) ===== */
const sqlErr=m=>{throw new Error(m);};
function lex(src){
  const T=[];let i=0;
  const isD=c=>c>='0'&&c<='9',isI=c=>/[A-Za-z_À-ÿ]/.test(c);
  while(i<src.length){
    const c=src[i];
    if(/\s/.test(c)){i++;continue;}
    if(c==='-'&&src[i+1]==='-'){while(i<src.length&&src[i]!=='\n')i++;continue;}
    if(c==="'"){let j=i+1,v='';while(j<src.length){if(src[j]==="'"){if(src[j+1]==="'"){v+="'";j+=2;continue;}break;}v+=src[j++];}if(src[j]!=="'")sqlErr('Guillemet non fermé');j++;T.push({t:'str',v});i=j;continue;}
    if(isD(c)||(c==='.'&&isD(src[i+1]))){let j=i;while(j<src.length&&(isD(src[j])||src[j]==='.'))j++;T.push({t:'num',v:parseFloat(src.slice(i,j))});i=j;continue;}
    if(isI(c)){let j=i;while(j<src.length&&(isI(src[j])||isD(src[j])))j++;T.push({t:'id',v:src.slice(i,j)});i=j;continue;}
    const two=src.slice(i,i+2);
    if(two==='<='||two==='>='||two==='<>'||two==='!='){T.push({t:'op',v:two==='!='?'<>':two});i+=2;continue;}
    if('=<>+-*/%(),.;'.includes(c)){T.push({t:'op',v:c});i++;continue;}
    sqlErr('Caractère inattendu : « '+c+' »');
  }
  T.push({t:'end'});return T;
}
const RESERVED=new Set(['SELECT','FROM','WHERE','GROUP','BY','HAVING','ORDER','LIMIT','JOIN','INNER','LEFT','CROSS','ON','AS','AND','OR','NOT','DISTINCT','DESC','ASC','LIKE','IN','IS','NULL']);
function parse(sql){
  const T=lex(sql);let p=0;
  const peek=()=>T[p],next=()=>T[p++];
  const eat=v=>{if(T[p].t==='op'&&T[p].v===v){p++;return true;}return false;};
  const expect=v=>{if(!eat(v))sqlErr('« '+v+' » attendu');};
  const kw=()=>T[p].t==='id'?T[p].v.toUpperCase():null;
  const eatKw=w=>{if(kw()===w){p++;return true;}return false;};
  const expectKw=w=>{if(!eatKw(w))sqlErr('« '+w+' » attendu');};
  function primary(){
    const t=peek();
    if(t.t==='num'||t.t==='str'){next();return {k:'lit',v:t.v};}
    if(t.t==='op'&&t.v==='('){next();const e=orE();expect(')');return e;}
    if(t.t==='op'&&t.v==='*'){next();return {k:'star'};}
    if(t.t==='id'){
      next();const name=t.v;
      if(peek().t==='op'&&peek().v==='('){
        next();const args=[];
        if(peek().t==='op'&&peek().v==='*'){next();args.push({k:'star'});}
        else if(!(peek().t==='op'&&peek().v===')')){args.push(orE());while(eat(','))args.push(orE());}
        expect(')');
        return {k:'fn',name:name.toUpperCase(),args};
      }
      if(peek().t==='op'&&peek().v==='.'){next();const c=next();if(c.t!=='id')sqlErr('Attribut attendu après « . »');return {k:'col',table:name,name:c.v};}
      if(name.toUpperCase()==='NULL')return {k:'lit',v:null};
      return {k:'col',name};
    }
    sqlErr('Expression attendue');
  }
  function unE(){if(peek().t==='op'&&peek().v==='-'){next();return {k:'neg',e:unE()};}if(peek().t==='id'&&peek().v.toUpperCase()==='NOT'){next();return {k:'not',e:unE()};}return primary();}
  function mulE(){let l=unE();while(peek().t==='op'&&(peek().v==='*'||peek().v==='/'||peek().v==='%')){const op=next().v;l={k:'bin',op,l,r:unE()};}return l;}
  function addE(){let l=mulE();while(peek().t==='op'&&(peek().v==='+'||peek().v==='-')){const op=next().v;l={k:'bin',op,l,r:mulE()};}return l;}
  function inE(l,neg){expect('(');const list=[addE()];while(eat(','))list.push(addE());expect(')');return {k:'in',e:l,list,neg};}
  function cmpE(){
    let l=addE();const t=peek();
    if(t.t==='op'&&['=','<>','<','>','<=','>='].includes(t.v)){const op=next().v;return {k:'cmp',op,l,r:addE()};}
    if(t.t==='id'){
      const w=t.v.toUpperCase();
      if(w==='LIKE'){next();return {k:'like',l,pat:addE(),neg:false};}
      if(w==='IS'){next();if(eatKw('NOT')){expectKw('NULL');return {k:'isnull',e:l,neg:true};}expectKw('NULL');return {k:'isnull',e:l,neg:false};}
      if(w==='NOT'){next();const w2=kw();if(w2==='LIKE'){next();return {k:'like',l,pat:addE(),neg:true};}if(w2==='IN'){next();return inE(l,true);}sqlErr('LIKE ou IN attendu après NOT');}
      if(w==='IN'){next();return inE(l,false);}
    }
    return l;
  }
  function andE(){let l=cmpE();while(peek().t==='id'&&peek().v.toUpperCase()==='AND'){next();l={k:'and',l,r:cmpE()};}return l;}
  function orE(){let l=andE();while(peek().t==='id'&&peek().v.toUpperCase()==='OR'){next();l={k:'or',l,r:andE()};}return l;}
  function alias(){if(eatKw('AS')){const a=next();if(a.t!=='id')sqlErr('Alias attendu');return a.v;}if(peek().t==='id'&&!RESERVED.has(peek().v.toUpperCase()))return next().v;return null;}
  expectKw('SELECT');
  const distinct=eatKw('DISTINCT');
  const select=[];
  do{const e=orE();select.push({e,alias:alias()});}while(eat(','));
  expectKw('FROM');
  const tables=[];
  function tableRef(){const t=next();if(t.t!=='id')sqlErr('Nom de table attendu');const a=alias();tables.push({table:t.v,alias:a||t.v});}
  tableRef();
  const joins=[];
  while(true){
    let type=null;
    if(eatKw('JOIN'))type='inner';
    else if(eatKw('INNER')){expectKw('JOIN');type='inner';}
    else if(eatKw('LEFT')){expectKw('JOIN');type='left';}
    else if(eatKw('CROSS')){expectKw('JOIN');type='cross';}
    else break;
    tableRef();
    let on=null;
    if(type!=='cross'){expectKw('ON');on=orE();}
    joins.push({table:tables[tables.length-1],type,on});
  }
  let where=null;if(eatKw('WHERE'))where=orE();
  let groupBy=null;
  if(eatKw('GROUP')){expectKw('BY');groupBy=[orE()];while(eat(','))groupBy.push(orE());}
  let having=null;if(eatKw('HAVING'))having=orE();
  let orderBy=null;
  if(eatKw('ORDER')){expectKw('BY');orderBy=[];do{const e=orE();let dir=1;if(eatKw('DESC'))dir=-1;else eatKw('ASC');orderBy.push({e,dir});}while(eat(','));}
  let limit=null;
  if(eatKw('LIMIT')){const t=next();if(t.t!=='num')sqlErr('Nombre attendu après LIMIT');limit=t.v;}
  eat(';');
  if(peek().t!=='end')sqlErr('Fin de requête inattendue (près de « '+(peek().v??'fin')+' »)');
  return {distinct,select,tables,joins,where,groupBy,having,orderBy,limit};
}
const AGGS=new Set(['COUNT','SUM','AVG','MIN','MAX']);
function hasAgg(e){
  if(!e||!e.k)return false;
  if(e.k==='fn')return AGGS.has(e.name)||e.args.some(hasAgg);
  if(['neg','not','isnull'].includes(e.k))return hasAgg(e.e);
  if('l' in e)return hasAgg(e.l)||hasAgg(e.r);
  if(e.k==='in')return hasAgg(e.e)||e.list.some(hasAgg);
  return false;
}
function cmpVal(a,b){
  if(typeof a==='number'&&typeof b==='number')return a<b?-1:a>b?1:0;
  const x=String(a),y=String(b);return x<y?-1:x>y?1:0;
}
function likeMatch(v,pat){
  const r=new RegExp('^'+String(pat).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'[\\s\\S]*').replace(/_/g,'[\\s\\S]')+'$','i');
  return r.test(String(v));
}
function evalExpr(e,row,grp){
  switch(e.k){
    case 'lit':return e.v;
    case 'star':sqlErr('* inattendu ici');
    case 'col':{
      let key=null;
      if(e.table)key=e.table+'.'+e.name;
      else key=Object.keys(row).find(k=>k===e.name)||Object.keys(row).find(k=>k.endsWith('.'+e.name))||null;
      if(key===null)sqlErr('Colonne inconnue : « '+e.name+' »');
      return row[key];
    }
    case 'neg':return -Number(evalExpr(e.e,row,grp));
    case 'not':return evalExpr(e.e,row,grp)?0:1;
    case 'and':return (evalExpr(e.l,row,grp)?evalExpr(e.r,row,grp):false)?1:0;
    case 'or':return (evalExpr(e.l,row,grp)||evalExpr(e.r,row,grp))?1:0;
    case 'bin':{const a=Number(evalExpr(e.l,row,grp)),b=Number(evalExpr(e.r,row,grp));return e.op==='+'?a+b:e.op==='-'?a-b:e.op==='*'?a*b:e.op==='/'?(b===0?null:a/b):a%b;}
    case 'cmp':{const a=evalExpr(e.l,row,grp),b=evalExpr(e.r,row,grp);if(a===null||b===null)return 0;const c=cmpVal(a,b);if(e.op==='=')return c===0?1:0;if(e.op==='<>')return c!==0?1:0;if(e.op==='<')return c<0?1:0;if(e.op==='>')return c>0?1:0;if(e.op==='<=')return c<=0?1:0;return c>=0?1:0;}
    case 'like':{const r=likeMatch(evalExpr(e.l,row,grp),evalExpr(e.pat,row,grp));return (e.neg?!r:r)?1:0;}
    case 'isnull':{const a=evalExpr(e.e,row,grp);return (e.neg?a!==null:a===null)?1:0;}
    case 'in':{const a=evalExpr(e.e,row,grp);const r=e.list.some(x=>cmpVal(a,evalExpr(x,row,grp))===0);return (e.neg?!r:r)?1:0;}
    case 'fn':{
      if(AGGS.has(e.name)){
        if(!grp)sqlErr(e.name+'(...) doit être utilisé avec GROUP BY ou seul dans le SELECT');
        let vals;
        if(e.args[0].k==='star')vals=grp.map(()=>1);
        else vals=grp.map(r=>evalExpr(e.args[0],r,null)).filter(v=>v!==null&&v!==undefined);
        if(e.name==='COUNT')return vals.length;
        if(!vals.length)return null;
        if(e.name==='MIN')return vals.reduce((a,b)=>cmpVal(a,b)<=0?a:b);
        if(e.name==='MAX')return vals.reduce((a,b)=>cmpVal(a,b)>=0?a:b);
        const nums=vals.map(Number),s=nums.reduce((a,b)=>a+b,0);
        return e.name==='SUM'?s:s/nums.length;
      }
      const a=evalExpr(e.args[0],row,grp);
      if(e.name==='UPPER')return String(a).toUpperCase();
      if(e.name==='LOWER')return String(a).toLowerCase();
      if(e.name==='LENGTH')return String(a).length;
      if(e.name==='ABS')return Math.abs(Number(a));
      if(e.name==='ROUND'){const d=e.args[1]?Number(evalExpr(e.args[1],row,grp)):0;return Math.round(Number(a)*Math.pow(10,d))/Math.pow(10,d);}
      sqlErr('Fonction inconnue : '+e.name);
    }
  }
  sqlErr('Expression non gérée');
}
function exprText(e){
  if(!e)return '';
  switch(e.k){
    case 'lit':return e.v===null?'NULL':typeof e.v==='number'?String(e.v):"'"+e.v+"'";
    case 'star':return '*';
    case 'col':return (e.table?e.table+'.':'')+e.name;
    case 'fn':return e.name+'('+e.args.map(exprText).join(', ')+')';
    case 'neg':return '-'+exprText(e.e);
    case 'not':return 'NOT '+exprText(e.e);
    case 'and':return exprText(e.l)+' AND '+exprText(e.r);
    case 'or':return exprText(e.l)+' OR '+exprText(e.r);
    case 'bin':return exprText(e.l)+' '+e.op+' '+exprText(e.r);
    case 'cmp':return exprText(e.l)+' '+e.op+' '+exprText(e.r);
    case 'like':return exprText(e.l)+(e.neg?' NOT':'')+' LIKE '+exprText(e.pat);
    case 'isnull':return exprText(e.e)+' IS '+(e.neg?'NOT ':'')+'NULL';
    case 'in':return exprText(e.e)+(e.neg?' NOT':'')+' IN ('+e.list.map(exprText).join(', ')+')';
  }
  return '?';
}
function runQuery(sql){
  const Q=parse(sql);
  if(Q.select.length===1&&Q.select[0].e.k==='star'){
    const all=[],seen=new Set();
    for(const t of Q.tables){if(!DB[t.table])sqlErr('Table inconnue : « '+t.table+' »');for(const c of DB[t.table].cols){const k=t.alias+'.'+c;if(!seen.has(k)){seen.add(k);all.push({e:{k:'col',table:t.alias,name:c},alias:c});}}}
    Q.select=all;
  }
  const stats={};
  const tableRows=ref=>{
    const t=DB[ref.table];if(!t)sqlErr('Table inconnue : « '+t.table+' »');
    return t.rows.map(r=>{const o={};t.cols.forEach((c,i)=>{o[ref.alias+'.'+c]=r[i];if(!(c in o))o[c]=r[i];});return o;});
  };
  let rows=tableRows(Q.tables[0]);
  for(const j of Q.joins){
    const rt=tableRows(j.table);const out=[];
    if(j.type==='left'){
      for(const a of rows){
        let any=false;
        for(const b of rt){const m={...a,...b};if(evalExpr(j.on,m,null)){out.push(m);any=true;}}
        if(!any){const m={...a};for(const k in rt[0])if(!(k in m))m[k]=null;out.push(m);}
      }
    }else{
      for(const a of rows)for(const b of rt){const m={...a,...b};if(j.type==='cross'||evalExpr(j.on,m,null))out.push(m);}
    }
    rows=out;
  }
  stats.from=rows.length;
  const fromRows=JSON.parse(JSON.stringify(rows));

  if(Q.where)rows=rows.filter(r=>evalExpr(Q.where,r,null));
  stats.where=rows.length;
  const whereRows=JSON.parse(JSON.stringify(rows));

  const anyAgg=Q.select.some(s=>hasAgg(s.e))||hasAgg(Q.having)||(Q.orderBy||[]).some(o=>hasAgg(o.e));
  let ctxs;
  if(Q.groupBy){
    const gm=new Map();
    for(const r of rows){const key=JSON.stringify(Q.groupBy.map(g=>evalExpr(g,r,null)));if(!gm.has(key))gm.set(key,[]);gm.get(key).push(r);}
    ctxs=[...gm.values()];
  }else if(anyAgg)ctxs=[rows];
  else ctxs=rows.map(r=>[r]);
  stats.groups=ctxs.length;
  const groupRows=JSON.parse(JSON.stringify(ctxs.map(g=>g[0])));

  if(Q.having)ctxs=ctxs.filter(g=>evalExpr(Q.having,g[0],g));
  stats.having=ctxs.length;
  const havingRows=JSON.parse(JSON.stringify(ctxs.map(g=>g[0])));

  const cols=Q.select.map(s=>s.alias||(s.e.k==='col'?s.e.name:exprText(s.e)));
  let recs=ctxs.map(g=>({vals:Q.select.map(s=>evalExpr(s.e,g[0],g)),g}));
  if(Q.distinct){const seen=new Set();recs=recs.filter(r=>{const k=JSON.stringify(r.vals);if(seen.has(k))return false;seen.add(k);return true;});}
  if(Q.orderBy){
    for(const o of Q.orderBy){
      const j=o.e.k==='col'&&!o.e.table?cols.indexOf(o.e.name):-1;
      const key=r=>j>=0?r.vals[j]:evalExpr(o.e,r.g[0],r.g);
      recs.sort((A,B)=>{const a=key(A),b=key(B);if(a===null&&b===null)return 0;if(a===null)return 1;if(b===null)return -1;return (o.dir*cmpVal(a,b))||0;});
    }
  }
  if(Q.limit!==null)recs=recs.slice(0,Q.limit);
  stats.result=recs.length;
  return {cols,rows:recs.map(r=>r.vals),stats,q:Q,groups:recs.map(r=>r.g),snapshots:{fromRows,whereRows,groupRows,havingRows}};
}

/* ===== coloration SQL ===== */
const SQLKW=new Set(['SELECT','FROM','WHERE','GROUP','BY','HAVING','ORDER','LIMIT','JOIN','INNER','LEFT','CROSS','ON','AS','AND','OR','NOT','DISTINCT','DESC','ASC','LIKE','IN','IS','NULL','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','PRIMARY','KEY','FOREIGN','REFERENCES','COMMIT']);
const SQLFN=new Set(['COUNT','SUM','AVG','MIN','MAX','UPPER','LOWER','LENGTH','ROUND','ABS']);
function sqlhl(code){
  return code.split('\n').map(line=>{
    let out='',i=0;
    while(i<line.length){
      const ch=line[i];
      if(ch==='-'&&line[i+1]==='-'){out+='<span class="hc">'+esc(line.slice(i))+'</span>';break;}
      if(ch==="'"){let j=i+1;while(j<line.length&&line[j]!=="'")j++;out+='<span class="hs">'+esc(line.slice(i,j+1))+'</span>';i=j+1;continue;}
      let j=i;while(j<line.length&&line[j]!=='-'&&line[j]!=="'")j++;
      let segTxt=esc(line.slice(i,j));
      segTxt=segTxt.replace(/[A-Za-z_À-ÿ]\w*|\d+(?:\.\d+)?/g,m=>/^\d/.test(m)?'<span class="hn">'+m+'</span>':SQLKW.has(m.toUpperCase())?'<span class="hk">'+m+'</span>':SQLFN.has(m.toUpperCase())?'<span class="hf">'+m+'</span>':m);
      out+=segTxt;i=j;
    }
    return out||' ';
  });
}
function codeBlock(code){
  return '<pre class="code">'+sqlhl(code).map(l=>'<span>'+l+'</span>').join('\n')+'</pre>';
}

/* ===== rendu de tables ===== */
function htmlVal(v){
  if(v===null||v===undefined)return '<span style="color:var(--muted);font-style:italic">NULL</span>';
  if(typeof v==='number')return String(v).replace('.',',');
  return esc(v);
}
function tableHTML(cols,rows,opts){
  opts=opts||{};
  return '<div class="dwrap"><table class="dt"><thead><tr>'+cols.map(c=>'<th'+(opts.pk&&opts.pk.includes(c)?' class="hl"':'')+'>'+c+'</th>').join('')+'</tr></thead><tbody>'+
    (rows.length?rows.map((r,ri)=>{
      const cls=opts.rowClass?opts.rowClass(r,ri):'';
      return '<tr'+(cls?' class="'+cls+'"':'')+'>'+r.map((v,ci)=>'<td'+((typeof v==='number')?' class="num"':'')+'>'+htmlVal(v)+'</td>').join('')+'</tr>';
    }).join(''):'<tr><td colspan="'+cols.length+'" style="color:var(--muted)">0 ligne</td></tr>')+'</tbody></table></div>';
}
function dbTable(name,opts){
  const t=DB[name];
  return tableHTML(t.cols.map(esc),t.rows,Object.assign({pk:[t.pk].filter(Boolean)},opts||{}));
}

        if(s.rows && s.rows.length && typeof s.rows[0]==='object' && !Array.isArray(s.rows[0])){
          const keys=Object.keys(s.rows[0]);
          const arrVals=s.rows.map(obj=>keys.map(k=>obj[k]));
          previewArea.append(h('div',{html:tableHTML(keys.map(esc),arrVals)}));
        } else if(s.rows) {
          previewArea.append(h('div',{html:tableHTML(s.cols.map(esc),s.rows)}));
        } else {
          previewArea.append(h('div',{style:'color:var(--muted);font-size:13px'},'Aucune donnée tabulaire intermédiaire.'));
        }
      });
      stepBox.append(rowEl);
    });
    stepBox.append(previewArea);
    return stepBox;
  }

  function anyAggQuery(Q){
    return Q.select.some(s=>hasAgg(s.e))||hasAgg(Q.having);
  }

  function run(){
    msg.innerHTML='';out.innerHTML='';
    let r;
    try{r=runQuery(ta.value);}
    catch(e){
      msg.append(h('div',{class:'verdict no'},h('b',null,'Erreur SQL : '),e.message));
      return;
    }
    msg.append(h('div',{class:'verdict yes'},r.rows.length+' ligne(s) · '+r.cols.length+' colonne(s)'));
    out.append(h('div',{html:tableHTML(r.cols.map(esc),r.rows)}));
    out.append(steps(r));
  }
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();run();}});
  root.append(chips,h('p',{class:'small'},'Exemples de requêtes :'),ta,h('div',{style:'margin:8px 0'},h('button',{class:'btn pri',type:'button',onclick:run},'Exécuter (Ctrl+Entrée)')),msg,out);
  run();
}});

ws({id:'agg',label:'Agrégats & HAVING',hint:'GROUP BY découpe les lignes en paquets ; chaque paquet devient une ligne de résultat.',mount(root){
  root.append(h('h2',null,'Agrégation : GROUP BY et HAVING'),
    h('p',null,'Une fonction d\'agrégation (',cm('COUNT'), ', ',cm('SUM'), ', ',cm('AVG'), ', ',cm('MIN'), ', ',cm('MAX'), ') résume un ',h('b',null,'ensemble de lignes'), ' en une valeur. ',cm('GROUP BY'), ' découpe la table en paquets selon un attribut : chaque paquet donne ',h('b',null,'une ligne'), ' de résultat. ',cm('HAVING'), ' filtre les paquets, comme WHERE filtre les lignes.'));
  root.append(h('table',{class:'ctable',html:'<tr><th>WHERE</th><th>HAVING</th></tr><tr><td>filtre des <b>lignes</b> avant regroupement</td><td>filtre des <b>groupes</b> après agrégation</td></tr><tr><td>peut utiliser les colonnes, pas les agrégats</td><td>peut utiliser les agrégats (AVG, COUNT...)</td></tr></table>'}));
  const opts={col:'module',having:false};
  const box=h('div'),chips=h('div',{class:'chips'});
  function query(){
    let s='SELECT m.intitule AS module, COUNT(*) AS nb,\n       ROUND(AVG(n.valeur), 2) AS moyenne\nFROM notes n JOIN modules m ON n.module = m.code\nGROUP BY m.intitule';
    if(opts.having)s+='\nHAVING AVG(n.valeur) < 12';
    s+='\nORDER BY moyenne DESC;';
    return s;
  }
  function render(){
    const sql=query();
    box.innerHTML='';
    box.append(h('div',{html:codeBlock(sql)}));
    let r;try{r=runQuery(sql);}catch(e){box.append(h('p',{class:'verdict no'},e.message));return;}
    box.append(h('div',{html:tableHTML(r.cols.map(esc),r.rows)}));
    const bars=h('div',{class:'bars'});
    const maxv=Math.max(...r.rows.map(x=>x[1]));
    r.rows.forEach(x=>{bars.append(h('div',null,h('span',{class:'bl'},esc(x[0])),h('span',{class:'bar',style:'width:'+Math.round(x[1]/maxv*180)+'px'}),h('span',{class:'bv'},x[1]+' notes · moy. '+fmt(x[2]))));});
    box.append(h('div',{class:'widget'},h('h3',{style:'margin:0 0 4px'},'Un groupe = une ligne = une barre'),bars));
    if(opts.having)box.append(h('p',{class:'small'},'HAVING AVG(valeur) < 12 ne garde que les modules dont la moyenne est en dessous de 12 : ici, Économie (moyenne 11).'));
  }
  const c1=h('button',{type:'button',class:'chip on',onclick:()=>{opts.col='module';render();}},'Grouper par module');
  const c2=h('button',{type:'button',class:'chip',onclick:()=>{opts.having=!opts.having;c2.classList.toggle('on',opts.having);render();}},'HAVING AVG < 12');
  chips.append(c1,c2);
  root.append(chips,box);
}});

ws({id:'py',label:'SQL en Python',hint:'Le module sqlite3 : connecter, exécuter, lire, valider, se protéger.',mount(root){

       {line:4,t:'8 lignes au lieu d\'aucune : fuite de données.',con:["Nom ? x' OR '1'='1","8 lignes renvoyées"],out:'full'},

  const next=h('button',{class:'btn pri',type:'button',onclick:()=>{if(k<SC[cur].steps.length-1){k++;render();}}},'Suivant ▶');
  const rst=h('button',{class:'btn',type:'button',onclick:()=>{k=0;render();}},'↺');

     opts:['impératif : on décrit comment parcourir les lignes','déclaratif : on décrit le résultat voulu, le SGBD choisit le plan d\'exécution','procédural : on écrit un programme exécuté ligne à ligne'],
     a:1,why:'On décrit quoi (le résultat), pas comment : le SGBD choisit l\'ordre des opérations et les optimise (index, ordre de jointure...).'}
  ];
  const store=lsGet(KEYS.act+'/qcm',{});
  let ok=0,done=0;
  act.innerHTML='';
  act.append(h('div',{class:'phead'},h('b',null,'Activité'),h('span',{class:'sub'},'Objectif · questions')));
  const body=h('div',{class:'pbody'});
  body.append(h('div',{class:'goal'},'Objectif : savoir écrire une requête SQL (projection, sélection, jointure, agrégats) sur un schéma relationnel, et l\'utiliser depuis Python.'));
  body.append(h('ul',{class:'steps'},
    h('li',null,'Parcours les ateliers : modèle, console, jointures, agrégats, Python.'),
    h('li',null,'Termine les 10 exercices guidés dans l\'atelier « Exercices ».'),
    h('li',null,'Réponds au QCM ci-dessous : tes réponses sont mémorisées.')));
  const score=h('p',{class:'score'});
  body.append(score);
  function upd(){
    ok=QCM.filter(q=>store[q.id]===q.a).length;
    done=QCM.filter(q=>store[q.id]!=null).length;
    score.textContent=done?('Score : '+ok+' / '+QCM.length+(done===QCM.length?' (terminé)':'')):'';
  }
  QCM.forEach(q=>{
    const fs=h('fieldset',{class:'q'},h('legend',null,q.q));
    q.opts.forEach((lab,j)=>{
      const chosen=store[q.id];
      const good=chosen!=null&&j===q.a,bad=chosen!=null&&j===chosen&&j!==q.a;
      const labEl=h('label',{class:'opt'+(good?' good':bad?' bad':'')},
        h('input',{type:'radio',name:'r-'+q.id,checked:chosen===j,disabled:chosen!=null,onclick:()=>{store[q.id]=j;lsSet(KEYS.act+'/qcm',store);mountAct();}}),
        h('span',{style:chosen!=null&&j===q.a?'font-weight:600':'',html:esc(lab)+(chosen!=null&&j===q.a?' ✓':'')}));
      fs.append(labEl);
    });
    if(store[q.id]!=null)fs.append(h('p',{class:'why'},q.why));
    body.append(fs);
  });
  upd();
  act.append(body);
}

/* ===== cours ===== */
function mountCourse(){
  const SEC=[
   {id:'c1',t:'1. Le modèle relationnel',html:`
    <p>Une <b>base de données relationnelle</b> range les données dans des <b>tables</b>. Une table a :</p>
    <ul><li>un <b>schéma</b> : le nom des attributs et leurs domaines (INTEGER, TEXT, REAL...) ;</li>
    <li>une <b>instance</b> : l'ensemble des lignes à un instant donné.</li></ul>
    <p>Formellement, une relation est un sous-ensemble du produit cartésien des domaines : une même ligne ne peut pas y apparaître deux fois.</p>
    <p class="formula">etudiants(ine, nom, ville)<br>modules(code, intitule, credits)<br>notes(etudiant, module, valeur)</p>
    <div class="retain">Une table = un schéma (les colonnes) + une instance (les lignes). Le résultat d'une requête est toujours... une table.</div>`},
   {id:'c2',t:'2. Clés et contraintes',html:`
    <p>La <b>clé primaire</b> identifie chaque ligne : unique et jamais NULL (contrainte d'entité). Une <b>clé étrangère</b> référence la clé primaire d'une autre table ; toute valeur doit exister dans la table référencée (contrainte d'intégrité référentielle).</p>
    <table class="ctable"><tr><th>Table</th><th>Clé primaire</th><th>Clés étrangères</th></tr>
    <tr><td>etudiants</td><td>ine</td><td>—</td></tr>
    <tr><td>modules</td><td>code</td><td>—</td></tr>
    <tr><td>notes</td><td>(etudiant, module)</td><td>etudiant → etudiants.ine, module → modules.code</td></tr></table>
    <p class="formula">CREATE TABLE notes (<br>&nbsp;&nbsp;etudiant INTEGER REFERENCES etudiants(ine),<br>&nbsp;&nbsp;module&nbsp; TEXT REFERENCES modules(code),<br>&nbsp;&nbsp;valeur&nbsp;&nbsp; REAL,<br>&nbsp;&nbsp;PRIMARY KEY (etudiant, module)<br>);</p>
    <p>Un attribut peut valoir <b>NULL</b> (valeur absente) ; on le teste avec <code class="k">IS NULL</code> ou <code class="k">IS NOT NULL</code>, jamais avec = : <code class="k">valeur = NULL</code> est toujours faux.</p>
    <div class="retain">Insérer une ligne dont la clé primaire existe déjà : refusé. Insérer une clé étrangère qui ne pointe nulle part : refusé. C'est le SGBD qui garantit ces contraintes, pas le programmeur.</div>`},
   {id:'c3',t:'3. Algèbre relationnelle',html:`
    <p>Les requêtes se pensent avec quatre opérations, composables, dont le résultat est toujours une relation :</p>
    <table class="ctable"><tr><th>Opération</th><th>Notation</th><th>Effet</th><th>En SQL</th></tr>
    <tr><td>Projection</td><td>π<sub>A,B</sub>(R)</td><td>garde les colonnes A, B (doublons éliminés)</td><td>SELECT DISTINCT A, B</td></tr>
    <tr><td>Sélection</td><td>σ<sub>cond</sub>(R)</td><td>garde les lignes vérifiant cond</td><td>WHERE cond</td></tr>
    <tr><td>Jointure</td><td>R ⋈ S</td><td>assemble les lignes de R et S qui coïncident</td><td>JOIN ... ON ...</td></tr>
    <tr><td>Renommage</td><td>ρ<sub>a→b</sub>(R)</td><td>renomme un attribut</td><td>AS</td></tr></table>
    <p class="formula">π<sub>nom</sub>(σ<sub>ville='Lyon'</sub>(etudiants))&nbsp;&nbsp;≡&nbsp;&nbsp;SELECT nom FROM etudiants WHERE ville = 'Lyon';</p>
    <div class="retain">SQL est <b>déclaratif</b> : on décrit le résultat (avec π, σ, ⋈), le SGBD choisit comment le calculer. L'algèbre relationnel est le plan de travail du SGBD.</div>`},
   {id:'c4',t:'4. SELECT : la requête complète',html:`
    <p class="formula">SELECT [DISTINCT] exprs [AS alias]   -- projection<br>FROM table [alias]<br>[JOIN table2 ON cond]           -- jointures<br>[WHERE cond]                     -- sélection des lignes<br>[GROUP BY attributs]             -- regroupement<br>[HAVING cond]                    -- filtre des groupes<br>[ORDER BY attribut [DESC]]       -- tri<br>[LIMIT n]                        -- n lignes</p>
    <p>L'ordre d'<b>écriture</b> n'est pas l'ordre d'<b>évaluation</b> :</p>
    <p class="formula">FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</p>
    <p>C'est pour cela que le filtre sur les groupes doit être dans HAVING (évalué après GROUP BY), et que l'on ne peut pas utiliser un alias du SELECT dans WHERE.</p>
    <ul>
      <li><code class="k">WHERE ville = 'Lyon' AND valeur >= 12</code> — conditions booléennes (AND, OR, NOT) ;</li>
      <li><code class="k">WHERE nom LIKE 'A%'</code> — motif (% : n'importe quoi, _ : un caractère) ;</li>
      <li><code class="k">WHERE ville IN ('Lyon', 'Paris')</code> — appartenance ;</li>
      <li><code class="k">SELECT DISTINCT ...</code> — élimine les doublons ;</li>
      <li><code class="k">ORDER BY moyenne DESC, nom</code> — tri multi-critères.</li>
    </ul>
    <div class="retain">SQL ne renvoie pas un « fichier de résultats » : il renvoie une table. Doublons, ordre, colonnes : tout se décrit dans la requête.</div>`},
   {id:'c5',t:'5. Jointures',html:`
    <p>Une jointure assemble deux tables : on croise chaque ligne de A avec chaque ligne de B, puis on garde les paires qui vérifient la condition <code class="k">ON</code> (en général clé étrangère = clé primaire).</p>
    <table class="ctable"><tr><th>Type</th><th>Lignes gardées</th><th>Usage type</th></tr>
    <tr><td>JOIN (interne)</td><td>les paires qui vérifient ON</td><td>combiner les données liées</td></tr>
    <tr><td>LEFT JOIN</td><td>toutes les lignes de gauche (NULL si pas de partenaire)</td><td>trouver les lignes « orphelines » (IS NULL)</td></tr>
    <tr><td>CROSS JOIN</td><td>toutes les paires (produit cartésien)</td><td>comprendre ce que filtre ON</td></tr></table>
    <p class="formula">SELECT e.nom, n.valeur<br>FROM etudiants e LEFT JOIN notes n ON e.ine = n.etudiant<br>WHERE n.valeur IS NULL;&nbsp;&nbsp;-- les étudiants sans note</p>
    <div class="retain">Le nombre de lignes d'un CROSS JOIN est le produit des effectifs : 8 × 17 = 136 pour etudiants × notes. Une jointure filtre ce produit cartésien.</div>`},
   {id:'c6',t:'6. Agrégats, GROUP BY, HAVING',html:`
    <table class="ctable"><tr><th>Fonction</th><th>Résultat</th></tr>
    <tr><td>COUNT(*) / COUNT(col)</td><td>nombre de lignes / nombre de valeurs non NULL</td></tr>
    <tr><td>SUM(col), AVG(col)</td><td>somme, moyenne (valeurs NULL ignorées)</td></tr>
    <tr><td>MIN(col), MAX(col)</td><td>extremums</td></tr></table>
    <p><code class="k">GROUP BY a</code> découpe les lignes en paquets qui partagent la même valeur de a ; chaque paquet produit <b>une</b> ligne du résultat. Sans GROUP BY, un agrégat dans le SELECT traite la table entière et renvoie une seule ligne.</p>
    <p><b>WHERE filtre des lignes, HAVING filtre des groupes :</b></p>
    <p class="formula">SELECT m.intitule, ROUND(AVG(n.valeur),2) AS moyenne<br>FROM notes n JOIN modules m ON n.module = m.code<br>GROUP BY m.intitule<br>HAVING AVG(n.valeur) &lt; 12;<br>-- modules dont la moyenne est &lt; 12</p>
    <div class="retain">Règle d'or : toute colonne du SELECT qui n'est pas dans un agrégat doit figurer dans le GROUP BY.</div>`},
   {id:'c7',t:'7. SQL en Python (sqlite3)',html:`
    <p class="formula">import sqlite3<br>connexion = sqlite3.connect("base.db")&nbsp;&nbsp;# 1. connexion<br>curseur = connexion.cursor()&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 2. curseur<br>curseur.execute("SELECT ...")&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 3. requête<br>lignes = curseur.fetchall()&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 4. lecture (liste de tuples)<br>connexion.commit()&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 5. validation des écritures<br>connexion.close()&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 6. fermeture</p>
    <ul>
      <li>les écritures (INSERT, UPDATE, DELETE) sont d'abord dans une <b>transaction</b> : sans <code class="k">commit()</code>, elles sont perdues ;</li>
      <li>on ne concatène <b>jamais</b> une saisie utilisateur dans la requête (injection SQL) : on passe par un <b>paramètre</b> :</li>
    </ul>
    <p class="formula">curseur.execute("SELECT * FROM etudiants WHERE nom = ?", (nom,))</p>
    <div class="retain">La requête reste du SQL, les données restent des valeurs : le paramètre ? est la barrière entre les deux.</div>`},
   {id:'c8',t:'8. Glossaire',html:`
    <dl class="gloss">
    <dt>Attribut</dt><dd>colonne d'une table, avec son domaine (type).</dd>
    <dt>Clé primaire</dt><dd>attribut(s) identifiant chaque ligne, unique(s) et non NULL.</dd>
    <dt>Clé étrangère</dt><dd>attribut référençant la clé primaire d'une autre table.</dd>
    <dt>Schéma</dt><dd>description des tables et contraintes d'une base.</dd>
    <dt>Instance</dt><dd>contenu (lignes) des tables à un instant donné.</dd>
    <dt>Projection π</dt><dd>garder certaines colonnes (SELECT).</dd>
    <dt>Sélection σ</dt><dd>garder certaines lignes (WHERE).</dd>
    <dt>Jointure ⋈</dt><dd>assembler deux tables selon une condition.</dd>
    <dt>Agrégat</dt><dd>fonction résumant un groupe de lignes (COUNT, AVG...).</dd>
    <dt>Transaction</dt><dd>séquence d'opérations validée atomiquement par commit.</dd>
    <dt>Injection SQL</dt><dd>attaque par saisie transformée en code SQL ; parade : paramètres.</dd>
    <dt>SGBD</dt><dd>système de gestion de bases de données (ex. SQLite, PostgreSQL).</dd>
    </dl>`}
  ];
  const course=$('#course');
  course.innerHTML='';
  course.append(h('div',{class:'inner ctop'},h('b',null,'Cours : SQL et bases de données relationnelles'),h('span',{class:'small'},'Niveau CPGE · 2e année')));
  const toc=h('div',{class:'inner ctoc'}),body=h('div',{class:'cbody'});
  let cur=SEC[0].id;
  function show(s){
    body.innerHTML='<h2>'+s.t+'</h2>'+s.html;
    $$('button',toc).forEach(b=>b.classList.toggle('on',b.dataset.id===s.id));
  }
  SEC.forEach(s=>{toc.append(h('button',{type:'button','data-id':s.id,onclick:()=>show(s)},s.t));});
  course.append(h('div',{class:'inner cwrap'},toc,body));
  show(SEC[0]);
}
