function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');

const WORKSHOPS = [];

const DB = {

function drawTabs(lab) {

function runLab(lab) {

function showRes(lab) {

function pipeView(t) {
  const st = [];
  st.push(['FROM', t.from + ' ligne' + (t.from > 1 ? 's' : '')]);
  if (t.where != null) st.push(['WHERE', t.where + ' ligne' + (t.where > 1 ? 's' : '')]);
  if (t.grouped) { st.push(['GROUP BY', t.groups.length + ' groupe' + (t.groups.length > 1 ? 's' : '')]); if (t.having) st.push(['HAVING', t.groups.filter(g => g.kept).length + ' groupe(s)']); }
  st.push(['SELECT', t.select + ' ligne' + (t.select > 1 ? 's' : '')]);
  if (t.distinct) st.push(['DISTINCT', t.afterDistinct + ' ligne' + (t.afterDistinct > 1 ? 's' : '')]);
  if (t.order) st.push(['ORDER BY', 'tri']);
  if (t.limit != null) st.push(['LIMIT', t.limit + ' ligne' + (t.limit > 1 ? 's' : '')]);
  const box = h('div', null, h('p', { class: 'small', style: 'margin:8px 0 2px' }, 'Ordre d’exécution de la requête :'));
  const pipe = h('div', { class: 'pipe' });
  st.forEach((s, i) => { if (i) pipe.append(h('span', { class: 'parrow' }, '→')); pipe.append(h('div', { class: 'pstep' }, h('b', null, s[0]), h('span', null, s[1]))); });
  box.append(pipe);
  if (t.joins.length) box.append(h('ul', { class: 'small', style: 'margin:4px 0 8px' }, t.joins.map(j => h('li', null, j.l + ' × ' + j.r + ' : ' + j.ln + ' × ' + j.rn + ' = ' + (j.ln * j.rn) + ' couples' + (j.on ? ' → ' + j.out + ' retenus par la condition ON.' : ' (produit cartésien, aucune condition).')))));
  if (t.grouped && t.groups.length) {
    box.append(h('p', { class: 'small', style: 'margin:6px 0 2px' }, t.groups[0].vals.length ? 'Groupes formés (valeur du groupe : nombre de lignes)' + (t.having ? ' ; barrés : éliminés par HAVING :' : ' :') : 'Un seul groupe : toutes les lignes.'));
    if (t.groups[0].vals.length) box.append(h('div', { class: 'gboxes' }, t.groups.map(g => h('span', { class: 'gbox' + (g.kept ? '' : ' out') }, g.vals.map(fmtV).join(' · ') + ' : ' + g.n))));
  }
  return box;
}

const COURSE = [];
COURSE.push({ id: 'cadre', t: 'Cadre du cours', h: `
<p>Ce cours suit la partie « Bases de données » du programme d’ITC (troisième semestre). On se limite volontairement à une <b>description applicative</b> des bases de données en langage SQL : il s’agit d’<b>interroger</b> une base qui présente des données à travers plusieurs relations.</p>
<h3>Au programme</h3>
<ul><li>Vocabulaire : tables ou relations, attributs ou colonnes, domaine, schéma, enregistrements ou lignes.</li><li>Clé primaire, clé étrangère, entités et associations (1 — 1, 1 — *, * — *).</li><li>SELECT avec WHERE, projection, AS, DISTINCT, LIMIT, OFFSET, ORDER BY.</li><li>UNION, INTERSECT, EXCEPT, produit cartésien.</li><li>Jointures internes JOIN … ON, autojointure.</li><li>MIN, MAX, SUM, AVG, COUNT, GROUP BY, HAVING, quelques requêtes imbriquées.</li></ul>
<h3>Hors programme</h3>
<p>La création et la suppression de tables, l’algèbre et le calcul relationnels, la notion de NULL, la représentation des dates, les collations, les index, les transactions, l’optimisation de requêtes, les bases non relationnelles.</p>
<p>Les exemples portent sur une petite base de bibliothèque : <b>auteurs</b>, <b>livres</b>, <b>lecteurs</b> et <b>emprunts</b>. Le temps est repéré par un numéro de jour (un entier), conformément au programme.</p>
<div class="retain"><b>À retenir.</b> On apprend à <b>interroger</b> une base avec SELECT ; on ne la crée ni ne la modifie ici.</div>` });

COURSE.push({ id: 'vocab', t: 'Tables, lignes, domaines', h: `
<p>Une <b>base de données relationnelle</b> est un ensemble de <b>tables</b> (ou relations). Chaque table est un tableau :</p>
<ul><li>les <b>colonnes</b> sont les <b>attributs</b> ; chacun a un <b>domaine</b> : entier, flottant ou chaîne de caractères ;</li><li>les <b>lignes</b> sont les <b>enregistrements</b> (ou n-uplets) ;</li><li>le <b>schéma</b> d’une table est la liste de ses attributs avec leur domaine.</li></ul>
<table class="ctable"><thead><tr><th colspan="4">livres</th></tr><tr><th>id</th><th>titre</th><th>auteur_id</th><th>annee</th></tr></thead><tbody>
<tr><td>7</td><td>1984</td><td>4</td><td>1949</td></tr><tr><td>8</td><td>La Ferme des animaux</td><td>4</td><td>1945</td></tr></tbody></table>
<p>Schéma : <code>livres(id : entier, titre : chaîne, auteur_id : entier, annee : entier, genre : chaîne, pages : entier)</code>.</p>
<p>Dans une requête, les chaînes s’écrivent entre apostrophes (<code>'roman'</code>), les nombres sans guillemets. Pour écrire une apostrophe dans une chaîne, on la double : <code>'L''Étranger'</code>.</p>
<div class="retain"><b>À retenir.</b> Table = relation ; colonne = attribut ; ligne = enregistrement ; chaque attribut a un domaine.</div>` });

COURSE.push({ id: 'cles', t: 'Clés et associations', h: `
<h3>Clé primaire</h3>
<p>Une <b>clé primaire</b> est un attribut, ou un ensemble d’attributs, dont la valeur identifie de façon unique chaque ligne de la table. Dans <code>livres</code>, c’est <code>id</code>. Elle n’est pas forcément formée d’un seul attribut, même si c’est le cas le plus fréquent.</p>
<h3>Clé étrangère</h3>
<p>Une <b>clé étrangère</b> est un attribut d’une table dont les valeurs sont des valeurs de la clé primaire d’une autre table. Ainsi <code>livres.auteur_id</code> référence <code>auteurs.id</code> : chaque livre désigne son auteur. Une clé étrangère doit toujours désigner une ligne qui existe.</p>
<h3>Entités et associations</h3>
<p>Le modèle <b>entité–association</b> décrit des entités (auteur, livre, lecteur) et les associations qui les lient :</p>
<table class="ctable"><thead><tr><th>Association</th><th>Exemple</th><th>Traduction en tables</th></tr></thead><tbody>
<tr><td>1 — 1</td><td>lecteur / carte de bibliothèque</td><td>une clé étrangère dans l’une des tables, dont les valeurs sont toutes distinctes</td></tr>
<tr><td>1 — *</td><td>auteur / livres</td><td>clé étrangère dans la table du côté « * » (livres.auteur_id)</td></tr>
<tr><td>* — *</td><td>lecteurs / livres</td><td>deux associations 1 — * grâce à une table intermédiaire (emprunts) portant deux clés étrangères</td></tr></tbody></table>
<p>On peut dessiner ces schémas par de simples diagrammes à flèches : <code>auteurs ← livres</code>, <code>lecteurs ← emprunts → livres</code>.</p>
<div class="retain"><b>À retenir.</b> Clé primaire : identifie une ligne. Clé étrangère : référence la clé primaire d’une autre table. Une association * — * se sépare en deux associations 1 — *.</div>` });

COURSE.push({ id: 'select', t: 'SELECT, WHERE, projection', h: `
<pre class="code">SELECT [DISTINCT] colonnes
FROM table
[WHERE condition]
[ORDER BY colonne [DESC]]
[LIMIT n [OFFSET k]]</pre>
<ul>
<li><b>Projection</b> : la liste après SELECT choisit les colonnes ; <code>*</code> désigne toutes les colonnes ; <code>expr AS nom</code> renomme une colonne du résultat.</li>
<li><b>Sélection</b> : <code>WHERE</code> ne garde que les lignes qui vérifient la condition.</li>
<li><b>Opérateurs</b> : <code>+ − * /</code> ; comparaisons <code>= &lt;&gt; &lt; &lt;= &gt; &gt;=</code> ; connecteurs <code>AND</code>, <code>OR</code>, <code>NOT</code>. NOT s’applique avant AND, AND avant OR : on utilise des parenthèses pour lever le doute.</li>
<li><b>DISTINCT</b> supprime les doublons du résultat.</li>
<li><b>ORDER BY</b> trie (croissant par défaut, <code>DESC</code> pour décroissant) ; on peut trier selon plusieurs colonnes.</li>
<li><b>LIMIT n</b> garde les n premières lignes, <b>OFFSET k</b> saute d’abord k lignes.</li>
</ul>
<pre class="code">SELECT titre, 2026 - annee AS anciennete
FROM livres
WHERE genre = 'roman' AND annee &gt; 1850
ORDER BY anciennete DESC
LIMIT 3 OFFSET 1</pre>
<p>Un SELECT ne modifie jamais la table : il construit un nouveau tableau, le résultat.</p>
<div class="retain"><b>À retenir.</b> SELECT choisit les colonnes, WHERE les lignes, DISTINCT supprime les doublons, ORDER BY trie, LIMIT et OFFSET découpent.</div>` });

COURSE.push({ id: 'ensembles', t: 'Produit cartésien et opérateurs ensemblistes', h: `
<h3>Produit cartésien</h3>
<p>Le <b>produit cartésien</b> de deux tables contient toutes les paires formées d’une ligne de la première et d’une ligne de la seconde. Si elles ont p et q lignes, il en a p × q.</p>
<pre class="code">SELECT * FROM livres, auteurs        -- 12 x 7 = 84 lignes</pre>
<p>Il est rarement utile seul : on le filtre par une condition qui relie les tables (voir jointures).</p>
<h3>UNION, INTERSECT, EXCEPT</h3>
<p>Ces opérateurs combinent deux résultats qui ont <b>le même nombre de colonnes</b>, de domaines compatibles. Le résultat est un ensemble : les doublons disparaissent.</p>
<table class="ctable"><thead><tr><th>Opérateur</th><th>Résultat</th></tr></thead><tbody>
<tr><td>A UNION B</td><td>lignes de A ou de B</td></tr><tr><td>A INTERSECT B</td><td>lignes de A et de B</td></tr><tr><td>A EXCEPT B</td><td>lignes de A qui ne sont pas dans B</td></tr></tbody></table>
<pre class="code">SELECT id FROM livres
EXCEPT
SELECT livre_id FROM emprunts      -- livres jamais empruntés</pre>
<div class="retain"><b>À retenir.</b> Produit cartésien : p × q lignes. UNION, INTERSECT, EXCEPT : réunion, intersection, différence de deux résultats de même forme.</div>` });

COURSE.push({ id: 'jointures', t: 'Jointures', h: `
<p>Une <b>jointure interne</b> relie des tables par leurs clés : elle garde, parmi le produit cartésien, les paires qui vérifient une condition.</p>
<pre class="code">SELECT l.titre, a.nom
FROM livres l
JOIN auteurs a ON l.auteur_id = a.id</pre>
<ul>
<li><code>T1 JOIN T2 ON φ</code> équivaut à un produit cartésien filtré par φ. Au programme, φ est une <b>conjonction d’égalités</b> (équi-jointure).</li>
<li>On peut enchaîner plusieurs jointures : <code>T1 JOIN T2 ON … JOIN T3 ON …</code>.</li>
<li>Les <b>alias</b> (<code>livres l</code>) raccourcissent l’écriture et lèvent les ambiguïtés : si deux tables ont une colonne <code>id</code>, on écrit <code>l.id</code> ou <code>a.id</code>.</li>
</ul>
<pre class="code">-- trois tables : emprunts relie lecteurs et livres
SELECT le.nom, l.titre
FROM emprunts e
JOIN lecteurs le ON e.lecteur_id = le.id
JOIN livres l ON e.livre_id = l.id</pre>
<h3>Autojointure</h3>
<p>Une <b>autojointure</b> joint une table avec elle-même : on lui donne deux alias.</p>
<pre class="code">SELECT a.nom, b.nom
FROM lecteurs a JOIN lecteurs b
  ON a.ville = b.ville AND a.id &lt; b.id    -- couples de lecteurs d'une même ville</pre>
<p>La condition <code>a.id &lt; b.id</code> élimine les couples (x, x) et les doublons (x, y) / (y, x).</p>
<div class="retain"><b>À retenir.</b> JOIN … ON relie une clé étrangère à une clé primaire ; sans condition on retrouve un produit cartésien. Les alias distinguent les tables, surtout dans une autojointure.</div>` });

COURSE.push({ id: 'agreg', t: 'Agrégation, GROUP BY, HAVING', h: `
<h3>Fonctions d’agrégation</h3>
<p><code>COUNT</code>, <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code> résument un ensemble de lignes en une valeur. <code>COUNT(*)</code> compte les lignes.</p>
<pre class="code">SELECT COUNT(*), MIN(annee), MAX(pages), AVG(pages) FROM livres    -- une seule ligne</pre>
<h3>GROUP BY</h3>
<p><code>GROUP BY a</code> regroupe les lignes qui ont la même valeur de a, et chaque agrégat est calculé par groupe. Dans le SELECT, on ne met que les attributs de regroupement et des agrégats.</p>
<pre class="code">SELECT genre, COUNT(*) AS nb
FROM livres
GROUP BY genre</pre>
<h3>HAVING et WHERE</h3>
<ul><li><b>WHERE</b> filtre les <b>lignes</b>, avant le regroupement ; il ne peut pas contenir d’agrégat.</li><li><b>HAVING</b> filtre les <b>groupes</b>, après le regroupement ; il porte en général sur un agrégat.</li></ul>
<pre class="code">SELECT a.nom, COUNT(*) AS nb
FROM livres l JOIN auteurs a ON l.auteur_id = a.id
WHERE l.annee &gt; 1850          -- filtre les livres
GROUP BY a.nom
HAVING COUNT(*) &gt; 1           -- filtre les auteurs</pre>
<h3>Ordre d’exécution</h3>
<p>FROM → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT / OFFSET. C’est pourquoi un alias défini dans SELECT peut servir dans ORDER BY mais pas dans WHERE.</p>
<div class="retain"><b>À retenir.</b> WHERE filtre les lignes avant GROUP BY, HAVING filtre les groupes après. Un agrégat ne s’écrit jamais dans WHERE.</div>` });

COURSE.push({ id: 'imbriquees', t: 'Requêtes imbriquées', h: `
<p>Une <b>requête imbriquée</b> (ou sous-requête) est un SELECT placé entre parenthèses dans une autre requête. On en présente quelques exemples.</p>
<h3>Comparer à une valeur</h3>
<pre class="code">SELECT titre FROM livres
WHERE pages = (SELECT MAX(pages) FROM livres)</pre>
<p>La sous-requête renvoie une valeur unique (le maximum), comparée à chaque ligne.</p>
<h3>Comparer à un ensemble</h3>
<pre class="code">SELECT titre FROM livres
WHERE id NOT IN (SELECT livre_id FROM emprunts)   -- jamais empruntés</pre>
<p><code>IN</code> teste l’appartenance à l’ensemble de valeurs produit par la sous-requête ; <code>NOT IN</code> teste la non-appartenance.</p>
<h3>Sous-requête dans FROM</h3>
<pre class="code">SELECT genre, nb
FROM (SELECT genre, COUNT(*) AS nb FROM livres GROUP BY genre) AS t
WHERE nb &gt; 2</pre>
<p>Le résultat de la sous-requête sert de table, qu’on nomme par un alias.</p>
<div class="retain"><b>À retenir.</b> Une sous-requête s’exécute d’abord et fournit une valeur ou un ensemble de valeurs à la requête principale.</div>` });

COURSE.push({ id: 'bilan', t: 'Méthode et synthèse', h: `
<h3>Démarche pour écrire une requête</h3>
<ol><li>Quelles <b>tables</b> contiennent les informations demandées ? Les relier par des jointures (clé étrangère = clé primaire).</li><li>Quelles <b>lignes</b> garder ? Condition WHERE.</li><li>Faut-il <b>regrouper</b> ? GROUP BY, puis HAVING pour filtrer les groupes.</li><li>Quelles <b>colonnes</b> afficher ? SELECT, avec AS si besoin ; DISTINCT pour supprimer les doublons.</li><li>Dans quel <b>ordre</b> ? ORDER BY ; combien ? LIMIT, OFFSET.</li></ol>
<h3>Erreurs fréquentes</h3>
<table class="ctable"><thead><tr><th>Symptôme</th><th>Cause probable</th></tr></thead><tbody>
<tr><td>Beaucoup trop de lignes</td><td>condition de jointure oubliée : produit cartésien</td></tr>
<tr><td>Doublons dans le résultat</td><td>jointure qui multiplie les lignes : DISTINCT ou GROUP BY</td></tr>
<tr><td>Colonne ambiguë</td><td>même nom dans deux tables : préfixer par l’alias</td></tr>
<tr><td>Agrégat refusé dans WHERE</td><td>utiliser HAVING</td></tr>
<tr><td>Colonne inconnue pour une chaîne</td><td>oubli des apostrophes</td></tr></tbody></table>
<div class="retain"><b>À retenir.</b> Penser en étapes : tables et jointures, filtre, regroupement, affichage, tri.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Table, relation</dt><dd>Ensemble de lignes décrites par les mêmes attributs.</dd>
<dt>Attribut, colonne</dt><dd>Caractéristique d’une table, de domaine donné.</dd>
<dt>Domaine</dt><dd>Ensemble des valeurs possibles d’un attribut : entier, flottant, chaîne.</dd>
<dt>Schéma</dt><dd>Description des attributs d’une table (ou des tables d’une base).</dd>
<dt>Enregistrement, ligne</dt><dd>Ligne d’une table.</dd>
<dt>Clé primaire</dt><dd>Attribut(s) identifiant de façon unique chaque ligne.</dd>
<dt>Clé étrangère</dt><dd>Attribut(s) référençant la clé primaire d’une autre table.</dd>
<dt>Association</dt><dd>Lien entre entités : 1 — 1, 1 — *, * — *.</dd>
<dt>Projection</dt><dd>Choix des colonnes du résultat.</dd>
<dt>Sélection</dt><dd>Choix des lignes par une condition WHERE.</dd>
<dt>Produit cartésien</dt><dd>Toutes les paires de lignes de deux tables.</dd>
<dt>Jointure</dt><dd>Produit cartésien filtré par une condition portant sur des clés.</dd>
<dt>Autojointure</dt><dd>Jointure d’une table avec elle-même, à l’aide d’alias.</dd>
<dt>Agrégat</dt><dd>Valeur calculée sur un ensemble de lignes : COUNT, SUM, AVG, MIN, MAX.</dd>
<dt>Requête imbriquée</dt><dd>SELECT placé entre parenthèses dans une autre requête.</dd>
</dl>` });

function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : bases de données et SQL'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Six ateliers sur les bases de données et le langage SQL (ITC, CPGE 2e année) : tables et clés, requêtes SELECT, jointures, agrégation, ensembles et requêtes imbriquées, défis.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Dans les ateliers 2 à 5, cliquez sur un exemple ou écrivez votre requête, puis exécutez-la (Ctrl + Entrée).</li><li>Sous la requête, la chaîne d’exécution montre le nombre de lignes à chaque étape.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction ; <b>Cours</b> détaille le programme.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM et les défis réussis sont mémorisés dans ce navigateur uniquement. Aucune donnée n’est envoyée. Les requêtes sont exécutées par un petit interpréteur SQL intégré à la page, limité à SELECT.</p>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
