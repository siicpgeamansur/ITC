<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<style>

  /* Mise en page : fenêtre de type GeoGebra. Onglets = parties du cours. Dans chaque partie : vue Algèbre (paramètres, saisies, curseurs) à gauche, vue Graphique à droite. Fond blanc assumé dans les deux thèmes. */

  --font-math:"Cambria Math","STIX Two Math",Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{box-sizing:border-box;margin:0;background:var(--paper);color:var(--ink);font:14px/1.4 var(--font-ui);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
.app{height:100%;min-height:600px;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--paper)}

.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--paper);scrollbar-width:thin}
.tabs button{flex:none;font:inherit;font-size:13px;padding:9px 14px;border:0;border-right:1px solid var(--line);border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}

.tag{display:inline-block;font:600 11px/1.5 var(--font-mono);padding:0 6px;border-radius:3px;text-align:center}
.tag.t-int{background:#e6effc;color:#1f3fa0}
.tag.t-float{background:#e3f4ea;color:#1c6b40}

.hh.t-int{color:#1f3fa0}.hh.t-float{color:#1c6b40}.hh.t-str{color:#8a5200}
/* les trois étapes pour la clé saisie */
.steps{display:grid;gap:8px;margin-top:10px}

/* vue graphique */
.brow{display:flex;align-items:center;gap:6px;margin-bottom:6px}

.cell{border:1px solid var(--line);border-radius:4px;background:var(--paper)}

<div class="app">
  <header class="bar">
    <div class="brand">Dictionnaires et hachage</div>
    <div class="formula" id="formula"></div>
  </header>

<script>
'use strict';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function fmt(x,d){d=d===undefined?3:d;if(!isFinite(x))return '–';let r=Math.round(x*Math.pow(10,d))/Math.pow(10,d);if(Object.is(r,-0))r=0;return String(r).replace('.',',');}
const fmtInt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const q=(root,sel)=>root.querySelector(sel);
const qa=(root,sel)=>Array.from(root.querySelectorAll(sel));

/* mise en couleur Python très légère */
function pyhl(code){
  const KW=/^(def|return|for|in|if|elif|else|while|not|raise|import|from|with|as|and|or|is|lambda|class|pass|break|continue)$/;
  const BI=/^(print|len|range|set|dict|list|max|min|sum|id|hash|sorted|open|str|int|float|None|True|False)$/;
  return code.split('\n').map(line=>{
    let out='',i=0;
    while(i<line.length){
      const ch=line[i];
      if(ch==='#'){out+='<span class="hc">'+esc(line.slice(i))+'</span>';break;}
      if(ch==='"'||ch==="'"){
        let j=i+1;while(j<line.length&&line[j]!==ch)j++;
        out+='<span class="hs">'+esc(line.slice(i,j+1))+'</span>';i=j+1;continue;
      }
      let j=i;while(j<line.length&&line[j]!=='#'&&line[j]!=='"'&&line[j]!=="'")j++;
      let seg=esc(line.slice(i,j)).replace(/\b([A-Za-z_]\w*|\d+(?:\.\d+)?)\b/g,(m)=>/^\d/.test(m)?'<span class="hn">'+m+'</span>':KW.test(m)?'<span class="hk">'+m+'</span>':BI.test(m)?'<span class="hf">'+m+'</span>':m);
      out+=seg;i=j;
    }
    return out;
  });
}
function codeBlock(code,on){
  const lines=pyhl(code);
  return '<pre class="code">'+lines.map((l,i)=>'<span class="ln'+(on===i+1||(Array.isArray(on)&&on.includes(i+1))?' on':'')+'">'+(l||' ')+'</span>').join('')+'</pre>';
}

/* curseur + zone numérique, façon GeoGebra */
let _sid=0;
function slider(host,o){
  const id='sld'+(++_sid);
  const wrap=document.createElement('div');
  wrap.className='slider';wrap.style.setProperty('--c',o.color||'#6557d2');
  wrap.innerHTML='<div class="row"><span class="dot"></span><label class="name" for="'+id+'n">'+o.name+'</label><span class="eq">=</span><input class="field num" id="'+id+'n" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"><span class="unit">'+(o.note||'')+'</span></div><input type="range" id="'+id+'r" min="'+o.min+'" max="'+o.max+'" step="'+o.step+'" aria-label="'+esc(o.label||o.name)+'">';
  host.appendChild(wrap);
  const num=wrap.querySelector('.num'),rg=wrap.querySelector('[type=range]');
  const dec=o.dec||0;
  const f=x=>fmt(x,dec);
  const sync=skip=>{if(skip!==num)num.value=f(o.get());rg.value=o.get();};
  rg.addEventListener('input',()=>{o.set(parseFloat(rg.value));sync(null);o.on&&o.on(null);});
  num.addEventListener('input',()=>{
    const v=parseFloat(num.value.replace(',','.').replace(/ |\s/g,''));
    if(!isFinite(v)){num.classList.add('bad');return;}
    num.classList.remove('bad');
    o.set(clamp(v,o.min,o.max));rg.value=o.get();o.on&&o.on(num);
  });
  num.addEventListener('blur',()=>{num.classList.remove('bad');num.value=f(o.get());});
  sync(null);
  return {sync,wrap};
}
/* boutons radio segmentés */
function seg(host,items,get,set,cols){
  host.classList.add('seg');host.style.setProperty('--cols',cols||items.length);host.setAttribute('role','radiogroup');
  host.innerHTML=items.map(([v,l])=>'<button type="button" role="radio" data-v="'+esc(v)+'">'+l+'</button>').join('');
  const sync=()=>qa(host,'button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.v===String(get()))));
  qa(host,'button').forEach(b=>b.addEventListener('click',()=>{set(b.dataset.v);sync();}));
  sync();return sync;
}
const sec=(title,inner,num)=>'<section class="sec"><h2>'+(num?'<span class="n">'+num+'</span>':'')+title+'</h2>'+inner+'</section>';

/* graphiques SVG */
const Chart={
  _ticks(a,b,n){const span=b-a,raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/p,s=r<1.5?1:r<3?2:r<7?5:10,st=s*p,out=[];for(let v=Math.ceil(a/st-1e-9)*st;v<=b+1e-9;v+=st)out.push(+v.toFixed(10));return out;},
  _short(v){const a=Math.abs(v);if(a>=1e6)return (v/1e6).toString().replace('.',',')+' M';if(a>=1e3)return (v/1e3).toString().replace('.',',')+' k';return String(+v.toFixed(4)).replace('.',',');},
  line(svg,o){
    const W=o.w||520,H=o.h||260,L=o.left||46,R=10,T=14,B=o.bottom||34;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.classList.add('chart');
    const lx=o.xlog?Math.log10:x=>x,ly=o.ylog?Math.log10:y=>y;
    const xmin=o.xmin,xmax=o.xmax,ymin=o.ymin,ymax=o.ymax;
    const X=x=>L+(lx(x)-lx(xmin))/(lx(xmax)-lx(xmin))*(W-L-R);
    const Y=y=>H-B-(ly(y)-ly(ymin))/(ly(ymax)-ly(ymin))*(H-B-T);
    let s='';
    const xt=o.xlog?Array.from({length:Math.round(lx(xmax)-lx(xmin))+1},(_,i)=>Math.pow(10,Math.round(lx(xmin))+i)):Chart._ticks(xmin,xmax,o.xticks||6);
    const yt=o.ylog?Array.from({length:Math.round(ly(ymax)-ly(ymin))+1},(_,i)=>Math.pow(10,Math.round(ly(ymin))+i)):Chart._ticks(ymin,ymax,o.yticks||5);
    yt.forEach(v=>{if(v<ymin||v>ymax)return;const y=Y(v);s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#e8e8ee"/><text x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10.5" fill="#6a6a78">'+Chart._short(v)+'</text>';});
    xt.forEach(v=>{if(v<xmin||v>xmax)return;const x=X(v);s+='<line x1="'+x+'" y1="'+T+'" x2="'+x+'" y2="'+(H-B)+'" stroke="#f0f0f4"/><text x="'+x+'" y="'+(H-B+14)+'" text-anchor="middle" font-size="10.5" fill="#6a6a78">'+Chart._short(v)+'</text>';});

/* clés Python : int, float ou str (les guillemets forcent str ; 1 et 1.0 désignent la même clé) */
const FLOAT_RE=/^[+-]?(\d+\.\d*|\.\d+|\d+(?=[eE]))([eE][+-]?\d+)?$/;
function parseKey(text){
  const t=String(text).trim().slice(0,28);
  if(!t) return null;
  const qm=t.match(/^(["'])(.*)\1$/);
  if(qm&&qm[2].length) return {type:'str',id:'s:'+qm[2],label:t,s:qm[2]};
  if(/^[+-]?\d+$/.test(t)){const b=BigInt(t.replace(/^\+/,''));return {type:'int',id:'n:'+b,label:t,big:b};}
  let x=NaN;
  if(/^[+-]?inf(inity)?$/i.test(t)) x=t[0]==='-'?-Infinity:Infinity;
  else if(FLOAT_RE.test(t)) x=parseFloat(t);
  if(!Number.isNaN(x)){
    if(!Number.isFinite(x)) return {type:'float',id:'f:'+x,label:t,x};
    if(Number.isInteger(x)) return {type:'float',id:'n:'+BigInt(x),label:t,x,big:BigInt(x)};
    return {type:'float',id:'f:'+x,label:t,x};
  }
  return {type:'str',id:'s:'+t,label:t,s:t};
}

/* arithmétique 64 bits à la Python */
const M64=(1n<<64n)-1n,P61=(1n<<61n)-1n;
function pyInt(n){const neg=n<0n,a=neg?-n:n;let h=a%P61;if(neg)h=-h;if(h===-1n)h=-2n;return h;}
function splitmix(h){h^=h>>30n;h=(h*0xbf58476d1ce4e5b9n)&M64;h^=h>>27n;h=(h*0x94d049bb133111ebn)&M64;h^=h>>31n;return h;}
function strHash64(s,salt){let h=0xcbf29ce484222325n^(salt||0n);for(const b of new TextEncoder().encode(s)){h^=BigInt(b);h=(h*0x100000001b3n)&M64;}return BigInt.asIntN(64,splitmix(h));}
const bin64=h=>BigInt.asUintN(64,h).toString(2).padStart(64,'0');
const hex64=h=>'0x'+BigInt.asUintN(64,h).toString(16).padStart(16,'0');
function randSalt(){const a=new Uint32Array(2);(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):(a[0]=Math.random()*4294967296,a[1]=Math.random()*4294967296);return (BigInt(a[0])<<32n)|BigInt(a[1]);}
function egcd(a,b){let [r0,r1,s0,s1]=[a,b,1n,0n];while(r1!==0n){const qq=r0/r1;[r0,r1]=[r1,r0-qq*r1];[s0,s1]=[s1,s0-qq*s1];}return [r0,s0];}
function modInv(a,m){const [g,x]=egcd(((a%m)+m)%m,m);return g===1n?((x%m)+m)%m:null;}
function sci(x,d){d=d===undefined?2:d;if(!isFinite(x))return '∞';if(Math.abs(x)<1e6)return fmtInt(Math.round(x));const e=Math.floor(Math.log10(x)),m=x/Math.pow(10,e);const sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return fmt(m,d)+' × 10'+String(e).split('').map(c=>sup[+c]).join('');}

  ${sec('Définition','<p class="desc" style="margin:0">Un dictionnaire associe à chaque <b>clé</b> une <b>valeur</b>. Opérations : ajouter, supprimer une association, obtenir la valeur d\'une clé.</p>')}
  ${sec('Création','<div id="d-pre"></div><p class="desc"><span style="font-family:var(--font-mono)">d = {}</span> ou <span style="font-family:var(--font-mono)">dict()</span> crée un dictionnaire vide.</p><textarea class="field" id="d-text" rows="5" spellcheck="false" autocomplete="off" aria-label="Contenu du dictionnaire"></textarea><p class="desc">Une association par ligne : <span style="font-family:var(--font-mono)">clé : valeur</span>.</p><p class="msg warn" id="d-note" hidden></p>')}
  ${sec('Opérations sur d','<div class="row"><span class="dot" style="--c:var(--path)"></span><label class="name" for="d-k">k</label><span class="eq">=</span><input class="field mono" id="d-k" value="&quot;M. Catry&quot;" autocomplete="off" spellcheck="false"></div><div class="row"><span class="dot" style="--c:var(--ok)"></span><label class="name" for="d-v">v</label><span class="eq">=</span><input class="field mono" id="d-v" value="&quot;j\'adore les maths&quot;" autocomplete="off" spellcheck="false"></div><div class="btns" id="d-ops"></div>')}
  ${sec('Console','<pre class="code" id="d-con" style="min-height:90px;padding:8px 10px"></pre><div class="btns"><button class="btn" id="d-clear">Effacer</button></div>')}
 </aside>
 <main class="view">
  <div class="vbar"><span id="d-info"></span><span class="pk">type(d) = dict</span></div>
  <div class="vis" id="d-vis"></div>
 </main>`,
 init(root){
  const D={name:'d',map:new Map(),pre:'mdp',last:null,con:[]};
  const $r=s=>q(root,s);
  const parseDict=text=>{
    const m=new Map();let notes=[];
    for(const line of text.split('\n')){
      const t=line.trim();if(!t) continue;
      const mm=t.match(/^((?:"[^"]*"|'[^']*'|[^:])+?)\s*:\s*(.*)$/);
      if(!mm) continue;
      const ki=parseKey(mm[1]);if(!ki) continue;
      const u=unhashable(mm[1]);
      if(u){notes.push('TypeError : unhashable type : \''+u+'\' (clé '+mm[1]+')');continue;}
      if(m.has(ki.id))notes.push(ki.label+' remplace une clé égale déjà présente');
      m.set(ki.id,{ki,v:mm[2].trim()});
    }
    return {m,notes};
  };
  const setNote=n=>{const e=$r('#d-note');e.hidden=!n.length;e.textContent=n.join(' · ');};
  const items=()=>Array.from(D.map.values());
  const reprDict=()=>'{'+items().map(e=>pyRepr(e.ki)+': '+e.v).join(', ')+'}';
  function log(cmd,out,err){D.con.push({cmd,out,err});if(D.con.length>14)D.con.shift();renderCon();}
  function renderCon(){
    $r('#d-con').innerHTML=D.con.length?D.con.map(c=>'<span style="display:block;padding:0 10px">'+pyhl('>>> '+c.cmd)[0].replace('&gt;&gt;&gt;','<span class="hc">&gt;&gt;&gt;</span>')+'</span><span style="display:block;padding:0 10px;color:'+(c.err?'var(--bad)':'var(--ink)')+'">'+esc(c.out)+'</span>').join(''):'<span class="hc" style="padding:0 10px">Choisis une opération.</span>';
    $r('#d-con').scrollTop=1e9;
  }
  const getK=()=>parseKey($r('#d-k').value),getV=()=>$r('#d-v').value.trim();
  const OPS=[
   ['get','d[k]'],['set','d[k] = v'],['in','k in d'],['notin','k not in d'],['getd','d.get(k, 0)'],['del','del d[k]'],['len','len(d)'],['keys','d.keys()'],['values','d.values()'],['items','d.items()']
  ];
  $r('#d-ops').innerHTML=OPS.map(([id,l])=>'<button type="button" class="btn'+(id==='set'?' main':'')+'" data-op="'+id+'">'+esc(l)+'</button>').join('');
  function doOp(op){
    const ki=getK(),need=!['len','keys','values','items'].includes(op);
    if(need&&!ki){log('…','Saisis une clé k.',true);return;}
    const key=ki?(ki.type==='str'?'"'+ki.s+'"':ki.label):'';
    const e=ki?D.map.get(ki.id):null;
    D.last=ki&&need?ki.id:null;
    if(op==='get'){e?log('d['+key+']',e.v):log('d['+key+']',"KeyError: "+pyRepr(ki),true);}
    else if(op==='set'){
      const v=getV()||'None';
      const u=unhashable(ki.label);if(u){log('d['+key+'] = '+v,"TypeError: unhashable type: '"+u+"'",true);}
      else{D.map.set(ki.id,{ki:e?e.ki:ki,v});log('d['+key+'] = '+v,e?'(valeur modifiée)':'(clé ajoutée)');syncText();}
    }
    else if(op==='in')log(key+' in d',e?'True':'False');
    else if(op==='notin')log(key+' not in d',e?'False':'True');
    else if(op==='getd')log('d.get('+key+', 0)',e?e.v:'0');
    else if(op==='del'){if(e){D.map.delete(ki.id);log('del d['+key+']','(association supprimée)');syncText();}else log('del d['+key+']','KeyError: '+pyRepr(ki),true);}
    else if(op==='len')log('len(d)',String(D.map.size));
    else if(op==='keys')log('list(d.keys())','['+items().map(e=>pyRepr(e.ki)).join(', ')+']');
    else if(op==='values')log('list(d.values())','['+items().map(e=>e.v).join(', ')+']');
    else if(op==='items')log('list(d.items())','['+items().map(e=>'('+pyRepr(e.ki)+', '+e.v+')').join(', ')+']');
    renderAll();
  }
  qa(root,'[data-op]').forEach(b=>b.addEventListener('click',()=>doOp(b.dataset.op)));
  $r('#d-clear').addEventListener('click',()=>{D.con=[];renderCon();});
  const syncText=()=>{$r('#d-text').value=items().map(e=>pyRepr(e.ki).replace(/^'(.*)'$/,'"$1"')+' : '+e.v).join('\n');};
  seg($r('#d-pre'),Object.keys(PRESETS).map(k=>[k,PRESETS[k].name]),()=>D.pre,v=>{D.pre=v;$r('#d-text').value=PRESETS[v].text;fromText();},3);
  function fromText(){const r=parseDict($r('#d-text').value);D.map=r.m;setNote(r.notes);D.last=null;renderAll();}
  $r('#d-text').addEventListener('input',fromText);

  /* ---- vue graphique ---- */
  function freq(L){const o=new Map();for(const x of L)o.set(x,(o.get(x)||0)+1);return o;}
  function renderAll(){
    const it=items();
    $r('#d-info').innerHTML='<b style="color:var(--ink)">len(d) = '+it.length+'</b>';
    let h='<div class="h3">Le dictionnaire <span style="font-family:var(--font-mono)">d</span></div>';
    h+=it.length?'<div class="cards">'+it.map(e=>'<div class="card" style="'+(D.last===e.ki.id?'border-color:var(--ok);background:var(--ok-soft)':'')+'"><div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span class="tag t-'+e.ki.type+'">'+e.ki.type+'</span><b style="font-family:var(--font-mono)">'+esc(pyRepr(e.ki))+'</b></div><div style="margin-top:4px;font-family:var(--font-mono);font-size:13px;color:var(--ink)">→ '+esc(e.v||'None')+'</div></div>').join('')+'</div>':'<p class="empty">Dictionnaire vide : <span style="font-family:var(--font-mono)">{}</span></p>';
    h+='<p class="note" style="font-family:var(--font-mono)">d = '+esc(reprDict())+'</p>';
    /* complexité */
    h+='<div class="h3" style="margin-top:18px">Complexité des opérations élémentaires</div><div class="tblw"><table class="tbl"><tr><th>Python</th><th>Description</th><th>Complexité</th></tr>'+
     '<tr><td><code class="code-i">d[k] = v</code></td><td>Ajout (ou modification) d\'une association de k à v</td><td>O(1) en moyenne</td></tr>'+
     '<tr><td><code class="code-i">d[k]</code></td><td>Accès à la valeur de clé k</td><td>O(1) en moyenne</td></tr>'+
     '<tr><td><code class="code-i">len(d)</code></td><td>Nombre de clés de d</td><td>O(1) en moyenne</td></tr>'+
     '<tr><td><code class="code-i">for k in d:</code></td><td>Parcourir les clés k de d</td><td>O(n), n = nombre de clés</td></tr></table></div>';
    /* parcours */
    h+='<div class="h3" style="margin-top:18px">Parcours</div>'+codeBlock('for k in d:   # équivalent à d.keys()\n    print(k, "->", d[k])')+'<pre class="code" style="margin-top:6px;padding:8px 10px">'+(it.length?it.map(e=>esc(e.ki.type==='str'?e.ki.s:e.ki.label)+' -> '+esc(e.v)).join('\n'):'(rien)')+'</pre>';
    /* exercice inverse */
    const inv=new Map(),dups=[],bad=[];
    it.forEach(e=>{const u=unhashable(e.v);if(u){bad.push(e.v+' (type '+u+')');return;}const ki=parseKey(e.v);if(!ki)return;if(inv.has(ki.id))dups.push(e.v);inv.set(ki.id,{ki,v:pyRepr(e.ki)});});
    h+='<div class="h3" style="margin-top:18px">Exercice : inverse(d)</div><p class="note">On veut <code class="code-i">d[k] == v ⇔ d2[v] == k</code>, en supposant que d ne contient pas deux fois la même valeur.</p><div class="cards"><div>'+codeBlock('def inverse(d):\n    d2 = {}                 # nouveau dictionnaire\n    for k in d:             # O(n)\n        v = d[k]            # O(1)\n        d2[v] = k           # O(1)\n    return d2')+'<p class="note" style="margin-top:6px">Version élégante avec <code class="code-i">items</code> :</p>'+codeBlock('def inverse(d):\n    return {v: k for k, v in d.items()}')+'</div><div><div class="h3">d2 = inverse(d)</div>'+
      (inv.size?'<div class="tblw"><table class="tbl"><tr><th>clé de d2 (= v)</th><th>valeur (= k)</th></tr>'+Array.from(inv.values()).map(e=>'<tr><td><code class="code-i">'+esc(e.ki.label)+'</code></td><td><code class="code-i">'+esc(e.v)+'</code></td></tr>').join('')+'</table></div>':'<p class="empty">Rien à afficher.</p>')+
      (dups.length?'<p class="msg err"><b>Valeur en double :</b> '+dups.map(esc).join(', ')+'. Une seule association est conservée, la dernière : l\'hypothèse de l\'énoncé n\'est pas vérifiée.</p>':'')+
      (bad.length?'<p class="msg err"><b>TypeError : unhashable.</b> '+bad.map(esc).join(', ')+' ne peut pas servir de clé : seuls les objets immuables sont hachables.</p>':'')+'</div></div>';
    /* exercice frequent */
    h+='<div class="h3" style="margin-top:18px">Exercice : frequent(L) en O(n)</div><div class="row"><label class="name" for="d-L" style="font-size:14px;font-style:normal">L =</label><input class="field mono" id="d-L" value="'+esc(D.L===undefined?'3 1 3 2 1 3 4 1 3':D.L)+'" autocomplete="off" spellcheck="false" aria-label="Liste L, éléments séparés par des espaces"></div><div id="d-freq"></div>';
    h+='<div class="cards" style="margin-top:8px"><div>'+codeBlock('def frequent(L):\n    if not L:\n        return None\n    occurrences = {}\n    for element in L:\n        if element in occurrences:\n            occurrences[element] += 1\n        else:\n            occurrences[element] = 1\n    plus_frequent = L[0]\n    max_occ = 0\n    for element, compte in occurrences.items():\n        if compte > max_occ:\n            max_occ = compte\n            plus_frequent = element\n    return plus_frequent')+'</div><div>'+codeBlock('def frequent(L):\n    if not L:\n        return None\n    occurrences = {}\n    for element in L:\n        occurrences[element] = occurrences.get(element, 0) + 1\n    return max(occurrences, key=occurrences.get)')+'<p class="note" style="margin-top:6px">Version élégante avec <code class="code-i">get</code> : un seul parcours de L, chaque mise à jour est en O(1).</p></div></div>';
    $r('#d-vis').innerHTML=h;
    const inp=$r('#d-L');
    const upd=()=>{
      D.L=inp.value;
      const L=inp.value.split(/[\s,;]+/).filter(Boolean).slice(0,200);
      const oc=freq(L),arr=Array.from(oc.entries());
      let best=null,bm=0;arr.forEach(([k,c])=>{if(c>bm){bm=c;best=k;}});
      $r('#d-freq').innerHTML=L.length?'<div class="tblw"><table class="tbl" style="margin-top:6px"><tr><th>élément</th>'+arr.map(a=>'<td><code class="code-i">'+esc(a[0])+'</code></td>').join('')+'</tr><tr><th>occurrences</th>'+arr.map(a=>'<td class="r" style="'+(a[0]===best?'background:var(--ok-soft);font-weight:600':'')+'">'+a[1]+'</td>').join('')+'</tr></table></div><p class="msg ok">frequent(L) = <b>'+esc(best)+'</b> ('+bm+' fois). Un parcours de L : n = '+L.length+' mises à jour du dictionnaire, chacune en O(1).</p>':'<p class="msg warn">frequent([]) renvoie None.</p>';
    };
    inp.addEventListener('input',upd);upd();
  }
  $r('#d-text').value=PRESETS.mdp.text;fromText();renderCon();
  log('d["M. Chomette"]',"'artif'");
 }
});

})();

/* ===== p3.js ===== */
(function(){
/* Partie 3 : dictionnaire de variables, représentation d'un graphe par dictionnaire */
const GR={
 simple:{text:'0 : [1, 2]\n1 : [0, 2]\n2 : [0, 1]\n3 : [4]\n4 : [3]\n5 : []',pos:{0:[250,70],1:[110,200],2:[390,200],3:[150,330],4:[350,330],5:[470,60]}},
 pond:{text:'0 : {1: 2, 2: 3}\n1 : {0: 2, 2: 1}\n2 : {0: 3, 1: 1}\n3 : {4: 8}\n4 : {3: 8}\n5 : {}',pos:{0:[250,70],1:[110,200],2:[390,200],3:[150,330],4:[350,330],5:[470,60]}}
};
part({
 id:'applications',tab:'Applications',
 html:`<aside class="alg">
  ${sec('globals et locals','<p class="desc" style="margin:0 0 8px">Python conserve en mémoire deux dictionnaires de variables : <code>globals()</code> et <code>locals()</code>.</p><div id="a-code"></div><div class="row"><label class="name" for="a-x" style="font-style:normal;font-size:14px">f(</label><input class="field num mono" id="a-x" value="1" aria-label="Argument de f"><span class="eq">)</span></div><p class="msg" id="a-loc"></p>')}
  ${sec('Représenter un graphe','<div id="a-pre"></div><p class="desc">Au lieu d\'une matrice ou d\'une liste, <code>G[v]</code> donne les voisins du sommet v (liste ou ensemble), ou un dictionnaire <code>{voisin: poids}</code> pour un graphe pondéré.</p><textarea class="field" id="a-text" rows="7" spellcheck="false" autocomplete="off" aria-label="Dictionnaire du graphe"></textarea><p class="msg err" id="a-err" hidden></p>')}
  ${sec('Interroger G','<div class="row"><span class="dot" style="--c:var(--path)"></span><label class="name" for="a-u">u</label><span class="eq">=</span><input class="field num mono" id="a-u" value="0"><label class="name" for="a-w" style="margin-left:6px">v</label><span class="eq">=</span><input class="field num mono" id="a-w" value="2"></div><p class="msg" id="a-q"></p>')}
 </aside>
 <main class="view">
  <div class="vbar"><span id="a-info"></span><span class="pk">clic sur un sommet : u</span></div>
  <div class="vis"><svg id="a-svg" class="chart" style="max-width:640px"></svg><p class="note" style="font-family:var(--font-mono)" id="a-repr"></p></div>
 </main>`,
 init(root){
  const $r=s=>q(root,s);
  let x=1,mode='pond',u='0',w='2',G=null;
  /* globals / locals */
  $r('#a-code').innerHTML=codeBlock('a = 10\ndef f(x):\n    y = 2\n    print(locals())\nf(1)   # affiche {\'x\': 1, \'y\': 2}');
  const updLoc=()=>{
    const xv=$r('#a-x').value.trim()||'None';
    $r('#a-loc').innerHTML='<b>locals()</b> dans f : <code>{\'x\': '+esc(xv)+', \'y\': 2}</code><br><b>globals()</b> : <code>{\'a\': 10, \'f\': &lt;function f&gt;, …}</code><br>Une variable locale n\'existe que dans le bloc de la fonction.';
  };
  $r('#a-x').addEventListener('input',updLoc);updLoc();
  /* graphe */
  function parseG(text){
    const g=new Map(),errs=[];let weighted=false;
    for(const line of text.split('\n')){
      const t=line.trim();if(!t)continue;
      const m=t.match(/^([^:]+?)\s*:\s*(.*)$/);if(!m){errs.push('Ligne ignorée : '+t);continue;}
      const v=m[1].trim(),rest=m[2].trim();
      if(rest.startsWith('[')&&rest.endsWith(']')){
        const inner=rest.slice(1,-1).trim();
        g.set(v,new Map((inner?inner.split(/\s*,\s*/):[]).map(n=>[n,null])));
      }else if(rest.startsWith('{')&&rest.endsWith('}')){
        const inner=rest.slice(1,-1).trim();const mp=new Map();
        if(inner)for(const pr of inner.split(/\s*,\s*/)){const mm=pr.match(/^([^:]+?)\s*:\s*(-?[\d.]+)$/);if(!mm){errs.push('Paire ignorée : '+pr);continue;}mp.set(mm[1].trim(),parseFloat(mm[2]));weighted=true;}
        g.set(v,mp);
      }else errs.push('Ligne ignorée : '+t);
    }
    return {g,errs,weighted};
  }
  function render(){
    const r=parseG($r('#a-text').value);G=r.g;
    const e=$r('#a-err');e.hidden=!r.errs.length;e.textContent=r.errs.join(' · ');
    const nodes=Array.from(G.keys());
    for(const nb of G.values())for(const k of nb.keys())if(!G.has(k)&&!nodes.includes(k))nodes.push(k);
    const preset=(mode==='pond'||mode==='simple')&&nodes.every(n=>GR.simple.pos[n]);
    const pos={};
    nodes.forEach((n,i)=>{
      if(preset&&$r('#a-text').value===GR[mode].text)pos[n]=GR[mode].pos[n];
      else{const ang=-Math.PI/2+i*2*Math.PI/Math.max(nodes.length,1);pos[n]=[300+190*Math.cos(ang),215+150*Math.sin(ang)];}
    });
    const svg=$r('#a-svg');svg.setAttribute('viewBox','0 0 600 430');
    let s='<defs><marker id="ga" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#55555f"/></marker></defs>';
    const edges=[];
    for(const [a,nb] of G)for(const [b,wt] of nb)edges.push([a,b,wt]);
    const has=(a,b)=>G.has(a)&&G.get(a).has(b);
    const drawn=new Set();
    edges.forEach(([a,b,wt])=>{
      if(!pos[a]||!pos[b])return;
      const sym=has(b,a),key=sym?[a,b].sort().join('|'):a+'>'+b;
      if(drawn.has(key))return;drawn.add(key);
      const [x1,y1]=pos[a],[x2,y2]=pos[b];
      if(a===b){s+='<path d="M'+x1+','+(y1-18)+' c-30,-50 30,-50 0,0" fill="none" stroke="#55555f" stroke-width="1.6" marker-end="url(#ga)"/>';return;}
      const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
      const hl=(a===u&&b!==undefined&&G.get(u)&&G.get(u).has(b))||(sym&&b===u);
      const col=hl?'#e08a00':'#55555f';
      s+='<line x1="'+(x1+ux*20)+'" y1="'+(y1+uy*20)+'" x2="'+(x2-ux*(sym?20:23))+'" y2="'+(y2-uy*(sym?20:23))+'" stroke="'+col+'" stroke-width="'+(hl?3:1.8)+'"'+(sym?'':' marker-end="url(#ga)"')+'/>';
      if(wt!==null)s+='<text x="'+((x1+x2)/2-uy*12)+'" y="'+((y1+y2)/2+ux*12+4)+'" text-anchor="middle" font-size="14" font-weight="600" fill="#1565c0" paint-order="stroke" stroke="#fff" stroke-width="4">'+fmt(wt,2)+'</text>';
    });
    nodes.forEach(n=>{
      const [x,y]=pos[n],on=n===u,nb=G.get(u)&&G.get(u).has(n);
      s+='<g data-n="'+esc(n)+'" style="cursor:pointer"><circle cx="'+x+'" cy="'+y+'" r="20" fill="'+(on?'#fff3dc':nb?'#e3f4ea':'#e6effc')+'" stroke="'+(on?'#e08a00':nb?'#2e8b57':'#8fa8d8')+'" stroke-width="2"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f28">'+esc(n)+'</text></g>';
    });
    svg.innerHTML=s;
    qa(svg,'[data-n]').forEach(g=>g.addEventListener('click',()=>{u=g.dataset.n;$r('#a-u').value=u;render();}));
    let ne=0;edges.forEach(([a,b])=>{ne++;});
    const und=edges.every(([a,b])=>has(b,a));
    $r('#a-info').innerHTML='<b style="color:var(--ink)">'+nodes.length+' sommets, '+(und?ne/2:ne)+' arêtes'+(und?'':' orientées')+'</b>';
    $r('#a-repr').textContent='G = {'+Array.from(G).map(([v,nb])=>v+': '+(nb.size&&Array.from(nb.values())[0]!==null?'{'+Array.from(nb).map(([k,wt])=>k+': '+wt).join(', ')+'}':'['+Array.from(nb.keys()).join(', ')+']')).join(', ')+'}';
    query();
  }
  function query(){
    const nb=G.get(u),el=$r('#a-q');
    if(!nb){el.className='msg warn';el.innerHTML='Le sommet <code>'+esc(u)+'</code> n\'est pas une clé de G.';return;}
    const wts=Array.from(nb.values())[0]!==undefined&&Array.from(nb.values())[0]!==null;
    let h='<code>G['+esc(u)+']</code> = <b>'+esc(wts?'{'+Array.from(nb).map(([k,x])=>k+': '+x).join(', ')+'}':'['+Array.from(nb.keys()).join(', ')+']')+'</b> (degré '+nb.size+'), accès en O(1).';
    if(nb.has(w))h+='<br><code>'+esc(w)+' in G['+esc(u)+']</code> → True'+(wts?', poids <code>G['+esc(u)+']['+esc(w)+']</code> = <b>'+nb.get(w)+'</b>':'')+'.';
    else h+='<br><code>'+esc(w)+' in G['+esc(u)+']</code> → False : pas d\'arête de '+esc(u)+' vers '+esc(w)+'.';
    el.className='msg';el.innerHTML=h;
  }
  seg($r('#a-pre'),[['simple','Graphe du cours'],['pond','Graphe pondéré']],()=>mode,v=>{mode=v;$r('#a-text').value=GR[v].text;render();},2);
  $r('#a-text').value=GR.pond.text;

(function(){
/* Partie 4 : exploiter un dictionnaire (liste, dichotomie, dict) */

const MESURES=[
 ['Liste, force brute',3e-3,'obnubilé : 3 ms (omnubilé : 5,17 ms)','#d93a2b'],

part({
 id:'exploitation',tab:'Exploitation',
 html:`<aside class="alg">

  ${sec('Taille du dictionnaire','<div class="row"><span class="dot" style="--c:var(--ui)"></span><label class="name" for="x-N">N</label><span class="eq">=</span><input class="field num mono" id="x-N" style="width:110px" autocomplete="off"><span class="unit">mots</span></div><div id="x-sl"></div><div class="btns"><button class="btn" id="x-424">424 579 mots (cours)</button><button class="btn" id="x-160">160 000 (Swann)</button></div>')}
  ${sec('Mot recherché','<div class="row"><span class="dot" style="--c:var(--path)"></span><label class="name" for="x-w">m</label><span class="eq">=</span><input class="field mono" id="x-w" value="obnubilé" autocomplete="off" spellcheck="false"></div><div class="btns"><button class="btn main" id="x-go">Chercher</button><button class="btn" id="x-step">Pas suivant ▶</button><button class="btn" id="x-all">Tout exécuter</button></div><p class="desc">La liste affichée est un extrait de 48 mots triés. Les comparaisons <code>&lt;</code>, <code>==</code> se font caractère par caractère, selon le code Unicode (<code>ord()</code>) : « école » vient donc après « zèbre ».</p><p class="msg" id="x-msg"></p>')}
  ${sec('Nombre de comparaisons','<div class="res"><span class="dot" style="--c:var(--coll)"></span><span>Séquentielle, pire cas : N</span><span class="val" id="x-lin"></span></div><div class="res"><span class="dot" style="--c:var(--path)"></span><span>Dichotomie : ⌈log₂ N⌉</span><span class="val" id="x-dic"></span></div><div class="res"><span class="dot" style="--c:var(--ok)"></span><span>Table de hachage</span><span class="val">≈ 1</span></div><p class="desc" id="x-k"></p>')}
 </aside>
 <main class="view">
  <div class="vbar"><span><i class="sq"></i>zone de recherche</span><span><i class="sq p"></i>milieu comparé</span><span><i class="sq f"></i>trouvé</span><span><i class="sq" style="background:#ececf1;border-color:#ccc"></i>éliminé</span></div>
  <div class="vis">
   <div class="h3">Recherche dichotomique sur la liste triée</div>
   <div id="x-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px"></div>
   <pre class="code" id="x-code" style="margin-top:10px"></pre>
   <div class="h3" style="margin-top:18px">Comparaisons en fonction de N (échelle log-log)</div>
   <svg id="x-chart" style="max-width:640px"></svg>
   <div class="h3" style="margin-top:18px">Temps mesurés dans le cours (échelle logarithmique)</div>
   <div id="x-times"></div>
   <p class="note">Python est interprété, d'où des écarts plus petits que le rapport des nombres de comparaisons : une fonction de bibliothèque est plus efficace qu'une fonction écrite à la main. <code class="code-i">bisect_left</code> renvoie la position où insérer le mot pour garder la liste triée.</p>
   <p class="msg ok">Analyser « Du côté de chez Swann » (160 000 mots) : <b>15 ms</b> avec un dict, <b>8 min</b> avec la recherche linéaire, soit un rapport d'environ 32 000.</p>

 </main>`,
 init(root){
  const $r=s=>q(root,s);
  let N=424579,steps=[],k=-1,word='obnubilé';

  const sl=slider($r('#x-sl'),{name:'log₁₀ N',min:1,max:7,step:0.01,dec:2,get:()=>Math.log10(N),set:v=>setN(Math.pow(10,v)),on:()=>{renderN();}});

    const ns=[],lin=[],dic=[],hs=[];
    for(let e=1;e<=7;e+=0.05){const n=Math.pow(10,e);ns.push(n);lin.push([n,n]);dic.push([n,Math.ceil(Math.log2(n))]);hs.push([n,1]);}

    while debut <= fin:
        milieu = (debut + fin) // 2
        if liste[milieu] == mot:
            return True
        elif liste[milieu] < mot:
            debut = milieu + 1
        else:
            fin = milieu - 1
    return False`,st.mid===null?(st.done?(st.found?7:12):3):st.res==='eq'?7:st.res==='lt'?9:11).replace('<pre class="code">','').replace('</pre>','');
  }

 }
});

})();

(function(){
/* Partie 5 : table de hachage (atelier) */
part({
 id:'table',tab:'Table de hachage',
 html:"    <aside class=\"alg\" aria-label=\"Algèbre\">\n\n      <section class=\"sec\">\n        <h2>L'idée</h2>\n        <p class=\"desc\" style=\"margin:0 0 8px\">Chercher « Polytechnique » dans un dictionnaire papier : sans hachage, on lit mot après mot depuis la première page. Avec un onglet alphabétique, on « hache » le mot et on saute directement à la bonne section.</p>\n        <p class=\"desc\" style=\"margin:0\">Deux façons de créer un dictionnaire : une <b>table de hachage</b> (Python), accès en O(1) et mémoire O(n + N) où N est la taille de la table, ou un arbre binaire de recherche (option info).</p>\n      </section>\n\n      <section class=\"sec\">\n        <h2><span class=\"n\">1</span>Le hash donne un grand entier</h2>\n        <p class=\"desc\" style=\"margin:0 0 8px\">hash() renvoie toujours un entier de 64 bits, mais chaque type de clé occupe cette plage à sa façon :</p>\n        <ul class=\"rules\">\n          <li><span class=\"tag t-int\">int</span><span>le hash est l'entier lui-même, tant qu'il est dans l'intervalle de ±(2⁶¹ − 1). Sinon, modulo 2⁶¹ − 1.</span></li>\n          <li><span class=\"tag t-float\">float</span><span>deux nombres égaux ont le même hash (1 et 1.0). Sinon, p/q donne p × q⁻¹ modulo 2⁶¹ − 1.</span></li>\n          <li><span class=\"tag t-str\">str</span><span>salage aléatoire, puis un entier réparti sur les 64 bits.</span></li>\n        </ul>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"ck-course\"><span>Valeurs de hash du cours (vache, cochon, poule, veau)</span></label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"ck-salt\" checked><span>Salage aléatoire des chaînes</span></label>\n        <div class=\"row\" style=\"min-height:30px\"><span class=\"unit\" id=\"salt-val\" style=\"font-family:var(--font-mono);flex:1;min-width:0;overflow-wrap:anywhere\"></span><button type=\"button\" class=\"btn\" id=\"b-salt\">Nouvelle exécution</button></div>\n      </section>\n\n      <section class=\"sec\">\n        <h2><span class=\"n\">2</span>La réduction trouve la case</h2>\n        <div class=\"seg\" id=\"seg-red\" style=\"--cols:3\" role=\"radiogroup\" aria-label=\"Réduction\">\n          <button type=\"button\" role=\"radio\" data-v=\"mod\">Modulo</button>\n          <button type=\"button\" role=\"radio\" data-v=\"mask\">Masque</button>\n          <button type=\"button\" role=\"radio\" data-v=\"mult\">Multiplic.</button>\n        </div>\n        <p class=\"desc\" id=\"desc-red\"></p>\n        <div id=\"host-m\"></div>\n      </section>\n\n      <section class=\"sec\">\n        <h2><span class=\"n\">3</span>Le tableau stocke le paquet</h2>\n        <p class=\"desc\" style=\"margin:0 0 8px\">Chaque case contient le hash, la clé et la valeur. Si deux clés visent la même case, on gère la collision :</p>\n        <div class=\"seg\" id=\"seg-method\" style=\"--cols:4\" role=\"radiogroup\" aria-label=\"Gestion des collisions\">\n          <button type=\"button\" role=\"radio\" data-v=\"chain\">Chaînage</button>\n          <button type=\"button\" role=\"radio\" data-v=\"lin\">Linéaire</button>\n          <button type=\"button\" role=\"radio\" data-v=\"quad\">Quadr.</button>\n          <button type=\"button\" role=\"radio\" data-v=\"dbl\">Double</button>\n        </div>\n        <p class=\"desc\" id=\"desc-method\"></p>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"ck-py\"><span>Règle de Python : agrandir à 2/3 de remplissage, ×4 (×2 au-delà de 50 000 clés)</span></label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"ck-auto\"><span>Agrandir le tableau si α dépasse le seuil</span></label>\n        <div id=\"host-thr\"></div>\n      </section>\n\n      <section class=\"sec\">\n        <h2>Entrées du dictionnaire</h2>\n        <textarea class=\"field\" id=\"keys\" rows=\"7\" spellcheck=\"false\" autocomplete=\"off\" aria-label=\"Entrées, une par ligne, au format clé : valeur\"></textarea>\n        <p class=\"desc\">Une entrée par ligne, au format <span style=\"font-family:var(--font-mono)\">clé : valeur</span>. La clé est un entier (<span style=\"font-family:var(--font-mono)\">42</span>), un flottant (<span style=\"font-family:var(--font-mono)\">0.375</span>) ou une chaîne (<span style=\"font-family:var(--font-mono)\">pomme</span>, ou <span style=\"font-family:var(--font-mono)\">\"42\"</span> entre guillemets).</p>\n        <p class=\"msg warn\" id=\"dup\" hidden></p>\n        <div id=\"host-n\"></div>\n        <div class=\"btns\"><button type=\"button\" class=\"btn main\" id=\"b-animaux\">Exemple du cours : animaux</button><button type=\"button\" class=\"btn\" id=\"b-regen\">Tirer d'autres entrées</button></div>\n      </section>\n\n      <section class=\"sec\">\n        <h2>Opération sur une clé</h2>\n        <div class=\"row\"><span class=\"dot\" style=\"--c:var(--path)\"></span><label class=\"name\" for=\"op-key\">k</label><span class=\"eq\">=</span><input class=\"field\" id=\"op-key\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" value=\"0.375\"></div>\n        <div class=\"row\"><span class=\"dot\" style=\"--c:var(--ok)\"></span><label class=\"name\" for=\"op-val\">v</label><span class=\"eq\">=</span><input class=\"field\" id=\"op-val\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" value=\"30\"></div>\n        <div class=\"btns\">\n          <button type=\"button\" class=\"btn main\" id=\"b-ins\">d[k] = v</button>\n          <button type=\"button\" class=\"btn\" id=\"b-find\">d[k]</button>\n          <button type=\"button\" class=\"btn\" id=\"b-del\">del d[k]</button>\n        </div>\n        <p class=\"msg\" id=\"msg\"></p>\n        <div class=\"steps\" id=\"steps\"></div>\n      </section>\n\n      <section class=\"sec\">\n        <h2>Résultats</h2>\n        <div class=\"res\"><span class=\"dot\" style=\"--c:var(--ui)\"></span><span>Taille effective m</span><span class=\"val\" id=\"r-m\"></span></div>\n        <div class=\"res\"><span class=\"dot\" style=\"--c:var(--ui)\"></span><span>Facteur de charge α = n / m</span><span class=\"val\" id=\"r-a\"></span></div>\n        <div class=\"res\"><span class=\"dot\" style=\"--c:var(--coll)\"></span><span>Collisions</span><span class=\"val\" id=\"r-c\"></span></div>\n        <div class=\"res\"><span class=\"dot\" style=\"--c:var(--path)\"></span><span>Sondages par insertion (moy.)</span><span class=\"val\" id=\"r-p\"></span></div>\n        <div class=\"res\"><span class=\"dot\" style=\"--c:var(--path)\"></span><span id=\"r-l-lab\">Plus longue chaîne</span><span class=\"val\" id=\"r-l\"></span></div>\n        <div class=\"res\"><span class=\"dot\" style=\"--c:var(--ok)\"></span><span>Cases vides</span><span class=\"val\" id=\"r-e\"></span></div>\n        <p class=\"msg err\" id=\"warn\" hidden></p>\n      </section>\n\n      <section class=\"sec\">\n        <h2>Clés par case de départ</h2>\n        <svg class=\"hist\" id=\"hist\" viewBox=\"0 0 320 96\" role=\"img\" aria-label=\"Nombre de clés par indice obtenu à l'étape 2\"></svg>\n      </section>\n\n    </aside>\n\n    <main class=\"view\">\n      <div class=\"t-views\"><div id=\"t-seg\"></div></div>\n      <div class=\"vbar\" id=\"t-leg\" aria-hidden=\"true\">\n        <span><i class=\"sq\"></i>à sa case de départ</span>\n        <span><i class=\"sq c\"></i>collision, déplacée</span>\n        <span><i class=\"sq p\"></i>sondage</span>\n        <span><i class=\"sq f\"></i>trouvée</span>\n        <span class=\"pk\">case = clé / valeur / type et hash</span>\n      </div>\n      <div class=\"vis\" id=\"vis\"></div>\n      <div class=\"vis\" id=\"t-draw\" hidden></div>\n      <div class=\"vis\" id=\"t-code\" hidden></div>\n    </main>",
 init(root){

const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PHI=(Math.sqrt(5)-1)/2;
const MASK64=(1n<<64n)-1n;
const P61=(1n<<61n)-1n;
const WORDS=['pomme','poire','cerise','banane','kiwi','fraise','citron','mangue','orange','prune','figue','melon','raisin','abricot','ananas','pêche','datte','noix','lime','coing','goyave','litchi','mûre','myrtille','papaye','grenade','nectarine','mirabelle','framboise'];

/* ---------- état ---------- */
const S={
  red:'mod', method:'chain', m:8,
  entries:[],
  salted:true, salt:0n, course:false, pyrule:false,
  auto:false, thr:0.75,
  sel:null, msg:null, dup:''
};
const RDESC={
  mod:'indice = hash mod m : le reste de la division euclidienne, entre 0 et m−1.',
  mask:'indice = hash ET (m−1) : on garde les bits de poids faible. Valable avec m = 2, 4, 8, 16… (méthode de Python).',
  mult:'indice = ⌊m · frac(x · φ)⌋ où x est formé des 32 bits de poids faible du hash et φ = 0,618…'
};
const MDESC={
  chain:'Chaînage séparé : chaque case contient une liste de paquets.',
  lin:'Sondage linéaire : essai des cases i, i+1, i+2…',
  quad:'Sondage quadratique : essai des cases i, i+1², i+2²… Peut échouer si α dépasse 0,5.',
  dbl:'Double hachage : le pas 1 + hash mod (m−1) change d\'une clé à l\'autre.'
};
function newSalt(){
  const a=new Uint32Array(2);
  (window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):(a[0]=Math.random()*4294967296,a[1]=Math.random()*4294967296);
  S.salt=(BigInt(a[0])<<32n)|BigInt(a[1]);
}
newSalt();

/* ---------- les clés : int, float ou str ---------- */
const FLOAT_RE=/^[+-]?(\d+\.\d*|\.\d+|\d+(?=[eE]))([eE][+-]?\d+)?$/;
function parseKey(text){
  const t=String(text).trim().slice(0,24);
  if(!t) return null;
  let q=t.match(/^(["'])(.*)\1$/);
  if(q&&q[2].length) return {type:'str',id:'s:'+q[2],label:t,s:q[2]};
  if(/^[+-]?\d+$/.test(t)){const b=BigInt(t.replace(/^\+/,''));return {type:'int',id:'n:'+b,label:t,big:b};}
  let x=NaN;
  if(/^[+-]?inf(inity)?$/i.test(t)) x=t[0]==='-'?-Infinity:Infinity;
  else if(FLOAT_RE.test(t)) x=parseFloat(t);
  if(!Number.isNaN(x)){
    if(!Number.isFinite(x)) return {type:'float',id:'f:'+x,label:t,x};
    if(Number.isInteger(x)) return {type:'float',id:'n:'+BigInt(x),label:t,x,big:BigInt(x)};
    return {type:'float',id:'f:'+x,label:t,x};
  }
  return {type:'str',id:'s:'+t,label:t,s:t};
}

/* ---------- étape 1 : le hash (entier signé de 64 bits) ---------- */
function pyInt(n){
  const neg=n<0n,a=neg?-n:n;
  let h=a%P61;if(neg)h=-h;
  if(h===-1n)h=-2n;
  return h;
}
function fracParts(x){
  const dv=new DataView(new ArrayBuffer(8));dv.setFloat64(0,Math.abs(x));
  const bits=dv.getBigUint64(0);
  const e=Number((bits>>52n)&0x7ffn),f=bits&((1n<<52n)-1n);
  let M,E;
  if(e===0){M=f;E=-1074;}else{M=f|(1n<<52n);E=e-1075;}
  let k=-E;
  while(M%2n===0n&&k>0){M/=2n;k--;}
  return {M,k};
}
function splitmix(h){
  h^=h>>30n;h=(h*0xbf58476d1ce4e5b9n)&MASK64;
  h^=h>>27n;h=(h*0x94d049bb133111ebn)&MASK64;
  h^=h>>31n;return h;
}
const hcache=new Map();
const COURSE_H={'vache':-7934638040551621470n,'cochon':2827697250228178582n,'poule':-1481567228724354437n,'veau':577823365052861834n};
function hashOf(ki){
  const sk=ki.id+'|'+(ki.type==='str'?String(S.salted?S.salt:0)+'|'+S.course:'');
  let r=hcache.get(sk);
  if(r!==undefined) return r;
  if(ki.type==='int'||ki.big!==undefined) r=pyInt(ki.big);
  else if(ki.type==='float'){
    if(ki.x===Infinity) r=314159n;else if(ki.x===-Infinity) r=-314159n;
    else{
      const {M,k}=fracParts(ki.x);
      const inv=2n**BigInt((61-(k%61))%61);
      r=(M*inv)%P61;
      if(ki.x<0) r=-r;
      if(r===-1n) r=-2n;
    }
  }else if(S.course&&COURSE_H[ki.s]!==undefined){
    r=COURSE_H[ki.s];
  }else{
    let h=0xcbf29ce484222325n^(S.salted?S.salt:0n);
    for(const b of new TextEncoder().encode(ki.s)){h^=BigInt(b);h=(h*0x100000001b3n)&MASK64;}
    r=BigInt.asIntN(64,splitmix(h));
  }
  if(hcache.size>5000) hcache.clear();
  hcache.set(sk,r);
  return r;
}
function hashWhy(ki){
  if(ki.type==='str'&&S.course&&COURSE_H[ki.s]!==undefined) return 'Valeur de hash donnée dans le cours (une exécution de Python).';
  if(ki.type==='str') return 'Chaîne : salage aléatoire'+(S.salted?' (sel '+S.salt.toString(16).slice(0,8)+'…)':' désactivé')+', puis un entier réparti sur les 64 bits.';
  if(ki.type==='float'&&ki.x===Infinity) return 'Cas particulier : hash(inf) = 314159.';
  if(ki.type==='float'&&ki.x===-Infinity) return 'Cas particulier : hash(−inf) = −314159.';
  if(ki.big!==undefined){
    const ab=ki.big<0n?-ki.big:ki.big;
    const pre=ki.type==='float'?'Flottant égal à l\'entier '+ki.big+' : même hash que l\'entier. ':'';
    if(ab<P61) return pre+'Entier : le hash est égal à lui-même'+(ki.big===-1n?' (sauf −1, qui donne −2)':'')+'.';
    return pre+'Entier trop grand : modulo 2⁶¹ − 1.';
  }
  const {M,k}=fracParts(ki.x);
  const sg=ki.x<0?'−':'';
  return 'Flottant non entier : '+esc(ki.label)+' = '+sg+M+' / '+(2n**BigInt(k))+', on calcule '+sg+M+' × '+(2n**BigInt(k))+'⁻¹ modulo 2⁶¹ − 1.';
}

/* ---------- étape 2 : la réduction ---------- */
const bmod=(h,m)=>((h%BigInt(m))+BigInt(m))%BigInt(m);
function reduce(h,m){
  if(S.red==='mod') return Number(bmod(h,m));
  if(S.red==='mask') return Number(h&BigInt(m-1));
  return Math.floor(m*((Number(BigInt.asUintN(32,h))*PHI)%1));
}
const hv=(ki,m)=>reduce(hashOf(ki),m);
const h2=(ki,m)=>1+Number(bmod(hashOf(ki),m-1));
function redExpr(ki,m){
  const h=hashOf(ki),i=hv(ki,m);
  if(S.red==='mod') return h+' mod '+m+' = <b>'+i+'</b>';
  if(S.red==='mask'){
    let r=h+' ET '+(m-1)+' = <b>'+i+'</b>';
    if(isPow2(m)&&m>1){const lg=Math.log2(m),low=BigInt.asUintN(64,h).toString(2).slice(-8);r+='<br>bits : …'+low+' ET '+(m-1).toString(2).padStart(8,'0')+' = <b>'+i.toString(2).padStart(lg,'0')+'</b>';}
    return r;
  }
  return '⌊'+m+' · frac('+BigInt.asUintN(32,h)+' · φ)⌋ = <b>'+i+'</b>';
}
const isPow2=m=>m>0&&(m&(m-1))===0;
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;};

/* ---------- entrées ---------- */
function mkEntry(label,v){
  const ki=parseKey(label);
  return ki?{ki,id:ki.id,label:ki.label,type:ki.type,v:String(v).trim().slice(0,20)}:null;
}
S.entries=[['pomme','12'],['42','7'],['0.375','30'],['1','15'],['"42"','4'],['-7','22'],['poire','9']].map(a=>mkEntry(a[0],a[1]));
function parseEntries(text){
  const out=[],seen=new Map();let dup='';
  for(const line of text.split('\n')){
    const t=line.trim();if(!t) continue;
    let kt=t,v='';
    const mm=t.match(/^((?:"[^"]*"|'[^']*'|[^:=])+?)\s*[:=]\s*(.*)$/);
    if(mm){kt=mm[1];v=mm[2];}
    const e=mkEntry(kt,v);
    if(!e) continue;
    if(seen.has(e.id)){dup+=(dup?' ; ':'')+e.label+' désigne la même clé que '+seen.get(e.id)+' (ignorée)';continue;}
    seen.set(e.id,e.label);out.push(e);
    if(out.length>=60) break;
  }
  S.dup=dup;
  return out;
}
const entriesText=()=>S.entries.map(e=>e.label+' : '+e.v).join('\n');
function addRandom(count){
  const used=new Set(S.entries.map(e=>e.id));
  let guard=0;
  while(S.entries.length<count&&guard++<500){
    const r=Math.random();let lab;
    if(r<0.4) lab=WORDS[Math.floor(Math.random()*WORDS.length)];
    else if(r<0.7) lab=String(Math.floor(Math.random()*200)-50);
    else lab=String(Math.floor(Math.random()*80)/8+(Math.random()<0.5?0.5:0.125)).slice(0,8);
    const e=mkEntry(lab,String(1+Math.floor(Math.random()*99)));
    if(!e||used.has(e.id)) continue;
    used.add(e.id);S.entries.push(e);
  }
}
const entryOf=id=>S.entries.find(x=>x.id===id)||null;

/* ---------- construction du tableau ---------- */
function effectiveM(){
  let m=S.m;
  if(S.pyrule){const n=S.entries.length;while(n/m>2/3&&m<4096) m*=(n<50000?4:2);}
  else if(S.auto){while(S.entries.length/m>S.thr&&m<64) m=Math.min(64,2*m);}
  return m;
}
function probeIdx(ki,i,m){
  const h=hv(ki,m);
  if(S.method==='lin') return (h+i)%m;
  if(S.method==='quad') return (h+i*i)%m;
  return (h+i*h2(ki,m))%m;
}
function build(){
  const m=effectiveM(),chain=S.method==='chain';
  const T=chain?Array.from({length:m},()=>[]):new Array(m).fill(null);
  const info={},failed=[];
  let collisions=0,totalProbes=0,maxProbe=0;
  const home=new Array(m).fill(0);
  for(const e of S.entries){
    const k=e.id,h=hv(e.ki,m);home[h]++;
    if(chain){
      const probes=T[h].length+1;
      if(T[h].length>0) collisions++;
      T[h].push(k);
      info[k]={home:h,slot:h,pos:T[h].length-1,probes,placed:true};
      totalProbes+=probes;maxProbe=Math.max(maxProbe,T[h].length);
    }else{
      let placed=false,probes=0;
      for(let i=0;i<m;i++){
        const j=probeIdx(e.ki,i,m);probes++;
        if(T[j]===null){T[j]=k;info[k]={home:h,slot:j,probes,placed:true};placed=true;break;}
      }
      if(T[h]!==null&&(!placed||info[k].slot!==h)) collisions++;
      if(!placed){failed.push(e.label);info[k]={home:h,slot:-1,probes,placed:false};}
      totalProbes+=probes;maxProbe=Math.max(maxProbe,probes);
    }
  }
  const n=S.entries.length;
  const empty=chain?T.filter(b=>b.length===0).length:T.filter(x=>x===null).length;
  return {m,T,info,failed,collisions,avg:n?totalProbes/n:0,maxProbe,empty,home,chain,n};
}
function pathFor(B,ki){
  const m=B.m,path=[],id=ki.id;
  if(B.chain){
    const h=hv(ki,m),b=B.T[h];
    path.push({b:h,pos:-1});
    for(let i=0;i<b.length;i++){
      path.push({b:h,pos:i});
      if(b[i]===id) return {path,found:true,probes:i+1};
    }
    return {path,found:false,probes:b.length};
  }
  for(let i=0;i<m;i++){
    const j=probeIdx(ki,i,m);
    path.push({b:j,pos:0});
    if(B.T[j]===id) return {path,found:true,probes:i+1};
    if(B.T[j]===null) return {path,found:false,probes:i+1};
  }
  return {path,found:false,probes:m};
}

function renderVis(B,pathInfo){

  const isFound=(b,pos)=>last&&last.b===b&&last.pos===pos;

  $r('#h-2p64').addEventListener('click',()=>{N=Math.pow(2,64);n=5.1e9;Nsl.sync(null);nsl.sync(null);rAnniv();});
  const NI=$r('#h-Ncases'),nI=$r('#h-nkeys');
  NI.addEventListener('input',()=>{const v=Number(NI.value.replace(/\s| /g,'').replace(',','.'));if(isFinite(v)&&v>=2){N=v;Nsl.sync(null);rAnniv(true);}});
  nI.addEventListener('input',()=>{const v=Number(nI.value.replace(/\s| /g,'').replace(',','.'));if(isFinite(v)&&v>=1){n=Math.round(v);nsl.sync(null);rAnniv(true);}});
  $r('#h-sim').addEventListener('click',()=>{
    const m=$r('#h-simmsg');m.hidden=false;
    if(N>5e7||n>5000){m.className='msg warn';m.textContent='Simulation limitée à N ≤ 5×10⁷ et n ≤ 5 000.';return;}
    let hit=0;const T=2000;
    for(let t=0;t<T;t++){const s=new Set();let c=false;for(let i=0;i<n;i++){const v=Math.floor(Math.random()*N);if(s.has(v)){c=true;break;}s.add(v);}if(c)hit++;}
    m.className='msg ok';m.innerHTML='Sur '+T+' tirages de '+fmtInt(n)+' clés dans '+sci(N)+' cases : au moins une collision dans <b>'+fmt(100*hit/T,1)+' %</b> des cas (calcul : '+fmt(100*pColl(n,N),1)+' %).';
  });
  function rAnniv(keep){
    if(!keep){NI.value=N<1e9?fmtInt(N):sci(N);nI.value=n<1e9?fmtInt(n):sci(n);}
    const xmax=Math.max(10,Math.ceil(3*Math.sqrt(N))),pts=[];
    for(let i=0;i<=80;i++){const x=Math.max(1,Math.round(xmax*i/80));pts.push([x,100*pColl(x,N)]);}
    const p=pColl(n,N),n5=n50(N);
    const V=$r('#h-v-anniv');
    V.innerHTML='<div class="h3">Probabilité d\'au moins une collision</div><svg id="h-ch" style="max-width:640px"></svg>'+
     '<div class="cards" style="margin-top:12px"><div class="card"><div class="h3">Pour n = '+(n<1e9?fmtInt(n):sci(n))+', N = '+(N<1e9?fmtInt(N):sci(N))+'</div><div style="font-size:26px;font-weight:600;color:'+(p>0.5?'var(--coll)':'var(--ok)')+'">'+fmt(100*p,p<0.001?6:1)+' %</div><p class="note">de chances d\'avoir un doublon.</p></div><div class="card"><div class="h3">50 % atteints dès</div><div style="font-size:22px;font-weight:600">n ≈ '+sci(n5)+'</div><p class="note">soit environ 1,18 × √N clés.</p></div></div>'+
     '<div class="h3" style="margin-top:16px">Valeurs du cours (N = 365 jours)</div><div class="tblw"><table class="tbl"><tr><th>Élèves</th>'+[23,24,36,48].map(k=>'<th class="r">'+k+'</th>').join('')+'</tr><tr><td>P(au moins deux dates égales)</td>'+[23,24,36,48].map(k=>'<td class="r">'+fmt(100*pColl(k,365),1)+' %</td>').join('')+'</tr></table></div>'+
     '<p class="note">On ne demande pas la chance que quelqu\'un partage <i>votre</i> anniversaire (très faible), mais que <i>deux personnes quelconques</i> aient le même. On calcule la probabilité que toutes les dates soient différentes, puis on prend le complémentaire.</p>'+
     '<p class="msg warn"><b>En informatique :</b> même avec un grand tableau, les collisions sont inévitables et arrivent très tôt. Avec 2<sup>64</sup> valeurs possibles, il faut de l\'ordre de 5 milliards de clés pour atteindre 50 %.</p>';
    Chart.line($r('#h-ch'),{xmin:0,xmax:xmax,ymin:0,ymax:100,xlabel:'n (nombre de clés)',ylabel:'probabilité (%)',h:260,series:[{color:'#6557d2',pts}],marks:[{x:clamp(n,0,xmax),y:100*p,label:'n = '+(n<1e9?fmtInt(n):sci(n))},{x:Math.min(n5,xmax),y:50,color:'#2e8b57',label:'50 %'}]});
  }

  /* ---------- B. Mersenne ---------- */
  let pexp=4;
  const psl=slider($r('#h-psl'),{name:'p',min:2,max:61,step:1,get:()=>pexp,set:v=>{pexp=Math.round(v);},on:()=>rMers(),note:'M = 2^p − 1'});
  const MERS=[2,3,5,7,13,17,19,31,61];
  const parseBig=s=>{const t=s.trim().replace(/[\s _]/g,'');return /^[+-]?\d{1,60}$/.test(t)?BigInt(t):null;};
  qa(root,'[data-int]').forEach(b=>b.addEventListener('click',()=>{$r('#h-int').value=b.dataset.int;rMers();}));
  $r('#h-int').addEventListener('input',()=>rMers());
  $r('#h-big').addEventListener('input',()=>rMers());
  function rMers(){
    const nI=parseBig($r('#h-int').value),m=$r('#h-intmsg');
    if(nI===null){m.className='msg err';m.textContent='Saisis un entier.';}
    else{const a=nI<0n?-nI:nI,h=pyInt(nI);
      m.className='msg';m.innerHTML='<code>hash('+esc(nI)+')</code> = <b>'+h+'</b><br>'+(a<P61?(nI===-1n?'Cas particulier : hash(−1) = −2.':'Dans l\'intervalle : le hash est l\'entier lui-même.'):'|n| ≥ 2⁶¹ − 1 : on applique le modulo 2⁶¹ − 1 = '+P61+'.');}
    const X=parseBig($r('#h-big').value),V=$r('#h-v-mers');
    if(X===null||X<0n){V.innerHTML='<p class="msg err">Saisis un entier X positif.</p>';return;}
    const P=BigInt(pexp),M=(1n<<P)-1n,two=1n<<P;
    const q=X>>P,r=X&M;
    const bs=v=>v.toString(2);
    let h='<div class="h3">Division euclidienne par 2<sup>p</sup> : décalage et ET logique</div><p class="note">Exemple du cours : 53 ÷ 16 = 16 × 3 + 5 (p = 4). Le quotient s\'obtient en enlevant les p derniers bits, le reste en gardant les p bits de poids faible.</p>';
    h+='<div class="tblw"><table class="tbl"><tr><th>X</th><td style="font-family:var(--font-mono)">'+X+' = ('+bs(X)+')₂</td></tr><tr><th>quotient X ≫ p</th><td style="font-family:var(--font-mono)">('+bs(q)+')₂ = '+q+'</td></tr><tr><th>reste X &amp; (2<sup>p</sup> − 1)</th><td style="font-family:var(--font-mono)">('+bs(r).padStart(pexp,'0')+')₂ = '+r+'</td></tr></table></div>';
    h+='<div class="h3" style="margin-top:16px">Cas particulier : modulo 2<sup>p</sup> − 1 = '+M+(MERS.includes(pexp)?' <span class="tag t-int">premier de Mersenne</span>':'')+'</div><p class="note">Comme 2<sup>p</sup> ≡ 1 (mod 2<sup>p</sup> − 1), on écrit X = H·2<sup>p</sup> + L avec H = X ≫ p et L = X &amp; (2<sup>p</sup> − 1). Donc X ≡ H + L (mod 2<sup>p</sup> − 1).</p>';
    let cur=X,rows='',it=0;
    while(cur>=M&&it<80&&M>0n){const H=cur>>P,L=cur&M,s=H+L;rows+='<tr><td style="font-family:var(--font-mono)">'+bs(cur)+'</td><td style="font-family:var(--font-mono);color:#1565c0">H = '+bs(H)+' ('+H+')</td><td style="font-family:var(--font-mono);color:#d93a2b">L = '+bs(L).padStart(pexp,'0')+' ('+L+')</td><td class="r"><b>'+s+'</b></td></tr>';cur=s;it++;}
    let res=cur===M?0n:cur;
    h+='<div class="tblw"><table class="tbl"><tr><th>X (binaire)</th><th>H = X ≫ p</th><th>L = X &amp; M</th><th class="r">H + L</th></tr>'+(rows||'<tr><td colspan="4">X &lt; 2<sup>p</sup> − 1 : déjà réduit.</td></tr>')+'</table></div>';
    h+='<p class="msg '+(res===X%M?'ok':'err')+'">Résultat : X mod (2<sup>'+pexp+'</sup> − 1) = <b>'+res+'</b>'+(cur===M?' (H + L = 2<sup>p</sup> − 1 vaut 0 modulo M)':'')+'. Division classique : '+(X%M)+'. '+(it?it+' addition'+(it>1?'s':'')+' à la place d\'une division.':'')+'</p>';
    h+='<p class="note">Résolu en 1 à 2 cycles d\'horloge, contre 30 à 80 pour une division entière : on évite une instruction coûteuse. Python utilise des milliers de dictionnaires en arrière-plan (variables locales et globales, modules importés…), donc ce gain compte.</p>';
    V.innerHTML=h;
  }

  /* ---------- C. float / inverse modulaire ---------- */
  ['#h-q','#h-m','#h-p','#h-x'].forEach(s=>$r(s).addEventListener('input',()=>rInv()));
  function rInv(){
    /* hash d'un flottant */
    const x=parseFloat($r('#h-x').value.replace(',','.')),xm=$r('#h-xmsg'),V=$r('#h-v-inv');
    let top='';
    if(!isFinite(x)){xm.className='msg err';xm.textContent='Saisis un nombre décimal fini.';}
    else if(Number.isInteger(x)){xm.className='msg ok';const h=pyInt(BigInt(x));xm.innerHTML='<b>'+x+'</b> est égal à l\'entier '+x+' : <code>hash('+x+') = hash('+x+'.0) = '+h+'</code>.';}
    else{
      const dv=new DataView(new ArrayBuffer(8));dv.setFloat64(0,Math.abs(x));const bits=dv.getBigUint64(0);
      const e=Number((bits>>52n)&0x7ffn),f=bits&((1n<<52n)-1n);let Mn=e===0?f:f|(1n<<52n),k=(e===0?1074:1075-e);
      while(Mn%2n===0n&&k>0){Mn/=2n;k--;}
      const Q=1n<<BigInt(k),inv=modInv(Q,P61),neg=x<0;
      let h=(Mn*inv)%P61;if(neg)h=-h;if(h===-1n)h=-2n;
      xm.className='msg';xm.innerHTML=x+' = '+(neg?'−':'')+Mn+' / '+Q+'<br>q⁻¹ = '+Q+'⁻¹ = <b>'+inv+'</b> (mod 2⁶¹ − 1)<br><code>hash('+x+') = '+(neg?'−(':'')+Mn+' × q⁻¹ mod M₆₁'+(neg?')':'')+' = <b>'+h+'</b></code>';
      top='<div class="card" style="margin-bottom:14px"><div class="h3">Dans le monde modulo M₆₁ = 2⁶¹ − 1</div><p class="note" style="margin:0">hash(<b>'+x+'</b>) = '+(neg?'−':'')+Mn+' × '+Q+'⁻¹ = <b style="font-family:var(--font-mono)">'+h+'</b>. L\'inverse de q = '+Q+' vaut '+inv+' : c\'est ÉNORME. Comme 2⁶¹ ≡ 1, l\'inverse de 2<sup>k</sup> est 2<sup>61−k</sup>.</p></div>';
    }
    /* inverse en petit */
    const Q=BigInt(Math.round(parseFloat($r('#h-q').value)||0)),Mm=BigInt(Math.round(parseFloat($r('#h-m').value)||0)),Pp=BigInt(Math.round(parseFloat($r('#h-p').value)||0));
    let h='<div class="h3">Exemple p/q dans le monde modulo m</div>';
    if(Mm<2n||Mm>200n||Q<1n){V.innerHTML=top+h+'<p class="msg err">Choisis 2 ≤ m ≤ 200 et q ≥ 1.</p>';return;}
    h+='<p class="note">Tous les nombres sont des restes de division par m (de 0 à m − 1). On cherche q⁻¹ tel que q × q⁻¹ ≡ 1 (mod m) en essayant les multiples de q.</p>';
    const rows=[];let found=null;const qm=Q%Mm;
    for(let t=1n;t<Mm;t++){const pr=qm*t,rr=pr%Mm;rows.push([t,pr,rr]);if(rr===1n){found=t;break;}}
    h+='<div class="tblw"><table class="tbl"><tr><th>t</th><th>q × t</th><th>(q × t) mod m</th></tr>'+rows.map(([t,pr,rr])=>'<tr style="'+(rr===1n?'background:var(--ok-soft);font-weight:600':'')+'"><td>'+t+'</td><td>'+Q+' × '+t+' = '+(Q*t)+'</td><td>'+rr+'</td></tr>').join('')+'</table></div>';
    if(found!==null){const r2=(Pp*found)%Mm;h+='<p class="msg ok">L\'inverse modulaire de '+Q+' pour (mod '+Mm+') est <b>'+found+'</b>, car '+Q+' × '+found+' ≡ 1. Ici p/q = '+Pp+'/'+Q+' devient '+Pp+' × '+found+' = '+(Pp*found)+' ≡ <b>'+r2+'</b> (mod '+Mm+').</p>';}
    else h+='<p class="msg err">'+Q+' n\'a pas d\'inverse modulo '+Mm+' : q et m ont un diviseur commun. Avec M₆₁ premier, tout dénominateur est inversible.</p>';
    V.innerHTML=top+h;
  }

  /* ---------- D. chaînes ---------- */
  let salt=randSalt(),salted=true,runs=[],dsN=2000,dsSalt=false;
  const saltOf=()=>salted?salt:0n;
  $r('#h-salt').addEventListener('change',e=>{salted=e.target.checked;rStr();});
  $r('#h-newrun').addEventListener('click',()=>{salt=randSalt();rStr();});
  $r('#h-s1').addEventListener('input',()=>rStr());$r('#h-s2').addEventListener('input',()=>rStr());
  $r('#h-dsalt').addEventListener('change',e=>{dsSalt=e.target.checked;rStr();});
  const dsl=slider($r('#h-dsl'),{name:'N',min:100,max:20000,step:100,color:'#d93a2b',get:()=>dsN,set:v=>{dsN=Math.round(v);},on:()=>rStr(),note:'clés envoyées'});
  const bitGrid=(h,ref)=>'<div style="display:grid;grid-template-columns:repeat(32,1fr);gap:2px;max-width:460px">'+bin64(h).split('').map((b,i)=>{const diff=ref&&bin64(ref)[i]!==b;return '<span title="bit '+(63-i)+'" style="aspect-ratio:1;display:grid;place-items:center;font:10px var(--font-mono);border-radius:2px;border:1px solid '+(diff?'var(--coll)':'var(--line)')+';background:'+(diff?'var(--coll-soft)':b==='1'?'var(--occ)':'#fff')+'">'+b+'</span>';}).join('')+'</div>';
  function rStr(){
    $r('#h-saltv').textContent=salted?'sel = '+hex64(salt):'sans sel : le hash est déterministe';
    const s1=$r('#h-s1').value,s2=$r('#h-s2').value;
    const h1=strHash64(s1,saltOf()),h2=strHash64(s2,saltOf());
    let diff=0;const b1=bin64(h1),b2=bin64(h2);for(let i=0;i<64;i++)if(b1[i]!==b2[i])diff++;
    /* historique de plusieurs exécutions */
    const runsT=[0,1,2].map(i=>{const sl=i===0?saltOf():randSaltStable(i);return {s:salted?sl:0n,h:strHash64(s1,salted?sl:0n)};});
    let h='<div class="h3">Salage : le même mot, trois exécutions de Python</div><div class="tblw"><table class="tbl"><tr><th>Exécution</th><th>sel</th><th>hash("'+esc(s1)+'")</th></tr>'+runsT.map((r,i)=>'<tr><td>'+(i===0?'courante':'autre #'+i)+'</td><td style="font-family:var(--font-mono);font-size:12px">'+(salted?hex64(r.s):'—')+'</td><td style="font-family:var(--font-mono);font-size:12px">'+r.h+'</td></tr>').join('')+'</table></div><p class="note">À l\'intérieur d\'une même exécution, le hash d\'une chaîne reste identique. Cela empêche un attaquant de fabriquer facilement de nombreuses collisions.</p>';
    h+='<div class="h3" style="margin-top:16px">Effet avalanche : « '+esc(s1)+' » et « '+esc(s2)+' »</div><div class="cards"><div><p class="note" style="margin:0 0 4px">s₁ : <span style="font-family:var(--font-mono)">'+hex64(h1)+'</span></p>'+bitGrid(h1)+'</div><div><p class="note" style="margin:0 0 4px">s₂ : <span style="font-family:var(--font-mono)">'+hex64(h2)+'</span></p>'+bitGrid(h2,h1)+'</div></div><p class="msg '+(s1===s2?'warn':'ok')+'"><b>'+diff+' bits sur 64</b> diffèrent'+(s1===s2?' (chaînes identiques)':' : une modification minime change environ la moitié des bits')+'. Les bits en rouge sont ceux qui diffèrent de s₁.</p>';
    /* Hash DoS */
    const m=1024,NN=dsN,xs=[],ys=[],zs=[],ws=[];
    const cnt=new Array(m).fill(0);let cost=0,costRand=0;
    const cntS=new Array(m).fill(0);let costS=0;
    const pts=60,step=Math.max(1,Math.floor(NN/pts));
    let c1=0,c2=0,c3=0,pushed=0;
    for(let i=1;i<=NN;i++){
      const b=Math.floor(Math.random()*m);c1+=cnt[b]+1;cnt[b]++;
      c2+=i;                        /* clés conçues : toutes dans la même case */
      const b2=dsSalt?Math.floor(Math.random()*m):0;c3+=cntS[b2]+1;cntS[b2]++;
      if(i%step===0||i===NN){xs.push(i);ys.push([i,c1]);zs.push([i,c2]);ws.push([i,c3]);}
    }
    h+='<div class="h3" style="margin-top:16px">Hash DoS : insérer N = '+fmtInt(NN)+' clés dans une table de '+m+' cases</div><svg id="h-dos" style="max-width:640px"></svg>';
    h+='<p class="msg '+(dsSalt?'ok':'err')+'">Clés ordinaires : <b>'+sci(c1)+'</b> comparaisons. Clés conçues '+(dsSalt?'contre une fonction salée : <b>'+sci(c3)+'</b> (le salage les disperse, l\'attaquant ne peut plus prédire les collisions)':'sans salage : <b>'+sci(c2)+'</b>, soit '+fmt(c2/c1,0)+' fois plus (0 + 1 + 2 + … + N = O(N²))')+'.</p>';
    h+='<p class="note">Le 28 décembre 2011, au congrès 28C3, A. Klink et J. Wälde dévoilent cette vulnérabilité touchant Python, PHP, Java, Ruby : l\'envoi de quelques mégaoctets de données fige le serveur à 100 % de CPU. Riposte de Python (3.3+) : un <b>salage aléatoire</b> au démarrage (hash seed) et, depuis 3.4, <b>SipHash</b>, un hachage rapide et résistant aux collisions forcées.</p>';
    $r('#h-v-str').innerHTML=h;
    Chart.line($r('#h-dos'),{xmin:0,xmax:NN,ymin:0,ymax:Math.max(c2,c1,c3)*1.05,xlabel:'N (clés insérées)',ylabel:'comparaisons cumulées',h:250,left:56,series:[{name:'clés ordinaires',color:'#2e8b57',pts:ys},{name:'clés conçues, sans salage',color:'#d93a2b',pts:zs},{name:'clés conçues, avec salage',color:'#6557d2',pts:ws,dash:true}]});
  }
  const _rs={};function randSaltStable(i){return _rs[i]||(_rs[i]=randSalt());}
  showSv();
 }
});

})();

(function(){
/* Partie 7 : construction d'une bonne fonction de hachage (remplissage, loi de Poisson, modulo premier) */
part({
 id:'bonne',tab:'Bonne fonction',
 formula:'Pr[X<sub>i</sub> = k] ≈ α<sup>k</sup> e<sup>−α</sup> / k!',
 html:`<aside class="alg">
  ${sec('Une bonne fonction de hachage','<p class="desc" style="margin:0 0 6px">Les collisions sont inévitables. L\'objectif est de <b>mélanger pour espacer</b> : chaque case a la même probabilité d\'être choisie, et une infime variation de la clé envoie le hash à l\'autre bout du tableau.</p><div id="b-seg" style="margin-top:10px"></div>')}

   ${sec('Ce qu\'on mesure','<div class="res"><span class="dot" style="--c:var(--ui)"></span><span>Moyenne mesurée</span><span class="val" id="b-r-mean"></span></div><div class="res"><span class="dot" style="--c:var(--ok)"></span><span>Variance mesurée</span><span class="val" id="b-r-var"></span></div><div class="res"><span class="dot" style="--c:var(--path)"></span><span>Tiroirs vides (mesuré)</span><span class="val" id="b-r-e"></span></div><div class="res"><span class="dot" style="--c:var(--path)"></span><span>Tiroirs vides (e<sup>−α</sup>)</span><span class="val" id="b-r-p0"></span></div><div class="res"><span class="dot" style="--c:var(--coll)"></span><span>Plus gros tiroir</span><span class="val" id="b-r-max"></span></div>')}
  </div>
  <div class="sv" data-sv="prime" hidden>

   ${sec('Deux tailles de tableau','<div id="b-N1sl"></div><div id="b-N2sl"></div><div class="btns"><button class="btn" id="b-ex">Exemple du cours (4, 8, 12… avec 12 et 11)</button></div>')}
   ${sec('Rapidité du modulo','<p class="desc" style="margin:0">Pour accélérer le calcul, on choisit une taille de la forme 2<sup>p</sup> − 1 (nombre de Mersenne) : <code>X mod (2^p − 1) ≡ (X ≫ p) + (X &amp; (2^p − 1))</code>. Voir la partie « La fonction hash ».</p>')}
  </div>
 </aside>
 <main class="view">

 </main>`,
 init(root){
  const $r=s=>q(root,s);

  const INFO={pois:'Répartition des fiches dans les tiroirs : loi de Poisson',prime:'Pourquoi une taille de table première'};
  const showSv=()=>{qa(root,'.sv').forEach(e=>e.hidden=e.dataset.sv!==sv);$r('#b-info').innerHTML='<b style="color:var(--ink)">'+INFO[sv]+'</b>';sv==='pois'?rPois():rPrime();};
  seg($r('#b-seg'),[['pois','Remplissage'],['prime','N premier']],()=>sv,v=>{sv=v;showSv();},2);

  /* ---------- A. remplissage et loi de Poisson ---------- */
  let N=1000,M=1000,src='rand',salt=(Math.random()*4294967296)>>>0,data=null;
  const lg=Math.log10;
  const SRC={
   rand:'<code>random.randrange(0, N)</code> : un tirage uniforme, la référence théorique.',
   hash:'Hash de Python simulé : un mélange de bits (effet avalanche) suivi d\'un modulo N. Se comporte comme une source pseudo-aléatoire.',
   bad:'Mauvaise fonction : les clés sont les multiples de 4 et la case est <code>clé mod N</code>. Les cases ne sont pas atteintes de façon uniforme.'
  };
  seg($r('#b-src'),[['rand','randrange'],['hash','hash (simulé)'],['bad','multiples de 4']],()=>src,v=>{src=v;$r('#b-srcd').innerHTML=SRC[src];sample();},3);
  $r('#b-srcd').innerHTML=SRC[src];
  const NI=$r('#b-N'),MI=$r('#b-M');
  const parseN=el=>Number(el.value.replace(/\s| /g,'').replace(',','.'));
  const Nsl=slider($r('#b-Nsl'),{name:'log₁₀ N',min:1,max:6.3,step:0.01,dec:2,get:()=>lg(N),set:v=>{N=Math.max(2,Math.round(Math.pow(10,v)));},on:()=>{sample();}});
  const Msl=slider($r('#b-Msl'),{name:'log₁₀ M',min:1,max:6.3,step:0.01,dec:2,color:'#d93a2b',get:()=>lg(Math.max(1,M)),set:v=>{M=Math.max(1,Math.round(Math.pow(10,v)));},on:()=>{sample();}});
  NI.addEventListener('input',()=>{const v=parseN(NI);if(isFinite(v)&&v>=2&&v<=4e6){N=Math.round(v);Nsl.sync(null);sample(true);}});
  MI.addEventListener('input',()=>{const v=parseN(MI);if(isFinite(v)&&v>=1&&v<=4e6){M=Math.round(v);Msl.sync(null);sample(true);}});
  $r('#b-redo').addEventListener('click',()=>{salt=(Math.random()*4294967296)>>>0;sample();});
  $r('#b-course').addEventListener('click',()=>{N=1048576;M=424579;Nsl.sync(null);Msl.sync(null);sample();});

  const mix32=x=>{x^=x>>>16;x=Math.imul(x,0x7feb352d);x^=x>>>15;x=Math.imul(x,0x846ca68b);x^=x>>>16;return x>>>0;};
  function sample(keep){
    if(!keep){NI.value=fmtInt(N);MI.value=fmtInt(M);}
    const c=new Uint32Array(N);
    if(src==='rand'){for(let i=0;i<M;i++)c[(Math.random()*N)|0]++;}
    else if(src==='hash'){for(let i=0;i<M;i++)c[mix32((i+salt)>>>0)%N]++;}
    else{for(let i=1;i<=M;i++)c[(4*i)%N]++;}
    let mx=0;for(let i=0;i<N;i++)if(c[i]>mx)mx=c[i];
    const eff=new Array(mx+1).fill(0);for(let i=0;i<N;i++)eff[c[i]]++;
    let s2=0;const mean=M/N;for(let k=0;k<=mx;k++)s2+=eff[k]*(k-mean)*(k-mean);
    data={eff,mx,mean,vari:s2/N};
    rPois();
  }
  const pois=(k,a)=>{let l=-a+k*Math.log(a);for(let i=2;i<=k;i++)l-=Math.log(i);return N*Math.exp(l);};
  const binom=(k,Mx,Nx)=>{if(k>Mx)return 0;let l=0;for(let i=0;i<k;i++)l+=Math.log((Mx-i)/(i+1));l+=k*Math.log(1/Nx)+(Mx-k)*Math.log1p(-1/Nx);return Nx*Math.exp(l);};
  const COURS={rand:[699149,283705,57195,7698,758,68,3],hash:[699474,283159,57332,7755,793,59,4],pois:[699439,283210,57337,7739,783,63,4]};
  function rPois(){
    if(!data){sample();return;}
    const a=M/N,V=$r('#b-v-pois');
    $r('#b-alpha').innerHTML='α = M / N = <b>'+fmt(a,3)+'</b>';
    $r('#b-r-mean').textContent=fmt(data.mean,4);
    $r('#b-r-var').textContent=fmt(data.vari,4)+(src==='bad'?'':' (Poisson : '+fmt(a,3)+')');
    $r('#b-r-e').textContent=fmt(100*data.eff[0]/N,2)+' %';
    $r('#b-r-p0').textContent=fmt(100*Math.exp(-a),2)+' %';
    $r('#b-r-max').textContent=data.mx+' fiches';
    const kmax=Math.min(14,Math.max(5,data.mx,Math.ceil(a+4*Math.sqrt(a)+2)));
    const labels=[],mes=[],po=[];
    for(let k=0;k<=kmax;k++){labels.push(String(k));mes.push(data.eff[k]||0);po.push(pois(k,a));}
    const tail=data.mx>kmax;
    let h='<div class="h3">Nombre de tiroirs contenant exactement k fiches</div><svg id="b-ch" style="max-width:680px"></svg>';
    h+='<div class="tblw"><table class="tbl" style="max-width:680px"><tr><th>k</th><th class="r">Effectif mesuré</th><th class="r">Loi de Poisson</th><th class="r">Binomiale (M, 1/N)</th></tr>';
    for(let k=0;k<=kmax;k++)h+='<tr><td>'+k+'</td><td class="r">'+fmtInt(mes[k])+'</td><td class="r">'+fmtInt(Math.round(po[k]))+'</td><td class="r">'+fmtInt(Math.round(binom(k,M,N)))+'</td></tr>';
    h+='</table></div>';
    if(tail)h+='<p class="note">Il existe aussi des tiroirs de plus de '+kmax+' fiches (jusqu\'à '+data.mx+').</p>';
    h+='<p class="msg '+(src==='bad'?'err':'ok')+'">'+(src==='bad'
      ?'Avec ces clés, la variance mesurée ('+fmt(data.vari,2)+') est très loin de α ('+fmt(a,3)+') : des tiroirs sont surchargés pendant que '+fmt(100*data.eff[0]/N,1)+' % restent vides, contre '+fmt(100*Math.exp(-a),1)+' % attendus pour une répartition uniforme.'
      :'Pour k petit et M, N grands, le nombre de fiches d\'un tiroir suit la loi binomiale de paramètres M et 1/N, que la <b>loi de Poisson</b> approche : Pr[X = k] = α<sup>k</sup> e<sup>−α</sup> / k!. Ici Pr[X = 0] = e<sup>−'+fmt(a,3)+'</sup> = '+fmt(100*Math.exp(-a),1)+' %.')+'</p>';
    h+='<div class="h3" style="margin-top:16px">Mesures du cours : N = 2<sup>20</sup> = 1 048 576 tiroirs, M = 424 579 mots français (α ≈ 0,405)</div><div class="tblw"><table class="tbl" style="max-width:680px"><tr><th>k</th><th class="r">randrange</th><th class="r">hash de Python</th><th class="r">Poisson</th></tr>';
    for(let k=0;k<7;k++)h+='<tr><td>'+k+'</td><td class="r">'+fmtInt(COURS.rand[k])+'</td><td class="r">'+fmtInt(COURS.hash[k])+'</td><td class="r">'+fmtInt(COURS.pois[k])+'</td></tr>';
    h+='</table></div><p class="note">Le hash de Python (SipHash) suit de façon spectaculaire la loi de Poisson : c\'est la preuve empirique qu\'il se comporte comme une source pseudo-aléatoire uniforme. Le bouton « Données du cours » reproduit cette expérience avec ma source simulée.</p>';
    V.innerHTML=h;
    Chart.bars($r('#b-ch'),{w:640,h:260,bottom:42,labels,xlabel:'k fiches dans un tiroir',left:54,series:[{name:'mesuré',color:'#6557d2',vals:mes},{name:'Poisson',color:'#e08a00',vals:po}]});
  }

  /* ---------- B. modulo un nombre premier ---------- */
  let s=4,K=6,N1=12,N2=11;
  const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;};
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  const ps=slider($r('#b-psl'),{name:'pas s',min:1,max:24,step:1,get:()=>s,set:v=>{s=Math.round(v);},on:()=>rPrime(),note:'clés s, 2s, 3s…'});
  const ks=slider($r('#b-psl'),{name:'clés K',min:2,max:40,step:1,color:'#d93a2b',get:()=>K,set:v=>{K=Math.round(v);},on:()=>rPrime()});
  const n1=slider($r('#b-N1sl'),{name:'N₁',min:2,max:40,step:1,get:()=>N1,set:v=>{N1=Math.round(v);},on:()=>rPrime(),note:'cases'});
  const n2=slider($r('#b-N2sl'),{name:'N₂',min:2,max:40,step:1,color:'#2e8b57',get:()=>N2,set:v=>{N2=Math.round(v);},on:()=>rPrime(),note:'cases'});
  $r('#b-ex').addEventListener('click',()=>{s=4;K=6;N1=12;N2=11;[ps,ks,n1,n2].forEach(x=>x.sync(null));rPrime();});
  function place(Nx){
    const cnt=new Array(Nx).fill(0),lines=[];
    for(let i=1;i<=K;i++){const k=s*i,c=k%Nx,coll=cnt[c]>0;cnt[c]++;lines.push({k,c,coll});}
    return {cnt,lines,used:cnt.filter(x=>x>0).length};
  }
  function block(Nx,col){
    const r=place(Nx),g=gcd(s,Nx),cols=0;
    let h='<div class="card"><div class="h3" style="color:'+col+'">N = '+Nx+(isPrime(Nx)?' <span class="tag t-float">premier</span>':' <span class="tag t-str">pgcd(s, N) = '+g+'</span>')+'</div>';
    h+='<div class="drawer" style="grid-template-columns:repeat(auto-fill,minmax(26px,1fr));margin:6px 0 8px">'+r.cnt.map((c,i)=>'<div style="'+(c>1?'background:var(--coll-soft);border-color:var(--coll)':c===1?'background:var(--occ);border-color:var(--occ-line)':'')+'" title="case '+i+'">'+(c?c:'<span style="color:var(--muted)">'+i+'</span>')+'</div>').join('')+'</div>';
    h+='<div style="font-size:13px;line-height:1.7;margin-bottom:6px">'+r.lines.slice(0,24).map(l=>'<span style="display:inline-block;margin-right:10px;white-space:nowrap;font-family:var(--font-mono);font-size:12px;'+(l.coll?'color:var(--coll)':'')+'">'+l.k+' mod '+Nx+' = '+l.c+(l.coll?' ✗':'')+'</span>').join('')+(r.lines.length>24?'…':'')+'</div>';
    h+='<div class="res" style="grid-template-columns:1fr auto"><span>Cases utilisées</span><span class="val">'+r.used+' / '+Nx+' ('+fmt(100*r.used/Nx,0)+' %)</span></div>';
    h+='<div class="res" style="grid-template-columns:1fr auto"><span>Collisions</span><span class="val" style="color:'+(K-r.used>0?'var(--coll)':'var(--ok)')+'">'+(K-r.used)+'</span></div></div>';
    return h;
  }
  function rPrime(){
    const V=$r('#b-v-prime');
    let h='<div class="h3">Clés : '+Array.from({length:Math.min(K,8)},(_,i)=>s*(i+1)).join(', ')+(K>8?', …':'')+' (K = '+K+')</div><div class="cards" style="margin-bottom:16px">'+block(N1,'var(--ui)')+block(N2,'var(--ok)')+'</div>';
    h+='<div class="h3">Clés rangées dans une case distincte, en % de K, selon la taille N (pas s = '+s+', K = '+K+')</div><svg id="b-pch" style="max-width:680px"></svg>';
    h+='<p class="note"><span class="sq" style="background:#2e8b57;border-color:#2e8b57;display:inline-block;vertical-align:-2px"></span> N premier &nbsp; <span class="sq" style="background:#d93a2b;border-color:#d93a2b;display:inline-block;vertical-align:-2px"></span> N a un diviseur commun avec s &nbsp; <span class="sq" style="display:inline-block;vertical-align:-2px"></span> autre cas</p>';
    const g1=gcd(s,N1),g2=gcd(s,N2);
    h+='<p class="msg '+(g2===1&&g1>1?'ok':'')+'">Avec N = '+N1+', pgcd('+s+', '+N1+') = '+g1+' : seules '+(N1/g1)+' cases sur '+N1+' sont atteignables ('+fmt(100/g1,0)+' %). Avec N = '+N2+', pgcd('+s+', '+N2+') = '+g2+' : '+(g2===1?'toutes les cases sont atteignables, car '+(isPrime(N2)?N2+' est premier et ne partage aucun diviseur commun (hormis 1) avec le motif des données.':'les cases sont toutes atteignables.'):'seules '+(N2/g2)+' cases sont atteignables.')+'</p>';
    V.innerHTML=h;
    const labels=[],vals=[],cols=[];
    for(let Nx=2;Nx<=40;Nx++){const r=place(Nx);labels.push(String(Nx));vals.push(100*r.used/K);cols.push(isPrime(Nx)?'#2e8b57':gcd(s,Nx)>1?'#d93a2b':'#8fa8d8');}
    Chart.bars($r('#b-pch'),{w:640,h:250,bottom:42,labels,xlabel:'taille N du tableau',left:44,ymax:100,maxLabels:20,series:[{color:cols,vals}]});
  }
  showSv();
 }
});

})();

mountParts();
</script>

</body></html>
