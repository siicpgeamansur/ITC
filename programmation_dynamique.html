<div id="app">

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-dp-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
const WORKSHOPS = [];

/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Code Python coloré (léger) */
function codeBlock(code, on) {
  const KW = /^(def|return|for|in|if|elif|else|while|not|raise|import|from|with|as|and|or|is|lambda|class|pass|break|continue|assert|try|except|finally|yield|None)$/;
  const BI = /^(print|len|range|set|dict|list|max|min|sum|id|hash|sorted|open|str|int|float|True|False|isinstance|TypeError|ValueError|Exception|AssertionError|float|inf)$/;
  const lines = code.split('\n').map(line => {
    let out = '', i = 0;
    while (i < line.length) {
      const ch = line[i];
      if (ch === '#') { out += '<span style="color:#7a7a88;font-style:italic">' + esc(line.slice(i)) + '</span>'; break; }
      if (ch === '"' || ch === "'") { let j = i + 1; while (j < line.length && line[j] !== ch) j++; out += '<span style="color:#1c6b40">' + esc(line.slice(i, j + 1)) + '</span>'; i = j + 1; continue; }
      let j = i; while (j < line.length && line[j] !== '#' && line[j] !== '"' && line[j] !== "'") j++;
      let seg = esc(line.slice(i, j)).replace(/\b([A-Za-z_]\w*|\d+(?:\.\d+)?)\b/g, m => /^\d/.test(m) ? '<span style="color:#b05a00">' + m + '</span>' : KW.test(m) ? '<span style="color:#7c3aa8">' + m + '</span>' : BI.test(m) ? '<span style="color:#1f3fa0">' + m + '</span>' : m);
      out += seg; i = j;
    }
    return out;
  });
  return '<pre class="code">' + lines.map((l, i) => '<span style="display:block;padding:0 ' + (on === i + 1 || (Array.isArray(on) && on.includes(i + 1)) ? '10px 0 10px;background:#fff3dc;border-left:3px solid #e08a00' : '10px') + ';white-space:pre">' + (l || ' ') + '</span>').join('') + '</pre>';
}

/* ================= Atelier 1 : Fibonacci & mémoïsation ================= */
const W1 = { n: 10, mode: 'memo', steps: [], step: 0, timer: null };
function mountW1(root) {
  root.innerHTML = '<h2>Fibonacci et mémoïsation</h2><p>Le calcul naïf de Fibonacci recalcule les mêmes valeurs un nombre exponentiel de fois. La <b>mémoïsation</b> (avec un dictionnaire) stocke les résultats déjà calculés : chaque sous-problème n\'est résolu qu\'une fois.</p>' +
    '<div class="opts"><label class="fld"><span>n = <b id="w1-nval"></b></span><input type="range" id="w1-n" min="1" max="30" value="10"></label><div class="fld"><span>Méthode</span><div id="w1-mode"></div></div></div>' +
    '<div class="files" style="margin:8px 0"><button class="btn" id="w1-prev" type="button">◀ Précédent</button><button class="btn pri" id="w1-next" type="button">Suivant ▶</button><button class="btn" id="w1-play" type="button">Lecture</button><button class="btn" id="w1-reset" type="button">Départ</button></div>' +
    '<div class="dwrap" id="w1-tree"></div>' +
    '<div class="gstats" id="w1-stats"></div>' +
    '<div class="verdict" id="w1-msg" aria-live="polite"></div>' +
    '<h3>Code Python</h3><div id="w1-code"></div>' +
    '<h3>Mémoïsation avec un dictionnaire</h3><p>On utilise un dictionnaire <code>memo</code> : les clés sont les sous-problèmes (ici <code>n</code>), les valeurs sont les résultats déjà calculés.</p>' +
    '<pre class="code">def fib(n: int, memo: dict = {}) -> int:\n    if n in memo:\n        return memo[n]\n    if n <= 1:\n        memo[n] = n\n        return n\n    memo[n] = fib(n - 1, memo) + fib(n - 2, memo)\n    return memo[n]</pre>' +
    '<p class="small">Les clés sont des entiers (n) : elles sont hachables, donc le dictionnaire fonctionne. Le coût passe de O(2<sup>n</sup>) à O(n), au prix d\'un espace mémoire O(n).</p>';
  const S = W1;
  const nEl = $('#w1-n'), nVal = $('#w1-nval');
  $('#w1-mode').append(chipsRow([['naif', 'Naïf (arbre)'], ['memo', 'Mémoïsé (dictionnaire)'], ['bas', 'Bas en haut (boucle)']], S.mode, v => { S.mode = v; S.steps = []; S.step = 0; stop(); render(); }, 'Méthode'));
  function stop() { if (S.timer) { clearInterval(S.timer); S.timer = null; } const b = $('#w1-play'); if (b) b.textContent = 'Lecture'; }
  function buildSteps() {
    if (S.mode === 'bas') return buildBottomUp(S.n);
    if (S.mode === 'memo') return buildMemo(S.n);
    return buildNaive(S.n);
  }
  function buildNaive(n) {
    // génère l'arbre des appels
    const nodes = [], edges = [];
    function fib(a, id) {
      nodes.push({ id, a });
      if (a <= 1) return;
      const L = id * 2, R = id * 2 + 1;
      edges.push([id, L]); edges.push([id, R]);
      fib(a - 1, L); fib(a - 2, R);
    }
    fib(n, 0);
    // steps : on ajoute les noeuds un par un
    const steps = [];
    for (let i = 0; i < nodes.length; i++) steps.push({ shown: i + 1, nodes, edges });
    return steps;
  }
  function buildMemo(n) {
    const steps = [], memo = new Map();
    const calls = [];
    function fib(a) {
      calls.push(a);
      if (memo.has(a)) { steps.push({ a, hit: true, memo: new Map(memo) }); return memo.get(a); }
      if (a <= 1) { memo.set(a, a); steps.push({ a, hit: false, memo: new Map(memo) }); return a; }
      steps.push({ a, hit: false, memo: new Map(memo) });
      const v = fib(a - 1) + fib(a - 2);
      memo.set(a, v);
      steps.push({ a, hit: false, memo: new Map(memo), computed: v });
      return v;
    }
    fib(n);
    return steps;
  }
  function buildBottomUp(n) {
    const dp = [0, 1], steps = [{ idx: 0, val: 0, dp: dp.slice() }, { idx: 1, val: 1, dp: dp.slice() }];
    for (let i = 2; i <= n; i++) { dp[i] = dp[i - 1] + dp[i - 2]; steps.push({ idx: i, val: dp[i], dp: dp.slice() }); }
    return steps;
  }
  function render() {
    const steps = buildSteps();
    if (S.step >= steps.length) S.step = steps.length - 1;
    const st = steps[S.step] || steps[0];
    if (S.mode === 'bas') {
      let html = '<h3>Table de programmation dynamique</h3><table class="dp-table"><thead><tr><th>i</th>';
      for (let i = 0; i <= S.n; i++) html += '<th>' + i + '</th>';
      html += '</tr></thead><tbody><tr><td>F(i)</td>';
      for (let i = 0; i <= S.n; i++) {
        const val = st.dp[i];
        html += '<td class="' + (i === st.idx ? 'path' : val !== undefined ? 'hl' : 'val') + '">' + (val !== undefined ? val : '·') + '</td>';
      }
      html += '</tr></tbody></table>';
      html += '<div class="dwrap"><table class="test-table"><thead><tr><th>Indice i</th><th>F(i)</th><th>F(i-1) + F(i-2)</th></tr></thead><tbody>';
      for (let i = 2; i <= st.idx; i++) html += '<tr><td>' + i + '</td><td class="m">' + st.dp[i] + '</td><td class="m">' + st.dp[i-1] + ' + ' + st.dp[i-2] + ' = ' + (st.dp[i-1] + st.dp[i-2]) + '</td></tr>';
      html += '</tbody></table></div>';
      $('#w1-tree').innerHTML = html;
      $('#w1-msg').className = 'verdict';
      $('#w1-msg').innerHTML = '<b>Étape ' + S.step + ' / ' + (steps.length - 1) + '.</b> On remplit F(' + st.idx + ') = ' + st.val + '. Chaque valeur ne dépend que des deux précédentes.';
      $('#w1-stats').innerHTML = '';
      $('#w1-stats').append(stats([['n', S.n], ['F(n)', st.dp[st.idx] !== undefined ? st.dp[st.idx] : '—'], ['Calculs', String(st.idx + 1)], ['Mémoire', 'O(n)']]));
      $('#w1-code').innerHTML = codeBlock('def fib_bas_en_haut(n):\n    F = [0, 1]\n    for i in range(2, n + 1):\n        F.append(F[i - 1] + F[i - 2])\n    return F[n]');
    } else if (S.mode === 'memo') {
      let html = '<h3>Appels récursifs (mémoïsés)</h3><p>On ne recalcule jamais une valeur déjà connue : on consulte d\'abord le dictionnaire <code>memo</code>.</p>';
      html += '<div class="dwrap"><table class="test-table"><thead><tr><th>Appel fib(k)</th><th>Présent dans memo ?</th><th>memo courant</th></tr></thead><tbody>';
      for (let i = 0; i <= S.step; i++) {
        const sp = steps[i];
        html += '<tr' + (i === S.step ? ' style="background:var(--accent-soft)"' : '') + '><td>fib(' + sp.a + ')</td><td class="' + (sp.hit ? 'ok' : '') + '">' + (sp.hit ? 'oui (cache)' : 'non') + '</td><td class="m">' + Array.from(sp.memo.entries()).map(([k, v]) => k + ':' + v).join(', ') + '</td></tr>';
      }
      html += '</tbody></table></div>';
      $('#w1-tree').innerHTML = html;
      $('#w1-msg').className = 'verdict';
      $('#w1-msg').innerHTML = '<b>Étape ' + S.step + ' / ' + (steps.length - 1) + '.</b> Appel fib(' + st.a + ') : ' + (st.hit ? 'résultat déjà dans le dictionnaire, on le renvoie.' : 'résultat absent, on le calcule.');
      $('#w1-stats').innerHTML = '';
      $('#w1-stats').append(stats([['n', S.n], ['Appels', String(steps.length)], ['Cache', String(st.memo.size)], ['Mémoire', 'O(n)']]));
      $('#w1-code').innerHTML = codeBlock('def fib(n: int, memo: dict = {}) -> int:\n    if n in memo:\n        return memo[n]  # déjà calculé\n    if n <= 1:\n        memo[n] = n\n        return n\n    memo[n] = fib(n - 1, memo) + fib(n - 2, memo)\n    return memo[n]');
    } else {
      // naïf : arbre
      const vis = st.nodes.slice(0, st.shown);
      const visibleIds = new Set(vis.map(x => x.id));
      const maxId = Math.max(...vis.map(x => x.id));
      const depth = Math.floor(Math.log2(maxId + 1));
      let svg = '<h3>Arbre des appels récursifs (naïf)</h3><svg viewBox="0 0 ' + Math.max(600, Math.pow(2, depth) * 40) + ' ' + (depth * 50 + 50) + '" style="width:100%;max-width:' + Math.max(600, Math.pow(2, depth) * 40) + 'px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;margin:8px 0">';
      const W = Math.max(600, Math.pow(2, depth) * 40);
      const pos = {};
      function place(id, x, y, width) {
        pos[id] = [x, y];
        if (id * 2 <= maxId && visibleIds.has(id * 2)) {
          place(id * 2, x - width / 4, y + 50, width / 2);
          place(id * 2 + 1, x + width / 4, y + 50, width / 2);
        }
      }
      place(0, W / 2, 30, W);
      st.edges.forEach(([a, b]) => {
        if (!visibleIds.has(a) || !visibleIds.has(b)) return;
        const [x1, y1] = pos[a], [x2, y2] = pos[b];
        svg += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#ccc"/>';
      });
      vis.forEach(nd => {
        const [x, y] = pos[nd.id];
        const isLeaf = nd.a <= 1;
        svg += '<circle cx="' + x + '" cy="' + y + '" r="14" fill="' + (isLeaf ? 'rgba(30,122,46,.2)' : 'rgba(46,109,164,.15)') + '" stroke="' + (isLeaf ? 'var(--ok)' : 'var(--accent)') + '" stroke-width="2"/>';
        svg += '<text x="' + x + '" y="' + (y + 4) + '" text-anchor="middle" font-size="11" font-weight="600" fill="#222">' + nd.a + '</text>';
      });
      svg += '</svg>';
      $('#w1-tree').innerHTML = svg;
      const total = st.nodes.length;
      $('#w1-msg').className = 'verdict warn';
      $('#w1-msg').innerHTML = '<b>Étape ' + st.shown + ' / ' + total + '.</b> L\'arbre des appels recalcule plusieurs fois les mêmes valeurs (fib(2), fib(3)…). Complexité exponentielle O(2<sup>n</sup>).';
      $('#w1-stats').innerHTML = '';
      $('#w1-stats').append(stats([['n', S.n], ['Appels', String(total)], ['Complexité', 'O(2ⁿ)'], ['Mémoire', 'O(n) (pile)']]));
      $('#w1-code').innerHTML = codeBlock('def fib(n: int) -> int:\n    if n <= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)');
    }
    $('#w1-prev').disabled = S.step === 0;
    $('#w1-next').disabled = S.step >= steps.length - 1;
    $('#w1-play').textContent = S.timer ? 'Pause' : 'Lecture';
  }
  nEl.oninput = () => { S.n = parseInt(nEl.value, 10); nVal.textContent = S.n; S.step = 0; stop(); render(); };
  $('#w1-prev').onclick = () => { stop(); if (S.step > 0) { S.step--; render(); } };
  $('#w1-next').onclick = () => { stop(); if (S.step < buildSteps().length - 1) { S.step++; render(); } };
  $('#w1-reset').onclick = () => { stop(); S.step = 0; render(); };
  $('#w1-play').onclick = () => {
    if (S.timer) { stop(); render(); return; }
    const max = buildSteps().length - 1;
    if (S.step >= max) S.step = 0;
    S.timer = setInterval(() => { if (S.step >= max) { stop(); render(); return; } S.step++; render(); }, 400);
    render();
  };
  S.n = 10; nVal.textContent = S.n;
  render();
}

/* ================= Atelier 2 : Rendu de monnaie ================= */
const W2 = { coins: [1, 2, 5, 10], amount: 11, mode: 'dp' };
function mountW2(root) {
  root.innerHTML = '<h2>Rendu de monnaie</h2><p>On veut rendre une somme avec le minimum de pièces. Ce problème a une <b>sous-structure optimale</b> : la solution optimale pour S utilise une solution optimale pour S − pièce. On peut le résoudre par programmation dynamique.</p>' +
    '<div class="opts"><label class="fld"><span>Pièces (séparées par des virgules)</span><input type="text" id="w2-coins" class="mono" value="1, 2, 5, 10"></label><label class="fld"><span>Somme S</span><input type="number" id="w2-amount" value="11" style="width:80px"></label><div class="fld"><span>Méthode</span><div id="w2-mode"></div></div></div>' +
    '<div id="w2-out"></div>';
  const S = W2;
  $('#w2-mode').append(chipsRow([['dp', 'Dynamique'], ['glouton', 'Glouton (pièces triées)']], S.mode, v => { S.mode = v; render(); }, 'Méthode'));
  function render() {
    const coins = $('#w2-coins').value.split(',').map(s => parseInt(s.trim(), 10)).filter(x => isFinite(x) && x > 0);
    const amount = parseInt($('#w2-amount').value, 10);
    if (!coins.length || !isFinite(amount) || amount < 0) { $('#w2-out').innerHTML = '<p class="verdict no">Entrée invalide.</p>'; return; }
    if (S.mode === 'dp') {
      // DP
      const dp = new Array(amount + 1).fill(Infinity); dp[0] = 0;
      const choice = new Array(amount + 1).fill(-1);
      for (let s = 1; s <= amount; s++) {
        for (const c of coins) {
          if (c <= s && dp[s - c] + 1 < dp[s]) { dp[s] = dp[s - c] + 1; choice[s] = c; }
        }
      }
      let html = '<h3>Table de programmation dynamique</h3><table class="dp-table"><thead><tr><th>S</th>';
      for (let s = 0; s <= amount; s++) html += '<th>' + s + '</th>';
      html += '</tr></thead><tbody><tr><td>dp[S]</td>';
      for (let s = 0; s <= amount; s++) html += '<td class="' + (dp[s] === Infinity ? 'val' : 'hl') + '">' + (dp[s] === Infinity ? '∞' : dp[s]) + '</td>';
      html += '</tr></tbody></table>';
      // reconstruction
      let r = amount, used = [];
      while (r > 0 && choice[r] > 0) { used.push(choice[r]); r -= choice[r]; }
      html += '<h3>Solution optimale</h3>';
      if (dp[amount] === Infinity) html += '<p class="verdict no">Impossible de rendre ' + amount + ' avec ces pièces.</p>';
      else html += '<p class="verdict yes">Somme ' + amount + ' → <b>' + dp[amount] + ' pièces</b> : ' + used.join(' + ') + ' = ' + amount + '.</p>';
      html += '<p class="small">La reconstruction se fait en remontant les choix : pour chaque S, <code>choice[S]</code> est la pièce utilisée.</p>';
      html += '<pre class="code">def rendu(coins, S):\n    dp = [float("inf")] * (S + 1)\n    dp[0] = 0\n    choix = [-1] * (S + 1)\n    for s in range(1, S + 1):\n        for c in coins:\n            if c <= s and dp[s - c] + 1 < dp[s]:\n                dp[s] = dp[s - c] + 1\n                choix[s] = c\n    # reconstruction\n    res = []\n    s = S\n    while s > 0 and choix[s] > 0:\n        res.append(choix[s])\n        s -= choix[s]\n    return dp[S], res</pre>';
      $('#w2-out').innerHTML = html;
    } else {
      // glouton
      const sorted = coins.slice().sort((a, b) => b - a);
      let r = amount, used = [];
      for (const c of sorted) { while (r >= c) { used.push(c); r -= c; } }
      let html = '<h3>Algorithme glouton</h3><p>On prend toujours la plus grande pièce possible. Correct pour le système {1, 2, 5, 10}, mais pas en général.</p><div class="verdict ' + (r === 0 ? 'yes' : 'no') + '">';
      if (r === 0) html += 'Somme ' + amount + ' → <b>' + used.length + ' pièces</b> : ' + used.join(' + ') + ' = ' + amount + '.';
      else html += 'Échec : il reste ' + r + ' impossible à rendre avec ces pièces.';
      html += '</div>';
      html += '<p class="small">Contre-exemple classique : pièces {1, 3, 4}, somme 6. Le glouton prend 4 puis 1 + 1 (3 pièces) alors que la solution optimale est 3 + 3 (2 pièces). La programmation dynamique trouve toujours l\'optimum.</p>';
      html += '<pre class="code">def rendu_glouton(coins, S):\n    coins = sorted(coins, reverse=True)\n    res = []\n    for c in coins:\n        while S >= c:\n            res.append(c)\n            S -= c\n    return res  # optimal seulement pour certains systèmes</pre>';
      $('#w2-out').innerHTML = html;
    }
  }
  $('#w2-coins').oninput = render;
  $('#w2-amount').oninput = render;
  render();
}

/* ================= Atelier 3 : LCS ================= */
const W3 = { A: 'ABCBDAB', B: 'BDCABA' };
function mountW3(root) {
  root.innerHTML = '<h2>Plus longue sous-suite commune (LCS)</h2><p>La LCS de deux chaînes est la plus longue suite de caractères apparaissant dans le même ordre dans les deux chaînes (pas nécessairement contigus). La programmation dynamique la calcule en O(n × m).</p>' +
    '<div class="opts"><label class="fld"><span>Chaîne A</span><input type="text" id="w3-A" class="mono" value="ABCBDAB" style="width:120px" maxlength="10"></label><label class="fld"><span>Chaîne B</span><input type="text" id="w3-B" class="mono" value="BDCABA" style="width:120px" maxlength="10"></label></div>' +
    '<div id="w3-out"></div>';
  function render() {
    const A = $('#w3-A').value.toUpperCase().slice(0, 10);
    const B = $('#w3-B').value.toUpperCase().slice(0, 10);
    const n = A.length, m = B.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        if (A[i - 1] === B[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
        else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
    // reconstruction
    let i = n, j = m, path = [];
    while (i > 0 && j > 0) {
      if (A[i - 1] === B[j - 1]) { path.push({ i, j, c: A[i - 1] }); i--; j--; }
      else if (dp[i - 1][j] >= dp[i][j - 1]) i--;
      else j--;
    }
    path.reverse();
    const pathSet = new Set(path.map(p => p.i + ',' + p.j));
    let html = '<h3>Table de programmation dynamique</h3><p class="small">Ligne = préfixe de A, colonne = préfixe de B. La case (i, j) donne la longueur de la LCS de A[0:i] et B[0:j].</p>';
    html += '<table class="dp-table"><thead><tr><th></th><th>∅</th>';
    for (let j = 0; j < m; j++) html += '<th>' + B[j] + '</th>';
    html += '</tr></thead><tbody>';
    for (let i = 0; i <= n; i++) {
      html += '<tr><th>' + (i === 0 ? '∅' : A[i - 1]) + '</th>';
      for (let j = 0; j <= m; j++) {
        const isPath = pathSet.has(i + ',' + j);
        html += '<td class="' + (isPath ? 'path' : dp[i][j] > 0 ? 'hl' : 'val') + '">' + dp[i][j] + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
    html += '<h3>Résultat</h3><p class="verdict yes">LCS = <b>' + path.map(p => p.c).join('') + '</b>, longueur <b>' + dp[n][m] + '</b>. Les cases vertes forment le chemin de reconstruction.</p>';
    html += '<h3>Code Python</h3><pre class="code">def lcs(A: str, B: str) -> str:\n    n, m = len(A), len(B)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            if A[i - 1] == B[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n    # reconstruction\n    i, j = n, m\n    res = []\n    while i > 0 and j > 0:\n        if A[i - 1] == B[j - 1]:\n            res.append(A[i - 1]); i -= 1; j -= 1\n        elif dp[i - 1][j] >= dp[i][j - 1]:\n            i -= 1\n        else:\n            j -= 1\n    return "".join(reversed(res))</pre>';
    $('#w3-out').innerHTML = html;
  }
  $('#w3-A').oninput = render;
  $('#w3-B').oninput = render;
  render();
}

/* ================= Atelier 4 : Levenshtein ================= */
const W4 = { A: 'chat', B: 'chien' };
function mountW4(root) {
  root.innerHTML = '<h2>Distance d\'édition (Levenshtein)</h2><p>La distance d\'édition entre deux chaînes est le nombre minimal d\'opérations (insertion, suppression, substitution) pour transformer l\'une en l\'autre. La programmation dynamique la calcule en O(n × m).</p>' +
    '<div class="opts"><label class="fld"><span>Chaîne A</span><input type="text" id="w4-A" class="mono" value="chat" style="width:120px" maxlength="10"></label><label class="fld"><span>Chaîne B</span><input type="text" id="w4-B" class="mono" value="chien" style="width:120px" maxlength="10"></label></div>' +
    '<div id="w4-out"></div>';
  function render() {
    const A = $('#w4-A').value.slice(0, 10);
    const B = $('#w4-B').value.slice(0, 10);
    const n = A.length, m = B.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = 0; i <= n; i++) dp[i][0] = i;
    for (let j = 0; j <= m; j++) dp[0][j] = j;
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        const cost = A[i - 1] === B[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      }
    }
    // reconstruction des opérations
    let i = n, j = m, ops = [], pathSet = new Set();
    while (i > 0 || j > 0) {
      pathSet.add(i + ',' + j);
      if (i > 0 && j > 0 && A[i - 1] === B[j - 1]) { i--; j--; }
      else if (i > 0 && j > 0 && dp[i][j] === dp[i - 1][j - 1] + 1) { ops.push('remplacer ' + A[i - 1] + ' par ' + B[j - 1]); i--; j--; }
      else if (i > 0 && dp[i][j] === dp[i - 1][j] + 1) { ops.push('supprimer ' + A[i - 1]); i--; }
      else { ops.push('insérer ' + B[j - 1]); j--; }
    }
    pathSet.add(0 + ',' + 0);
    let html = '<h3>Matrice de programmation dynamique</h3><p class="small">Case (i, j) = distance entre A[0:i] et B[0:j]. Les flèches indiquent le choix de reconstruction.</p>';
    html += '<table class="dp-table"><thead><tr><th></th><th>∅</th>';
    for (let j = 0; j < m; j++) html += '<th>' + esc(B[j]) + '</th>';
    html += '</tr></thead><tbody>';
    for (let i = 0; i <= n; i++) {
      html += '<tr><th>' + (i === 0 ? '∅' : esc(A[i - 1])) + '</th>';
      for (let j = 0; j <= m; j++) {
        const isPath = pathSet.has(i + ',' + j);
        html += '<td class="' + (isPath ? 'path' : dp[i][j] > 0 ? 'hl' : 'val') + '">' + dp[i][j] + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
    html += '<h3>Résultat</h3><p class="verdict yes">Distance = <b>' + dp[n][m] + '</b> opérations.</p>';
    if (ops.length) html += '<h4 style="margin-top:12px">Une séquence optimale</h4><ol style="padding-left:22px;font-size:13.5px;line-height:1.7">' + ops.reverse().map(o => '<li>' + esc(o) + '</li>').join('') + '</ol>';
    html += '<h3>Code Python</h3><pre class="code">def levenshtein(A: str, B: str) -> int:\n    n, m = len(A), len(B)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(n + 1):\n        dp[i][0] = i\n    for j in range(m + 1):\n        dp[0][j] = j\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            cout = 0 if A[i - 1] == B[j - 1] else 1\n            dp[i][j] = min(\n                dp[i - 1][j] + 1,       # suppression\n                dp[i][j - 1] + 1,       # insertion\n                dp[i - 1][j - 1] + cout # substitution\n            )\n    return dp[n][m]</pre>';
    $('#w4-out').innerHTML = html;
  }
  $('#w4-A').oninput = render;
  $('#w4-B').oninput = render;
  render();
}

/* ================= Atelier 5 : Partition équilibrée ================= */
const W5 = { arr: [3, 1, 4, 2, 2, 1] };
function mountW5(root) {
  root.innerHTML = '<h2>Partition équilibrée d\'un tableau</h2><p>Étant donné un tableau d\'entiers positifs, on veut le partitionner en deux sous-ensembles de somme aussi proche que possible. C\'est un problème de sac à dos (0/1) résolu par programmation dynamique.</p>' +
    '<div class="opts"><label class="fld"><span>Tableau (nombres séparés par des virgules)</span><input type="text" id="w5-arr" class="mono" value="3, 1, 4, 2, 2, 1" style="width:260px"></label></div>' +
    '<div id="w5-out"></div>';
  function render() {
    const arr = $('#w5-arr').value.split(',').map(s => parseInt(s.trim(), 10)).filter(x => isFinite(x) && x > 0);
    if (!arr.length) { $('#w5-out').innerHTML = '<p class="verdict no">Entrée invalide.</p>'; return; }
    const total = arr.reduce((a, b) => a + b, 0);
    const target = Math.floor(total / 2);
    const n = arr.length;
    // dp[i][s] : possible d'atteindre la somme s avec les i premiers éléments
    const dp = Array.from({ length: n + 1 }, () => new Array(target + 1).fill(false));
    for (let i = 0; i <= n; i++) dp[i][0] = true;
    for (let i = 1; i <= n; i++) {
      for (let s = 1; s <= target; s++) {

      }
    }

    let best = target;
    while (best > 0 && !dp[n][best]) best--;

      if (s >= 0 && dp[i][s] && (s < arr[i - 1] || !dp[i - 1][s])) { set1.push(arr[i - 1]); s -= arr[i - 1]; }
      else set2.push(arr[i - 1]);

COURSE.push({ id: 'memoisation', t: 'Mémoïsation et dictionnaires', h: `
<p>La <b>programmation dynamique</b> résout des problèmes qui présentent deux propriétés :</p>
<ul><li><b>Sous-structure optimale</b> : la solution optimale du problème se compose de solutions optimales de sous-problèmes.</li><li><b>Chevauchement des sous-problèmes</b> : les mêmes sous-problèmes reviennent plusieurs fois dans la récursion naïve.</li></ul>
<h3>Mémoïsation</h3>
<p>On stocke les résultats des sous-problèmes déjà résolus dans une structure de données, souvent un <b>dictionnaire</b> :</p>
<pre class="code">def fib(n: int, memo: dict = {}) -> int:
    if n in memo:
        return memo[n]        # déjà calculé
    if n <= 1:
        memo[n] = n
        return n
    memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
    return memo[n]</pre>
<p>La complexité passe de O(2ⁿ) à O(n), au prix d'un espace O(n).</p>
<h3>Bas en haut</h3>
<p>Au lieu de récursion, on peut remplir un tableau itérativement :</p>
<pre class="code">def fib_bas_en_haut(n: int) -> int:
    F = [0, 1]
    for i in range(2, n + 1):
        F.append(F[i - 1] + F[i - 2])
    return F[n]</pre>
<h3>Dictionnaires et limites</h3>
<p>On ne peut utiliser comme clés que des objets <b>hachables</b> (immuables) : entiers, chaînes, tuples. Une liste ou un dictionnaire ne peut pas être une clé.</p>
<div class="retain"><b>À retenir.</b> Mémoïsation = dictionnaire des sous-problèmes déjà résolus. Sous-structure optimale + chevauchement = programmation dynamique.</div>` });

COURSE.push({ id: 'rendu', t: 'Rendu de monnaie', h: `
<p>On veut rendre une somme S avec le minimum de pièces d'un ensemble donné.</p>
<h3>Glouton</h3>
<p>Prendre toujours la plus grande pièce possible. Rapide mais <b>faux en général</b> :</p>
<pre class="code">Pièces {1, 3, 4}, S = 6
Glouton : 4 + 1 + 1 = 3 pièces
Optimal : 3 + 3 = 2 pièces</pre>
<h3>Programmation dynamique</h3>
<p>On définit <code>dp[s]</code> = nombre minimal de pièces pour rendre s.</p>
<pre class="code">def rendu(coins, S):
    dp = [float("inf")] * (S + 1)
    dp[0] = 0
    choix = [-1] * (S + 1)
    for s in range(1, S + 1):
        for c in coins:
            if c <= s and dp[s - c] + 1 < dp[s]:
                dp[s] = dp[s - c] + 1
                choix[s] = c
    return dp[S]</pre>
<p>Complexité : O(S × k), où k est le nombre de pièces. Reconstruction : on remonte <code>choix[S]</code>, puis <code>choix[S − choix[S]]</code>, etc.</p>
<div class="retain"><b>À retenir.</b> Le glouton n'est pas toujours optimal. La DP l'est, avec un coût O(S × k).</div>` });

COURSE.push({ id: 'lcs', t: 'Plus longue sous-suite commune', h: `
<p>La LCS de deux chaînes est la plus longue suite de caractères qui apparaît dans les deux chaînes, dans le même ordre mais pas nécessairement de façon contiguë.</p>
<h3>Récurrence</h3>
<p>Soit <code>dp[i][j]</code> la longueur de la LCS de A[0:i] et B[0:j].</p>
<ul><li>Si A[i − 1] = B[j − 1] : <code>dp[i][j] = dp[i − 1][j − 1] + 1</code>.</li><li>Sinon : <code>dp[i][j] = max(dp[i − 1][j], dp[i][j − 1])</code>.</li></ul>
<h3>Code</h3>
<pre class="code">def lcs(A, B):
    n, m = len(A), len(B)
    dp = [[0] * (m + 1) for _ in range(n + 1)]
    for i in range(1, n + 1):
        for j in range(1, m + 1):
            if A[i - 1] == B[j - 1]:
                dp[i][j] = dp[i - 1][j - 1] + 1
            else:
                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
    # reconstruction
    i, j = n, m
    res = []
    while i > 0 and j > 0:
        if A[i - 1] == B[j - 1]:
            res.append(A[i - 1]); i -= 1; j -= 1
        elif dp[i - 1][j] >= dp[i][j - 1]:
            i -= 1
        else:
            j -= 1
    return "".join(reversed(res))</pre>
<p>Complexité temporelle : O(n × m). Complexité spatiale : O(n × m).</p>
<div class="retain"><b>À retenir.</b> La LCS est un exemple classique de DP en O(n × m), avec reconstruction de solution.</div>` });

COURSE.push({ id: 'levenshtein', t: 'Distance d\'édition', h: `
<p>La distance de Levenshtein entre A et B est le nombre minimal d'opérations (insertion, suppression, substitution) pour transformer A en B.</p>
<h3>Récurrence</h3>
<p><code>dp[i][j]</code> = distance entre A[0:i] et B[0:j].</p>
<pre class="code">dp[i][j] = min(
    dp[i - 1][j] + 1,       # suppression
    dp[i][j - 1] + 1,       # insertion
    dp[i - 1][j - 1] + cout # substitution (cout = 0 si égaux)
)</pre>
<h3>Code</h3>
<pre class="code">def levenshtein(A, B):
    n, m = len(A), len(B)
    dp = [[0] * (m + 1) for _ in range(n + 1)]
    for i in range(n + 1):
        dp[i][0] = i
    for j in range(m + 1):
        dp[0][j] = j
    for i in range(1, n + 1):
        for j in range(1, m + 1):
            cout = 0 if A[i - 1] == B[j - 1] else 1
            dp[i][j] = min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cout)
    return dp[n][m]</pre>
<p>Complexité : O(n × m) en temps et en espace.</p>
<div class="retain"><b>À retenir.</b> La distance d'édition est utilisée en correction orthographique, en bio-informatique, en traitement du langage.</div>` });

            s -= arr[i - 1]
        else:
            set2.append(arr[i - 1])
    return set1, set2</pre>
<p>Complexité : O(n × total) en temps et en espace. Le problème est NP-complet en n, la DP est pseudo-polynomiale (dépend de la valeur de la somme).</p>
<div class="retain"><b>À retenir.</b> La partition équilibrée est un cas particulier du sac à dos, résolu par DP en O(n × total).</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Programmation dynamique</dt><dd>Méthode de résolution de problèmes par combinaison de solutions de sous-problèmes.</dd>
<dt>Sous-structure optimale</dt><dd>La solution optimale du problème se compose de solutions optimales de sous-problèmes.</dd>
<dt>Chevauchement des sous-problèmes</dt><dd>Les mêmes sous-problèmes reviennent plusieurs fois dans la récursion naïve.</dd>

<dt>Bas en haut (bottom-up)</dt><dd>Calcul itératif des sous-problèmes du plus petit au plus grand, sans récursion.</dd>
<dt>Reconstruction</dt><dd>Remonter les choix faits dans la table pour retrouver une solution optimale.</dd>
<dt>Complexité temporelle</dt><dd>Nombre d'opérations en fonction de la taille de l'entrée.</dd>
<dt>Complexité spatiale</dt><dd>Mémoire utilisée en fonction de la taille de l'entrée.</dd>
<dt>Glouton</dt><dd>Algorithme qui fait le meilleur choix local à chaque étape, sans revenir en arrière.</dd>
<dt>Sac à dos</dt><dd>Problème de sélection d'objets de poids et valeur donnés, sous contrainte de capacité.</dd>
</dl>` });

/* ---------- interface ---------- */
const UI = { cur: 'w1' };

function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }

function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));

function mountWs() {

function gotoWs(id) {

}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');

  box.hidden = !AS.open;

  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;

  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),

  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;

    const row = h('div', { class: 'files' });

    body.append(row);
  }
