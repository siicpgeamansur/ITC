*{box-sizing:border-box}

    '<div class="formula">possible(i, s) = possible(i − 1, s) <b>ou</b> (s ≥ t[i−1] <b>et</b> possible(i − 1, s − t[i−1]))</div>' +

COURSE.push({ id: 'dico', t: 'Dictionnaires en Python', h: `
<p>Un <b>dictionnaire</b> associe à des <b>clés</b> des <b>valeurs</b>. Les clés sont toutes distinctes ; la valeur associée à une clé se retrouve très vite.</p>
<h3>Syntaxe</h3>
<pre class="code">&gt;&gt;&gt; d = {'lundi': 1, 'mardi': 2}
&gt;&gt;&gt; d['lundi']
1
&gt;&gt;&gt; d['mercredi'] = 3        # ajout ou modification
&gt;&gt;&gt; 'mardi' in d             # test d'appartenance (sur les clés)
True
&gt;&gt;&gt; d.get('dimanche', 0)     # valeur par défaut
0
&gt;&gt;&gt; d['jeudi']
KeyError: 'jeudi'
&gt;&gt;&gt; del d['lundi']</pre>
<h3>Parcours</h3>
<pre class="code">for cle in d:                    # parcours des clés
    print(cle, d[cle])
for cle, val in d.items():       # parcours des couples (clé, valeur)
    print(cle, val)
list(d.values())                 # les valeurs</pre>
<h3>Exemple : compter des occurrences</h3>
<pre class="code">def compter(mot):
    c = {}
    for ch in mot:
        c[ch] = c.get(ch, 0) + 1
    return c

compter('abracadabra')   # {'a': 5, 'b': 2, 'r': 2, 'c': 1, 'd': 1}</pre>
<p>Depuis Python 3.7, un dictionnaire conserve l’ordre d’insertion de ses clés.</p>
<div class="retain"><b>À retenir.</b> d[c] lit, d[c] = v écrit, c in d teste la présence d’une clé, d.get(c, defaut) évite l’erreur, for c in d parcourt les clés, d.items() les couples.</div>` });

COURSE.push({ id: 'hachage', t: 'Principes du hachage', h: `
<p>Pour retrouver une clé sans parcourir tout le dictionnaire, on la range dans un tableau de <b>m alvéoles</b> à l’aide d’une <b>fonction de hachage</b> qui calcule le numéro d’alvéole à partir de la clé. L’accès devient direct : on calcule le numéro, puis on regarde l’alvéole.</p>
<h3>Collisions</h3>
<p>Deux clés différentes peuvent avoir le même numéro d’alvéole : c’est une <b>collision</b>. Une solution est le <b>chaînage</b> : chaque alvéole contient la liste des couples (clé, valeur) qui y sont tombés. Pour chercher, on calcule l’alvéole puis on compare avec les clés de la liste.</p>
<pre class="code">def hacher(cle, m):             # fonction pédagogique
    return sum(ord(c) for c in cle) % m

def chercher(table, cle):
    for (k, v) in table[hacher(cle, len(table))]:
        if k == cle:
            return v
    return None</pre>
<h3>Coût</h3>
<ul>
<li>Le <b>facteur de charge</b> n/m (éléments par alvéole) mesure le remplissage ; s’il devient grand, on agrandit la table et on replace les éléments.</li>
<li>Si les clés sont bien réparties, les chaînes sont courtes : accès, ajout et suppression en temps constant <b>en moyenne</b>.</li>
<li>Dans le pire cas (toutes les clés dans la même alvéole), l’accès est en O(n).</li>
</ul>
<h3>Quelles clés utiliser ?</h3>
<p>Une clé doit avoir une valeur de hachage qui <b>ne change pas</b> : une clé doit être <b>immuable</b> (au sens du hachage). Sont acceptés : entiers, flottants, booléens, chaînes, tuples dont tous les éléments sont hachables. Sont refusés : listes, ensembles, dictionnaires.</p>
<pre class="code">&gt;&gt;&gt; d = {}
&gt;&gt;&gt; d[(1, 2)] = 'ok'
&gt;&gt;&gt; d[[1, 2]] = 'non'
TypeError: unhashable type: 'list'</pre>
<div class="retain"><b>À retenir.</b> Hachage : clé → numéro d’alvéole. Collisions résolues par chaînage. Accès en temps constant en moyenne. Les clés doivent être hachables (immuables) : un tuple oui, une liste non.</div>` });

COURSE.push({ id: 'principe', t: 'Principe de la programmation dynamique', h: `
<p>La <b>programmation dynamique</b> résout un problème en le ramenant à des sous-problèmes de même nature, dont on mémorise les résultats. Elle s’applique quand deux propriétés sont réunies.</p>
<h3>Sous-structure optimale</h3>
<p>Une solution optimale du problème s’obtient à partir de solutions <b>optimales</b> de sous-problèmes : on peut écrire une relation de récurrence entre la valeur optimale d’un problème et celles de problèmes plus petits.</p>
<h3>Chevauchement de sous-problèmes</h3>
<p>Le même sous-problème est rencontré plusieurs fois par la récursion naïve : en le résolvant une seule fois, on passe d’un temps exponentiel à un temps polynomial.</p>
<h3>Méthode</h3>
<ol><li>Définir les sous-problèmes (quels paramètres ?).</li><li>Écrire la relation de récurrence et les cas de base.</li><li>Choisir l’ordre de calcul : de bas en haut, ou récursif avec mémoïsation.</li><li>Reconstruire une solution (et pas seulement sa valeur) à partir de l’information calculée.</li><li>Évaluer le temps (nombre de sous-problèmes × coût par sous-problème) et la mémoire.</li></ol>
<h3>Comparaison avec d’autres paradigmes</h3>
<table class="ctable"><thead><tr><th></th><th>Diviser pour régner</th><th>Glouton</th><th>Programmation dynamique</th></tr></thead><tbody>
<tr><td>Sous-problèmes</td><td>Indépendants</td><td>Un seul, après un choix</td><td>Qui se chevauchent</td></tr>
<tr><td>Choix</td><td>Aucun</td><td>Local et irrévocable</td><td>Comparaison de plusieurs choix</td></tr>
<tr><td>Garantie d’optimalité</td><td>—</td><td>À justifier</td><td>Par la sous-structure optimale</td></tr></tbody></table>
<p>La sous-structure optimale est donc commune à la programmation dynamique et aux algorithmes gloutons vus en première année ; mais le glouton doit prouver qu’un choix local est sûr, ce qui est faux pour l’ordonnancement pondéré.</p>
<div class="retain"><b>À retenir.</b> Sous-structure optimale + chevauchement de sous-problèmes = programmation dynamique. On mémorise pour ne résoudre chaque sous-problème qu’une fois.</div>` });

COURSE.push({ id: 'memo', t: 'Mémoïsation ou bas en haut', h: `
<p>Deux façons de ne calculer chaque sous-problème qu’une fois.</p>
<h3>Mémoïsation (de haut en bas)</h3>
<p>On garde la fonction récursive, mais on stocke chaque résultat dans un <b>dictionnaire</b> dont les clés sont les paramètres (un tuple s’ils sont plusieurs).</p>
<pre class="code">def fib(n, memo={}):
    if n &lt; 2:
        return n
    if n not in memo:
        memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
    return memo[n]</pre>
<h3>De bas en haut</h3>
<p>On remplit un tableau dans un ordre tel que chaque case ne dépende que de cases déjà calculées.</p>
<pre class="code">def chemins(n, m):
    t = [[1] * (m + 1) for _ in range(n + 1)]
    for i in range(1, n + 1):
        for j in range(1, m + 1):
            t[i][j] = t[i - 1][j] + t[i][j - 1]
    return t[n][m]</pre>
<h3>Comparaison</h3>
<table class="ctable"><thead><tr><th></th><th>Mémoïsation</th><th>De bas en haut</th></tr></thead><tbody>
<tr><td>Sous-problèmes calculés</td><td>Seulement ceux nécessaires</td><td>Tous</td></tr>
<tr><td>Récursion</td><td>Oui (profondeur de pile)</td><td>Non</td></tr>
<tr><td>Structure</td><td>Dictionnaire</td><td>Tableau</td></tr>
<tr><td>Mémoire</td><td>Une entrée par sous-problème calculé</td><td>Parfois réductible (quelques lignes)</td></tr></tbody></table>
<h3>Enjeux de complexité en mémoire</h3>
<p>On échange du temps contre de l’espace : le tableau de la grille a (n + 1)(m + 1) cases, mais pour le seul calcul de la valeur, deux lignes suffisent. En revanche, pour <b>reconstruire</b> une solution, on a souvent besoin de conserver tout le tableau.</p>
<div class="retain"><b>À retenir.</b> Mémoïsation : récursif + dictionnaire. Bas en haut : tableau rempli dans l’ordre des dépendances. Complexité = nombre de sous-problèmes × coût de chacun ; attention à la mémoire.</div>` });

COURSE.push({ id: 'partition', t: 'Partition équilibrée', h: `
<p><b>Problème.</b> Étant donné un tableau t d’entiers positifs de somme S, le partager en deux groupes dont les sommes diffèrent le moins possible.</p>
<p><b>Sous-problème.</b> possible(i, s) : « avec les i premiers éléments, on peut former la somme s ».</p>
<div class="formula">possible(0, 0) = vrai ; possible(0, s) = faux si s &gt; 0<br>possible(i, s) = possible(i − 1, s) ou (s ≥ t[i−1] et possible(i − 1, s − t[i−1]))</div>
<p>On cherche la plus grande somme s ≤ S/2 telle que possible(n, s) ; l’écart minimal est S − 2s.</p>
<pre class="code">def partition(t):
    S = sum(t)
    H = S // 2
    n = len(t)
    possible = [[False] * (H + 1) for _ in range(n + 1)]
    possible[0][0] = True
    for i in range(1, n + 1):
        for s in range(H + 1):
            possible[i][s] = possible[i - 1][s] or (s &gt;= t[i - 1] and possible[i - 1][s - t[i - 1]])
    best = H
    while not possible[n][best]:
        best -= 1
    return S - 2 * best</pre>
<h3>Reconstruction</h3>
<p>En partant de s = best et de i = n : si possible[i−1][s] est vrai, l’élément n’est pas pris ; sinon il est pris et on retranche sa valeur de s.</p>
<p><b>Complexité.</b> O(n·S) en temps et en mémoire : polynomiale en n et en S, mais pas en la taille de l’écriture de S (<i>pseudo-polynomiale</i>), contre 2ⁿ sous-ensembles pour l’énumération.</p>
<div class="retain"><b>À retenir.</b> Tableau booléen possible[i][s]. On garde la dernière ligne pour la valeur, tout le tableau pour la reconstruction. Coût O(n·S).</div>` });

COURSE.push({ id: 'taches', t: 'Tâches pondérées', h: `
<p><b>Problème.</b> n tâches, chacune avec un début, une fin et un poids. Deux tâches qui se chevauchent sont incompatibles. Trouver un ensemble de tâches compatibles de poids total maximal.</p>
<p>On trie les tâches par heure de fin. Soit p(i) l’indice de la dernière tâche compatible avec la tâche i (0 s’il n’y en a pas).</p>
<div class="formula">opt(0) = 0 ; opt(i) = max( opt(i − 1) , poids(i) + opt(p(i)) )</div>
<pre class="code">def ordonnancement(taches):
    T = sorted(taches, key=lambda t: t[1])
    n = len(T)
    opt = [0] * (n + 1)
    for i in range(1, n + 1):
        d, f, w = T[i - 1]
        p = max([j + 1 for j in range(i - 1) if T[j][1] &lt;= d], default=0)
        opt[i] = max(opt[i - 1], w + opt[p])
    return opt[n]</pre>
<h3>Reconstruction</h3>
<p>En partant de i = n : si poids(i) + opt(p(i)) &gt; opt(i − 1), la tâche i est choisie et on continue en p(i) ; sinon on continue en i − 1.</p>
<h3>Lien avec les stratégies gloutonnes</h3>
<p>Quand les poids sont tous égaux, le problème se résout par un glouton (choisir la tâche qui finit le plus tôt). Avec des poids, ce glouton et le glouton « plus gros poids d’abord » peuvent échouer : un choix local irrévocable n’est plus sûr, la sous-structure optimale seule ne suffit pas. La programmation dynamique, qui compare « prendre » et « ne pas prendre » à chaque étape, reste correcte.</p>
<div class="retain"><b>À retenir.</b> Tri par fin, p(i), opt(i) = max(opt(i−1), poids(i) + opt(p(i))). Le glouton n’est pas toujours optimal quand il y a des poids.</div>` });

COURSE.push({ id: 'mots', t: 'PLSC et distance d’édition', h: `
<h3>Plus longue sous-suite commune (PLSC)</h3>
<p>Une <b>sous-suite</b> d’un mot s’obtient en effaçant des lettres sans changer l’ordre des autres. T[i][j] désigne la longueur d’une PLSC des préfixes a[0:i] et b[0:j].</p>
<div class="formula">T[i][0] = T[0][j] = 0<br>T[i][j] = T[i−1][j−1] + 1 si a[i−1] = b[j−1] ; sinon max( T[i−1][j] , T[i][j−1] )</div>
<pre class="code">def plsc(a, b):
    T = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
    for i in range(1, len(a) + 1):
        for j in range(1, len(b) + 1):
            if a[i - 1] == b[j - 1]:
                T[i][j] = T[i - 1][j - 1] + 1
            else:
                T[i][j] = max(T[i - 1][j], T[i][j - 1])
    return T[len(a)][len(b)]</pre>
<p><b>Reconstruction.</b> On part de la case (len(a), len(b)) : si les lettres sont égales, on les ajoute (en tête) et on passe en diagonale ; sinon on va vers la plus grande des cases voisines (haut ou gauche).</p>
<h3>Distance d’édition (Levenshtein)</h3>
<p>C’est le nombre minimal d’opérations (insertion, suppression, remplacement d’une lettre) pour transformer a en b.</p>
<div class="formula">T[i][0] = i ; T[0][j] = j<br>T[i][j] = min( T[i−1][j] + 1 , T[i][j−1] + 1 , T[i−1][j−1] + (0 si a[i−1] = b[j−1], sinon 1) )</div>
<pre class="code">def levenshtein(a, b):
    T = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
    for i in range(len(a) + 1):
        T[i][0] = i
    for j in range(len(b) + 1):
        T[0][j] = j
    for i in range(1, len(a) + 1):
        for j in range(1, len(b) + 1):
            cout = 0 if a[i - 1] == b[j - 1] else 1
            T[i][j] = min(T[i - 1][j] + 1, T[i][j - 1] + 1, T[i - 1][j - 1] + cout)
    return T[len(a)][len(b)]</pre>
<p><b>Reconstruction.</b> En remontant, un déplacement en diagonale correspond à garder ou remplacer une lettre, vers le haut à supprimer, vers la gauche à insérer.</p>
<p><b>Complexité.</b> O(m·n) en temps ; en mémoire O(m·n) pour reconstruire, O(min(m, n)) si on ne veut que la valeur.</p>
<div class="retain"><b>À retenir.</b> Tableau à deux indices (préfixes de a et de b), trois cases voisines (haut, gauche, diagonale), reconstruction en remontant.</div>` });

COURSE.push({ id: 'floyd', t: 'Floyd-Warshall', h: `
<p><b>Problème.</b> Dans un graphe orienté pondéré (sans cycle de poids négatif), calculer la plus courte distance entre <b>toutes</b> les paires de sommets. Les sommets sont numérotés de 0 à n − 1.</p>
<p><b>Sous-problème.</b> D_k[i][j] : plus courte distance de i à j en n’utilisant comme sommets intermédiaires que les k premiers sommets.</p>
<div class="formula">D₀[i][j] = poids de l’arc (i, j), ∞ s’il n’existe pas, 0 si i = j<br>D_k[i][j] = min( D_{k−1}[i][j] , D_{k−1}[i][k−1] + D_{k−1}[k−1][j] )</div>
<pre class="code">def floyd_warshall(D):          # D[i][j] = poids de l'arc i -&gt; j, inf si absent, D[i][i] = 0
    n = len(D)
    for k in range(n):
        for i in range(n):
            for j in range(n):
                if D[i][k] + D[k][j] &lt; D[i][j]:
                    D[i][j] = D[i][k] + D[k][j]
    return D</pre>
<p>Ce code travaille en place sur une seule matrice : la mise à jour de D[i][j] au pas k ne perturbe pas le calcul, car D[i][k] et D[k][j] ne changent pas pendant ce pas.</p>
<h3>Reconstruction des chemins</h3>
<p>On tient une matrice suivant[i][j] : le premier sommet à emprunter pour aller de i à j. Quand D[i][j] est améliorée via k, on pose suivant[i][j] = suivant[i][k]. Le chemin se lit en suivant les successeurs de i jusqu’à j.</p>
<p><b>Complexité.</b> O(n³) en temps ; O(n²) en mémoire.</p>
<div class="retain"><b>À retenir.</b> Trois boucles : k (intermédiaire) à l’extérieur, puis i et j. Une matrice des distances, une matrice des successeurs pour reconstruire.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Dictionnaire</dt><dd>Structure associant une valeur à chaque clé.</dd>
<dt>Fonction de hachage</dt><dd>Fonction qui calcule le numéro d’alvéole d’une clé.</dd>
<dt>Collision</dt><dd>Deux clés distinctes avec la même alvéole.</dd>
<dt>Chaînage</dt><dd>Résolution des collisions par une liste dans chaque alvéole.</dd>
<dt>Facteur de charge</dt><dd>Nombre d’éléments divisé par le nombre d’alvéoles.</dd>
<dt>Clé hachable</dt><dd>Clé immuable dont on peut calculer la valeur de hachage.</dd>
<dt>Sous-structure optimale</dt><dd>Une solution optimale contient des solutions optimales de sous-problèmes.</dd>
<dt>Chevauchement de sous-problèmes</dt><dd>Un même sous-problème apparaît dans plusieurs appels.</dd>
<dt>Mémoïsation</dt><dd>Stockage des résultats déjà calculés pour ne pas les recalculer.</dd>
<dt>De bas en haut</dt><dd>Remplissage d’un tableau dans l’ordre des dépendances.</dd>
<dt>Glouton</dt><dd>Algorithme qui fait des choix locaux irrévocables.</dd>
<dt>Sous-suite</dt><dd>Lettres d’un mot prises dans l’ordre, pas forcément consécutives.</dd>
<dt>Distance d’édition</dt><dd>Nombre minimal d’insertions, suppressions et remplacements.</dd>
<dt>Reconstruction</dt><dd>Retrouver une solution à partir du tableau calculé.</dd>
</dl>` });

/* ---------- interface ---------- */
const UI = { cur: 's1' };
const AS = { key: 's1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'cadre' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }

  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),

  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : dictionnaires et programmation dynamique'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));

$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });
