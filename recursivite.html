COURSE.push({ id: 'principe', t: 'Principe de la récursivité', h: `
<p>Une fonction est <b>récursive</b> si elle s’appelle elle-même. Pour que cela fonctionne, il faut :</p>
<ul><li>un ou plusieurs <b>cas de base</b>, résolus directement, sans appel récursif ;</li><li>un ou plusieurs <b>appels récursifs</b> sur des arguments « plus petits », qui rapprochent d’un cas de base.</li></ul>
<pre class="code">def fact(n):
    if n == 0:              # cas de base
        return 1
    return n * fact(n - 1)  # appel récursif</pre>
<p>Cette fonction traduit directement la définition mathématique n! = n × (n − 1)! avec 0! = 1.</p>
<h3>La pile d’appels</h3>
<p>Chaque appel crée un <b>cadre</b> (arguments, variables locales, adresse de retour) empilé sur la pile d’appels. Un cadre est dépilé quand la fonction retourne. Pour <code>fact(3)</code> :</p>
<pre class="code">fact(3)
  fact(2)
    fact(1)
      fact(0)  retourne 1          # cas de base
    fact(1)  retourne 1 * 1 = 1
  fact(2)  retourne 2 * 1 = 2
fact(3)  retourne 3 * 2 = 6</pre>
<p>Les produits sont calculés au <b>retour</b> des appels, du plus profond au plus extérieur.</p>
<h3>Limite de récursion</h3>
<p>La pile est de taille limitée : Python lève une <code>RecursionError</code> au-delà d’environ 1000 appels imbriqués.</p>
<pre class="code">import sys
sys.getrecursionlimit()      # 1000 par défaut
sys.setrecursionlimit(5000)  # à utiliser avec prudence</pre>
<div class="retain"><b>À retenir.</b> Une fonction récursive a un cas de base et des appels sur des arguments plus petits. Les appels sont empilés puis les résultats remontent au retour.</div>` });

COURSE.push({ id: 'terminaison', t: 'Terminaison et correction', h: `
<h3>Terminaison : le variant</h3>
<p>Pour prouver qu’une fonction récursive termine, on exhibe un <b>variant</b> : une quantité à valeurs dans ℕ qui <b>diminue strictement</b> à chaque appel récursif. Comme il n’existe pas de suite infinie strictement décroissante d’entiers naturels, les appels s’arrêtent.</p>
<ul><li><code>fact(n)</code> : le variant est n (de n à n − 1).</li><li><code>pgcd(a, b)</code> : le variant est b, car le nouvel argument a % b est strictement inférieur à b.</li><li><code>dicho(t, x, g, d)</code> : le variant est d − g + 1, la longueur de la zone de recherche, qui au moins diminue de 1.</li></ul>
<h3>Correction : récurrence</h3>
<p>On prouve la correction par récurrence sur le variant (récurrence forte) : le cas de base est correct, et si les appels récursifs sont corrects, le résultat combiné l’est aussi.</p>
<div class="formula">pgcd(a, b) = pgcd(b, a mod b) car les diviseurs communs de a et b sont ceux de b et a mod b</div>
<h3>Complexité</h3>
<p>On écrit une <b>relation de récurrence</b> sur le coût C(n) puis on la résout :</p>
<table class="ctable"><thead><tr><th>Fonction</th><th>Relation</th><th>Coût</th></tr></thead><tbody>
<tr><td>fact(n)</td><td>C(n) = C(n − 1) + O(1)</td><td>O(n)</td></tr>
<tr><td>fibo(n) naïf</td><td>C(n) = C(n − 1) + C(n − 2) + 1</td><td>exponentiel, Θ(φⁿ), φ ≈ 1,618</td></tr>
<tr><td>Hanoï (nombre de coups)</td><td>H(n) = 2·H(n − 1) + 1</td><td>2ⁿ − 1</td></tr>
<tr><td>dichotomie</td><td>C(n) = C(n/2) + O(1)</td><td>O(log n)</td></tr>
<tr><td>tri fusion</td><td>C(n) = 2·C(n/2) + O(n)</td><td>O(n log n)</td></tr></tbody></table>
<div class="retain"><b>À retenir.</b> Variant strictement décroissant dans ℕ = terminaison. Correction = récurrence. Le coût se calcule avec une relation de récurrence, dont la forme (un ou deux appels, taille n − 1 ou n/2) donne l’ordre de grandeur.</div>` });

COURSE.push({ id: 'complexite', t: 'Arbres d’appels et mémoïsation', h: `
<p>Quand une fonction fait plusieurs appels récursifs, ses appels forment un <b>arbre</b>. Pour <code>fibo(4)</code> :</p>
<pre class="code">fibo(4)
├─ fibo(3)
│  ├─ fibo(2)
│  │  ├─ fibo(1)
│  │  └─ fibo(0)
│  └─ fibo(1)
└─ fibo(2)            # recalculé !
   ├─ fibo(1)
   └─ fibo(0)</pre>
<p>Les mêmes sous-problèmes sont recalculés : le nombre d’appels C(n) vérifie C(n) = 1 + C(n − 1) + C(n − 2), il croît exponentiellement (15 appels pour n = 5, plus de 2,6 millions pour n = 30).</p>
<h3>Mémoïsation</h3>
<p>On <b>mémorise</b> chaque résultat dans un dictionnaire, afin que chaque sous-problème ne soit résolu qu’une fois. Le nombre d’appels devient 2n − 1.</p>
<pre class="code">def fibo(n, memo=None):
    if memo is None:
        memo = {}
    if n < 2:
        return n
    if n not in memo:
        memo[n] = fibo(n - 1, memo) + fibo(n - 2, memo)
    return memo[n]

from functools import cache   # même idée, automatique

@cache
def fibo2(n):
    return n if n &lt; 2 else fibo2(n - 1) + fibo2(n - 2)</pre>
<h3>Version itérative (programmation dynamique)</h3>
<pre class="code">def fibo_iter(n):
    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a</pre>
<p>Elle calcule les mêmes valeurs « du bas vers le haut », sans pile d’appels : coût O(n) en temps et O(1) en mémoire.</p>
<h3>Tours de Hanoï</h3>
<pre class="code">def hanoi(n, a, b, c):   # n disques de a vers c, avec b comme intermédiaire
    if n &gt; 0:
        hanoi(n - 1, a, c, b)
        print(a, '-&gt;', c)
        hanoi(n - 1, b, a, c)</pre>
<p>Le nombre de coups vérifie H(n) = 2·H(n − 1) + 1, d’où H(n) = 2<sup>n</sup> − 1. Aucune mémoïsation ne peut y changer quoi que ce soit : la sortie elle-même est de taille exponentielle.</p>
<div class="retain"><b>À retenir.</b> Si les appels se recouvrent, l’arbre d’appels est exponentiel. La mémoïsation ou la programmation dynamique ramène le coût au nombre de sous-problèmes distincts.</div>` });

COURSE.push({ id: 'diviser', t: 'Diviser pour régner', h: `
<p>On <b>divise</b> un problème de taille n en sous-problèmes de taille environ n/2, on les <b>résout</b> récursivement, puis on <b>combine</b> les résultats. La profondeur de récursion est de l’ordre de log₂ n.</p>
<h3>Recherche dichotomique</h3>
<pre class="code">def dicho(t, x, g, d):
    if g &gt; d:
        return -1
    m = (g + d) // 2
    if t[m] == x:
        return m
    if t[m] &lt; x:
        return dicho(t, x, m + 1, d)
    return dicho(t, x, g, m - 1)</pre>
<p>Le tableau doit être <b>trié</b>. Au plus ⌊log₂ n⌋ + 1 comparaisons : coût O(log n).</p>
<h3>Exponentiation rapide</h3>
<pre class="code">def puiss(x, n):
    if n == 0:
        return 1
    y = puiss(x, n // 2)
    if n % 2 == 0:
        return y * y
    return x * y * y</pre>
<p>On fait ⌊log₂ n⌋ + 2 appels et au plus 2 multiplications par appel : O(log n) multiplications au lieu de n − 1.</p>
<h3>Tri fusion</h3>
<pre class="code">def fusion(t):
    if len(t) &lt;= 1:
        return t
    m = len(t) // 2
    return merge(fusion(t[:m]), fusion(t[m:]))

def merge(a, b):
    i = j = 0
    res = []
    while i &lt; len(a) and j &lt; len(b):
        if a[i] &lt;= b[j]:
            res.append(a[i]); i += 1
        else:
            res.append(b[j]); j += 1
    return res + a[i:] + b[j:]</pre>
<p><code>merge</code> fusionne deux listes triées en temps linéaire. Il y a environ log₂ n niveaux et chaque niveau traite n éléments : coût <b>O(n log n)</b>.</p>
<div class="retain"><b>À retenir.</b> Diviser le problème par 2 à chaque appel donne une profondeur log₂ n : dichotomie et exponentiation rapide en O(log n), tri fusion en O(n log n).</div>` });

COURSE.push({ id: 'iteratif', t: 'Récursif ou itératif ?', h: `
<p>Tout algorithme récursif peut s’écrire avec une boucle (au besoin avec une pile explicite), et inversement. Le choix est une question de clarté et de coût.</p>
<table class="ctable"><thead><tr><th></th><th>Récursif</th><th>Itératif</th></tr></thead><tbody>
<tr><td>Lisibilité</td><td>Proche de la définition mathématique, naturel pour les arbres et le diviser pour régner</td><td>Plus long à écrire pour certains problèmes</td></tr>
<tr><td>Mémoire</td><td>Une pile d’appels de hauteur proportionnelle à la profondeur</td><td>Souvent O(1)</td></tr>
<tr><td>Limite</td><td>RecursionError vers 1000 appels en Python</td><td>Aucune</td></tr></tbody></table>
<h3>Récursion terminale</h3>
<p>Un appel est <b>terminal</b> s’il est la dernière opération de la fonction. Certains langages le transforment en boucle, mais <b>pas Python</b>. Une fonction terminale se réécrit facilement avec une boucle :</p>
<pre class="code">def pgcd(a, b):             # récursif terminal
    if b == 0:
        return a
    return pgcd(b, a % b)

def pgcd_iter(a, b):        # itératif équivalent
    while b != 0:
        a, b = b, a % b
    return a</pre>
<p>Ici le variant de la fonction récursive devient l’invariant de terminaison de la boucle : b décroît strictement.</p>
<div class="retain"><b>À retenir.</b> Récursif = clair mais limité par la pile en Python. Un appel terminal se transforme en boucle ; on garde la récursivité pour les structures arborescentes et le diviser pour régner.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Récursivité</dt><dd>Fait pour une fonction de s’appeler elle-même.</dd>
<dt>Cas de base</dt><dd>Situation traitée sans appel récursif ; elle arrête la récursion.</dd>
<dt>Pile d’appels</dt><dd>Structure où Python empile un cadre par appel de fonction en cours.</dd>
<dt>Cadre</dt><dd>Zone mémoire d’un appel : arguments, variables locales, adresse de retour.</dd>
<dt>Variant</dt><dd>Quantité entière qui décroît strictement à chaque appel : elle prouve la terminaison.</dd>
<dt>Arbre d’appels</dt><dd>Arbre dont les nœuds sont les appels et les fils les appels qu’ils déclenchent.</dd>
<dt>Mémoïsation</dt><dd>Mémorisation des résultats déjà calculés pour éviter de les recalculer.</dd>
<dt>Programmation dynamique</dt><dd>Calcul des sous-problèmes du plus petit au plus grand, en les stockant.</dd>
<dt>Diviser pour régner</dt><dd>Diviser en sous-problèmes plus petits, résoudre récursivement, combiner.</dd>
<dt>Récursion terminale</dt><dd>Appel récursif placé en dernière opération ; se transforme en boucle.</dd>
</dl>` });

/* ---------- interface ---------- */
const UI = { cur: 'r1' };
const AS = { key: 'r1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'principe' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }

  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));

  art.append(h('div', { class: 'cpn' },

  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : la récursivité'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
