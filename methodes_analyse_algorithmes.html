@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-methodes-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
const WORKSHOPS = [];

/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Code Python coloré (léger) */
function codeBlock(code, on) {
  const KW = /^(def|return|for|in|if|elif|else|while|not|raise|import|from|with|as|and|or|is|lambda|class|pass|break|continue|assert|try|except|finally|yield)$/;
  const BI = /^(print|len|range|set|dict|list|max|min|sum|id|hash|sorted|open|str|int|float|None|True|False|isinstance|TypeError|ValueError|Exception|AssertionError)$/;
  const lines = code.split('\n').map(line => {
    let out = '', i = 0;
    while (i < line.length) {
      const ch = line[i];
      if (ch === '#') { out += '<span style="color:#7a7a88;font-style:italic">' + esc(line.slice(i)) + '</span>'; break; }
      if (ch === '"' || ch === "'") { let j = i + 1; while (j < line.length && line[j] !== ch) j++; out += '<span style="color:#1c6b40">' + esc(line.slice(i, j + 1)) + '</span>'; i = j + 1; continue; }
      let j = i; while (j < line.length && line[j] !== '#' && line[j] !== '"' && line[j] !== "'") j++;
      let seg = esc(line.slice(i, j)).replace(/\b([A-Za-z_]\w*|\d+(?:\.\d+)?)\b/g, m => /^\d/.test(m) ? '<span style="color:#b05a00">' + m + '</span>' : KW.test(m) ? '<span style="color:#7c3aa8">' + m + '</span>' : BI.test(m) ? '<span style="color:#1f3fa0">' + m + '</span>' : m);
      out += seg; i = j;
    }
    return out;
  });
  return '<pre class="code">' + lines.map((l, i) => '<span style="display:block;padding:0 ' + (on === i + 1 || (Array.isArray(on) && on.includes(i + 1)) ? '10px 0 10px;background:#fff3dc;border-left:3px solid #e08a00' : '10px') + ';white-space:pre">' + (l || ' ') + '</span>').join('') + '</pre>';
}

/* ================= Atelier 1 : Spécification & Assertions ================= */
const W1 = { func: 'moyenne', input: '', active: false };
const FUNCS = {
  moyenne: {
    label: 'moyenne(L)',
    sig: 'def moyenne(L: list) -> float:',
    desc: 'Calcule la moyenne des éléments de la liste L.',
    pre: 'L est une liste non vide de nombres (int ou float).',
    post: 'renvoie la somme des éléments de L divisée par len(L).',
    code: [
      'def moyenne(L: list) -> float:',
      '    """Calcule la moyenne de L. Précondition : len(L) > 0."""',
      '    assert len(L) > 0, "L ne doit pas être vide"',
      '    total = 0',
      '    for x in L:',
      '        total += x',
      '    return total / len(L)'
    ],
    tests: {
      '[]': { ok: false, msg: 'AssertionError : L ne doit pas être vide', type: 'err' },
      '[3]': { ok: true, val: '3.0' },
      '[1, 2, 3]': { ok: true, val: '2.0' },
      '[10, 20, 30, 40]': { ok: true, val: '25.0' }
    }
  },
  division: {
    label: 'division(a, b)',
    sig: 'def division(a: int, b: int) -> float:',
    desc: 'Renvoie le quotient de a par b.',
    pre: 'a et b sont des entiers, b ≠ 0.',
    post: 'renvoie a / b (flottant).',
    code: [
      'def division(a: int, b: int) -> float:',
      '    """Quotient de a par b. Précondition : b != 0."""',
      '    assert isinstance(a, int) and isinstance(b, int), "a et b doivent être des entiers"',
      '    assert b != 0, "division par zéro"',
      '    return a / b'
    ],
    tests: {
      '3, 2': { ok: true, val: '1.5' },
      '6, 3': { ok: true, val: '2.0' },
      '1, 0': { ok: false, msg: 'AssertionError : division par zéro', type: 'err' },
      '1.5, 2': { ok: false, msg: 'AssertionError : a et b doivent être des entiers', type: 'err' }
    }
  }
};
function mountW1(root) {
  root.innerHTML = '<h2>Spécification et assertions</h2><p>Une fonction doit être <b>documentée</b> : on précise sa <b>signature</b>, sa <b>précondition</b> (ce qui doit être vrai à l\'entrée) et sa <b>postcondition</b> (ce qui doit être vrai à la sortie). Les <b>assertions</b> vérifient la précondition : si elle est fausse, le programme s\'arrête.</p>' +
    '<div class="opts"><div class="fld"><span>Fonction</span><div id="w1-func"></div></div></div>' +
    '<div class="dwrap"><table class="dt"><thead><tr><th>Élément</th><th>Contenu</th></tr></thead><tbody id="w1-spec"></tbody></table></div>' +
    '<div id="w1-code"></div>' +
    '<h3>Tester la fonction</h3><p>Entrez les arguments et vérifiez le comportement.</p>' +
    '<div class="opts"><label class="fld"><span>Arguments</span><input type="text" id="w1-input" class="mono" placeholder="ex : [1, 2, 3] ou 3, 2" autocomplete="off"></label><button class="btn pri" id="w1-go" type="button">Exécuter</button></div>' +
    '<div class="verdict" id="w1-out" aria-live="polite"></div>' +
    '<h3>Cas de test prédéfinis</h3><div id="w1-tests"></div>' +
    '<p class="small">Les assertions servent à détecter les erreurs de programmation. Elles ne remplacent pas les exceptions (ValueError, TypeError) qui, elles, peuvent être rattrapées. Le programme de première année demande de savoir utiliser <code>assert</code> pour valider les entrées.</p>';
  const S = W1;

function mountW2(root) {

  };
  render();

const COURSE = [];
COURSE.push({ id: 'specification', t: 'Spécification et assertions', h: `
<p>Une fonction doit être <b>documentée</b> : on précise sa <b>signature</b> (nom, paramètres, type de retour), sa <b>précondition</b> (ce qui doit être vrai à l'entrée) et sa <b>postcondition</b> (ce qui doit être vrai à la sortie).</p>
<h3>Signature</h3>
<pre class="code">def moyenne(L: list) -> float:
    """Calcule la moyenne de L.
    Précondition : L est une liste non vide de nombres.
    Postcondition : renvoie la somme des éléments de L divisée par len(L).
    """</pre>
<h3>Assertions</h3>
<p>Une <b>assertion</b> vérifie la précondition. Si la condition est fausse, Python lève une <code>AssertionError</code> et le programme s'arrête.</p>
<pre class="code">def moyenne(L: list) -> float:
    assert len(L) > 0, "L ne doit pas être vide"
    total = 0
    for x in L:
        total += x
    return total / len(L)</pre>
<p>Les assertions sont un outil de <b>débogage</b> et de <b>documentation exécutable</b> : elles ne remplacent pas les exceptions de gestion d'erreur (ValueError, TypeError).</p>
<h3>Annotations par commentaires</h3>
<p>On peut annoter un bloc d'instructions par une précondition, une postcondition, une propriété invariante, sous forme de commentaires :</p>
<pre class="code"># Précondition : n >= 0
def factorielle(n: int) -> int:
    f = 1
    i = 1
    # Invariant : f = (i - 1)!
    while i <= n:
        f = f * i
        i = i + 1
    # Postcondition : f = n!
    return f</pre>
<div class="retain"><b>À retenir.</b> Signature, précondition, postcondition : la spécification d'une fonction. assert vérifie la précondition.</div>` });

COURSE.push({ id: 'invariant', t: 'Invariant, variant, correction', h: `
<h3>Invariant de boucle</h3>
<p>Un <b>invariant</b> est une propriété vraie avant et après chaque tour de boucle. Il sert à prouver la <b>correction partielle</b> : si la boucle s'arrête, l'invariant et la condition d'arrêt donnent le résultat.</p>
<pre class="code">def somme(n: int) -> int:
    s = 0
    i = 0
    # Invariant : s = 0 + 1 + ... + i
    while i < n:
        i = i + 1
        s = s + i
    return s</pre>
<h3>Variant de boucle</h3>
<p>Un <b>variant</b> est une quantité entière positive qui décroît strictement à chaque tour. Comme elle ne peut pas décroître indéfiniment, la boucle s'arrête : c'est la <b>terminaison</b>.</p>
<pre class="code"># Variant : n - i
while i < n:
    i = i + 1</pre>
<h3>Correction totale</h3>
<ul><li><b>Correction partielle</b> : si la boucle s'arrête, le résultat est correct (preuve par invariant).</li><li><b>Terminaison</b> : la boucle s'arrête toujours (preuve par variant).</li><li><b>Correction totale</b> = correction partielle + terminaison.</li></ul>
<div class="retain"><b>À retenir.</b> Invariant = correction partielle ; variant = terminaison ; les deux = correction totale.</div>` });

COURSE.push({ id: 'tests', t: 'Jeu de tests', h: `
<h3>Écrire un jeu de tests</h3>
<p>Un <b>jeu de tests</b> associe à chaque entrée la sortie attendue. Le programme officiel demande de savoir écrire ces tests à la main (la génération automatique n'est pas au programme).</p>
<h3>Partitions du domaine</h3>
<p>On découpe les entrées en classes équivalentes (cas normal, cas limite, cas d'erreur) et on choisit une entrée dans chaque classe.</p>
<pre class="code">def signe(x: int) -> int:
    if x < 0:
        return -1
    elif x > 0:
        return 1
    else:
        return 0

# Partitions : x < 0, x = 0, x > 0
# Tests :

assert signe(0) == 0
assert signe(5) == 1</pre>
<h3>Valeurs limites</h3>
<p>Les erreurs se cachent souvent aux bornes : x = 0, x = 1, x = −1, x = 20, x = 21… On teste toujours les valeurs qui déclenchent un changement de comportement.</p>

<table class="ctable"><thead><tr><th>Entrée</th><th>Sortie attendue</th><th>Partition</th></tr></thead><tbody>
<tr><td>−3</td><td>−1</td><td>x &lt; 0</td></tr>
<tr><td>0</td><td>0</td><td>x = 0 (limite)</td></tr>
<tr><td>5</td><td>1</td><td>x &gt; 0</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Un bon jeu de tests couvre les partitions et les limites. On l'écrit à la main.</div>` });

COURSE.push({ id: 'complexite', t: 'Complexité', h: `
<h3>Complexité temporelle</h3>
<p>La <b>complexité temporelle</b> compte le nombre d'opérations élémentaires en fonction de la taille n de l'entrée, dans le <b>pire cas</b>. On la donne en ordre de grandeur.</p>
<table class="ctable"><thead><tr><th>Notation</th><th>Signification</th><th>Exemple</th></tr></thead><tbody>
<tr><td>O(1)</td><td>constant</td><td>accès à un indice de tableau</td></tr>
<tr><td>O(log n)</td><td>logarithmique</td><td>recherche dichotomique</td></tr>
<tr><td>O(n)</td><td>linéaire</td><td>recherche séquentielle</td></tr>
<tr><td>O(n log n)</td><td>quasi-linéaire</td><td>tri fusion, tri rapide (moyenne)</td></tr>
<tr><td>O(n²)</td><td>quadratique</td><td>tri à bulles, tri par sélection</td></tr>
</tbody></table>
<h3>Pire cas</h3>
<p>On étudie le nombre d'opérations dans le pire cas : c'est une garantie de temps d'exécution, indépendante des données.</p>
<h3>Complexité en espace</h3>
<p>On peut aussi s'intéresser à la mémoire utilisée : un tri en place a une complexité spatiale O(1) (ou O(log n) pour la pile de récursion), un tri fusion a besoin de O(n) mémoire supplémentaire.</p>
<div class="retain"><b>À retenir.</b> Un algorithme en O(n log n) est plus rapide qu'un algorithme en O(n²) pour n grand. La notation O ignore les constantes.</div>` });

COURSE.push({ id: 'conception', t: 'Choix de conception', h: `
<h3>Justifier ses choix</h3>
<p>Un programme n'est pas seulement correct : il doit être <b>justifié</b>. Le programme officiel demande d'expliquer les choix de conception (algorithme, structure de données) en commentaire.</p>
<h3>Choisir une structure</h3>
<table class="ctable"><thead><tr><th>Besoin</th><th>Structure adaptée</th></tr></thead><tbody>
<tr><td>Accès par clé</td><td>dictionnaire</td></tr>
<tr><td>Éléments uniques</td><td>ensemble</td></tr>
<tr><td>Ordre d'insertion</td><td>liste</td></tr>
<tr><td>File (FIFO)</td><td>collections.deque</td></tr>
<tr><td>Pile (LIFO)</td><td>list</td></tr>
</tbody></table>
<h3>Commenter le code</h3>
<p>Un commentaire utile explique <b>pourquoi</b> on fait un choix, pas ce que fait le code ligne à ligne. Par exemple :</p>
<pre class="code"># On utilise un dictionnaire car on doit compter les occurrences
# de chaque mot : l'accès par mot est en O(1), le parcours en O(n).
occurrences = {}
for mot in texte:
    occurrences[mot] = occurrences.get(mot, 0) + 1</pre>
<h3>Effet de bord</h3>
<p>En Python, l'affectation est une <b>instruction</b> (et non une expression, contrairement au C). C'est un choix des concepteurs du langage : une affectation ne renvoie pas de valeur.</p>
<pre class="code"># En C :
# x = (y = 3) + 1  // y vaut 3, x vaut 4

# En Python :
# x = (y = 3) + 1  # SyntaxError
y = 3
x = y + 1</pre>
<div class="retain"><b>À retenir.</b> Choisir une structure, la justifier en commentaire, expliquer les effets de bord : c'est la démarche attendue.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Signature</dt><dd>Nom, paramètres et type de retour d'une fonction.</dd>
<dt>Précondition</dt><dd>Ce qui doit être vrai à l'entrée d'une fonction.</dd>
<dt>Postcondition</dt><dd>Ce qui doit être vrai à la sortie, si la précondition est vérifiée.</dd>
<dt>Assertion</dt><dd>Instruction assert qui vérifie une condition et lève une AssertionError si elle est fausse.</dd>
<dt>Invariant de boucle</dt><dd>Propriété vraie avant et après chaque tour de boucle ; prouve la correction partielle.</dd>
<dt>Variant de boucle</dt><dd>Entier positif qui décroît strictement à chaque tour ; prouve la terminaison.</dd>
<dt>Correction partielle</dt><dd>Si la boucle s'arrête, le résultat est correct.</dd>
<dt>Correction totale</dt><dd>Correction partielle + terminaison.</dd>
<dt>Jeu de tests</dt><dd>Ensemble de tests associant entrées et sorties attendues.</dd>
<dt>Partition du domaine</dt><dd>Découpage des entrées en classes équivalentes.</dd>
<dt>Valeur limite</dt><dd>Valeur aux bornes d'un intervalle (0, 1, −1…), souvent source d'erreurs.</dd>
<dt>Complexité temporelle</dt><dd>Nombre d'opérations en fonction de la taille de l'entrée, dans le pire cas.</dd>
<dt>Complexité spatiale</dt><dd>Mémoire utilisée en fonction de la taille de l'entrée.</dd>
<dt>Ordre de grandeur</dt><dd>Notation O(·) qui ignore les constantes et les termes négligeables.</dd>
<dt>Effet de bord</dt><dd>Modification d'un état extérieur à une fonction (variable globale, argument mutable).</dd>
</dl>` });

/* ---------- interface ---------- */
const UI = { cur: 'w1' };
const AS = { key: 'w1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'specification' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }

  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;

  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));

  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : méthodes et analyse d\'algorithmes'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {

});
