'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);

    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

const WORKSHOPS = [];

/*LOGIC-START*/
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
const ALGO_NAME = { selection: 'Tri par sélection', insertion: 'Tri par insertion', fusion: 'Tri fusion', rapide: 'Tri rapide', comptage: 'Tri par comptage' };
function genArray(kind, n, small) {

  if (kind === 'trie') a.sort((x, y) => x - y);

/* mesures : comparaisons de valeurs et mouvements (échanges, décalages, recopies) */
function measure(algo, t) {

    for (let i = 1; i < n; i++) { const x = a[i]; let j = i; while (j > 0) { cmp++; if (a[j - 1] > x) { a[j] = a[j - 1]; j--; mov++; } else break; } a[j] = x; }

<p><b>Trier</b> un tableau, c’est le réarranger pour que ses éléments soient rangés dans l’ordre croissant (pour une relation d’ordre donnée). Les tris servent partout : recherche dichotomique, statistiques (médiane), affichage, regroupement.</p>
<h3>Critères de comparaison</h3>
<ul>
<li><b>Coût en temps</b> : nombre de comparaisons et de mouvements en fonction de la taille n. On distingue le meilleur cas, le pire cas et le cas moyen.</li>
<li><b>Coût en mémoire</b> : un tri est <b>en place</b> s’il n’utilise qu’un espace supplémentaire O(1) (ou O(log n) pour la pile de récursion).</li>
<li><b>Stabilité</b> : un tri est <b>stable</b> s’il conserve l’ordre relatif des éléments de même clé.</li>
<li><b>Tri par comparaison</b> : il n’utilise que des comparaisons entre éléments (sélection, insertion, fusion, rapide). Le tri par comptage n’en utilise pas.</li>
<li><b>En ligne</b> : un tri en ligne peut trier au fur et à mesure que les éléments arrivent (insertion).</li>
</ul>
<h3>Invariants</h3>
<p>Pour prouver un tri itératif, on énonce un <b>invariant de boucle</b> : une propriété vraie avant chaque tour, qui à la fin donne le résultat. Pour la terminaison, on utilise un variant (une quantité entière qui décroît).</p>
<h3>Python</h3>
<pre class="code">&gt;&gt;&gt; sorted([3, 1, 2])          # nouvelle liste triée
[1, 2, 3]
&gt;&gt;&gt; t = [3, 1, 2]; t.sort()    # tri en place
&gt;&gt;&gt; sorted(noms, key=len, reverse=True)</pre>
<p>Ces deux fonctions sont stables et de complexité O(n log n) (algorithme Timsort).</p>
<div class="retain"><b>À retenir.</b> Un tri se caractérise par son coût en temps, sa mémoire, sa stabilité et sa nature (par comparaison ou non). Un invariant de boucle prouve sa correction.</div>` });

COURSE.push({ id: 'selection', t: 'Tri par sélection', h: `
<p><b>Principe.</b> On cherche le plus petit élément de la partie non triée et on le place à la suite de la partie triée.</p>
<pre class="code">def tri_selection(t):
    n = len(t)
    for i in range(n - 1):
        m = i                        # indice du minimum de t[i:]
        for j in range(i + 1, n):
            if t[j] &lt; t[m]:
                m = j
        if m != i:
            t[i], t[m] = t[m], t[i]  # échange</pre>
<p><b>Invariant.</b> Au début du tour i, t[0:i] est trié et contient les i plus petits éléments du tableau, à leur place définitive.</p>
<p><b>Coût.</b> Le nombre de comparaisons est (n − 1) + (n − 2) + … + 1 = n(n − 1)/2 dans <b>tous les cas</b> : Θ(n²). Au plus n − 1 échanges. Mémoire : O(1).</p>
<p><b>Propriétés.</b> En place, par comparaison, <b>non stable</b> : l’échange d’un élément avec le minimum peut passer par-dessus un élément égal. Exemple : [2a, 2b, 1c] devient [1c, 2b, 2a].</p>
<div class="retain"><b>À retenir.</b> Sélection : n(n − 1)/2 comparaisons toujours, peu d’échanges, non stable.</div>` });

COURSE.push({ id: 'insertion', t: 'Tri par insertion', h: `
<p><b>Principe.</b> On considère que la partie gauche est triée, puis on insère chaque élément suivant à sa bonne place en décalant vers la droite les éléments plus grands, comme on trie des cartes dans sa main.</p>
<pre class="code">def tri_insertion(t):
    for i in range(1, len(t)):
        x = t[i]                 # élément à insérer
        j = i
        while j &gt; 0 and t[j - 1] &gt; x:
            t[j] = t[j - 1]      # décalage vers la droite
            j -= 1
        t[j] = x</pre>
<p><b>Invariant.</b> Au début du tour i, t[0:i] est trié (ce sont les mêmes éléments qu’au départ, rangés dans l’ordre).</p>
<p><b>Coût.</b> Le nombre de décalages est le nombre d’<b>inversions</b> du tableau (paires i &lt; j avec t[i] &gt; t[j]).</p>
<table class="ctable"><thead><tr><th>Cas</th><th>Tableau</th><th>Comparaisons</th></tr></thead><tbody>
<tr><td>Meilleur</td><td>déjà trié</td><td>n − 1 : O(n)</td></tr>
<tr><td>Pire</td><td>trié à l’envers</td><td>n(n − 1)/2 : O(n²)</td></tr>
<tr><td>Moyen</td><td>aléatoire</td><td>≈ n²/4 : O(n²)</td></tr></tbody></table>
<p><b>Propriétés.</b> En place, par comparaison, <b>stable</b> (on ne décale que les éléments strictement plus grands), <b>en ligne</b>. Très efficace sur les tableaux presque triés.</p>
<div class="retain"><b>À retenir.</b> Insertion : O(n) si le tableau est trié, O(n²) sinon ; stable et adapté aux petits tableaux ou aux tableaux presque triés.</div>` });

COURSE.push({ id: 'fusion', t: 'Tri fusion et tri rapide', h: `
<p>Ces deux tris sont récursifs, du type <b>diviser pour régner</b> : ils ramènent le tri d’un tableau de taille n à celui de deux sous-tableaux de taille environ n/2.</p>
<h3>Tri fusion</h3>
<pre class="code">def tri_fusion(t):
    if len(t) &lt;= 1:
        return t
    m = len(t) // 2
    return fusion(tri_fusion(t[:m]), tri_fusion(t[m:]))

def fusion(a, b):
    i = j = 0
    res = []
    while i &lt; len(a) and j &lt; len(b):
        if a[i] &lt;= b[j]:
            res.append(a[i]); i += 1
        else:
            res.append(b[j]); j += 1
    return res + a[i:] + b[j:]</pre>
<ul><li>La fusion de deux listes triées de tailles p et q coûte au plus p + q − 1 comparaisons.</li><li>Relation de récurrence : C(n) = 2·C(n/2) + O(n), donc <b>O(n log n)</b> dans tous les cas.</li><li><b>Stable</b> (on prend a[i] en cas d’égalité), mémoire supplémentaire O(n).</li></ul>
<h3>Tri rapide</h3>
<pre class="code">def partition(t, lo, hi):          # pivot = t[hi]
    pivot = t[hi]
    i = lo
    for j in range(lo, hi):
        if t[j] &lt; pivot:
            t[i], t[j] = t[j], t[i]
            i += 1
    t[i], t[hi] = t[hi], t[i]
    return i                       # position définitive du pivot

def tri_rapide(t, lo, hi):
    if lo &lt; hi:
        p = partition(t, lo, hi)
        tri_rapide(t, lo, p - 1)
        tri_rapide(t, p + 1, hi)</pre>
<p>Après <code>partition</code>, le pivot est à sa place définitive : tout ce qui est à gauche est plus petit, tout ce qui est à droite est plus grand ou égal. Il reste à trier chaque côté.</p>
<ul><li><b>Meilleur cas et cas moyen</b> : O(n log n) quand le pivot partage bien le tableau.</li><li><b>Pire cas</b> : O(n²), par exemple un tableau déjà trié avec le dernier élément comme pivot (sous-tableaux de taille n − 1 et 0). On l’évite en choisissant un pivot aléatoire ou au milieu.</li><li>En place, non stable, pile de récursion O(log n) en moyenne.</li></ul>
<div class="retain"><b>À retenir.</b> Fusion : O(n log n) garanti, stable, mémoire O(n). Rapide : O(n log n) en moyenne, O(n²) au pire, en place, non stable.</div>` });

COURSE.push({ id: 'comptage', t: 'Tri par comptage', h: `
<p><b>Principe.</b> Les éléments sont des entiers compris entre 0 et vmax. On compte combien de fois apparaît chaque valeur, puis on reconstruit le tableau en écrivant chaque valeur autant de fois qu’elle apparaît, dans l’ordre croissant.</p>
<pre class="code">def tri_comptage(t, vmax):
    c = [0] * (vmax + 1)
    for x in t:
        c[x] += 1                  # c[v] = nombre d'occurrences de v
    res = []
    for v in range(vmax + 1):
        res += [v] * c[v]
    return res</pre>
<ul>
<li><b>Coût</b> : O(n + vmax) en temps comme en mémoire, dans tous les cas.</li>
<li><b>Aucune comparaison</b> entre éléments : ce n’est pas un tri par comparaison, et il n’est donc pas soumis à la borne O(n log n) des tris par comparaison.</li>
<li><b>Limites</b> : il faut des entiers (ou des clés entières) et un vmax raisonnable devant n. Inutilisable pour des flottants ou pour des valeurs de l’ordre de 10<sup>12</sup>.</li>
</ul>
<div class="retain"><b>À retenir.</b> Comptage : O(n + vmax), sans comparaison, réservé aux entiers de petite amplitude.</div>` });

COURSE.push({ id: 'bilan', t: 'Bilan comparatif', h: `
<table class="ctable"><thead><tr><th>Tri</th><th>Meilleur cas</th><th>Cas moyen</th><th>Pire cas</th><th>Mémoire</th><th>Stable</th></tr></thead><tbody>
<tr><td>Sélection</td><td>O(n²)</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>non</td></tr>
<tr><td>Insertion</td><td>O(n)</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>oui</td></tr>
<tr><td>Fusion</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n)</td><td>oui</td></tr>
<tr><td>Rapide</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n²)</td><td>O(log n) (pile)</td><td>non</td></tr>
<tr><td>Comptage</td><td colspan="3">O(n + vmax)</td><td>O(n + vmax)</td><td>oui</td></tr></tbody></table>
<h3>Que choisir ?</h3>
<ul><li><b>Petit tableau ou presque trié</b> : insertion.</li><li><b>Cas général</b> : tri natif de Python (<code>sorted</code>, <code>sort</code>), ou fusion pour une garantie O(n log n) stable.</li><li><b>Peu de mémoire disponible</b> : tri rapide en place (avec un bon pivot).</li><li><b>Entiers de petite amplitude</b> : comptage.</li><li><b>Plusieurs critères</b> : un tri stable, appliqué du critère le moins important au plus important.</li></ul>
<div class="retain"><b>À retenir.</b> Aucun tri n’est le meilleur partout : le choix dépend de la taille, de l’état du tableau, de la mémoire, de la stabilité et de la nature des valeurs.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Tri par comparaison</dt><dd>Tri qui n’utilise que des comparaisons entre éléments.</dd>
<dt>Tri en place</dt><dd>Tri qui n’utilise qu’une mémoire supplémentaire négligeable (O(1) ou O(log n)).</dd>
<dt>Tri stable</dt><dd>Tri qui conserve l’ordre relatif des éléments de même clé.</dd>
<dt>Tri en ligne</dt><dd>Tri qui peut s’effectuer à mesure que les éléments arrivent.</dd>
<dt>Invariant de boucle</dt><dd>Propriété vraie avant chaque tour de boucle, qui prouve la correction.</dd>
<dt>Inversion</dt><dd>Paire d’indices i &lt; j telle que t[i] &gt; t[j]. Le nombre d’inversions mesure le désordre.</dd>
<dt>Pivot</dt><dd>Élément autour duquel le tri rapide partitionne le tableau.</dd>
<dt>Partition</dt><dd>Réorganisation qui place le pivot à sa position finale, les plus petits à gauche, les plus grands à droite.</dd>
<dt>Fusion</dt><dd>Construction d’une liste triée à partir de deux listes triées.</dd>
<dt>Timsort</dt><dd>Algorithme de tri de Python : stable, O(n log n) au pire, O(n) sur un tableau déjà trié.</dd>
</dl>` });

function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }

}

}
function gotoWs(id) {

  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');

  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
