<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-images-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
const WORKSHOPS = [];

/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Code Python coloré (léger) */
function codeBlock(code, on) {
  const KW = /^(def|return|for|in|if|elif|else|while|not|raise|import|from|with|as|and|or|is|lambda|class|pass|break|continue|assert|try|except|finally|yield|None)$/;
  const BI = /^(print|len|range|set|dict|list|max|min|sum|id|hash|sorted|open|str|int|float|True|False|isinstance|TypeError|ValueError|Exception|AssertionError|abs|round|min|max)$/;
  const lines = code.split('\n').map(line => {
    let out = '', i = 0;
    while (i < line.length) {
      const ch = line[i];
      if (ch === '#') { out += '<span style="color:#7a7a88;font-style:italic">' + esc(line.slice(i)) + '</span>'; break; }
      if (ch === '"' || ch === "'") { let j = i + 1; while (j < line.length && line[j] !== ch) j++; out += '<span style="color:#1c6b40">' + esc(line.slice(i, j + 1)) + '</span>'; i = j + 1; continue; }
      let j = i; while (j < line.length && line[j] !== '#' && line[j] !== '"' && line[j] !== "'") j++;
      let seg = esc(line.slice(i, j)).replace(/\b([A-Za-z_]\w*|\d+(?:\.\d+)?)\b/g, m => /^\d/.test(m) ? '<span style="color:#b05a00">' + m + '</span>' : KW.test(m) ? '<span style="color:#7c3aa8">' + m + '</span>' : BI.test(m) ? '<span style="color:#1f3fa0">' + m + '</span>' : m);
      out += seg; i = j;
    }
    return out;
  });
  return '<pre class="code">' + lines.map((l, i) => '<span style="display:block;padding:0 ' + (on === i + 1 || (Array.isArray(on) && on.includes(i + 1)) ? '10px 0 10px;background:#fff3dc;border-left:3px solid #e08a00' : '10px') + ';white-space:pre">' + (l || ' ') + '</span>').join('') + '</pre>';
}

/* ---------- Gestion des images ---------- */
const IMG_SIZE = 16; // grille de 16x16 pixels

/* Génère une image de base (dégradé + cercle) */
function makeBaseImage() {
  const img = [];
  for (let y = 0; y < IMG_SIZE; y++) {
    const row = [];
    for (let x = 0; x < IMG_SIZE; x++) {
      const dx = x - IMG_SIZE / 2 + 0.5, dy = y - IMG_SIZE / 2 + 0.5;
      const d = Math.sqrt(dx * dx + dy * dy);
      let v = 255;
      if (d < 5) v = 40;
      else if (d < 7) v = 180;
      else v = 220 - (x + y) * 3;
      row.push(clamp(v, 0, 255));
    }
    img.push(row);
  }
  return img;
}

/* Convertit une matrice en canvas */
function drawMatrix(canvas, mat, scale = 1) {
  const n = mat.length, m = mat[0].length;
  canvas.width = n * scale;
  canvas.height = m * scale;
  const ctx = canvas.getContext('2d');
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < m; j++) {
      const v = clamp(Math.round(mat[i][j]), 0, 255);
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(i * scale, j * scale, scale, scale);
    }
  }
}

/* Rotation 90° horaire */
function rotate90(mat) {
  const n = mat.length, m = mat[0].length;
  const res = Array.from({ length: m }, () => new Array(n).fill(0));
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < m; j++) {
      res[j][n - 1 - i] = mat[i][j];
    }
  }
  return res;
}

/* Réduction : moyenne de blocs de taille k */
function downsample(mat, k) {
  const n = mat.length, m = mat[0].length;
  const rn = Math.floor(n / k), rm = Math.floor(m / k);
  const res = Array.from({ length: rn }, () => new Array(rm).fill(0));
  for (let i = 0; i < rn; i++) {
    for (let j = 0; j < rm; j++) {
      let sum = 0, cnt = 0;
      for (let di = 0; di < k; di++) {
        for (let dj = 0; dj < k; dj++) {
          sum += mat[i * k + di][j * k + dj];
          cnt++;
        }
      }
      res[i][j] = Math.round(sum / cnt);
    }
  }
  return res;
}

/* Agrandissement : plus proche voisin */
function upsample(mat, k) {
  const n = mat.length, m = mat[0].length;
  const res = Array.from({ length: n * k }, () => new Array(m * k).fill(0));
  for (let i = 0; i < n * k; i++) {
    for (let j = 0; j < m * k; j++) {
      res[i][j] = mat[Math.floor(i / k)][Math.floor(j / k)];
    }
  }
  return res;
}

/* Convolution */
function convolve(mat, kernel) {
  const n = mat.length, m = mat[0].length;
  const kn = kernel.length, km = kernel[0].length;
  const kr = Math.floor(kn / 2), kc = Math.floor(km / 2);
  const res = Array.from({ length: n }, () => new Array(m).fill(0));
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < m; j++) {
      let sum = 0;
      for (let di = 0; di < kn; di++) {
        for (let dj = 0; dj < km; dj++) {
          const ni = i + di - kr, nj = j + dj - kc;
          if (ni >= 0 && ni < n && nj >= 0 && nj < m) {
            sum += mat[ni][nj] * kernel[di][dj];
          }
        }
      }
      res[i][j] = sum;
    }
  }
  return res;
}

/* ================= Atelier 1 : Rotation ================= */
const W1 = { mat: makeBaseImage() };
function mountW1(root) {
  root.innerHTML = '<h2>Rotation d\'une image</h2><p>Une image en niveaux de gris est un <b>tableau à deux dimensions</b> : <code>img[y][x]</code> donne l\'intensité (0 à 255) du pixel de coordonnées (x, y). Tourner une image revient à permuter ses lignes et ses colonnes.</p>' +
    '<div class="controls"><button class="btn pri" id="w1-rot90" type="button">Tourner 90°</button><button class="btn" id="w1-rot180" type="button">Tourner 180°</button><button class="btn" id="w1-reset" type="button">Réinitialiser</button><div class="zoom"><span>Taille des pixels</span><input type="range" id="w1-scale" min="4" max="20" value="12" style="width:100px"></div></div>' +
    '<div class="img-wrap"><div class="img-panel"><div class="img-title">Image d\'origine (16 × 16)</div><canvas id="w1-canvas-orig"></canvas></div><div class="img-panel"><div class="img-title">Image transformée</div><canvas id="w1-canvas-res"></canvas></div></div>' +
    '<div class="gstats" id="w1-stats"></div>' +
    '<h3>Principe mathématique</h3><p class="small">Pour une rotation de 90° dans le sens horaire, le pixel <code>(x, y)</code> se retrouve en <code>(H − 1 − y, x)</code> dans la nouvelle image, où <code>H</code> est la hauteur de l\'image d\'origine.</p>' +
    '<h3>Code Python</h3><div id="w1-code"></div>';
  const S = W1;
  function render() {
    const scale = parseInt($('#w1-scale').value, 10);
    drawMatrix($('#w1-canvas-orig'), S.mat, scale);
    drawMatrix($('#w1-canvas-res'), S.mat, scale);
    const n = S.mat.length, m = S.mat[0].length;
    $('#w1-stats').innerHTML = '';
    $('#w1-stats').append(stats([['Dimensions', n + ' × ' + m], ['Type de données', 'tableau 2D (listes imbriquées)'], ['Pixel [0][0]', String(S.mat[0][0])]]));
    $('#w1-code').innerHTML = codeBlock('def rotation_horaire(img):\n    n = len(img)          # hauteur\n    m = len(img[0])       # largeur\n    res = [[0] * n for _ in range(m)]\n    for i in range(n):\n        for j in range(m):\n            res[j][n - 1 - i] = img[i][j]\n    return res');
  }
  $('#w1-rot90').onclick = () => { S.mat = rotate90(S.mat); render(); };
  $('#w1-rot180').onclick = () => { S.mat = rotate90(rotate90(S.mat)); render(); };
  $('#w1-reset').onclick = () => { S.mat = makeBaseImage(); render(); };
  $('#w1-scale').oninput = render;
  render();
}
WORKSHOPS.push({ id: 'w1', title: 'Rotation', hint: 'Tourner une image revient à permuter les lignes et les colonnes du tableau 2D. Observez le pixel (0, 0) après rotation.',
  mount: mountW1, reset: () => { W1.mat = makeBaseImage(); } });

/* ================= Atelier 2 : Réduction et agrandissement ================= */
const W2 = { mat: makeBaseImage(), factor: 2 };
function mountW2(root) {
  root.innerHTML = '<h2>Réduction et agrandissement</h2><p>Une image est une matrice de pixels. Pour la <b>réduire</b>, on fusionne des blocs de k × k pixels en moyennant leur intensité (filtrage). Pour l\'<b>agrandir</b>, on duplique chaque pixel (plus proche voisin) ou on interpole.</p>' +
    '<div class="controls"><div class="zoom"><span>Facteur k</span><input type="range" id="w2-k" min="2" max="4" value="2" style="width:100px"><b id="w2-kval" style="width:20px;display:inline-block;text-align:right">2</b></div><button class="btn" id="w2-down" type="button">Réduire</button><button class="btn" id="w2-up" type="button">Agrandir</button><button class="btn" id="w2-reset" type="button">Réinitialiser</button><div class="zoom"><span>Taille des pixels</span><input type="range" id="w2-scale" min="4" max="20" value="12" style="width:100px"></div></div>' +
    '<div class="img-wrap"><div class="img-panel"><div class="img-title">Image d\'origine (16 × 16)</div><canvas id="w2-canvas-orig"></canvas></div><div class="img-panel"><div class="img-title">Image transformée</div><canvas id="w2-canvas-res"></canvas></div></div>' +
    '<div class="gstats" id="w2-stats"></div>' +
    '<h3>Principe mathématique</h3><p class="small">Réduction : chaque nouveau pixel est la moyenne des k × k pixels du bloc correspondant. Agrandissement : le pixel (i, j) de l\'image d\'origine devient un bloc de k × k pixels identiques (plus proche voisin).</p>' +
    '<h3>Code Python</h3><div id="w2-code"></div>';
  const S = W2;
  function render() {
    const scale = parseInt($('#w2-scale').value, 10);
    const k = parseInt($('#w2-k').value, 10);
    drawMatrix($('#w2-canvas-orig'), S.mat, scale);
    drawMatrix($('#w2-canvas-res'), S.mat, scale);
    const n = S.mat.length, m = S.mat[0].length;
    $('#w2-stats').innerHTML = '';
    $('#w2-stats').append(stats([['Dimensions', n + ' × ' + m], ['Pixels', String(n * m)], ['Facteur k', String(k)], ['Réduction', n % k === 0 && m % k === 0 ? 'exacte' : 'partielle']]));
    $('#w2-code').innerHTML = codeBlock('def reduire(img, k):\n    n, m = len(img), len(img[0])\n    res = [[0] * (m // k) for _ in range(n // k)]\n    for i in range(n // k):\n        for j in range(m // k):\n            total = 0\n            for di in range(k):\n                for dj in range(k):\n                    total += img[i * k + di][j * k + dj]\n            res[i][j] = total // (k * k)\n    return res\n\ndef agrandir(img, k):\n    n, m = len(img), len(img[0])\n    res = [[0] * (m * k) for _ in range(n * k)]\n    for i in range(n * k):\n        for j in range(m * k):\n            res[i][j] = img[i // k][j // k]\n    return res');
  }
  $('#w2-down').onclick = () => {
    const k = parseInt($('#w2-k').value, 10);
    if (S.mat.length % k === 0) { S.mat = downsample(S.mat, k); render(); }
    else alert('La taille de l\'image n\'est pas divisible par k = ' + k);
  };
  $('#w2-up').onclick = () => {
    const k = parseInt($('#w2-k').value, 10);
    if (S.mat.length * k <= 32) { S.mat = upsample(S.mat, k); render(); }
    else alert('Image trop grande (max 32 × 32).');
  };
  $('#w2-reset').onclick = () => { S.mat = makeBaseImage(); render(); };
  $('#w2-k').oninput = () => { $('#w2-kval').textContent = $('#w2-k').value; };
  $('#w2-scale').oninput = render;
  $('#w2-kval').textContent = '2';
  render();
}
WORKSHOPS.push({ id: 'w2', title: 'Réduction et agrandissement', hint: 'Réduire une image en moyennant des blocs k × k, l\'agrandir en dupliquant les pixels.',
  mount: mountW2, reset: () => { W2.mat = makeBaseImage(); W2.factor = 2; } });

/* ================= Atelier 3 : Convolution ================= */
const W3 = { mat: makeBaseImage(), kernel: [[1,1,1],[1,1,1],[1,1,1]], mode: 'flou' };
function mountW3(root) {
  root.innerHTML = '<h2>Convolution</h2><p>La <b>convolution</b> consiste à calculer, pour chaque pixel, une combinaison linéaire de ses voisins pondérés par un <b>noyau</b> (une petite matrice). C\'est la base du flou, du contour, du renforcement, etc.</p>' +
    '<div class="controls"><div class="zoom"><span>Préréglage</span><div id="w3-preset" style="display:flex;gap:4px"></div></div><button class="btn pri" id="w3-apply" type="button">Appliquer</button><button class="btn" id="w3-reset" type="button">Réinitialiser l\'image</button></div>' +
    '<div class="img-wrap"><div class="img-panel"><div class="img-title">Image d\'origine</div><canvas id="w3-canvas-orig"></canvas></div><div class="img-panel"><div class="img-title">Image convoluée</div><canvas id="w3-canvas-res"></canvas></div></div>' +
    '<h3>Noyau de convolution (3 × 3)</h3>' +
    '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start"><div class="kernel-grid" id="w3-kernel"></div><p class="small" style="flex:1;min-width:180px">Un noyau est une petite matrice <code>K</code> de taille impaire (3 × 3 ici). Pour chaque pixel, on calcule la somme <code>Σ K[i][j] · pixel(i, j)</code> sur le voisinage, puis on borne le résultat dans [0, 255]. La somme des coefficients d\'un noyau de flou vaut 1, celle d\'un noyau de contour vaut 0.</p></div>' +
    '<div class="gstats" id="w3-stats"></div>' +
    '<h3>Code Python</h3><div id="w3-code"></div>';
  const S = W3;
  // préréglages
  const PRESETS = {
    flou: { label: 'Flou', k: [[1/9,1/9,1/9],[1/9,1/9,1/9],[1/9,1/9,1/9]] },
    contour: { label: 'Contour', k: [[-1,-1,-1],[-1,8,-1],[-1,-1,-1]] },
    renforce: { label: 'Renforce', k: [[0,-1,0],[-1,5,-1],[0,-1,0]] },
    identite: { label: 'Identité', k: [[0,0,0],[0,1,0],[0,0,0]] }
  };
  const modeEl = $('#w3-preset');
  modeEl.innerHTML = Object.keys(PRESETS).map(k => '<button type="button" class="chip' + (S.mode === k ? ' on' : '') + '" data-k="' + k + '">' + PRESETS[k].label + '</button>').join('');
  modeEl.querySelectorAll('button').forEach(b => b.onclick = () => {
    S.mode = b.dataset.k;
    S.kernel = PRESETS[S.mode].k.map(r => r.slice());
    modeEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.k === S.mode));
    render();
  });
  function renderKernel() {
    const kg = $('#w3-kernel');
    kg.innerHTML = '';
    S.kernel.forEach((row, i) => row.forEach((v, j) => {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = v;
      inp.oninput = () => {
        const x = parseFloat(inp.value);
        if (!isNaN(x)) S.kernel[i][j] = x;
      };
      kg.appendChild(inp);
    }));
  }
  function render() {
    const scale = 12;
    drawMatrix($('#w3-canvas-orig'), S.mat, scale);
    drawMatrix($('#w3-canvas-res'), S.mat, scale);
    const n = S.mat.length;
    $('#w3-stats').innerHTML = '';
    let sum = 0;
    S.kernel.forEach(r => r.forEach(v => sum += v));
    const desc = S.mode === 'flou' ? 'Somme = 1 : conserve la luminosité moyenne.' :
                 S.mode === 'contour' ? 'Somme = 0 : détecte les variations brusques.' :
                 S.mode === 'renforce' ? 'Somme = 1 : accentue les détails.' :
                 'Somme = 1 : identité (l\'image ne change pas).';
    $('#w3-stats').append(stats([['Taille', n + ' × ' + n], ['Somme du noyau', sum.toFixed(2)], ['Noyau', S.mode], ['Remarque', desc]]));
    $('#w3-code').innerHTML = codeBlock('def convoluer(img, noyau):\n    n, m = len(img), len(img[0])\n    kn, km = len(noyau), len(noyau[0])\n    kr, kc = kn // 2, km // 2\n    res = [[0] * m for _ in range(n)]\n    for i in range(n):\n        for j in range(m):\n            total = 0\n            for di in range(kn):\n                for dj in range(km):\n                    ni, nj = i + di - kr, j + dj - kc\n                    if 0 <= ni < n and 0 <= nj < m:\n                        total += img[ni][nj] * noyau[di][dj]\n            res[i][j] = max(0, min(255, int(total)))\n    return res');
    renderKernel();
  }
  $('#w3-apply').onclick = () => {
    const res = convolve(S.mat, S.kernel);
    for (let i = 0; i < res.length; i++) for (let j = 0; j < res[i].length; j++) res[i][j] = clamp(Math.round(res[i][j]), 0, 255);
    drawMatrix($('#w3-canvas-res'), res, 12);
    S.mat = res; // on garde l'image transformée pour les applications successives
    render();
  };
  $('#w3-reset').onclick = () => { S.mat = makeBaseImage(); render(); };
  S.kernel = PRESETS[S.mode].k.map(r => r.slice());
  render();
}
WORKSHOPS.push({ id: 'w3', title: 'Convolution', hint: 'Appliquer un noyau de convolution (flou, contour, renforcement) à une image, comprendre l\'effet des coefficients.',
  mount: mountW3, reset: () => { W3.mat = makeBaseImage(); W3.kernel = [[1/9,1/9,1/9],[1/9,1/9,1/9],[1/9,1/9,1/9]]; W3.mode = 'flou'; } });

/* ================= Atelier 4 : Matrices comme tableaux 2D ================= */
const W4 = { mat: [[1,2,3],[4,5,6],[7,8,9]] };
function mountW4(root) {
  root.innerHTML = '<h2>Manipulations de tableaux à deux dimensions</h2><p>Une image est un tableau 2D. On peut accéder à un pixel par <code>img[y][x]</code>, modifier sa valeur, parcourir les lignes et les colonnes. Voici quelques manipulations de base.</p>' +
    '<div class="opts"><label class="fld"><span>Matrice (nombres séparés par des espaces, une ligne par ligne)</span><textarea id="w4-mat" class="mono" rows="4" style="width:260px"></textarea></label></div>' +
    '<div class="controls"><button class="btn pri" id="w4-apply" type="button">Appliquer</button><button class="btn" id="w4-identity" type="button">Matrice identité 5×5</button><button class="btn" id="w4-random" type="button">Aléatoire 5×5</button></div>' +
    '<div id="w4-out"></div>' +
    '<h3>Code Python</h3><div id="w4-code"></div>';
  const S = W4;
  $('#w4-mat').value = S.mat.map(r => r.join(' ')).join('\n');
  function parseMat(txt) {
    const rows = txt.trim().split('\n').map(l => l.trim().split(/\s+/).map(Number).filter(n => !isNaN(n)));
    if (!rows.length || !rows[0].length) return null;
    const m = rows[0].length;
    if (rows.some(r => r.length !== m)) return null;
    return rows;
  }
  function render() {
    const mat = S.mat, n = mat.length, m = mat[0].length;
    let html = '<h3>Matrice</h3><table class="mat-table">';
    for (let i = 0; i < n; i++) {
      html += '<tr>';
      for (let j = 0; j < m; j++) {
        const v = mat[i][j];
        const bg = 'rgb(' + clamp(v, 0, 255) + ',' + clamp(v, 0, 255) + ',' + clamp(v, 0, 255) + ')';
        const col = v > 128 ? '#000' : '#fff';
        html += '<td style="background:' + bg + ';color:' + col + ';font-weight:600">' + v + '</td>';
      }
      html += '</tr>';
    }
    html += '</table>';
    html += '<div class="gstats">' + [
      ['Dimensions', n + ' × ' + m],
      ['Nombre de pixels', String(n * m)],
      ['Minimum', String(Math.min(...mat.flat()))],
      ['Maximum', String(Math.max(...mat.flat()))]
    ].map(([k, v]) => '<div class="stat"><span>' + k + '</span><b>' + v + '</b></div>').join('') + '</div>';
    html += '<h3>Manipulations</h3><ul style="line-height:1.7">' +
      '<li><b>Accès :</b> <code>img[2][3]</code> lit la ligne 2, colonne 3 (attention à l\'ordre).</li>' +
      '<li><b>Parcours :</b> deux boucles imbriquées, l\'une sur les lignes, l\'autre sur les colonnes.</li>' +
      '<li><b>Transposée :</b> <code>t[i][j] = img[j][i]</code>.</li>' +
      '<li><b>Symétrie horizontale :</b> <code>t[i][j] = img[i][m-1-j]</code>.</li>' +
      '<li><b>Symétrie verticale :</b> <code>t[i][j] = img[n-1-i][j]</code>.</li>' +
      '</ul>';
    html += '<h3>Exemple : transposée</h3><table class="mat-table">';
    const tr = mat[0].map((_, j) => mat.map(r => r[j]));
    for (let i = 0; i < tr.length; i++) {
      html += '<tr>';
      for (let j = 0; j < tr[0].length; j++) {
        const v = tr[i][j];
        const bg = 'rgb(' + clamp(v, 0, 255) + ',' + clamp(v, 0, 255) + ',' + clamp(v, 0, 255) + ')';
        const col = v > 128 ? '#000' : '#fff';
        html += '<td style="background:' + bg + ';color:' + col + ';font-weight:600">' + v + '</td>';
      }
      html += '</tr>';
    }
    html += '</table>';
    $('#w4-out').innerHTML = html;
    $('#w4-code').innerHTML = codeBlock('img = [[1, 2, 3],\n       [4, 5, 6],\n       [7, 8, 9]]\n\nprint(img[1][2])   # 6\n\n# Transposée\nt = [[img[i][j] for i in range(len(img))]\n     for j in range(len(img[0]))]\n\n# Parcours de tous les pixels\nfor i in range(len(img)):\n    for j in range(len(img[i])):\n        img[i][j] = img[i][j] // 2');
  }
  $('#w4-apply').onclick = () => {
    const mat = parseMat($('#w4-mat').value);
    if (!mat) { alert('Format invalide : chaque ligne doit avoir le même nombre de nombres.'); return; }
    S.mat = mat;
    render();
  };
  $('#w4-identity').onclick = () => {
    S.mat = Array.from({ length: 5 }, (_, i) => Array.from({ length: 5 }, (_, j) => i === j ? 1 : 0));
    $('#w4-mat').value = S.mat.map(r => r.join(' ')).join('\n');
    render();
  };
  $('#w4-random').onclick = () => {
    S.mat = Array.from({ length: 5 }, () => Array.from({ length: 5 }, () => Math.floor(Math.random() * 256)));
    $('#w4-mat').value = S.mat.map(r => r.join(' ')).join('\n');
    render();
  };
  render();
}
WORKSHOPS.push({ id: 'w4', title: 'Tableaux 2D', hint: 'Manipuler des matrices : accès, parcours, transposée, symétries.',
  mount: mountW4, reset: () => { W4.mat = [[1,2,3],[4,5,6],[7,8,9]]; } });

const COURSE = [];
COURSE.push({ id: 'rotation', t: 'Rotation d\'image', h: `
<p>Une image en niveaux de gris est un <b>tableau à deux dimensions</b> de valeurs entre 0 (noir) et 255 (blanc). On accède à un pixel par <code>img[y][x]</code>.</p>
<h3>Rotation de 90° (sens horaire)</h3>
<p>Le pixel (i, j) se retrouve en (j, n − 1 − i), où n est la hauteur de l'image d'origine.</p>
<pre class="code">def rotation_horaire(img):
    n = len(img)          # hauteur
    m = len(img[0])       # largeur
    res = [[0] * n for _ in range(m)]
    for i in range(n):
        for j in range(m):
            res[j][n - 1 - i] = img[i][j]
    return res</pre>
<p>Les dimensions sont <b>échangées</b> : une image n × m devient m × n. Le coût est O(n × m), soit un parcours de tous les pixels.</p>
<h3>Autres rotations</h3>
<ul><li>180° : appliquer deux fois la rotation de 90°, ou <code>res[i][j] = img[n-1-i][m-1-j]</code>.</li><li>−90° (270°) : appliquer trois fois la rotation de 90°.</li></ul>
<div class="retain"><b>À retenir.</b> Tourner une image revient à permuter les indices de son tableau 2D.</div>` });

COURSE.push({ id: 'resize', t: 'Réduction et agrandissement', h: `
<h3>Réduction</h3>
<p>Pour réduire une image par un facteur k, on fusionne chaque bloc de k × k pixels en un seul pixel, en prenant la <b>moyenne</b> (filtrage) :</p>
<pre class="code">def reduire(img, k):
    n, m = len(img), len(img[0])
    res = [[0] * (m // k) for _ in range(n // k)]
    for i in range(n // k):
        for j in range(m // k):
            total = 0
            for di in range(k):
                for dj in range(k):
                    total += img[i * k + di][j * k + dj]
            res[i][j] = total // (k * k)
    return res</pre>
<p>Le moyennage évite l'effet d'escalier (aliasing) qu'on obtiendrait en prenant un pixel sur k.</p>
<h3>Agrandissement</h3>
<p>Pour agrandir, on duplique chaque pixel k fois dans chaque direction (plus proche voisin) :</p>
<pre class="code">def agrandir(img, k):
    n, m = len(img), len(img[0])
    res = [[0] * (m * k) for _ in range(n * k)]
    for i in range(n * k):
        for j in range(m * k):
            res[i][j] = img[i // k][j // k]
    return res</pre>
<h3>Comparaison</h3>
<table class="ctable"><thead><tr><th>Opération</th><th>Coût</th><th>Remarque</th></tr></thead><tbody>
<tr><td>Réduction par k</td><td>O(n × m)</td><td>Chaque pixel lu une fois</td></tr>
<tr><td>Agrandissement par k</td><td>O(n × m × k²)</td><td>Chaque pixel dupliqué k² fois</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Réduction par moyennage, agrandissement par duplication. La taille est divisée ou multipliée par k dans chaque dimension.</div>` });

COURSE.push({ id: 'convolution', t: 'Convolution', h: `
<p>La <b>convolution</b> est une opération qui combine chaque pixel avec ses voisins pondérés par un <b>noyau</b> (petite matrice). C'est la base du flou, du contour, du renforcement.</p>
<h3>Principe</h3>
<p>Pour chaque pixel (i, j), on calcule :</p>
<div class="formula">résultat(i, j) = Σ<sub>di, dj</sub> noyau(di, dj) × img(i + di − r, j + dj − r)</div>
<p>où r = ⌊taille / 2⌋. Le résultat est borné dans [0, 255].</p>
<h3>Code</h3>
<pre class="code">def convoluer(img, noyau):
    n, m = len(img), len(img[0])
    kn, km = len(noyau), len(noyau[0])
    kr, kc = kn // 2, km // 2
    res = [[0] * m for _ in range(n)]
    for i in range(n):
        for j in range(m):
            total = 0
            for di in range(kn):
                for dj in range(km):
                    ni, nj = i + di - kr, j + dj - kc
                    if 0 <= ni < n and 0 <= nj < m:
                        total += img[ni][nj] * noyau[di][dj]
            res[i][j] = max(0, min(255, int(total)))
    return res</pre>
<h3>Noyaux classiques</h3>
<table class="ctable"><thead><tr><th>Effet</th><th>Noyau 3 × 3</th><th>Somme</th></tr></thead><tbody>
<tr><td>Flou</td><td>1/9 partout</td><td>1</td></tr>
<tr><td>Contour</td><td>−1 partout, 8 au centre</td><td>0</td></tr>
<tr><td>Renforcement</td><td>0 en coins, −1 en croix, 5 au centre</td><td>1</td></tr>
<tr><td>Identité</td><td>1 au centre, 0 ailleurs</td><td>1</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> La convolution combine un pixel et ses voisins. La somme du noyau détermine l'effet : 1 = conserve la luminosité, 0 = contours.</div>` });

COURSE.push({ id: 'manip', t: 'Tableaux 2D', h: `
<h3>Création et accès</h3>
<pre class="code">img = [[1, 2, 3],
       [4, 5, 6],
       [7, 8, 9]]

print(img[1][2])   # 6 (ligne 1, colonne 2)
img[0][0] = 255    # modification d'un pixel</pre>
<h3>Parcours</h3>
<pre class="code">for i in range(len(img)):
    for j in range(len(img[i])):
        img[i][j] = img[i][j] // 2</pre>
<h3>Transposée, symétries</h3>
<table class="ctable"><thead><tr><th>Opération</th><th>Formule</th></tr></thead><tbody>
<tr><td>Transposée</td><td><code>t[i][j] = img[j][i]</code></td></tr>
<tr><td>Symétrie horizontale</td><td><code>t[i][j] = img[i][m-1-j]</code></td></tr>
<tr><td>Symétrie verticale</td><td><code>t[i][j] = img[n-1-i][j]</code></td></tr>
</tbody></table>
<h3>Dimensions</h3>
<p>La hauteur est <code>len(img)</code>, la largeur <code>len(img[0])</code>. Une image rectangulaire a un nombre de lignes différent du nombre de colonnes.</p>
<div class="retain"><b>À retenir.</b> Un tableau 2D se manipule avec deux indices : ligne puis colonne. Les transformations (rotation, symétrie, transposée) sont des permutations de ces indices.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Pixel</dt><dd>Élément d'une image, porteur d'une intensité (en niveaux de gris) ou d'une couleur.</dd>
<dt>Matrice</dt><dd>Tableau à deux dimensions : lignes et colonnes.</dd>
<dt>Niveaux de gris</dt><dd>Valeur entre 0 (noir) et 255 (blanc).</dd>
<dt>Réduction</dt><dd>Diminution de la taille d'une image, par moyennage de blocs.</dd>
<dt>Agrandissement</dt><dd>Augmentation de la taille d'une image, par duplication de pixels.</dd>
<dt>Convolution</dt><dd>Combinaison linéaire d'un pixel avec ses voisins pondérés par un noyau.</dd>
<dt>Noyau</dt><dd>Petite matrice de coefficients utilisée pour la convolution.</dd>
<dt>Flou</dt><dd>Effet obtenu avec un noyau de moyennage.</dd>
<dt>Contour</dt><dd>Effet obtenu avec un noyau de dérivation (somme 0).</dd>
<dt>Transposée</dt><dd>Échange des lignes et des colonnes d'une matrice.</dd>
<dt>Aliasing</dt><dd>Effet d'escalier produit par un sous-échantillonnage brutal.</dd>
</dl>` });
