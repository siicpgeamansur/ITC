<style>
/* Mise en page : barre d'outils en haut, onglets d'ateliers, zone de travail blanche, panneau Activité à droite (feuille basse sur téléphone), vue Cours avec sommaire. */

}

/* Carte « principe » */

@media (max-width:820px){

  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-glouton-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
const WORKSHOPS = [];

/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Code Python coloré (léger) */
function codeBlock(code, on) {
  const KW = /^(def|return|for|in|if|elif|else|while|not|raise|import|from|with|as|and|or|is|lambda|class|pass|break|continue|assert|try|except|finally|yield|None)$/;
  const BI = /^(print|len|range|set|dict|list|max|min|sum|id|hash|sorted|open|str|int|float|True|False|isinstance|TypeError|ValueError|Exception|AssertionError|abs|round|min|max)$/;
  const lines = code.split('\n').map(line => {
    let out = '', i = 0;
    while (i < line.length) {
      const ch = line[i];
      if (ch === '#') { out += '<span style="color:#7a7a88;font-style:italic">' + esc(line.slice(i)) + '</span>'; break; }
      if (ch === '"' || ch === "'") { let j = i + 1; while (j < line.length && line[j] !== ch) j++; out += '<span style="color:#1c6b40">' + esc(line.slice(i, j + 1)) + '</span>'; i = j + 1; continue; }
      let j = i; while (j < line.length && line[j] !== '#' && line[j] !== '"' && line[j] !== "'") j++;
      let seg = esc(line.slice(i, j)).replace(/\b([A-Za-z_]\w*|\d+(?:\.\d+)?)\b/g, m => /^\d/.test(m) ? '<span style="color:#b05a00">' + m + '</span>' : KW.test(m) ? '<span style="color:#7c3aa8">' + m + '</span>' : BI.test(m) ? '<span style="color:#1f3fa0">' + m + '</span>' : m);
      out += seg; i = j;
    }
    return out;
  });
  return '<pre class="code">' + lines.map((l, i) => '<span style="display:block;padding:0 ' + (on === i + 1 || (Array.isArray(on) && on.includes(i + 1)) ? '10px 0 10px;background:#fff3dc;border-left:3px solid #e08a00' : '10px') + ';white-space:pre">' + (l || ' ') + '</span>').join('') + '</pre>';
}

/* --- Carte « principe » affichée en tête de chaque atelier --- */
function renderPrincipe() {
  return h('div', { class: 'principe' },
    h('b', null, 'Principe du glouton'),
    h('p', { html: 'Un algorithme <b>glouton</b> fait à chaque étape le choix qui paraît <b>localement le meilleur</b>, sans jamais revenir en arrière. Il est <b>rapide</b> (souvent O(n log n)) mais <b>pas toujours optimal</b> : il faut soit le <b>démontrer</b> (argument d\'échange), soit exhiber un <b>contre-exemple</b>.' }),
    h('p', { html: '<b>Trois conditions :</b> un critère glouton bien choisi · une sous-structure optimale (le reste du problème est du même type) · un argument d\'échange (un choix glouton peut remplacer un choix optimal).' })
  );
}

/* ================= Atelier 1 : Rendu de monnaie ================= */
const W1 = { coins: [1, 2, 5, 10], amount: 11 };
function mountW1(root) {
  root.innerHTML = '<h2>Rendu de monnaie</h2><p>On veut rendre une somme avec le minimum de pièces. L\'algorithme <b>glouton</b> choisit toujours la plus grande pièce possible. Est-ce toujours optimal ?</p>' +
    '<div class="opts"><label class="fld"><span>Pièces (séparées par des virgules)</span><input type="text" id="w1-coins" class="mono" value="1, 2, 5, 10"></label><label class="fld"><span>Somme S</span><input type="number" id="w1-amount" value="11" style="width:80px"></label></div>' +
    '<div id="w1-out"></div>' +
    '<h3>Code Python</h3><pre class="code">def rendu_glouton(coins, S):\n    coins = sorted(coins, reverse=True)\n    res = []\n    for c in coins:\n        while S >= c:\n            res.append(c)\n            S -= c\n    return res  # optimal seulement pour certains systèmes</pre>';
  function render() {
    const coins = $('#w1-coins').value.split(',').map(s => parseInt(s.trim(), 10)).filter(x => isFinite(x) && x > 0);
    const amount = parseInt($('#w1-amount').value, 10);
    if (!coins.length || !isFinite(amount) || amount < 0) { $('#w1-out').innerHTML = '<p class="verdict no">Entrée invalide.</p>'; return; }
    const sorted = coins.slice().sort((a, b) => b - a);
    let r = amount, used = [];
    for (const c of sorted) { while (r >= c) { used.push(c); r -= c; } }
    const gOk = r === 0;
    const dp = new Array(amount + 1).fill(Infinity); dp[0] = 0;
    const choice = new Array(amount + 1).fill(-1);
    for (let s = 1; s <= amount; s++) {
      for (const c of coins) {
        if (c <= s && dp[s - c] + 1 < dp[s]) { dp[s] = dp[s - c] + 1; choice[s] = c; }
      }
    }
    let r2 = amount, opt = [];
    while (r2 > 0 && choice[r2] > 0) { opt.push(choice[r2]); r2 -= choice[r2]; }
    const optOk = dp[amount] !== Infinity;
    let html = '<h3>Comparaison</h3><div class="dwrap"><table class="dt"><thead><tr><th>Méthode</th><th>Résultat</th><th>Nombre de pièces</th></tr></thead><tbody>' +

        byRoom[r].forEach(c => {
          const left = ((c.start - minT) * scale).toFixed(1) + '%';
          const width = ((c.end - c.start) * scale).toFixed(1) + '%';
          html += '<div class="tl-block" style="left:' + left + ';width:' + width + ';background:' + colors[(parseInt(r)) % colors.length] + '">' + c.id + '</div>';
        });
        html += '</div></div>';
      });
      html += '</div>';
      html += '<h3>Résultat</h3><p class="verdict yes">Le glouton utilise <b>' + rooms.length + ' salle' + (rooms.length > 1 ? 's' : '') + '</b>.</p>';
      html += '<p class="small">C\'est le minimum possible : à l\'heure de pointe, le nombre de cours simultanés est de ' + rooms.length + '. Aucune allocation ne peut faire mieux.</p>';
      html += '<div class="dwrap"><table class="dt"><thead><tr><th>Cours</th><th>Début</th><th>Fin</th><th>Salle</th></tr></thead><tbody>';
      courses.forEach(c => { html += '<tr><td>' + c.id + '</td><td class="m">' + c.start + ' h</td><td class="m">' + c.end + ' h</td><td>Salle ' + (result.aff[c.id] + 1) + '</td></tr>'; });

/* ================= Atelier 4 : Sac à dos ================= */
const W4 = { mode: 'fractionnaire' };
const ITEMS = [
  { name: 'A', w: 10, v: 60 },
  { name: 'B', w: 20, v: 100 },
  { name: 'C', w: 30, v: 120 }
];
const CAP = 50;
function mountW4(root) {
  root.innerHTML = '<h2>Sac à dos</h2><p>On a des objets avec un poids et une valeur, et un sac de capacité limitée. On veut maximiser la valeur totale. Le glouton (tri par valeur/poids décroissant) est <b>optimal</b> pour le sac à dos <b>fractionnaire</b> (objets divisibles), mais <b>pas</b> pour le sac à dos <b>0/1</b> (objets entiers).</p>' +
    '<div class="controls"><div class="chip-group" style="display:flex;gap:6px"><button class="chip' + (W4.mode === 'fractionnaire' ? ' on' : '') + '" data-mode="fractionnaire" type="button">Fractionnaire</button><button class="chip' + (W4.mode === '01' ? ' on' : '') + '" data-mode="01" type="button">0/1</button></div><button class="btn pri" id="w4-run" type="button">Résoudre</button></div>' +
    '<div id="w4-out"></div>' +
    '<h3>Code Python (fractionnaire)</h3><pre class="code">def sac_fractionnaire(objets, capacite):\n    # tri par valeur/poids décroissant\n    objets = sorted(objets, key=lambda o: o[1] / o[0], reverse=True)\n    valeur = 0\n    choisis = []\n    for poids, val in objets:\n        if capacite >= poids:\n            valeur += val\n            choisis.append((poids, val, 1.0))\n            capacite -= poids\n        else:\n            fraction = capacite / poids\n            valeur += val * fraction\n            choisis.append((poids, val, fraction))\n            break\n    return valeur, choisis</pre>';
  root.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    W4.mode = b.dataset.mode;
    root.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.mode === W4.mode));
    render(null);
  });
  function render(result) {
    let html = '<h3>Objets</h3><div class="knap-items">';
    ITEMS.forEach(o => {
      const sel = result && result.taken && result.taken.includes(o.name);
      html += '<div class="knap-item' + (sel ? ' taken' : '') + '"><div class="vw">' + o.name + '</div><div class="small">poids ' + o.w + ', valeur ' + o.v + '</div><div class="small">v/p = ' + (o.v / o.w).toFixed(2) + '</div></div>';
    });
    html += '</div><p class="small">Capacité du sac : <b>' + CAP + '</b>.</p>';
    if (!result) {
      html += '<p class="verdict">Choisissez un mode et cliquez sur « Résoudre ».</p>';
    } else {
      html += '<h3>Résultat glouton (' + W4.mode + ')</h3>';
      html += '<p class="verdict ' + (result.optimal ? 'yes' : 'no') + '">Valeur totale : <b>' + result.value.toFixed(1) + '</b>.</p>';
      html += '<p class="small">' + result.explanation + '</p>';
      if (result.optValue !== undefined) {
        html += '<p class="small">Valeur optimale (DP) : <b>' + result.optValue + '</b>.</p>';
      }
    }
    html += '<h3>Pourquoi le glouton échoue en 0/1 ?</h3><p class="small">Exemple : objets {A: poids 10, valeur 60}, {B: poids 20, valeur 100}, {C: poids 30, valeur 120}, capacité 50. Le glouton prend A puis B (160), il reste 20 → impossible de prendre C (30). La solution optimale est B + C = 220. Le glouton ne peut pas « défaire » son choix.</p>';
    $('#w4-out').innerHTML = html;
  }
  $('#w4-run').onclick = () => {
    const sorted = ITEMS.slice().sort((a, b) => (b.v / b.w) - (a.v / a.w));
    if (W4.mode === 'fractionnaire') {
      let cap = CAP, val = 0, taken = [];
      for (const o of sorted) {
        if (cap >= o.w) { val += o.v; taken.push(o.name); cap -= o.w; }
        else { val += o.v * (cap / o.w); taken.push(o.name); cap = 0; break; }
      }
      render({ value: val, taken, optimal: true, explanation: 'Les objets sont divisibles : le glouton est optimal.' });
    } else {
      let cap = CAP, val = 0, taken = [];
      for (const o of sorted) {
        if (cap >= o.w) { val += o.v; taken.push(o.name); cap -= o.w; }
      }
      const n = ITEMS.length;
      const dp = Array.from({ length: n + 1 }, () => new Array(CAP + 1).fill(0));
      for (let i = 1; i <= n; i++) {
        for (let c = 0; c <= CAP; c++) {
          dp[i][c] = dp[i - 1][c];
          if (ITEMS[i - 1].w <= c) dp[i][c] = Math.max(dp[i][c], dp[i - 1][c - ITEMS[i - 1].w] + ITEMS[i - 1].v);
        }
      }
      const optValue = dp[n][CAP];
      const optimal = Math.abs(val - optValue) < 1e-9;
      render({ value: val, taken, optimal, optValue, explanation: 'Les objets sont entiers : le glouton ne trouve pas toujours l\'optimum.' });
    }
  };
  render(null);
}

<h3>Définition</h3>
<p>Un <b>algorithme glouton</b> construit une solution <b>pas à pas</b> : à chaque étape, il fait le choix qui paraît <b>localement le meilleur</b>, sans jamais revenir en arrière. C'est un algorithme <b>rapide</b> (souvent O(n log n) après un tri, ou O(n)), mais qui n'est <b>pas toujours optimal</b>.</p>
<h3>Trois conditions à vérifier</h3>
<ol>
<li><b>Critère glouton</b> : on doit pouvoir décider localement quel est le meilleur choix. Par exemple : « prendre la plus grande pièce », « prendre l'activité qui finit le plus tôt », « prendre l'objet de plus grand ratio valeur/poids ».</li>
<li><b>Sous-structure optimale</b> : une solution optimale du problème contient une solution optimale du sous-problème restant. C'est ce qui rend la démonstration possible.</li>
<li><b>Argument d'échange</b> : on peut toujours remplacer un choix d'une solution optimale par le choix glouton, sans dégrader la solution. C'est la preuve d'optimalité.</li>
</ol>
<h3>Quand le glouton échoue</h3>
<p>Si l'on ne peut pas prouver l'optimalité, il faut chercher un <b>contre-exemple</b>. Exemple : rendu de monnaie avec les pièces {1, 3, 4} et la somme 6.</p>
<ul>
<li>Glouton : 4 + 1 + 1 = 6 (3 pièces).</li>
<li>Optimal : 3 + 3 = 6 (2 pièces).</li>
</ul>
<p>Le glouton ne peut pas revenir sur son choix initial.</p>
<h3>Glouton vs autres approches</h3>
<table class="ctable"><thead><tr><th>Approche</th><th>Principe</th><th>Complexité</th><th>Optimalité</th></tr></thead><tbody>
<tr><td>Glouton</td><td>Choix local optimal</td><td>Rapide (O(n log n))</td><td>Pas toujours</td></tr>
<tr><td>Diviser pour régner</td><td>Décomposer en sous-problèmes</td><td>Souvent O(n log n)</td><td>Souvent (avec preuve)</td></tr>
<tr><td>Programmation dynamique</td><td>Résoudre tous les sous-problèmes</td><td>Plus lent (O(n²), O(nW)…)</td><td>Toujours (par construction)</td></tr>
<tr><td>Recherche exhaustive</td><td>Essayer toutes les solutions</td><td>Très lent (exponentiel)</td><td>Toujours</td></tr>
</tbody></table>
<h3>Comment choisir le critère glouton ?</h3>
<p>Il n'y a pas de recette universelle : il faut <b>comprendre la structure du problème</b> pour trouver le critère qui rend le choix local compatible avec un optimum global. Les quatre ateliers de cette page illustrent quatre critères différents :</p>
<ul>
<li><b>Rendu de monnaie</b> : plus grande pièce possible.</li>
<li><b>Sélection d'activités</b> : activité qui finit le plus tôt.</li>
<li><b>Allocation de salles</b> : heure de début croissante.</li>
<li><b>Sac à dos</b> : plus grand ratio valeur/poids.</li>
</ul>
<div class="retain"><b>À retenir.</b> Le glouton est rapide mais son optimalité doit être <b>démontrée</b> (argument d'échange) ou <b>réfutée</b> (contre-exemple).</div>` });

<h3>Principe</h3>
<p>On a n objets, chacun avec un poids et une valeur. Le sac a une capacité limitée. On veut maximiser la valeur totale.</p>
<h3>Sac fractionnaire</h3>
<p>Les objets sont divisibles. On trie par <b>valeur/poids décroissant</b> et on remplit le sac.</p>
<pre class="code">def sac_fractionnaire(objets, capacite):
    objets = sorted(objets, key=lambda o: o[1] / o[0], reverse=True)
    valeur = 0
    for poids, val in objets:
        if capacite >= poids:
            valeur += val
            capacite -= poids
        else:
            valeur += val * (capacite / poids)
            break
    return valeur</pre>
<p>Le glouton est <b>optimal</b> : on peut toujours remplir exactement le sac, et le choix local ne bloque pas de meilleur choix global.</p>
<h3>Sac 0/1</h3>
<p>Les objets sont indivisibles. Le glouton (valeur/poids) n'est <b>pas optimal</b> :</p>
<ul>
<li>A : poids 10, valeur 60 (ratio 6)</li>
<li>B : poids 20, valeur 100 (ratio 5)</li>
<li>C : poids 30, valeur 120 (ratio 4)</li>
</ul>
<p>Capacité 50. Glouton : A + B = 160. Optimal : B + C = 220.</p>
<p>Le sac 0/1 se résout par programmation dynamique en O(n × capacité).</p>
<div class="retain"><b>À retenir.</b> Fractionnaire : glouton optimal. 0/1 : glouton faux, DP optimale.</div>` });

    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : algorithmes gloutons'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Quatre ateliers sur les algorithmes gloutons (ITC, CPGE 1re année) : rendu de monnaie, sélection d\'activités, allocation de salles, sac à dos.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> détaille chaque partie ; la première section présente le <b>principe du glouton</b>.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
