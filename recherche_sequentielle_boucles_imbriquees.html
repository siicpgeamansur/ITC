<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-recherche-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
const WORKSHOPS = [];

/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Code Python coloré (léger) */
function codeBlock(code, on) {
  const KW = /^(def|return|for|in|if|elif|else|while|not|raise|import|from|with|as|and|or|is|lambda|class|pass|break|continue|assert|try|except|finally|yield|None)$/;
  const BI = /^(print|len|range|set|dict|list|max|min|sum|id|hash|sorted|open|str|int|float|True|False|isinstance|TypeError|ValueError|Exception|AssertionError|abs|round|min|max)$/;
  const lines = code.split('\n').map(line => {
    let out = '', i = 0;
    while (i < line.length) {
      const ch = line[i];
      if (ch === '#') { out += '<span style="color:#7a7a88;font-style:italic">' + esc(line.slice(i)) + '</span>'; break; }
      if (ch === '"' || ch === "'") { let j = i + 1; while (j < line.length && line[j] !== ch) j++; out += '<span style="color:#1c6b40">' + esc(line.slice(i, j + 1)) + '</span>'; i = j + 1; continue; }
      let j = i; while (j < line.length && line[j] !== '#' && line[j] !== '"' && line[j] !== "'") j++;
      let seg = esc(line.slice(i, j)).replace(/\b([A-Za-z_]\w*|\d+(?:\.\d+)?)\b/g, m => /^\d/.test(m) ? '<span style="color:#b05a00">' + m + '</span>' : KW.test(m) ? '<span style="color:#7c3aa8">' + m + '</span>' : BI.test(m) ? '<span style="color:#1f3fa0">' + m + '</span>' : m);
      out += seg; i = j;
    }
    return out;
  });
  return '<pre class="code">' + lines.map((l, i) => '<span style="display:block;padding:0 ' + (on === i + 1 || (Array.isArray(on) && on.includes(i + 1)) ? '10px 0 10px;background:#fff3dc;border-left:3px solid #e08a00' : '10px') + ';white-space:pre">' + (l || ' ') + '</span>').join('') + '</pre>';
}

/* ================= Atelier 1 : Recherche séquentielle ================= */
const W1 = { arr: [4, 8, 15, 16, 23, 42], target: 15, mode: 'search', step: 0, frames: null, timer: null };
function mountW1(root) {
  root.innerHTML = '<h2>Recherche séquentielle</h2><p>La recherche séquentielle (ou linéaire) parcourt le tableau élément par élément. C\'est la méthode la plus simple pour chercher une valeur, un maximum, ou le second maximum.</p>' +
    '<div class="opts"><div class="fld"><span>Opération</span><div id="w1-mode"></div></div><label class="fld"><span>Élément recherché</span><input type="number" id="w1-target" value="15" style="width:80px"></label></div>' +
    '<div class="cells" id="w1-arr"></div>' +
    '<div class="files" style="margin:8px 0"><button class="btn" id="w1-prev" type="button">◀ Précédent</button><button class="btn pri" id="w1-next" type="button">Suivant ▶</button><button class="btn" id="w1-play" type="button">Lecture</button><button class="btn" id="w1-reset" type="button">Départ</button></div>' +
    '<div class="gstats" id="w1-stats"></div>' +
    '<div class="verdict" id="w1-msg" aria-live="polite"></div>' +
    '<h3>Code Python</h3><div id="w1-code"></div>';
  const S = W1;
  $('#w1-mode').append(chipsRow([['search', 'Recherche'], ['max', 'Maximum'], ['second', 'Second max']], S.mode, v => { S.mode = v; S.frames = null; S.step = 0; stop(); render(); }, 'Opération'));
  function stop() { if (S.timer) { clearInterval(S.timer); S.timer = null; } const b = $('#w1-play'); if (b) b.textContent = 'Lecture'; }
  function buildFrames() {
    const arr = S.arr, frames = [];
    if (S.mode === 'search') {
      const t = S.target;
      let found = false;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] === t) { frames.push({ i, max: null, second: null, found: true, msg: 'arr[' + i + '] = ' + arr[i] + ' : trouvé !' }); found = true; break; }
        frames.push({ i, max: null, second: null, found: false, msg: 'arr[' + i + '] = ' + arr[i] + ' ≠ ' + t + ' : on continue.' });
      }
      if (!found) frames.push({ i: null, max: null, second: null, found: false, msg: t + ' absent (parcours complet).' });

const COURSE = [];
COURSE.push({ id: 'recherche', t: 'Recherche séquentielle', h: `
<p>La <b>recherche séquentielle</b> (ou recherche linéaire) parcourt un tableau élément par élément.</p>
<h3>Recherche d'un élément</h3>
<pre class="code">def recherche(arr, x):
    for i in range(len(arr)):
        if arr[i] == x:
            return i
    return -1</pre>
<p>Complexité : <b>O(n)</b> dans le pire cas. O(1) si l'élément est en tête.</p>
<h3>Recherche du maximum</h3>
<pre class="code">def maximum(arr):
    max = arr[0]
    for i in range(1, len(arr)):
        if arr[i] > max:
            max = arr[i]
    return max</pre>
<p>Complexité : n − 1 comparaisons, soit O(n).</p>
<h3>Recherche du second maximum</h3>
<pre class="code">def second_max(arr):
    max, second = -float("inf"), -float("inf")
    for x in arr:
        if x > max:
            second = max
            max = x
        elif x > second and x != max:
            second = x
    return second</pre>
<p>Complexité : O(n). On maintient deux variables.</p>
<div class="retain"><b>À retenir.</b> La recherche séquentielle est en O(n). Elle s'applique à des tableaux non triés.</div>` });

COURSE.push({ id: 'comptage', t: 'Comptage avec un dictionnaire', h: `
<p>Pour compter les occurrences de chaque élément d'un tableau, on utilise un <b>dictionnaire</b>.</p>
<pre class="code">def compter(arr):
    compteurs = {}
    for x in arr:
        if x in compteurs:
            compteurs[x] += 1
        else:
            compteurs[x] = 1
    return compteurs</pre>
<p>Complexité : O(n) en moyenne, car l'accès et la mise à jour d'une clé dans un dictionnaire coûtent O(1).</p>
<p>Sans dictionnaire, on ferait une boucle imbriquée pour chercher si l'élément a déjà été compté : O(n²).</p>
<div class="retain"><b>À retenir.</b> Le dictionnaire est la structure adaptée au comptage : O(n) au lieu de O(n²).</div>` });

COURSE.push({ id: 'facteur', t: 'Recherche de facteur', h: `
<p>Rechercher un motif dans un texte, c'est chercher une sous-chaîne.</p>
<h3>Algorithme naïf</h3>
<p>On essaie d'aligner le motif à chaque position possible du texte, et on compare caractère par caractère.</p>
<pre class="code">def recherche_naive(texte, motif):
    n, m = len(texte), len(motif)
    for i in range(n - m + 1):
        j = 0
        while j < m and texte[i + j] == motif[j]:
            j += 1
        if j == m:
            return i
    return -1</pre>
<p>Complexité : O(n × m) dans le pire cas. C'est un exemple typique de <b>boucles imbriquées</b>.</p>
<div class="retain"><b>À retenir.</b> La recherche naïve de sous-chaîne est quadratique : n positions × m caractères.</div>` });

COURSE.push({ id: 'proches', t: 'Valeurs les plus proches', h: `
<p>Pour trouver les deux valeurs les plus proches, on compare toutes les paires d'éléments.</p>
<pre class="code">def plus_proches(arr):
    min_diff = float("inf")
    paire = None
    for i in range(len(arr)):
        for j in range(i + 1, len(arr)):
            diff = abs(arr[i] - arr[j])
            if diff < min_diff:
                min_diff = diff
                paire = (arr[i], arr[j])
    return paire, min_diff</pre>
<p>Complexité : O(n²) à cause des deux boucles imbriquées.</p>
<p>En triant le tableau (O(n log n)), on peut trouver la paire la plus proche en un seul parcours des voisins.</p>
<div class="retain"><b>À retenir.</b> La force brute est en O(n²), le tri permet d'atteindre O(n log n).</div>` });

COURSE.push({ id: 'bulles', t: 'Tri à bulles', h: `
<p>Le tri à bulles compare les éléments voisins et les échange s'ils sont mal ordonnés.</p>
<pre class="code">def tri_bulles(arr):
    n = len(arr)
    for i in range(n):
        for j in range(0, n - i - 1):
            if arr[j] > arr[j + 1]:
                arr[j], arr[j + 1] = arr[j + 1], arr[j]
    return arr</pre>
<p>À chaque passe, le plus grand élément restant remonte à la fin (comme une bulle).</p>
<p>Complexité : O(n²) dans le pire cas et le cas moyen. O(n) si le tableau est déjà trié (avec un drapeau d'arrêt).</p>
<p>Le tri à bulles est <b>en place</b> et <b>stable</b>.</p>
<div class="retain"><b>À retenir.</b> Tri à bulles = boucles imbriquées = O(n²).</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Recherche séquentielle</dt><dd>Parcours d'un tableau élément par élément.</dd>
<dt>Complexité linéaire</dt><dd>O(n) : le coût est proportionnel à la taille.</dd>
<dt>Complexité quadratique</dt><dd>O(n²) : le coût est proportionnel au carré de la taille.</dd>
<dt>Boucles imbriquées</dt><dd>Une boucle à l'intérieur d'une autre boucle.</dd>
<dt>Dictionnaire</dt><dd>Structure d'association clé-valeur, accès en O(1).</dd>
<dt>Sous-chaîne</dt><dd>Suite de caractères contiguë dans une chaîne.</dd>
<dt>Tri à bulles</dt><dd>Tri par échanges successifs d'éléments voisins.</dd>
</dl>` });

    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : recherches séquentielles et boucles'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cinq ateliers sur les recherches séquentielles et les boucles imbriquées (ITC, CPGE 1re année) : recherche séquentielle, comptage, recherche de facteur, valeurs les plus proches, tri à bulles.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> détaille chaque partie.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
