.dt{border-collapse:collapse;width:100%;font-size:13.5px}

/* spécifique dichotomie */
.array-viz{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.cell{width:40px;height:40px;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;background:#fff;transition:all .15s;position:relative}
.cell .idx{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.cell.eliminated{background:#ececf1;color:#aaa;border-color:#d4d4dc}

}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-dichotomie-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
const WORKSHOPS = [];

/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Code Python coloré (léger) */
function codeBlock(code, on) {
  const KW = /^(def|return|for|in|if|elif|else|while|not|raise|import|from|with|as|and|or|is|lambda|class|pass|break|continue|assert|try|except|finally|yield|None)$/;
  const BI = /^(print|len|range|set|dict|list|max|min|sum|id|hash|sorted|open|str|int|float|True|False|isinstance|TypeError|ValueError|Exception|AssertionError|abs|round|min|max)$/;
  const lines = code.split('\n').map(line => {
    let out = '', i = 0;
    while (i < line.length) {
      const ch = line[i];
      if (ch === '#') { out += '<span style="color:#7a7a88;font-style:italic">' + esc(line.slice(i)) + '</span>'; break; }
      if (ch === '"' || ch === "'") { let j = i + 1; while (j < line.length && line[j] !== ch) j++; out += '<span style="color:#1c6b40">' + esc(line.slice(i, j + 1)) + '</span>'; i = j + 1; continue; }
      let j = i; while (j < line.length && line[j] !== '#' && line[j] !== '"' && line[j] !== "'") j++;
      let seg = esc(line.slice(i, j)).replace(/\b([A-Za-z_]\w*|\d+(?:\.\d+)?)\b/g, m => /^\d/.test(m) ? '<span style="color:#b05a00">' + m + '</span>' : KW.test(m) ? '<span style="color:#7c3aa8">' + m + '</span>' : BI.test(m) ? '<span style="color:#1f3fa0">' + m + '</span>' : m);
      out += seg; i = j;
    }
    return out;
  });
  return '<pre class="code">' + lines.map((l, i) => '<span style="display:block;padding:0 ' + (on === i + 1 || (Array.isArray(on) && on.includes(i + 1)) ? '10px 0 10px;background:#fff3dc;border-left:3px solid #e08a00' : '10px') + ';white-space:pre">' + (l || ' ') + '</span>').join('') + '</pre>';
}

/* ================= Atelier 1 : Recherche dichotomique ================= */
const W1 = { arr: [2, 5, 8, 12, 16, 23, 38, 56, 72, 91], target: 23, step: 0, frames: null, timer: null, mode: 'dicho' };
function mountW1(root) {
  root.innerHTML = '<h2>Recherche dichotomique</h2><p>Dans un tableau <b>trié</b>, on peut chercher un élément en divisant la zone de recherche par deux à chaque étape. C\'est la recherche <b>dichotomique</b>, de complexité O(log n), bien plus rapide que la recherche linéaire O(n).</p>' +
    '<div class="opts"><label class="fld"><span>Élément recherché</span><input type="number" id="w1-target" value="23" style="width:80px"></label><div class="fld"><span>Méthode</span><div id="w1-mode"></div></div><div class="fld"><span>Tableau</span><div id="w1-size"></div></div></div>' +
    '<div class="array-viz" id="w1-array"></div>' +
    '<div class="files" style="margin:8px 0"><button class="btn" id="w1-prev" type="button">◀ Précédent</button><button class="btn pri" id="w1-next" type="button">Suivant ▶</button><button class="btn" id="w1-play" type="button">Lecture</button><button class="btn" id="w1-reset" type="button">Départ</button></div>' +
    '<div class="gstats" id="w1-stats"></div>' +
    '<div class="verdict" id="w1-msg" aria-live="polite"></div>' +
    '<h3>Code Python</h3><div id="w1-code"></div>';
  const S = W1;
  $('#w1-mode').append(chipsRow([['dicho', 'Dichotomique O(log n)'], ['lin', 'Linéaire O(n)']], S.mode, v => { S.mode = v; S.frames = null; S.step = 0; stop(); render(); }, 'Méthode'));
  $('#w1-size').append(chipsRow([['10', '10 élts'], ['20', '20 élts'], ['50', '50 élts']], '10', v => {
    const n = parseInt(v, 10);
    S.arr = Array.from({ length: n }, (_, i) => Math.floor(i * 10 + Math.random() * 5 + 1)).sort((a, b) => a - b);
    S.arr = Array.from(new Set(S.arr));
    S.target = S.arr[Math.floor(Math.random() * S.arr.length)];
    $('#w1-target').value = S.target;
    S.frames = null; S.step = 0; stop(); render();
  }, 'Taille'));
  function stop() { if (S.timer) { clearInterval(S.timer); S.timer = null; } const b = $('#w1-play'); if (b) b.textContent = 'Lecture'; }
  function buildFrames() {
    const arr = S.arr, target = S.target, frames = [];
    if (S.mode === 'dicho') {
      let lo = 0, hi = arr.length - 1, step = 0;
      frames.push({ lo, hi, mid: null, step, found: false, msg: 'Recherche de ' + target + ' dans un tableau de ' + arr.length + ' éléments triés. On compare à l\'élément du milieu.' });
      while (lo <= hi) {
        const mid = Math.floor((lo + hi) / 2);
        step++;
        if (arr[mid] === target) { frames.push({ lo, hi, mid, step, found: true, msg: 'arr[' + mid + '] = ' + arr[mid] + ' : trouvé !' }); break; }
        else if (arr[mid] < target) { frames.push({ lo, hi, mid, step, found: false, msg: 'arr[' + mid + '] = ' + arr[mid] + ' < ' + target + ' : on cherche à droite.' }); lo = mid + 1; }
        else { frames.push({ lo, hi, mid, step, found: false, msg: 'arr[' + mid + '] = ' + arr[mid] + ' > ' + target + ' : on cherche à gauche.' }); hi = mid - 1; }
      }
      if (!frames[frames.length - 1].found) frames.push({ lo, hi, mid: null, step, found: false, msg: 'Zone de recherche vide : ' + target + ' est absent.' });
    } else {
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] === target) { frames.push({ i, step: i + 1, found: true, msg: 'arr[' + i + '] = ' + arr[i] + ' : trouvé !' }); break; }
        frames.push({ i, step: i + 1, found: false, msg: 'arr[' + i + '] = ' + arr[i] + ' ≠ ' + target + ' : on avance.' });
      }

  $('#w1-next').onclick = () => { stop(); if (S.step < S.frames.length - 1) { S.step++; render(); } };

const W2 = { base: 3, exp: 13, step: 0, frames: null, timer: null };
function mountW2(root) {
  root.innerHTML = '<h2>Exponentiation rapide</h2><p>Pour calculer <code>a<sup>n</sup></code>, on peut multiplier a n fois (O(n)), ou utiliser la <b>dichotomie</b> : <code>a<sup>n</sup> = (a<sup>n/2</sup>)<sup>2</sup></code> si n est pair, <code>a · a<sup>n−1</sup></code> si n est impair. C\'est l\'exponentiation rapide, de complexité O(log n).</p>' +
    '<div class="opts"><label class="fld"><span>Base a</span><input type="number" id="w2-base" value="3" style="width:80px"></label><label class="fld"><span>Exposant n</span><input type="number" id="w2-exp" value="13" style="width:80px"></label></div>' +

    '<div class="dwrap" id="w2-table"></div>' +

    '<h3>Code Python</h3><div id="w2-code"></div>';
  const S = W2;
  function stop() { if (S.timer) { clearInterval(S.timer); S.timer = null; } const b = $('#w2-play'); if (b) b.textContent = 'Lecture'; }
  function buildFrames() {
    const a = S.base, n = S.exp;
    const frames = [];
    let b = a, e = n, res = 1, i = 0;
    frames.push({ b, e, res, i, expr: 'a^' + n, msg: 'On décompose l\'exposant en binaire : ' + n.toString(2) + '.' });
    while (e > 0) {
      if (e % 2 === 1) { res *= b; frames.push({ b, e, res, i, expr: 'res ×= ' + b + ' (bit 1)', msg: 'L\'exposant est impair : on multiplie le résultat par ' + b + '.' }); }
      e = Math.floor(e / 2);
      if (e > 0) { b = b * b; frames.push({ b, e, res, i, expr: 'b = b²', msg: 'On élève la base au carré et on divise l\'exposant par 2.' }); }
      i++;
    }
    frames.push({ b, e, res, i, expr: 'résultat', msg: 'Terminé : ' + a + '^' + n + ' = ' + res + '.' });
    return frames;
  }
  function render() {
    if (!S.frames) S.frames = buildFrames();
    if (S.step >= S.frames.length) S.step = S.frames.length - 1;
    const f = S.frames[S.step];
    let html = '<table class="dt"><thead><tr><th>Étape</th><th>Base b</th><th>Exposant e</th><th>Résultat res</th><th>Opération</th></tr></thead><tbody>';
    S.frames.slice(0, S.step + 1).forEach((fr, i) => {
      html += '<tr' + (i === S.step ? ' style="background:var(--accent-soft)"' : '') + '><td>' + i + '</td><td class="m">' + fr.b + '</td><td class="m">' + fr.e + '</td><td class="m">' + fr.res + '</td><td>' + esc(fr.expr) + '</td></tr>';
    });
    html += '</tbody></table>';
    $('#w2-table').innerHTML = html;
    $('#w2-msg').className = 'verdict ' + (S.step === S.frames.length - 1 ? 'yes' : '');
    $('#w2-msg').innerHTML = '<b>Étape ' + S.step + ' / ' + (S.frames.length - 1) + '.</b> ' + f.msg;
    const n = S.exp;
    const logn = Math.ceil(Math.log2(n + 1)) * 2; // environ 2 multiplications par bit
    $('#w2-comp').innerHTML = '<div class="dwrap"><table class="dt"><thead><tr><th>Méthode</th><th>Multiplications</th><th>Complexité</th></tr></thead><tbody>' +
      '<tr><td>Naïve (a × a × … × a)</td><td class="m">' + (n - 1) + '</td><td>O(n)</td></tr>' +
      '<tr><td>Exponentiation rapide</td><td class="m">≤ ' + logn + '</td><td>O(log n)</td></tr>' +
      '</tbody></table></div>' +
      '<p class="small">Pour n = ' + n + ', la version naïve fait ' + (n - 1) + ' multiplications, la version rapide en fait au plus ' + logn + '.</p>';
    $('#w2-code').innerHTML = codeBlock('def puissance(a: int, n: int) -> int:\n    res = 1\n    b = a\n    e = n\n    while e > 0:\n        if e % 2 == 1:\n            res = res * b\n        b = b * b\n        e = e // 2\n    return res');
    $('#w2-prev').disabled = S.step === 0;
    $('#w2-next').disabled = S.step >= S.frames.length - 1;
  }
  $('#w2-base').oninput = () => { S.base = parseInt($('#w2-base').value, 10) || 2; S.frames = null; S.step = 0; stop(); render(); };
  $('#w2-exp').oninput = () => { S.exp = clamp(parseInt($('#w2-exp').value, 10) || 1, 1, 30); S.frames = null; S.step = 0; stop(); render(); };
  $('#w2-prev').onclick = () => { stop(); if (S.step > 0) { S.step--; render(); } };
  $('#w2-next').onclick = () => { stop(); if (S.step < S.frames.length - 1) { S.step++; render(); } };
  $('#w2-reset').onclick = () => { stop(); S.step = 0; render(); };
  $('#w2-play').onclick = () => {
    if (S.timer) { stop(); render(); return; }
    if (S.step >= S.frames.length - 1) S.step = 0;
    S.timer = setInterval(() => { if (S.step >= S.frames.length - 1) { stop(); render(); return; } S.step++; render(); }, 700);
    render();
  };
  render();
}

const W4 = { n: 1000, runs: {} };
function mountW4(root) {
  root.innerHTML = '<h2>Accélération : linéaire vs logarithmique</h2><p>La dichotomie divise par 2 la taille de la recherche à chaque étape. La recherche linéaire, elle, examine chaque élément un par un. Sur n = 1 000 000 d\'éléments, la différence est spectaculaire.</p>' +
    '<div class="opts"><label class="fld"><span>Taille n = <b id="w4-nval"></b></span><input type="range" id="w4-n" min="10" max="1000000" value="1000" style="width:240px"></label></div>' +
    '<div class="gstats" id="w4-stats"></div>' +
    '<div class="dwrap" id="w4-table"></div>' +

    '<h3>Code Python</h3><pre class="code"># Recherche linéaire : O(n)\ndef lineaire(arr, x):\n    for i in range(len(arr)):\n        if arr[i] == x:\n            return i\n    return -1\n\n# Recherche dichotomique : O(log n)\ndef dichotomie(arr, x):\n    lo, hi = 0, len(arr) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if arr[mid] == x:\n            return mid\n        elif arr[mid] < x:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1</pre>';
  const nEl = $('#w4-n'), nVal = $('#w4-nval');
  function fmt(n) { if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' M'; if (n >= 1e3) return (n / 1e3).toFixed(1).replace('.', ',') + ' k'; return String(n); }
  function render() {
    const n = W4.n;
    nVal.textContent = fmt(n);
    const lin = n, dicho = Math.ceil(Math.log2(n + 1));
    const ratio = lin / Math.max(dicho, 1);
    $('#w4-stats').innerHTML = '';
    $('#w4-stats').append(stats([
      ['n', fmtN(n)],
      ['Recherche linéaire (pire cas)', fmtN(lin) + ' comparaisons'],
      ['Recherche dichotomique', dicho + ' comparaisons'],
      ['Facteur d\'accélération', '×' + fmt(ratio)]
    ]));
    $('#w4-table').innerHTML = '<table class="dt"><thead><tr><th>Méthode</th><th>Comparaisons</th><th>Complexité</th><th>Sur 1 000 000 d\'éléments</th></tr></thead><tbody>' +
      '<tr><td>Recherche linéaire</td><td class="m">' + fmtN(lin) + '</td><td>O(n)</td><td class="m">1 000 000</td></tr>' +
      '<tr><td>Recherche dichotomique</td><td class="m">' + dicho + '</td><td>O(log n)</td><td class="m">20</td></tr>' +
      '</tbody></table>';

    const W = 600, H = 260, L = 60, R = 20, T = 20, B = 40;
    const pts = [];
    for (let e = 1; e <= 6; e += 0.1) { const x = Math.pow(10, e); pts.push({ x, lin: x, log: Math.ceil(Math.log2(x)) }); }
    const xmax = 1e6, ymax = 1e6;
    const X = x => L + (Math.log10(x) - 1) / (Math.log10(xmax) - 1) * (W - L - R);
    const Y = y => H - B - (Math.log10(y) - 0) / (Math.log10(ymax) - 0) * (H - B - T);
    let svg = '';
    for (let e = 1; e <= 6; e++) {
      const x = X(Math.pow(10, e)), y = Y(Math.pow(10, e));
      svg += '<line x1="' + x + '" y1="' + T + '" x2="' + x + '" y2="' + (H - B) + '" stroke="#eee"/><text x="' + x + '" y="' + (H - B + 15) + '" text-anchor="middle" font-size="11" fill="#666">10^' + e + '</text>';
      svg += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#eee"/><text x="' + (L - 5) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="11" fill="#666">10^' + e + '</text>';
    }
    svg += '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" stroke="#555"/><line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '" stroke="#555"/>';
    svg += '<polyline fill="none" stroke="#c0281f" stroke-width="2" points="' + pts.map(p => X(p.x).toFixed(1) + ',' + Y(Math.max(p.lin, 1)).toFixed(1)).join(' ') + '"/>';
    svg += '<polyline fill="none" stroke="#2e6da4" stroke-width="2" points="' + pts.map(p => X(p.x).toFixed(1) + ',' + Y(Math.max(p.log, 1)).toFixed(1)).join(' ') + '"/>';
    svg += '<circle cx="' + X(n) + '" cy="' + Y(Math.max(lin, 1)) + '" r="4" fill="#c0281f" stroke="#fff"/>';
    svg += '<circle cx="' + X(n) + '" cy="' + Y(Math.max(dicho, 1)) + '" r="4" fill="#2e6da4" stroke="#fff"/>';
    svg += '<text x="' + X(n) + '" y="' + (Y(Math.max(lin, 1)) - 10) + '" text-anchor="middle" font-size="11" fill="#c0281f">linéaire : ' + fmtN(lin) + '</text>';
    svg += '<text x="' + X(n) + '" y="' + (Y(Math.max(dicho, 1)) - 10) + '" text-anchor="middle" font-size="11" fill="#2e6da4">dichotomie : ' + dicho + '</text>';
    svg += '<line x1="' + (L + 10) + '" y1="' + (T + 10) + '" x2="' + (L + 30) + '" y2="' + (T + 10) + '" stroke="#c0281f" stroke-width="2"/><text x="' + (L + 36) + '" y="' + (T + 14) + '" font-size="11" fill="#222">linéaire</text>';
    svg += '<line x1="' + (L + 10) + '" y1="' + (T + 26) + '" x2="' + (L + 30) + '" y2="' + (T + 26) + '" stroke="#2e6da4" stroke-width="2"/><text x="' + (L + 36) + '" y="' + (T + 30) + '" font-size="11" fill="#222">dichotomie</text>';
    $('#w4-chart').innerHTML = svg;
  }
  nEl.oninput = () => { W4.n = parseInt(nEl.value, 10); render(); };
  render();
}

/* ---------- cours ---------- */
const COURSE = [];
COURSE.push({ id: 'recherche', t: 'Recherche dichotomique', h: `
<p>Dans un tableau <b>trié</b>, la recherche dichotomique permet de trouver un élément en divisant la zone de recherche par deux à chaque étape.</p>
<h3>Principe</h3>
<p>On compare l'élément cherché x à l'élément du milieu :</p>
<ul><li>si x est plus petit, on cherche à gauche ;</li><li>si x est plus grand, on cherche à droite ;</li><li>si x est égal, on a trouvé.</li></ul>
<pre class="code">def dichotomie(arr, x):
    lo, hi = 0, len(arr) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if arr[mid] == x:
            return mid
        elif arr[mid] < x:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1</pre>
<h3>Complexité</h3>
<p>Chaque étape divise la taille par 2 : il faut au plus ⌈log₂(n + 1)⌉ comparaisons. Complexité : <b>O(log n)</b>.</p>
<table class="ctable"><thead><tr><th>n</th><th>Linéaire</th><th>Dichotomie</th></tr></thead><tbody>
<tr><td>10</td><td>10</td><td>4</td></tr>
<tr><td>1 000</td><td>1 000</td><td>10</td></tr>
<tr><td>1 000 000</td><td>1 000 000</td><td>20</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> La dichotomie est en O(log n), mais elle nécessite un tableau trié et un accès direct aux éléments.</div>` });

COURSE.push({ id: 'exponentiation', t: 'Exponentiation rapide', h: `
<p>Pour calculer <code>a<sup>n</sup></code>, la méthode naïve fait n − 1 multiplications. L'exponentiation rapide utilise la décomposition binaire de n.</p>
<h3>Principe</h3>
<p>En binaire, <code>a<sup>n</sup></code> se calcule en élevant la base au carré et en multipliant le résultat quand le bit courant de n est 1.</p>
<pre class="code">def puissance(a, n):
    res = 1
    b = a
    e = n
    while e > 0:
        if e % 2 == 1:
            res = res * b
        b = b * b
        e = e // 2
    return res</pre>
<h3>Exemple : 3^13</h3>
<p>13 = 1101 en binaire.</p>
<table class="ctable"><thead><tr><th>e</th><th>b</th><th>res</th></tr></thead><tbody>
<tr><td>13</td><td>3</td><td>1</td></tr>
<tr><td>6</td><td>9</td><td>3</td></tr>
<tr><td>3</td><td>81</td><td>3</td></tr>
<tr><td>1</td><td>6561</td><td>243</td></tr>
<tr><td>0</td><td>—</td><td>1594323</td></tr>
</tbody></table>
<p>Résultat : 3<sup>13</sup> = 1 594 323. Nombre de multiplications : 5 (au lieu de 12).</p>
<h3>Complexité</h3>
<p>O(log n) : on divise l'exposant par 2 à chaque étape.</p>
<div class="retain"><b>À retenir.</b> L'exponentiation rapide est une méthode dichotomique sur l'exposant : O(log n) multiplications au lieu de O(n).</div>` });

COURSE.push({ id: 'tests', t: 'Jeux de tests', h: `
<p>Pour valider un algorithme, on écrit un jeu de tests à la main. Pour la recherche dichotomique, il faut couvrir plusieurs cas.</p>
<h3>Partitions du domaine</h3>
<ul><li>Élément au début du tableau.</li><li>Élément au milieu.</li><li>Élément à la fin.</li><li>Élément absent plus petit que tous.</li><li>Élément absent plus grand que tous.</li><li>Élément absent au milieu.</li><li>Tableau vide.</li><li>Tableau à un seul élément.</li></ul>
<h3>Table de tests</h3>
<table class="ctable"><thead><tr><th>Entrée</th><th>Résultat attendu</th></tr></thead><tbody>
<tr><td>([1, 3, 5], 1)</td><td>0</td></tr>
<tr><td>([1, 3, 5], 5)</td><td>2</td></tr>
<tr><td>([1, 3, 5], 0)</td><td>-1</td></tr>
<tr><td>([1, 3, 5], 4)</td><td>-1</td></tr>
<tr><td>([], 1)</td><td>-1</td></tr>
<tr><td>([7], 7)</td><td>0</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Un bon jeu de tests couvre les cas normaux, les limites et les erreurs.</div>` });

COURSE.push({ id: 'complexite', t: 'Linéaire vs logarithmique', h: `
<h3>Accélération</h3>
<p>La recherche dichotomique a une complexité <b>logarithmique</b> (O(log n)), la recherche linéaire une complexité <b>linéaire</b> (O(n)).</p>
<table class="ctable"><thead><tr><th>n</th><th>O(n)</th><th>O(log n)</th><th>Gain</th></tr></thead><tbody>
<tr><td>10</td><td>10</td><td>4</td><td>×2,5</td></tr>
<tr><td>1 000</td><td>1 000</td><td>10</td><td>×100</td></tr>
<tr><td>1 000 000</td><td>1 000 000</td><td>20</td><td>×50 000</td></tr>
</tbody></table>
<h3>Conditions</h3>
<ul><li>Le tableau doit être <b>trié</b>.</li><li>On doit pouvoir accéder à un élément par son indice en O(1).</li></ul>
<p>Sur une liste chaînée, l'accès est en O(n) : la dichotomie est inutilisable.</p>
<div class="retain"><b>À retenir.</b> La dichotomie accélère massivement la recherche sur les grands tableaux triés.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Dichotomie</dt><dd>Méthode qui divise un problème en deux sous-problèmes de taille moitié.</dd>
<dt>Recherche dichotomique</dt><dd>Recherche d'un élément dans un tableau trié en O(log n).</dd>
<dt>Exponentiation rapide</dt><dd>Calcul de a^n en O(log n) multiplications.</dd>
<dt>Complexité logarithmique</dt><dd>O(log n) : croissance très lente, quasi constante.</dd>
<dt>Complexité linéaire</dt><dd>O(n) : croissance proportionnelle à la taille.</dd>
<dt>Jeu de tests</dt><dd>Ensemble de tests couvrant les cas normaux, les limites et les erreurs.</dd>
</dl>` });
