*{box-sizing:border-box}

.stagebox{border:1px solid var(--line);border-radius:10px;padding:10px 10px 6px;background:#fff;margin:8px 0}
.rowname{font-size:12px;color:var(--muted);margin:4px 2px 0}
.bars{display:flex;align-items:flex-end;gap:4px;height:176px;padding-top:4px}

.card.t1{border-color:#2e6da4;color:#1b4a76}.card.t2{border-color:#9a5b00;color:#7a4700}.card.t3{border-color:#7b4fc2;color:#52308f}.card.t4{border-color:#1e7a2e;color:#1e7a2e}.card.t5{border-color:#c0281f;color:#8e1d15}.card.t6{border-color:#33475b;color:#33475b}

.twocol{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}

.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:9px}.chk input{width:auto}
.dt th.num{text-align:right}.dt td.diag{background:rgba(30,122,46,.18);font-weight:600}.dt td.offd{background:rgba(192,40,31,.14)}

.gscroll{overflow-x:auto}.gsvg{width:100%;min-width:520px;height:auto;display:block}.msvg{width:100%;min-width:700px;height:auto;display:block}
.dt th{vertical-align:bottom}

  const cb = $('#m5-cmp'); cb.innerHTML = ''; cb.append(h('p', { class: 'small', style: 'margin:6px 0 4px' }, 'Décision selon la profondeur (calculée sans animation) :'), h('div', { class: 'dwrap' }, h('table', { class: 'dt' }, h('thead', null, h('tr', null, ['Exploration', 'Valeur de la racine', 'Coup choisi'].map(t => h('th', null, t)))), tb)));

}

COURSE.push({ id: 'cadre', t: 'Cadre du cours', h: `
<p>Ce cours suit la partie <b>« Algorithmique pour l’intelligence artificielle et l’étude des jeux »</b> du programme d’informatique de tronc commun (troisième semestre). Elle permet de revisiter les notions de programmation et de représentation de données par un graphe, vues en première année, en les appliquant à des enjeux contemporains.</p>
<h3>Au programme</h3>
<table class="ctable"><thead><tr><th>Notion</th><th>Précisions</th></tr></thead><tbody>
<tr><td>Algorithme des k plus proches voisins avec distance euclidienne</td><td>Matrice de confusion. Lien avec l’apprentissage supervisé.</td></tr>
<tr><td>Algorithme des k-moyennes</td><td>Lien avec l’apprentissage non supervisé. On observe des convergences vers des minima locaux.</td></tr>
<tr><td>Jeux d’accessibilité à deux joueurs sur un graphe : stratégie, stratégie gagnante, position gagnante</td><td>Calcul des attracteurs, construction de stratégies gagnantes. On ne considère que les stratégies sans mémoire.</td></tr>
<tr><td>Notion d’heuristique, algorithme minmax avec une heuristique</td><td>—</td></tr></tbody></table>
<h3>Hors programme</h3>
<ul><li>L’élagage alpha-bêta.</li><li>La démonstration de la convergence des k-moyennes.</li><li>La connaissance détaillée de ces algorithmes n’est pas un attendu : il s’agit surtout de se familiariser avec les idées, qu’on pourra réutiliser dans des situations guidées.</li></ul>
<p class="small">Ce récapitulatif est établi à partir d’extraits cités du programme officiel ; le texte complet fait foi.</p>
<div class="retain"><b>À retenir.</b> Deux algorithmes d’apprentissage (k plus proches voisins, k-moyennes) et deux outils pour les jeux (attracteurs, minmax avec heuristique).</div>` });

COURSE.push({ id: 'apprent', t: 'Apprendre à partir de données', h: `
<p>L’<b>intelligence artificielle</b> regroupe des méthodes qui permettent à une machine de réaliser des tâches jugées « intelligentes ». L’<b>apprentissage automatique</b> en est une branche : au lieu de programmer des règles, on laisse l’algorithme les déduire de <b>données</b>.</p>
<ul>
<li>Une donnée est décrite par ses <b>attributs</b> (ici, deux nombres : un point du plan).</li>
<li>En <b>apprentissage supervisé</b>, chaque donnée d’apprentissage est associée à sa <b>classe</b> (étiquette). On veut prédire la classe d’une nouvelle donnée : c’est la <b>classification</b>. Exemple : k plus proches voisins.</li>
<li>En <b>apprentissage non supervisé</b>, les données n’ont pas de classe : on cherche des <b>groupes</b> (clusters) de données semblables. Exemple : k-moyennes.</li>
<li>On sépare les données en un jeu d’<b>apprentissage</b> et un jeu de <b>test</b> pour évaluer l’algorithme sur des données qu’il n’a pas vues.</li>
</ul>
<div class="retain"><b>À retenir.</b> Supervisé : les classes sont connues et on prédit. Non supervisé : on cherche des groupes sans classes connues.</div>` });

COURSE.push({ id: 'knn', t: 'k plus proches voisins', h: `
<p>Pour classer un point x, on cherche dans le jeu d’apprentissage ses <b>k plus proches voisins</b>, et on lui attribue la classe <b>majoritaire</b> parmi eux.</p>
<p>La distance utilisée est la <b>distance euclidienne</b> : entre x = (x₁ ; x₂) et y = (y₁ ; y₂),</p>
<div class="formula">d(x, y) = √((x₁ − y₁)² + (x₂ − y₂)²)</div>
<p>Pour comparer des distances, il suffit de comparer leurs carrés : on évite la racine carrée.</p>
<pre class="code">def dist2(a, b):
    return sum((u - v) ** 2 for u, v in zip(a, b))

def knn(points, classes, x, k):
    ordre = sorted(range(len(points)), key=lambda i: dist2(points[i], x))
    votes = {}
    for i in ordre[:k]:
        votes[classes[i]] = votes.get(classes[i], 0) + 1
    return max(votes, key=votes.get)</pre>
<ul>
<li><b>Coût</b> d’une prédiction : n calculs de distance (n points d’apprentissage), puis la sélection des k plus petites.</li>
<li><b>Choix de k</b> : avec k = 1, la frontière suit chaque point du jeu et peut être très irrégulière ; avec k grand, elle est plus lisse mais peut « gommer » de petites classes. Il n’y a pas de valeur universelle : on compare des valeurs de k sur un jeu de test.</li>
<li><b>Égalité de votes</b> : on doit se donner une règle, par exemple choisir la classe du voisin le plus proche parmi les classes à égalité. Pour deux classes, un k impair évite le problème.</li>
</ul>
<div class="retain"><b>À retenir.</b> k plus proches voisins : calculer les distances, garder les k plus petites, voter. C’est un algorithme d’apprentissage supervisé.</div>` });

COURSE.push({ id: 'eval', t: 'Évaluer : matrice de confusion', h: `
<p>On évalue un classifieur sur le jeu de <b>test</b>, en comparant la classe prédite à la classe réelle.</p>
<p>La <b>matrice de confusion</b> M a une ligne par classe réelle et une colonne par classe prédite : M[i][j] est le nombre de points de classe réelle i que l’algorithme a classés en j. Les bonnes réponses sont sur la diagonale.</p>
<table class="ctable"><thead><tr><th></th><th>prédit A</th><th>prédit B</th></tr></thead><tbody>
<tr><th>réel A</th><td>12</td><td>3</td></tr><tr><th>réel B</th><td>5</td><td>10</td></tr></tbody></table>
<p>Le <b>taux de bonnes réponses</b> est la somme de la diagonale divisée par le nombre total de points : (12 + 10) / 30 ≈ 73 %.</p>
<pre class="code">def confusion(reelles, predites, nb_classes):
    M = [[0] * nb_classes for _ in range(nb_classes)]
    for r, p in zip(reelles, predites):
        M[r][p] += 1
    return M</pre>
<h3>Surapprentissage</h3>
<p>Un taux excellent sur le jeu d’apprentissage mais nettement plus faible sur le jeu de test signale un <b>surapprentissage</b> : l’algorithme a trop collé aux données d’apprentissage. C’est typique de k = 1 sur des classes qui se chevauchent.</p>
<div class="retain"><b>À retenir.</b> Matrice de confusion : réel en ligne, prédit en colonne, bonnes réponses sur la diagonale. On évalue toujours sur des données de test.</div>` });

COURSE.push({ id: 'kmeans', t: 'k-moyennes', h: `
<p>On dispose de points sans classe et on cherche à les répartir en <b>k groupes</b> homogènes. L’algorithme des <b>k-moyennes</b> :</p>
<ol><li>choisir k centres initiaux (par exemple k points du jeu tirés au hasard) ;</li><li><b>affectation</b> : chaque point est affecté au centre le plus proche ;</li><li><b>mise à jour</b> : chaque centre devient la moyenne (le barycentre) des points de son groupe ;</li><li>recommencer 2 et 3 jusqu’à ce que les groupes ne changent plus.</li></ol>
<pre class="code">def k_moyennes(points, k):
    centres = random.sample(points, k)
    while True:
        groupes = [[] for _ in range(k)]
        for p in points:
            j = min(range(k), key=lambda j: dist2(p, centres[j]))
            groupes[j].append(p)
        nouveaux = [moyenne(g) if g else centres[j] for j, g in enumerate(groupes)]
        if nouveaux == centres:
            return centres, groupes
        centres = nouveaux</pre>
<p>L’<b>inertie</b> d’une partition est la somme, sur tous les points, du carré de la distance au centre de leur groupe. Chaque étape la fait décroître ou la laisse inchangée.</p>
<ul>
<li>L’algorithme <b>converge</b> (la démonstration n’est pas au programme), mais pas forcément vers la meilleure partition : selon les centres initiaux, on peut obtenir un <b>minimum local</b>.</li>
<li>On relance donc l’algorithme plusieurs fois et on garde la partition d’inertie minimale.</li>
<li>Le nombre de groupes k est choisi par l’utilisateur.</li>
</ul>
<div class="retain"><b>À retenir.</b> k-moyennes : alterner affectation au centre le plus proche et recalcul des centres. Apprentissage non supervisé, convergence vers un minimum local possible.</div>` });

COURSE.push({ id: 'jeux', t: 'Jeux d’accessibilité', h: `
<p>Un <b>jeu d’accessibilité à deux joueurs sur un graphe</b> est défini par un graphe orienté dont les sommets (positions) sont partagés entre J1 et J2, et par un ensemble de sommets cibles. Un jeton est placé sur un sommet ; le joueur auquel appartient le sommet choisit un arc sortant et déplace le jeton. J1 gagne s’il atteint la cible.</p>
<ul>
<li>Une <b>stratégie</b> d’un joueur indique quel arc choisir à chaque position ; on ne considère que les stratégies <b>sans mémoire</b> (le choix ne dépend que de la position courante).</li>
<li>Une stratégie est <b>gagnante</b> si elle mène à la victoire quels que soient les choix de l’adversaire. Une <b>position gagnante</b> est une position depuis laquelle J1 possède une stratégie gagnante.</li>
</ul>
<h3>Calcul de l’attracteur</h3>
<p>L’<b>attracteur</b> de la cible est l’ensemble des positions gagnantes de J1. On le construit par étapes :</p>
<ol><li>Attr₀ = la cible ;</li><li>on ajoute un sommet de <b>J1</b> s’il possède <b>au moins un</b> successeur dans l’attracteur ;</li><li>on ajoute un sommet de <b>J2</b> si <b>tous</b> ses successeurs (il en faut au moins un) sont dans l’attracteur ;</li><li>on recommence jusqu’à ce que plus rien ne s’ajoute (point fixe).</li></ol>
<pre class="code">def attracteur(sommets, succ, joueur, cible):
    attr = set(cible)
    change = True
    while change:
        change = False
        for s in sommets:
            if s in attr:
                continue
            dans = [t for t in succ[s] if t in attr]
            if (joueur[s] == 1 and dans) or \\
               (joueur[s] == 2 and succ[s] and len(dans) == len(succ[s])):
                attr.add(s)
                change = True
    return attr</pre>
<p><b>Stratégie gagnante</b> : en notant rang(s) l’étape d’entrée de s dans l’attracteur, J1 joue depuis chaque sommet de l’attracteur vers un successeur de rang strictement plus petit. Le rang diminue à chaque coup : la cible est atteinte.</p>
<p><b>Exemple : le jeu de Nim.</b> Une position est le couple (allumettes restantes, joueur qui doit jouer). On retire 1, 2 ou 3 allumettes, celui qui prend la dernière gagne. Les positions perdantes pour le joueur qui doit jouer sont les multiples de 4.</p>
<div class="retain"><b>À retenir.</b> Positions gagnantes de J1 = attracteur de la cible. Un sommet de J1 y entre avec un successeur dans l’attracteur ; un sommet de J2 y entre si tous ses successeurs y sont.</div>` });

COURSE.push({ id: 'minmax', t: 'Heuristique et minmax', h: `
<p>Pour la plupart des jeux, l’arbre des parties est trop grand pour être exploré en entier. On s’arrête alors à une <b>profondeur limite</b> et on évalue les positions atteintes par une <b>heuristique</b> : une fonction qui estime la qualité d’une position pour J1 (grande valeur : favorable à J1). Une heuristique est une estimation, qui peut se tromper.</p>
<p>L’algorithme <b>minmax</b> suppose que chaque joueur joue au mieux : J1 choisit le fils de valeur maximale, J2 le fils de valeur minimale.</p>
<pre class="code">def minmax(pos, prof, tour_de_j1):
    if prof == 0 or est_finale(pos):
        return heuristique(pos)
    valeurs = [minmax(q, prof - 1, not tour_de_j1) for q in coups(pos)]
    return max(valeurs) if tour_de_j1 else min(valeurs)</pre>
<ul>
<li>Le coût croît exponentiellement avec la profondeur : si chaque position a b coups, on explore de l’ordre de b<sup>p</sup> positions à la profondeur p.</li>
<li>Une exploration plus profonde donne en général une meilleure décision, mais le coup choisi peut changer d’une profondeur à l’autre.</li>
<li>L’élagage alpha-bêta, qui évite d’explorer certaines branches, <b>n’est pas au programme</b>.</li>
</ul>
<div class="retain"><b>À retenir.</b> Minmax avec heuristique : remonter les valeurs depuis la profondeur limite, en prenant le maximum aux nœuds de J1 et le minimum aux nœuds de J2.</div>` });

COURSE.push({ id: 'bilan', t: 'Synthèse', h: `
<table class="ctable"><thead><tr><th></th><th>k plus proches voisins</th><th>k-moyennes</th></tr></thead><tbody>
<tr><td>Type d’apprentissage</td><td>supervisé</td><td>non supervisé</td></tr>
<tr><td>Données</td><td>points avec leur classe</td><td>points sans classe</td></tr>
<tr><td>Résultat</td><td>classe prédite pour un nouveau point</td><td>partition en k groupes et leurs centres</td></tr>
<tr><td>Paramètre</td><td>k (nombre de voisins)</td><td>k (nombre de groupes), centres initiaux</td></tr>
<tr><td>Évaluation</td><td>matrice de confusion sur un jeu de test</td><td>inertie</td></tr>
<tr><td>Point de vigilance</td><td>surapprentissage (k trop petit)</td><td>minimum local</td></tr></tbody></table>
<table class="ctable"><thead><tr><th></th><th>Attracteur</th><th>Minmax avec heuristique</th></tr></thead><tbody>
<tr><td>But</td><td>trouver les positions gagnantes et une stratégie gagnante</td><td>choisir un coup quand on ne peut pas tout explorer</td></tr>
<tr><td>Jeu</td><td>graphe, cible d’accessibilité</td><td>arbre de parties à profondeur limitée</td></tr>
<tr><td>Garantie</td><td>exacte</td><td>dépend de l’heuristique</td></tr></tbody></table>
<div class="retain"><b>À retenir.</b> Savoir dérouler ces algorithmes sur de petits exemples et en expliquer les principes et les limites.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Classe, étiquette</dt><dd>Catégorie à laquelle appartient une donnée.</dd>
<dt>Classification</dt><dd>Prédire la classe d’une nouvelle donnée.</dd>
<dt>Apprentissage supervisé</dt><dd>Apprentissage à partir de données dont les classes sont connues.</dd>
<dt>Apprentissage non supervisé</dt><dd>Recherche de groupes dans des données sans classes connues.</dd>
<dt>Jeu d’apprentissage, jeu de test</dt><dd>Données utilisées pour apprendre, données réservées à l’évaluation.</dd>
<dt>Distance euclidienne</dt><dd>Longueur du segment qui relie deux points.</dd>
<dt>Matrice de confusion</dt><dd>Tableau des effectifs classe réelle × classe prédite.</dd>
<dt>Surapprentissage</dt><dd>Bonne performance sur l’apprentissage mais mauvaise sur de nouvelles données.</dd>
<dt>Centre, barycentre</dt><dd>Moyenne des points d’un groupe.</dd>
<dt>Inertie</dt><dd>Somme des carrés des distances des points au centre de leur groupe.</dd>
<dt>Minimum local</dt><dd>Solution meilleure que ses voisines mais pas forcément optimale globalement.</dd>
<dt>Jeu d’accessibilité</dt><dd>Jeu sur un graphe où J1 veut atteindre une cible.</dd>
<dt>Stratégie gagnante</dt><dd>Stratégie qui assure la victoire quel que soit le jeu de l’adversaire.</dd>
<dt>Attracteur</dt><dd>Ensemble des positions depuis lesquelles J1 peut forcer l’accès à la cible.</dd>
<dt>Heuristique</dt><dd>Estimation de la valeur d’une position non finale.</dd>
<dt>Minmax</dt><dd>Algorithme où J1 maximise et J2 minimise la valeur des positions.</dd>
</dl>` });

/* ---------- interface ---------- */

function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');

}
function gotoWs(id) {

  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });

    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
