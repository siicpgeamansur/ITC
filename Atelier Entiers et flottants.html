<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);

let toastT = null;

const KEYS = { act: 'atelier-entiers-flottants-v1' };

const WORKSHOPS = [];

/*LOGIC-START*/
/* ---------- entiers ---------- */
const mod = (v, w) => { const m = Math.pow(2, w); return ((v % m) + m) % m; };
const toBin = (v, w) => mod(v, w).toString(2).padStart(w, '0');
const toHex = (v, w) => mod(v, w).toString(16).toUpperCase().padStart(Math.ceil(w / 4), '0');
const sgn = (v, w) => v >= Math.pow(2, w - 1) ? v - Math.pow(2, w) : v;
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function addInfo(a, b, w) {

  return { ua, ub, us, carry: s >= M, res: sgn(us, w), tru, over: tru < -M / 2 || tru > M / 2 - 1 };
}
function bigFmt(b) { return b.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
/* ---------- flottants ---------- */
function bitsOf(x, w) {

  if (w === 64) dv.setFloat64(0, x); else dv.setFloat32(0, x);
  for (let i = 0; i < w / 8; i++) { const b = dv.getUint8(i); for (let j = 7; j >= 0; j--) bits.push((b >> j) & 1); }

const showVal = v => typeof v === 'boolean' ? pyBool(v) : pyRepr(v);
/*LOGIC-END*/

/* ---------- aides d'interface ---------- */
function bitRow(v, w, onFlip, cls) {
  const row = h('div', { class: 'bitrow' });
  for (let i = w - 1; i >= 0; i--) {
    const b = Math.floor(mod(v, w) / Math.pow(2, i)) % 2;
    const c = 'bit' + (b ? ' on' : '') + (cls ? ' ' + cls(i, b) : '');

const t4 = () => {

const COURSE = [];
COURSE.push({ id: 'naturels', t: 'Entiers naturels', h: `
<p>Un ordinateur manipule des suites de bits. Un mot de <b>n bits</b> s’interprète comme un entier naturel en base 2 :</p>
<div class="formula">x = x<sub>n−1</sub>·2<sup>n−1</sup> + … + x<sub>1</sub>·2 + x<sub>0</sub>, avec x<sub>i</sub> ∈ {0, 1}</div>
<p>Les valeurs possibles vont de <b>0 à 2<sup>n</sup> − 1</b> : il y en a 2<sup>n</sup> au total. Un octet (8 bits) code les entiers de 0 à 255.</p>
<h3>Conversions</h3>
<ul><li><b>Binaire → décimal</b> : on additionne les puissances de 2 des bits à 1.</li><li><b>Décimal → binaire</b> : divisions successives par 2 ; on lit les restes de bas en haut.</li><li><b>Hexadécimal</b> (base 16, chiffres 0–9 puis A–F) : un chiffre hexadécimal vaut exactement 4 bits. 1100 1101<sub>2</sub> = 0xCD = 205.</li></ul>
<pre class="code">&gt;&gt;&gt; bin(205), hex(205)
('0b11001101', '0xcd')
&gt;&gt;&gt; int('11001101', 2), int('cd', 16)
(205, 205)
&gt;&gt;&gt; format(205, '08b')
'11001101'</pre>
<h3>Dépassement non signé</h3>
<p>Sur n bits, l’addition est calculée modulo 2<sup>n</sup> : la retenue sortante est perdue. Sur 8 bits, 200 + 100 = 300 devient 300 − 256 = 44.</p>
<div class="retain"><b>À retenir.</b> Avec n bits on code 2<sup>n</sup> valeurs, de 0 à 2<sup>n</sup> − 1. Le calcul se fait modulo 2<sup>n</sup>.</div>` });

COURSE.push({ id: 'cpl2', t: 'Entiers relatifs : complément à 2', h: `
<p>Pour coder des entiers négatifs avec n bits, on donne au bit de gauche le poids <b>−2<sup>n−1</sup></b> :</p>
<div class="formula">x = −x<sub>n−1</sub>·2<sup>n−1</sup> + x<sub>n−2</sub>·2<sup>n−2</sup> + … + x<sub>0</sub></div>
<p>Les valeurs vont de <b>−2<sup>n−1</sup> à 2<sup>n−1</sup> − 1</b> (sur 8 bits : −128 à 127). Un nombre est négatif si et seulement si son bit de gauche vaut 1.</p>
${t4()}
<h3>Opposé</h3>
<p>Pour obtenir −x : <b>inverser tous les bits, puis ajouter 1</b>. En effet x + NOT(x) = 2<sup>n</sup> − 1, donc −x = NOT(x) + 1 modulo 2<sup>n</sup>.</p>
<div class="formula">6 = 0000 0110 → inversé 1111 1001 → + 1 → 1111 1010 = −6</div>
<p>Le plus petit nombre −2<sup>n−1</sup> n’a pas d’opposé représentable : son opposé est lui-même.</p>
<h3>Addition et dépassement</h3>
<p>Le même additionneur sert pour les deux lectures : A − B se calcule comme A + (−B). Il y a <b>dépassement signé</b> si le résultat exact sort de la plage. On le reconnaît à une règle de signe : deux opérandes de même signe donnent un résultat de signe opposé.</p>
<div class="formula">100 + 50 = 150 → 1001 0110 = −106 (sur 8 bits)</div>
<h3>Python et les autres langages</h3>
<p>En <b>Python</b>, les <code>int</code> n’ont pas de taille fixe : pas de dépassement, mais un calcul plus lent. En <b>C</b> ou avec <b>NumPy</b>, la taille est fixe et le dépassement est silencieux.</p>
<pre class="code">&gt;&gt;&gt; 2**100
1267650600228229401496703205376
&gt;&gt;&gt; import numpy as np
&gt;&gt;&gt; np.int8(127) + np.int8(1)     # avertissement, résultat -128
-128
&gt;&gt;&gt; (2**100).bit_length()
101</pre>
<div class="retain"><b>À retenir.</b> Complément à 2 sur n bits : plage −2<sup>n−1</sup> à 2<sup>n−1</sup> − 1 ; opposé = NOT puis + 1 ; dépassement silencieux dans les langages à taille fixe.</div>` });

COURSE.push({ id: 'ieee', t: 'Flottants : le format IEEE 754', h: `
<p>Un nombre réel est approché par un <b>flottant</b>, de la forme (−1)<sup>s</sup> × mantisse × 2<sup>exposant</sup>. La norme IEEE 754 fixe le codage. Un mot comprend trois champs :</p>
<div class="formula">| s (1 bit) | e (E bits) | m (M bits) |</div>
<table class="ctable"><thead><tr><th></th><th>binary32</th><th>binary64 (float de Python)</th></tr></thead><tbody>
<tr><td>Taille totale</td><td>32 bits</td><td>64 bits</td></tr>
<tr><td>Exposant E</td><td>8 bits, biais 127</td><td>11 bits, biais 1023</td></tr>
<tr><td>Mantisse M</td><td>23 bits (précision 24)</td><td>52 bits (précision 53)</td></tr>
<tr><td>Écart entre 1 et le suivant (ε)</td><td>2<sup>−23</sup> ≈ 1,19·10<sup>−7</sup></td><td>2<sup>−52</sup> ≈ 2,22·10<sup>−16</sup></td></tr>
<tr><td>Plus grand fini</td><td>≈ 3,40·10<sup>38</sup></td><td>≈ 1,80·10<sup>308</sup></td></tr>
<tr><td>Plus petit normal positif</td><td>2<sup>−126</sup> ≈ 1,18·10<sup>−38</sup></td><td>2<sup>−1022</sup> ≈ 2,23·10<sup>−308</sup></td></tr>
<tr><td>Chiffres décimaux fiables</td><td>6 à 7</td><td>15 à 16</td></tr></tbody></table>
<h3>Valeur d’un flottant</h3>
<table class="ctable"><thead><tr><th>Exposant e</th><th>Mantisse m</th><th>Valeur</th></tr></thead><tbody>
<tr><td>0 &lt; e &lt; 2<sup>E</sup> − 1</td><td>quelconque</td><td><b>normal</b> : (−1)<sup>s</sup> × (1 + m/2<sup>M</sup>) × 2<sup>e − biais</sup></td></tr>
<tr><td>0</td><td>≠ 0</td><td><b>sous-normal</b> : (−1)<sup>s</sup> × (m/2<sup>M</sup>) × 2<sup>1 − biais</sup></td></tr>
<tr><td>0</td><td>0</td><td>±0 (deux zéros)</td></tr>
<tr><td>2<sup>E</sup> − 1</td><td>0</td><td>±∞</td></tr>
<tr><td>2<sup>E</sup> − 1</td><td>≠ 0</td><td>NaN (Not a Number)</td></tr></tbody></table>
<p>Pour un nombre normal, le « 1 » devant la mantisse est <b>implicite</b> : il n’est pas stocké. L’exposant est stocké <b>décalé</b> du biais, ce qui permet de comparer deux flottants positifs comme deux entiers. Les sous-normaux comblent l’intervalle entre 0 et le plus petit normal.</p>
<h3>Exemple : 0,75 en binary32</h3>
<p>0,75 = 1,1<sub>2</sub> × 2<sup>−1</sup>. Donc s = 0, e = −1 + 127 = 126 = 0111 1110<sub>2</sub>, m = 1000…0. Le mot s’écrit 0011 1111 0100 0000 … 0 = <b>0x3F400000</b>.</p>
<pre class="code">&gt;&gt;&gt; import struct, sys
&gt;&gt;&gt; struct.pack('&gt;d', 0.1).hex()
'3fb999999999999a'
&gt;&gt;&gt; (0.1).hex()
'0x1.999999999999ap-4'
&gt;&gt;&gt; sys.float_info.epsilon
2.220446049250313e-16</pre>
<div class="retain"><b>À retenir.</b> Un flottant = signe, exposant décalé, mantisse avec 1 implicite. Un binary64 a 53 bits de précision, soit environ 16 chiffres décimaux. Exposant tout à 1 : ∞ ou NaN ; exposant nul : 0 ou sous-normaux.</div>` });

COURSE.push({ id: 'arrondi', t: 'Erreurs d’arrondi', h: `
<p>Presque tous les réels ne sont pas des flottants : un résultat est arrondi au flottant le plus proche (en cas d’égalité, au dernier bit pair). Ce n’est pas une imperfection de Python : c’est inhérent au format.</p>
<h3>Erreur relative</h3>
<p>Pour un nombre x dans la plage des flottants normaux, l’arrondi fl(x) vérifie :</p>
<div class="formula">|fl(x) − x| / |x| ≤ u, avec u = 2<sup>−53</sup> ≈ 1,11·10<sup>−16</sup> (binary64)</div>
<p>L’écart ε = 2<sup>−52</sup> entre 1 et le flottant suivant vaut 2u. L’écart entre deux flottants voisins est l’<b>ulp</b> : il double à chaque puissance de 2.</p>
<h3>Conséquences</h3>
<ul>
<li><b>Nombres non représentables</b> : 0,1 = 0,0001100110011…<sub>2</sub> est périodique en binaire. 0.1 + 0.2 donne 0.30000000000000004.</li>
<li><b>Entiers</b> : jusqu’à 2<sup>53</sup> tous les entiers sont exacts en binary64. Au-delà, l’écart est au moins 2.</li>
<li><b>Absorption</b> : x + y = x si |y| est inférieur à la moitié de l’ulp de x. Ainsi 1 + 10<sup>−16</sup> == 1.</li>
<li><b>Annulation catastrophique</b> : la soustraction de deux nombres presque égaux perd des chiffres significatifs. (1 − cos x) / x² est faux pour x = 10<sup>−8</sup> ; on utilise 2 sin²(x/2) / x².</li>
<li><b>Non-associativité</b> : (a + b) + c peut différer de a + (b + c).</li>
<li><b>Dépassement et sous-dépassement</b> : un résultat trop grand devient ∞, trop petit devient sous-normal puis 0.</li>
</ul>
<h3>Comparer des flottants</h3>
<p>On n’écrit pas <code>a == b</code> pour des résultats de calculs. On teste un écart relatif ou absolu :</p>
<pre class="code">import math
math.isclose(0.1 + 0.2, 0.3)             # True (rel_tol = 1e-9 par défaut)
abs(a - b) &lt;= 1e-9 * max(abs(a), abs(b))  # tolérance relative
math.isclose(1e-12, 2e-12)               # False : b vaut le double de a
math.fsum([0.1] * 10)                    # 1.0 : somme corrigée</pre>
<p>Une tolérance <b>absolue</b> est adaptée quand on compare à 0 ; une tolérance <b>relative</b> quand l’ordre de grandeur varie.</p>
<h3>Bonnes pratiques</h3>
<ul><li>Utiliser des entiers (ou <code>fractions</code>, <code>decimal</code>) pour compter ou pour des montants.</li><li>Éviter de soustraire des nombres proches ; reformuler la formule.</li><li>Additionner les petits termes d’abord, ou utiliser <code>math.fsum</code>.</li><li>Ne jamais utiliser un flottant comme compteur de boucle avec <code>==</code>.</li></ul>
<div class="retain"><b>À retenir.</b> Chaque opération arrondit avec une erreur relative d’au plus 2<sup>−53</sup>. Les erreurs s’accumulent, et on compare avec une tolérance.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Bit, octet</dt><dd>Un chiffre binaire ; un groupe de 8 bits.</dd>
<dt>Complément à 2</dt><dd>Codage des entiers relatifs : le bit de gauche a le poids −2<sup>n−1</sup>.</dd>
<dt>Dépassement</dt><dd>Résultat hors de la plage représentable ; avec un entier de taille fixe il est silencieux.</dd>
<dt>Mantisse</dt><dd>Les chiffres significatifs d’un flottant, avec 1 implicite pour un normal.</dd>
<dt>Biais</dt><dd>Constante retranchée à l’exposant stocké (127 ou 1023).</dd>
<dt>Normal, sous-normal</dt><dd>Un normal a un 1 implicite ; un sous-normal (exposant nul) n’en a pas et représente de très petits nombres.</dd>
<dt>NaN</dt><dd>« Not a Number » : résultat d’une opération indéterminée ; différent de tout, y compris de lui-même.</dd>
<dt>ε machine</dt><dd>Écart entre 1 et le flottant suivant : 2<sup>−52</sup> en binary64.</dd>
<dt>ulp</dt><dd>Écart entre un flottant et son successeur.</dd>
<dt>Absorption</dt><dd>Perte d’un terme trop petit devant l’ulp de l’autre.</dd>
<dt>Annulation catastrophique</dt><dd>Perte de chiffres significatifs lors de la soustraction de nombres presque égaux.</dd>
</dl>` });

function renderAct() {

      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }

      q.o.forEach((o, j) => {
