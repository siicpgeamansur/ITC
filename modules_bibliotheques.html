<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Atelier Modules, bibliothèques et données</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : barre d'outils en haut, onglets d'ateliers, zone de travail blanche, panneau Activité à droite (feuille basse sur téléphone), vue Cours avec sommaire. */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--run:#2e8b3a;
  --node-stroke:#33475b;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
/* cours */
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
pre.code{font:12.5px/1.55 var(--font-mono);margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
/* ateliers */
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
.opts input[type=range]{width:200px;max-width:100%}
.opts input[type=text]{font-family:var(--font-mono);min-width:240px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.dwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.dt{border-collapse:collapse;width:100%;font-size:13.5px}
.dt th,.dt td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.dt thead th{background:var(--panel2);font-weight:600}
.dt td.m{font-family:var(--font-mono);font-size:12.5px}
.dt tr:last-child td{border-bottom:0}
/* spécifique modules */
.file-content{background:#f8f9fa;border:1px solid var(--line);border-radius:6px;padding:10px;font:12px/1.5 var(--font-mono);color:var(--muted);margin:8px 0;max-height:150px;overflow-y:auto}
.file-content span.line{display:block}
.file-content span.line.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.chart-container{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;margin:10px 0;display:flex;justify-content:center}
svg.chart{display:block;width:100%;max-width:500px;height:auto}
svg.chart .axis{stroke:#ccc}
svg.chart .bar{fill:var(--accent);opacity:.8;transition:opacity .2s}
svg.chart .bar:hover{opacity:1}
svg.chart .point{fill:var(--ok);stroke:#fff;stroke-width:1.5}
svg.chart .line{fill:none;stroke:var(--accent);stroke-width:2}
svg.chart .dot{fill:#fff;stroke:var(--accent);stroke-width:2}
svg.chart text{font-family:var(--font-ui);font-size:11px;fill:var(--muted)}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="14" width="4" height="9" fill="var(--accent)"/><rect x="9" y="9" width="4" height="14" fill="var(--ok)"/><rect x="15" y="5" width="4" height="18" fill="var(--warn)"/><path d="M21,14 L23,18 L21,22" fill="none" stroke="var(--bad)" stroke-width="2"/></svg><span>Atelier Modules, bibliothèques et données <small>ITC · CPGE 1<sup>re</sup> année</small></span></div>
    <div class="files">
      <button class="btn" id="bAct" type="button" aria-pressed="false">Activité</button>
      <button class="btn" id="bCourse" type="button" aria-pressed="false">Cours</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
    </div>
  </div></header>
  <div class="band" id="modes"><div class="inner row"><div class="seg" id="wsSeg" role="tablist" aria-label="Ateliers"></div></div></div>
  <main class="inner work" id="work">
    <section id="stage"><div id="hint"></div><div id="scroller"><div id="ws"></div></div></section>
    <aside id="act" hidden aria-label="Activité"></aside>
  </main>
  <section id="course" hidden aria-label="Cours"></section>
</div>
<div id="dlg" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-modules-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
const WORKSHOPS = [];

/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Code Python coloré (léger) */
function codeBlock(code, on) {
  const KW = /^(def|return|for|in|if|elif|else|while|not|raise|import|from|with|as|and|or|is|lambda|class|pass|break|continue|assert|try|except|finally|yield|None)$/;
  const BI = /^(print|len|range|set|dict|list|max|min|sum|id|hash|sorted|open|str|int|float|True|False|isinstance|TypeError|ValueError|Exception|AssertionError|abs|round|min|max|open|close|read|write|readlines)$/;
  const lines = code.split('\n').map(line => {
    let out = '', i = 0;
    while (i < line.length) {
      const ch = line[i];
      if (ch === '#') { out += '<span style="color:#7a7a88;font-style:italic">' + esc(line.slice(i)) + '</span>'; break; }
      if (ch === '"' || ch === "'") { let j = i + 1; while (j < line.length && line[j] !== ch) j++; out += '<span style="color:#1c6b40">' + esc(line.slice(i, j + 1)) + '</span>'; i = j + 1; continue; }
      let j = i; while (j < line.length && line[j] !== '#' && line[j] !== '"' && line[j] !== "'") j++;
      let seg = esc(line.slice(i, j)).replace(/\b([A-Za-z_]\w*|\d+(?:\.\d+)?)\b/g, m => /^\d/.test(m) ? '<span style="color:#b05a00">' + m + '</span>' : KW.test(m) ? '<span style="color:#7c3aa8">' + m + '</span>' : BI.test(m) ? '<span style="color:#1f3fa0">' + m + '</span>' : m);
      out += seg; i = j;
    }
    return out;
  });
  return '<pre class="code">' + lines.map((l, i) => '<span style="display:block;padding:0 ' + (on === i + 1 || (Array.isArray(on) && on.includes(i + 1)) ? '10px 0 10px;background:#fff3dc;border-left:3px solid #e08a00' : '10px') + ';white-space:pre">' + (l || ' ') + '</span>').join('') + '</pre>';
}

/* Petites pastilles cliquables (modules, fonctions, fichiers, types de graphique) */
function chipsRow(items, selected, onSelect, label) {
  const wrap = h('div', { class: 'chips', role: label ? 'group' : null, 'aria-label': label || null });
  items.forEach(([val, txt]) => {
    wrap.append(h('button', {
      type: 'button',
      class: 'chip' + (val === selected ? ' on' : ''),
      'aria-pressed': val === selected ? 'true' : 'false',
      onclick: () => onSelect(val)
    }, txt));
  });
  return wrap;
}

/* Grille de statistiques (label + valeur) pour l'atelier W3 */
function stats(pairs) {
  const frag = document.createDocumentFragment();
  pairs.forEach(([label, value]) => {
    frag.append(h('div', { class: 'stat' },
      h('span', null, label),
      h('b', null, value)
    ));
  });
  return frag;
}

/* ================= Atelier 1 : Modules mathématiques ================= */
const W1 = { module: 'math', func: 'sqrt', args: '16', result: null };
function mountW1(root) {
  root.innerHTML = '<h2>Modules mathématiques</h2><p>Python fournit des <b>modules</b> (bibliothèques) de fonctions prêtes à l\'emploi. On les importe avec <code>import</code> ou <code>from ... import</code>.</p>' +
    '<div class="opts"><div class="fld"><span>Module</span><div id="w1-module"></div></div><div class="fld"><span>Fonction</span><div id="w1-func"></div></div><label class="fld"><span>Arguments</span><input type="text" id="w1-args" value="16" style="width:120px"></label><button class="btn pri" id="w1-run" type="button">Exécuter</button></div>' +
    '<div class="verdict" id="w1-out"></div>' +
    '<h3>Code Python</h3><div id="w1-code"></div>' +
    '<h3>Différentes façons d\'importer</h3><div class="dwrap"><table class="dt"><thead><tr><th>Syntaxe</th><th>Utilisation</th></tr></thead><tbody>' +
      '<tr><td><code>import math</code></td><td><code>math.sqrt(16)</code></td></tr>' +
      '<tr><td><code>from math import sqrt</code></td><td><code>sqrt(16)</code></td></tr>' +
      '<tr><td><code>import math as m</code></td><td><code>m.sqrt(16)</code></td></tr>' +
      '<tr><td><code>from math import *</code></td><td><code>sqrt(16)</code> (à éviter)</td></tr>' +
      '</tbody></table></div>';
  const S = W1;
  $('#w1-module').append(chipsRow([['math', 'math'], ['random', 'random'], ['statistics', 'statistics']], S.module, v => { S.module = v; S.func = v === 'math' ? 'sqrt' : v === 'random' ? 'randint' : 'mean'; render(); }, 'Module'));
  const FUNCS = {
    math: ['sqrt', 'floor', 'ceil', 'sin', 'cos', 'pi'],
    random: ['randint', 'random', 'choice', 'shuffle'],
    statistics: ['mean', 'median', 'stdev']
  };
  function render() {
    $('#w1-func').innerHTML = '';
    $('#w1-func').append(chipsRow(FUNCS[S.module].map(f => [f, f]), S.func, v => { S.func = v; render(); }, 'Fonction'));
    const pyCode = {
      math: { sqrt: 'import math\nmath.sqrt(16)', floor: 'import math\nmath.floor(3.7)', ceil: 'import math\nmath.ceil(3.2)', sin: 'import math\nmath.sin(math.pi / 2)', cos: 'import math\nmath.cos(0)', pi: 'import math\nmath.pi' },
      random: { randint: 'import random\nrandom.randint(1, 10)', random: 'import random\nrandom.random()', choice: 'import random\nrandom.choice([1, 2, 3])', shuffle: 'import random\nL = [1, 2, 3]\nrandom.shuffle(L)' },
      statistics: { mean: 'import statistics\nstatistics.mean([1, 2, 3, 4])', median: 'import statistics\nstatistics.median([1, 2, 3, 4])', stdev: 'import statistics\nstatistics.stdev([1, 2, 3, 4])' }
    }[S.module][S.func];
    $('#w1-code').innerHTML = codeBlock(pyCode);
    $('#w1-run').onclick = () => {
      const out = $('#w1-out');
      let res = '';
      try {
        if (S.module === 'math') {
          const x = parseFloat($('#w1-args').value.replace(',', '.'));
          if (!isFinite(x) && S.func !== 'pi') throw new Error('Argument invalide');
          if (S.func === 'sqrt') res = Math.sqrt(x);
          else if (S.func === 'floor') res = Math.floor(x);
          else if (S.func === 'ceil') res = Math.ceil(x);
          else if (S.func === 'sin') res = Math.sin(x);
          else if (S.func === 'cos') res = Math.cos(x);
          else if (S.func === 'pi') res = Math.PI;
        } else if (S.module === 'random') {
          if (S.func === 'randint') {
            const parts = $('#w1-args').value.split(',').map(s => parseInt(s.trim(), 10));
            if (parts.length !== 2 || !isFinite(parts[0]) || !isFinite(parts[1])) throw new Error('Entrez deux entiers a, b');
            res = Math.floor(Math.random() * (parts[1] - parts[0] + 1)) + parts[0];
          } else if (S.func === 'random') res = Math.random();
          else if (S.func === 'choice') { const arr = [1, 2, 3, 4, 5]; res = arr[Math.floor(Math.random() * arr.length)]; }
          else if (S.func === 'shuffle') res = '[' + [1, 2, 3].sort(() => Math.random() - 0.5).join(', ') + ']';
        } else {
          const arr = $('#w1-args').value.split(',').map(s => parseFloat(s.trim())).filter(x => isFinite(x));
          if (!arr.length) throw new Error('Entrez une liste de nombres');
          const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
          if (S.func === 'mean') res = mean;
          else if (S.func === 'median') { const s = arr.slice().sort((a, b) => a - b); const m = Math.floor(s.length / 2); res = s.length % 2 === 0 ? (s[m - 1] + s[m]) / 2 : s[m]; }
          else if (S.func === 'stdev') {
            if (arr.length < 2) throw new Error('Il faut au moins 2 éléments');
            const v = arr.reduce((a, b) => a + (b - mean) ** 2, 0) / (arr.length - 1);
            res = Math.sqrt(v);
          }
        }
        out.className = 'verdict yes';
        out.innerHTML = 'Résultat : <b>' + (typeof res === 'number' ? res.toFixed(4).replace('.', ',') : res) + '</b>';
      } catch (e) {
        out.className = 'verdict no';
        out.textContent = 'Erreur : ' + e.message;
      }
    };
  }
  render();
}

const W3 = { data: '12, 15, 18, 9, 14, 12, 10, 18, 15, 16' };
function mountW3(root) {
  root.innerHTML = '<h2>Calculs statistiques</h2><p>Une fois les données lues, on calcule des statistiques : moyenne, médiane, écart-type. On peut utiliser la bibliothèque <code>statistics</code> ou coder les calculs à la main.</p>' +
    '<div class="opts"><label class="fld"><span>Données (séparées par des virgules)</span><input type="text" id="w3-data" class="mono" value="12, 15, 18, 9, 14, 12, 10, 18, 15, 16" style="width:300px"></label></div>' +
    '<div class="gstats" id="w3-stats"></div>' +
    '<div id="w3-out"></div>' +
    '<h3>Code Python</h3><div id="w3-code"></div>';
  function render() {
    const arr = $('#w3-data').value.split(',').map(s => parseFloat(s.trim())).filter(x => isFinite(x));
    if (!arr.length) { $('#w3-out').innerHTML = '<p class="verdict no">Entrée invalide.</p>'; return; }
    const n = arr.length;
    const sum = arr.reduce((a, b) => a + b, 0);
    const mean = sum / n;
    const sorted = arr.slice().sort((a, b) => a - b);
    const median = n % 2 === 0 ? (sorted[n / 2 - 1] + sorted[n / 2]) / 2 : sorted[Math.floor(n / 2)];
    const variance = arr.reduce((a, b) => a + (b - mean) ** 2, 0) / n;
    const stdev = Math.sqrt(variance);
    const min = Math.min(...arr), max = Math.max(...arr);
    $('#w3-stats').innerHTML = '';
    $('#w3-stats').append(stats([
      ['Effectif n', String(n)],
      ['Somme', String(sum)],
      ['Moyenne', mean.toFixed(2).replace('.', ',')],
      ['Médiane', median.toFixed(2).replace('.', ',')],
      ['Écart-type', stdev.toFixed(2).replace('.', ',')],
      ['Minimum', String(min)],
      ['Maximum', String(max)]
    ]));
    let html = '<h3>Comparaison : à la main vs bibliothèque</h3><div class="dwrap"><table class="dt"><thead><tr><th>Statistique</th><th>À la main</th><th>Avec statistics</th></tr></thead><tbody>' +
      '<tr><td>Moyenne</td><td class="m">' + mean.toFixed(2) + '</td><td class="m"><code>statistics.mean(L)</code></td></tr>' +
      '<tr><td>Médiane</td><td class="m">' + median.toFixed(2) + '</td><td class="m"><code>statistics.median(L)</code></td></tr>' +
      '<tr><td>Écart-type</td><td class="m">' + stdev.toFixed(2) + '</td><td class="m"><code>statistics.pstdev(L)</code></td></tr>' +
      '</tbody></table></div>';
    html += '<p class="small">La bibliothèque <code>statistics</code> fournit des fonctions optimisées. <code>pstdev</code> est l\'écart-type de population, <code>stdev</code> l\'écart-type d\'échantillon.</p>';
    $('#w3-out').innerHTML = html;
    $('#w3-code').innerHTML = codeBlock('import statistics\n\nL = [' + arr.join(', ') + ']\n\nprint(statistics.mean(L))\nprint(statistics.median(L))\nprint(statistics.pstdev(L))\n\n# Ou à la main\nn = len(L)\nmoyenne = sum(L) / n\nmediane = sorted(L)[n // 2]');
  }
  $('#w3-data').oninput = render;
  render();
}

function mountW4(root) {
  root.innerHTML = '<h2>Représentation graphique</h2><p>La bibliothèque <code>matplotlib</code> permet de tracer des graphiques (histogrammes, nuages de points, courbes) à partir des données.</p>' +
    '<div class="opts"><div class="fld"><span>Type de graphique</span><div id="w4-type"></div></div></div>' +
    '<div class="chart-container"><svg id="w4-chart" viewBox="0 0 500 250" class="chart"></svg></div>' +
    '<div class="dwrap" id="w4-data"></div>' +
    '<h3>Code Python</h3><div id="w4-code"></div>';
  const S = W4;
  $('#w4-type').append(chipsRow([['hist', 'Histogramme'], ['line', 'Courbe'], ['scatter', 'Nuage de points']], S.chart, v => { S.chart = v; render(); }, 'Type'));
  function render() {
    const data = S.data;
    const maxV = Math.max(...data, 1);
    const W = 500, H = 250, L = 40, R = 20, T = 20, B = 30;
    const scaleX = (W - L - R) / data.length;
    const scaleY = (H - T - B) / maxV;
    let svg = '';
    svg += '<line class="axis" x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '"/>';
    svg += '<line class="axis" x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '"/>';
    for (let i = 0; i <= 4; i++) {
      const y = H - B - (maxV / 4) * i * scaleY;
      svg += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#eee"/>';
      svg += '<text x="' + (L - 5) + '" y="' + (y + 3) + '" text-anchor="end">' + Math.round(maxV / 4 * i) + '</text>';
    }
    if (S.chart === 'hist') {
      data.forEach((v, i) => {
        const x = L + i * scaleX + scaleX * 0.15;
        const h = v * scaleY;
        svg += '<rect class="bar" x="' + x + '" y="' + (H - B - h) + '" width="' + (scaleX * 0.7) + '" height="' + h + '" rx="2"/>';
        svg += '<text x="' + (x + scaleX * 0.35) + '" y="' + (H - B + 12) + '" text-anchor="middle">' + (i + 1) + '</text>';
        svg += '<text x="' + (x + scaleX * 0.35) + '" y="' + (H - B - h - 5) + '" text-anchor="middle" font-weight="600">' + v + '</text>';
      });
    } else if (S.chart === 'line') {
      const pts = data.map((v, i) => [L + i * scaleX + scaleX / 2, H - B - v * scaleY]);
      svg += '<polyline class="line" points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>';
      pts.forEach((p, i) => {
        svg += '<circle class="dot" cx="' + p[0] + '" cy="' + p[1] + '" r="4"/>';
        svg += '<text x="' + p[0] + '" y="' + (H - B + 12) + '" text-anchor="middle">' + (i + 1) + '</text>';
      });
    } else {
      data.forEach((v, i) => {
        const x = L + (i + 0.5) * scaleX;
        const y = H - B - v * scaleY;
        svg += '<circle class="point" cx="' + x + '" cy="' + y + '" r="5"/>';
        svg += '<text x="' + x + '" y="' + (H - B + 12) + '" text-anchor="middle">' + (i + 1) + '</text>';
      });
    }
    $('#w4-chart').innerHTML = svg;
    let tbl = '<table class="dt"><thead><tr><th>Indice</th><th>Valeur</th></tr></thead><tbody>';
    data.forEach((v, i) => { tbl += '<tr><td class="m">' + (i + 1) + '</td><td class="m">' + v + '</td></tr>'; });
    tbl += '</tbody></table>';
    $('#w4-data').innerHTML = tbl;
    const codes = {
      hist: 'import matplotlib.pyplot as plt\n\ndata = [5, 10, 15, 20, 15, 10, 5]\nplt.bar(range(len(data)), data)\nplt.xlabel("Indice")\nplt.ylabel("Valeur")\nplt.show()',
      line: 'import matplotlib.pyplot as plt\n\ndata = [5, 10, 15, 20, 15, 10, 5]\nplt.plot(data, marker="o")\nplt.xlabel("Indice")\nplt.ylabel("Valeur")\nplt.show()',
      scatter: 'import matplotlib.pyplot as plt\n\n# Nuage de points : x et y en correspondance\nx = [1, 2, 3, 4, 5, 6, 7]\ny = [5, 10, 15, 20, 15, 10, 5]\nplt.scatter(x, y)\nplt.xlabel("x")\nplt.ylabel("y")\nplt.show()'
    };
    $('#w4-code').innerHTML = codeBlock(codes[S.chart]);
  }
  render();
}

<div class="retain"><b>À retenir.</b> <code>import</code> importe le module, <code>from ... import</code> importe une fonction. L'alias <code>as</code> raccourcit l'écriture.</div>` });

COURSE.push({ id: 'fichiers', t: 'Lecture de fichiers', h: `
<h3>Ouvrir un fichier</h3>
<p>La fonction <code>open</code> ouvre un fichier. On peut lire (<code>"r"</code>), écrire (<code>"w"</code>) ou ajouter (<code>"a"</code>).</p>
<pre class="code">with open("notes.txt", "r", encoding="utf-8") as f:
    contenu = f.read()</pre>
<p>Le bloc <code>with</code> garantit que le fichier est fermé à la fin.</p>
<h3>Lire ligne par ligne</h3>

with open("data.csv", "r") as f:

<div class="retain"><b>À retenir.</b> <code>with open(...) as f:</code> est la bonne manière de lire un fichier. Le module <code>csv</code> simplifie les fichiers structurés.</div>` });

COURSE.push({ id: 'statistiques', t: 'Calculs statistiques', h: `
<h3>Moyenne</h3>
<p>La moyenne de n valeurs est la somme divisée par n.</p>
<pre class="code">def moyenne(L):
    return sum(L) / len(L)</pre>
<h3>Médiane</h3>
<p>La médiane est la valeur centrale d'une liste triée. Si n est pair, c'est la moyenne des deux valeurs centrales.</p>
<pre class="code">def mediane(L):
    L = sorted(L)
    n = len(L)
    if n % 2 == 1:
        return L[n // 2]
    else:
        return (L[n // 2 - 1] + L[n // 2]) / 2</pre>
<h3>Écart-type</h3>
<p>L'écart-type mesure la dispersion autour de la moyenne.</p>
<pre class="code">def ecart_type(L):
    m = moyenne(L)
    return (sum((x - m) ** 2 for x in L) / len(L)) ** 0.5</pre>
<h3>Avec le module statistics</h3>
<pre class="code">import statistics

L = [1, 2, 3, 4, 5]
print(statistics.mean(L))     # moyenne
print(statistics.median(L))   # médiane
print(statistics.pstdev(L))   # écart-type de population</pre>
<div class="retain"><b>À retenir.</b> Le module <code>statistics</code> fournit des fonctions optimisées et bien testées.</div>` });

/* ---------- interface ---------- */
const UI = { cur: 'w1' };
const AS = { key: 'w1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'modules' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }

  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);

  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });

  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : modules, fichiers et données'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cbody'); if (sc) sc.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {

  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
