const COURSE = [];
COURSE.push({ id: 'modeliser', t: 'Modéliser un jeu', h: `
<p>On étudie les jeux où deux joueurs jouent <b>à tour de rôle</b>, voient toute la position (<b>information parfaite</b>), sans hasard, et dont les parties se terminent : échecs, dames, Puissance 4, Nim.</p>
<h3>Le graphe de jeu</h3>
<p>Un graphe de jeu est un graphe orienté G = (S, A). Ses sommets (les <b>positions</b>) sont partitionnés en deux ensembles :</p>
<div class="formula">S = S₁ ⊔ S₂ : S_i contient les positions où c’est au joueur i de jouer</div>
<p>Un arc s → t est un <b>coup</b>. Les sommets sans successeur forment l’ensemble F des <b>positions terminales</b> : chacune désigne un vainqueur (ou un match nul). Une <b>partie</b> est un chemin du graphe qui part de la position initiale s₀.</p>
<h3>Stratégie</h3>
<p>Une <b>stratégie</b> du joueur i est une application σ qui associe à chaque position de S_i non terminale l’un de ses successeurs. Elle est <b>gagnante depuis s</b> si toute partie issue de s où i joue selon σ est gagnée par i, quoi que fasse l’adversaire.</p>
<h3>Exemple : Nim</h3>
<p>Les positions sont le nombre d’allumettes restantes et les arcs vont de n à n − m, avec m une prise autorisée. Comme les deux joueurs ont les mêmes coups, on se contente de noter chaque position <b>G</b> (celui qui doit jouer gagne) ou <b>P</b> (il perd).</p>
<h3>Attention aux cycles</h3>
<p>Dans un graphe avec cycles, une partie peut ne jamais finir. On la déclare alors nulle, et il faut en tenir compte dans la définition de « position gagnante ».</p>
<div class="retain"><b>À retenir.</b> Un jeu à deux joueurs à information parfaite se représente par un graphe orienté dont les sommets sont partagés entre les deux joueurs. Une stratégie gagnante garantit la victoire contre toute défense.</div>` });

COURSE.push({ id: 'attracteurs', t: 'Attracteurs et positions gagnantes', h: `
<p>Pour savoir qui gagne depuis chaque position, on part des positions déjà gagnantes et on remonte les arcs. L’ensemble construit est l’<b>attracteur</b>.</p>
<h3>Définition</h3>
<p>Soit F_i l’ensemble des positions terminales gagnantes pour le joueur i.</p>
<div class="formula pre">Attr₀ = F_i
Attr_{k+1} = Attr_k
   ∪ { s ∈ S_i      | ∃ t ∈ succ(s), t ∈ Attr_k }
   ∪ { s ∈ S_{3-i}  | succ(s) ≠ ∅ et ∀ t ∈ succ(s), t ∈ Attr_k }
Attr = ⋃ Attr_k</div>
<p>Un sommet du joueur i entre dès qu’<b>un</b> de ses coups mène dans l’attracteur. Un sommet de l’adversaire n’entre que si <b>tous</b> ses coups y mènent.</p>
<h3>Théorème</h3>
<p>Depuis toute position de Attr(F_i), le joueur i possède une stratégie gagnante : il joue un coup qui mène à un rang strictement plus petit. Ce rang décroît à chaque coup, donc la partie se termine dans F_i.</p>
<p><b>Corollaire.</b> Si le graphe est fini, acyclique et sans match nul, chaque position est gagnante pour exactement un des deux joueurs.</p>
<h3>Programmer l’attracteur</h3>
<pre class="code">def attracteur(succ, proprio, cible):
    """succ : dict sommet -&gt; liste de successeurs
       proprio : dict sommet -&gt; 0 ou 1 (joueur qui joue en ce sommet)
       cible : terminaux gagnants pour le joueur 0"""
    attr = set(cible)
    change = True
    while change:
        change = False
        for s in succ:
            if s in attr:
                continue
            if proprio[s] == 0 and any(t in attr for t in succ[s]):
                attr.add(s); change = True
            elif proprio[s] == 1 and succ[s] and all(t in attr for t in succ[s]):
                attr.add(s); change = True
    return attr</pre>
<p>Cette version balaie tous les sommets à chaque tour : coût en O(|S|·(|S|+|A|)). En tenant à jour un compteur de successeurs restants pour chaque sommet, on obtient O(|S|+|A|).</p>
<div class="retain"><b>À retenir.</b> Position gagnante : j’ai un coup vers une position perdante pour l’autre. Position perdante : tous mes coups mènent à une position gagnante pour l’autre.</div>` });

COURSE.push({ id: 'minimax', t: 'Évaluer une position : minimax', h: `
<p>Dans la plupart des jeux, le graphe est trop grand pour calculer l’attracteur complet. On explore l’arbre des coups jusqu’à une <b>profondeur p</b> et on évalue les feuilles avec une <b>heuristique</b> h, valeur du point de vue de Max : grande si Max est bien placé.</p>
<h3>Valeur minimax</h3>
<div class="formula pre">v(s, p) = h(s)                              si p = 0 ou s terminal
v(s, p) = max { v(t, p-1) | t ∈ succ(s) }   si c’est à Max de jouer
v(s, p) = min { v(t, p-1) | t ∈ succ(s) }   si c’est à Min de jouer</div>
<p>Max choisit le coup qui maximise la valeur, Min celui qui la minimise. On dessine un nœud Max par △ et un nœud Min par ▽.</p>
<pre class="code">def minimax(s, p, est_max):
    if p == 0 or terminal(s):
        return h(s)
    valeurs = [minimax(t, p - 1, not est_max) for t in successeurs(s)]
    return max(valeurs) if est_max else min(valeurs)</pre>
<h3>Coût</h3>
<ul><li><b>Temps</b> : avec b coups par position, on visite O(b<sup>p</sup>) nœuds.</li><li><b>Espace</b> : O(p), puisque l’exploration est en profondeur.</li><li><b>Négamax</b> : si h est antisymétrique, v(s) = max<sub>t</sub> −v(t) ; un seul cas à écrire.</li></ul>
<table class="ctable"><thead><tr><th>b</th><th>p</th><th>Feuilles b<sup>p</sup></th></tr></thead><tbody><tr><td>3</td><td>3</td><td>27</td></tr><tr><td>10</td><td>6</td><td>1 000 000</td></tr><tr><td>30</td><td>6</td><td>729 000 000</td></tr></tbody></table>
<div class="retain"><b>À retenir.</b> La valeur d’un nœud est toujours la valeur d’un de ses fils. Le coup à jouer est celui qui mène à ce fils.</div>` });

COURSE.push({ id: 'alphabeta', t: 'Élaguer : alpha-bêta', h: `
<p>Minimax évalue des branches dont on peut prouver qu’elles ne changeront pas le résultat. L’élagage α–β les saute.</p>
<h3>Les deux bornes</h3>
<p>α est la meilleure valeur que Max est déjà sûr d’obtenir sur le chemin menant au nœud. β est la meilleure valeur (la plus basse) que Min est déjà sûr d’obtenir. On démarre avec α = −∞ et β = +∞.</p>
<p><b>Coupure</b> dès que α ≥ β : l’adversaire ne laissera jamais la partie arriver ici, les fils restants sont ignorés. On parle de coupure β sur un nœud Max et de coupure α sur un nœud Min.</p>
<pre class="code">def alphabeta(s, p, alpha, beta, est_max):
    if p == 0 or terminal(s):
        return h(s)
    if est_max:
        v = float('-inf')
        for t in successeurs(s):
            v = max(v, alphabeta(t, p - 1, alpha, beta, False))
            alpha = max(alpha, v)
            if alpha &gt;= beta:
                break              # coupure beta
        return v
    v = float('inf')
    for t in successeurs(s):
        v = min(v, alphabeta(t, p - 1, alpha, beta, True))
        beta = min(beta, v)
        if alpha &gt;= beta:
            break                  # coupure alpha
    return v</pre>
<h3>Efficacité</h3>
<ul><li>Le résultat est <b>identique</b> à celui de minimax : seul le nombre de nœuds visités change.</li><li>Pire cas (mauvais ordre des fils) : O(b<sup>p</sup>).</li><li>Meilleur cas (meilleurs coups examinés en premier) : O(b<sup>p/2</sup>), ce qui permet de chercher environ deux fois plus profond à temps égal.</li><li>En pratique, on trie les coups avec une heuristique avant de les explorer.</li></ul>
<div class="retain"><b>À retenir.</b> Alpha-bêta donne la même valeur que minimax en visitant moins de nœuds. Son efficacité dépend de l’ordre dans lequel on examine les fils.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Position</dt><dd>Sommet du graphe de jeu : état de la partie, avec le joueur dont c’est le tour.</dd>
<dt>Coup</dt><dd>Arc du graphe, qui mène d’une position à une autre.</dd>
<dt>Position terminale</dt><dd>Position sans coup possible : elle désigne le vainqueur ou un match nul.</dd>
<dt>Stratégie</dt><dd>Règle qui indique le coup à jouer dans chaque position du joueur.</dd>
<dt>Stratégie gagnante</dt><dd>Stratégie qui gagne contre toute défense de l’adversaire.</dd>
<dt>Attracteur</dt><dd>Ensemble des positions depuis lesquelles un joueur peut forcer la victoire.</dd>
<dt>Heuristique</dt><dd>Fonction qui estime la valeur d’une position non terminale.</dd>
<dt>Minimax</dt><dd>Calcul de la valeur d’une position en alternant maximum (Max) et minimum (Min).</dd>
<dt>Alpha-bêta</dt><dd>Version de minimax qui ignore les branches inutiles grâce aux bornes α et β.</dd>
<dt>Coupure</dt><dd>Arrêt de l’exploration des fils d’un nœud lorsque α ≥ β.</dd>
</dl>` });

/* ---------- interface ---------- */
const UI = { cur: 'g1' };
const AS = { key: 'g1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'modeliser' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }

function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}

function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open; box.classList.toggle('sheet', AS.open && isSmall());
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() {
  if (CS.open) { CS.open = false; renderCourse(); }
  AS.open = !AS.open; renderAct();
}
$('#bAct').addEventListener('click', actToggle);

/* ---------- cours ---------- */
function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : la théorie des jeux'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

/* ---------- aide ---------- */
function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Trois ateliers sur la théorie des jeux à deux joueurs (ITC, CPGE PSI*) : jeu de Nim et attracteurs, minimax, élagage alpha-bêta. Les jeux sont volontairement simples pour voir les algorithmes à l’œuvre.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> détaille toutes les notions.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});

/* ---------- démarrage ---------- */
(function init() {
  AS.open = !isSmall();
  renderSeg(); mountWs(); renderAct(); renderCourse();
})();
</script>
