/* Mise en page : barre d'outils en haut, onglets d'ateliers, zone de travail blanche, panneau Activité à droite (feuille basse sur téléphone), vue Cours avec sommaire. */
*{box-sizing:border-box}

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-graphes-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
const WORKSHOPS = [];

/*LOGIC-START*/
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Graphes de démonstration */
const GRAPHS = {

    pos: { A: [70, 160], B: [200, 60], C: [200, 250], D: [390, 70], E: [340, 200], F: [480, 200], G: [520, 320], H: [620, 280] }
  },

    edges: [['S', 'A', 2], ['S', 'B', 4], ['A', 'B', 1], ['A', 'C', 5], ['B', 'C', 2], ['C', 'D', 2], ['C', 'E', 3], ['D', 'E', 2], ['D', 'T', 5], ['E', 'T', 3]],
    pos: { S: [60, 170], A: [180, 80], B: [180, 260], C: [320, 170], D: [450, 100], E: [450, 240], T: [580, 170] },

/* Génère un arbre binaire complet selon le nombre de sommets souhaité */
function generateTree(n) {
  const nodes = Array.from({ length: n }, (_, i) => String(i + 1));
  const edges = [];
  const pos = {};

  let maxLvl = 0;
  for (let i = 0; i < n; i++) {
    const lvl = Math.floor(Math.log2(i + 1));
    if (lvl > maxLvl) maxLvl = lvl;
  }

  const W = 640, H = 360;
  const topPad = 50, botPad = 50;
  const yStep = maxLvl > 0 ? (H - topPad - botPad) / maxLvl : 0;

  for (let i = 0; i < n; i++) {
    const lvl = Math.floor(Math.log2(i + 1));
    const posInLvl = i - (Math.pow(2, lvl) - 1);
    const totalInLvl = Math.pow(2, lvl);

    const spacing = W / (totalInLvl + 1);
    const x = spacing * (posInLvl + 1);
    const y = topPad + lvl * yStep;

    pos[String(i + 1)] = [x, y];

    if (i > 0) {
      const parent = Math.floor((i - 1) / 2);
      edges.push([String(parent + 1), String(i + 1), 1]);
    }
  }

  return { name: 'Arbre binaire', directed: false, nodes, edges, pos };
}

/* Construction de la liste d'adjacence */
function buildAdj(g) {
  const adj = new Map();
  for (const n of g.nodes) adj.set(n, new Map());
  for (const [u, v, w] of g.edges) {
    if (!adj.has(u)) adj.set(u, new Map());
    if (!adj.has(v)) adj.set(v, new Map());
    adj.get(u).set(v, w);
    if (!g.directed) adj.get(v).set(u, w);
  }
  return adj;
}
/* matrice d'adjacence */
function buildMatrix(g) {
  const idx = new Map(g.nodes.map((n, i) => [n, i]));
  const n = g.nodes.length;
  const M = Array.from({ length: n }, () => new Array(n).fill(null));
  for (const [u, v, w] of g.edges) {
    M[idx.get(u)][idx.get(v)] = w;
    if (!g.directed) M[idx.get(v)][idx.get(u)] = w;
  }
  return { M, idx };
}
/* BFS : parcours en largeur, renvoie l'ordre et les parents */
function bfs(g, start) {
  const adj = buildAdj(g), order = [], parent = new Map(), dist = new Map();
  const queue = [start]; dist.set(start, 0);
  const seen = new Set([start]);
  while (queue.length) {
    const u = queue.shift(); order.push(u);
    for (const v of adj.get(u).keys()) {
      if (!seen.has(v)) { seen.add(v); parent.set(v, u); dist.set(v, dist.get(u) + 1); queue.push(v); }
    }
  }
  return { order, parent, dist };
}
/* DFS récursif : ordre, parents, cycles */
function dfs(g, start) {
  const adj = buildAdj(g), order = [], parent = new Map(), seen = new Set(), cycle = [];
  const stack = [start]; seen.add(start);
  while (stack.length) {
    const u = stack.pop(); order.push(u);
    for (const v of adj.get(u).keys()) {
      if (!seen.has(v)) { seen.add(v); parent.set(v, u); stack.push(v); }
    }
  }
  return { order, parent };
}
/* connectivité et détection de cycle */
function components(g) {
  const adj = buildAdj(g), seen = new Set(), comps = [];
  for (const n of g.nodes) {
    if (seen.has(n)) continue;
    const comp = [], queue = [n]; seen.add(n);
    while (queue.length) {
      const u = queue.shift(); comp.push(u);
      for (const v of adj.get(u).keys()) if (!seen.has(v)) { seen.add(v); queue.push(v); }
    }
    comps.push(comp);
  }
  return comps;
}
function hasCycle(g) {
  const adj = buildAdj(g), seen = new Set();
  const rec = (u, p) => {
    seen.add(u);
    for (const v of adj.get(u).keys()) {
      if (!seen.has(v)) { if (rec(v, u)) return true; }
      else if (v !== p) return true;
    }
    return false;
  };
  for (const n of g.nodes) if (!seen.has(n)) if (rec(n, null)) return true;
  return false;
}
/* Dijkstra avec file de priorité naïve (minimum par recherche) */
function dijkstra(g, start) {
  const adj = buildAdj(g), dist = new Map(), parent = new Map(), steps = [];
  for (const n of g.nodes) dist.set(n, Infinity);
  dist.set(start, 0);
  const visited = new Set();
  while (visited.size < g.nodes.length) {
    let u = null, dmin = Infinity;
    for (const n of g.nodes) if (!visited.has(n) && dist.get(n) < dmin) { dmin = dist.get(n); u = n; }
    if (u === null) break;
    visited.add(u);
    steps.push({ u, dist: new Map(dist), visited: new Set(visited), parent: new Map(parent), phase: 'extract' });
    for (const [v, w] of adj.get(u)) {
      if (dist.get(u) + w < dist.get(v)) {
        dist.set(v, dist.get(u) + w); parent.set(v, u);
        steps.push({ u, v, w, dist: new Map(dist), visited: new Set(visited), parent: new Map(parent), phase: 'relax' });
      }
    }
  }
  return { dist, parent, steps };
}
/* A* avec heuristique */
function astar(g, start, goal) {
  const adj = buildAdj(g), h = g.heur || {}, dist = new Map(), parent = new Map(), steps = [];
  for (const n of g.nodes) dist.set(n, Infinity);
  dist.set(start, 0);
  const open = new Set([start]), closed = new Set();
  while (open.size) {
    let u = null, fmin = Infinity;
    for (const n of open) { const f = dist.get(n) + (h[n] || 0); if (f < fmin) { fmin = f; u = n; } }
    if (u === null) break;
    open.delete(u);
    if (u === goal) { steps.push({ u, dist: new Map(dist), open: new Set(open), closed: new Set(closed), parent: new Map(parent), phase: 'goal' }); break; }
    closed.add(u);
    steps.push({ u, dist: new Map(dist), open: new Set(open), closed: new Set(closed), parent: new Map(parent), phase: 'extract' });
    for (const [v, w] of adj.get(u)) {
      if (closed.has(v)) continue;
      if (dist.get(u) + w < dist.get(v)) {
        dist.set(v, dist.get(u) + w); parent.set(v, u);
        open.add(v);
        steps.push({ u, v, w, dist: new Map(dist), open: new Set(open), closed: new Set(closed), parent: new Map(parent), phase: 'relax' });
      }
    }
  }
  return { dist, parent, steps };
}
/* reconstruire le chemin à partir des parents — [FIX] garde-fou contre les cycles */
function pathTo(parent, goal) {
  const path = []; let cur = goal; let guard = 0;
  while (cur !== undefined && guard++ < 1000) { path.push(cur); cur = parent.get(cur); }
  return path.reverse();
}
/* [FIX] Calcule l'ensemble « en attente » (dans la file de priorité) pour un état Dijkstra. */
function dijkstraFrontier(st, nodes) {
  if (!st || !st.dist || !st.visited) return new Set();
  const f = new Set();
  for (const n of nodes) {
    const d = st.dist.get(n);
    if (d !== undefined && d !== Infinity && !st.visited.has(n)) f.add(n);
  }
  return f;
}

/* Génère le tableau d'évolution des distances (comme sur l'image) */
function buildHistoryTable(steps, g, start, finalDist, finalParent, currentIdx) {
  let historyHtml = '<div class="dwrap"><table class="dt"><thead><tr><th>E</th>';
  g.nodes.forEach(n => historyHtml += '<th>' + esc(n) + '</th>');
  historyHtml += '</tr></thead><tbody>';

  // Étape 0 : initialisation
  historyHtml += '<tr><td>0</td>';
  g.nodes.forEach(n => {
    historyHtml += '<td class="m">' + (n === start ? '0' : '∞') + '</td>';
  });
  historyHtml += '</tr>';

  // On ne garde que les étapes "extract" et "goal"
  const finalSteps = [];
  for (let i = 0; i < steps.length; i++) {
    if (steps[i].phase === 'extract' || steps[i].phase === 'goal') {
      finalSteps.push(i);
    }
  }

  for (let i = 0; i < finalSteps.length; i++) {
    const stepIdx = finalSteps[i];
    
    // LE FIX EST ICI : on arrête la construction du tableau si on a dépassé l'étape courante
    if (stepIdx > currentIdx) break; 

    const step = steps[stepIdx];
    const u = step.u;
    const visited = new Set(step.visited || step.closed || []);
    visited.add(u); // Le sommet extrait est définitif

    // Trouver l'état après les relaxations (c'est l'état de l'étape suivante, ou l'état final)
    let nextStepIdx = stepIdx + 1;
    while (nextStepIdx < steps.length && steps[nextStepIdx].phase === 'relax') {
      nextStepIdx++;
    }
    let d_map, p_map;
    if (nextStepIdx < steps.length) {
      d_map = steps[nextStepIdx].dist;
      p_map = steps[nextStepIdx].parent;
    } else {
      d_map = finalDist;
      p_map = finalParent;
    }

    // Surligner la ligne correspondant à l'étape en cours d'affichage
    const nextFinalStepIdx = (i + 1 < finalSteps.length) ? finalSteps[i+1] : steps.length;
    const isCurrent = (currentIdx >= stepIdx && currentIdx < nextFinalStepIdx);
    const rowStyle = isCurrent ? ' style="background:var(--accent-soft)"' : '';

    historyHtml += '<tr' + rowStyle + '><td>' + (i + 1) + '</td>';
    g.nodes.forEach(n => {
      let cell = '';
      const d = d_map.get(n);
      const parent = p_map.get(n);
      if (visited.has(n)) {
        cell = '•';
      } else if (d !== Infinity && d !== undefined) {
        cell = d + '<sub>' + (parent || '?') + '</sub>';
      } else {
        cell = '∞';
      }
      historyHtml += '<td class="m">' + cell + '</td>';
    });
    historyHtml += '</tr>';
  }
  historyHtml += '</tbody></table></div>';
  return historyHtml;
}

function stats(list) {

function codeBlock(code, on) {
  const KW = /^(def|return|for|in|if|elif|else|while|not|raise|import|from|with|as|and|or|is|lambda|class|pass|break|continue)$/;
  const BI = /^(print|len|range|set|dict|list|max|min|sum|id|hash|sorted|open|str|int|float|None|True|False|deque|heappush|heappop|isinf|heapify|append|appendleft|popleft)$/;
  const lines = code.split('\n').map(line => {
    let out = '', i = 0;
    while (i < line.length) {
      const ch = line[i];
      if (ch === '#') { out += '<span style="color:#7a7a88;font-style:italic">' + esc(line.slice(i)) + '</span>'; break; }
      if (ch === '"' || ch === "'") { let j = i + 1; while (j < line.length && line[j] !== ch) j++; out += '<span style="color:#1c6b40">' + esc(line.slice(i, j + 1)) + '</span>'; i = j + 1; continue; }
      let j = i; while (j < line.length && line[j] !== '#' && line[j] !== '"' && line[j] !== "'") j++;
      let seg = esc(line.slice(i, j)).replace(/\b([A-Za-z_]\w*|\d+(?:\.\d+)?)\b/g, m => /^\d/.test(m) ? '<span style="color:#b05a00">' + m + '</span>' : KW.test(m) ? '<span style="color:#7c3aa8">' + m + '</span>' : BI.test(m) ? '<span style="color:#1f3fa0">' + m + '</span>' : m);
      out += seg; i = j;
    }
    return out;
  });
  return '<pre class="code">' + lines.map((l, i) => '<span style="display:block;padding:0 ' + (on === i + 1 || (Array.isArray(on) && on.includes(i + 1)) ? '10px 0 10px;background:#fff3dc;border-left:3px solid #e08a00' : '10px') + ';white-space:pre">' + (l || ' ') + '</span>').join('') + '</pre>';
}

function drawGraph(svg, g, opts) {
  const o = opts || {};
  const pos = g.pos || {};
  const nodes = g.nodes.filter(n => pos[n]);
  const adj = buildAdj(g);
  const visited = o.visited || new Set();
  const frontier = o.frontier || new Set();
  const current = o.current;
  const final = o.final || new Set();
  const treeEdges = o.treeEdges || new Set();
  const pathEdges = o.pathEdges || new Set();
  const relaxEdge = o.relaxEdge;
  const dist = o.dist;
  const showWeights = g.edges.some(e => e[2] !== 1);
  let s = '<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a94a0"/></marker><marker id="arrT" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="' + '#2e6da4' + '"/></marker><marker id="arrP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="' + '#1e7a2e' + '"/></marker></defs>';
  const drawn = new Set();
  g.edges.forEach(([u, v, w]) => {
    if (!pos[u] || !pos[v]) return;
    const key = g.directed ? u + '>' + v : [u, v].sort().join('|');
    if (drawn.has(key)) return; drawn.add(key);
    const [x1, y1] = pos[u], [x2, y2] = pos[v];
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const r = 20;
    const ax = x1 + ux * r, ay = y1 + uy * r, bx = x2 - ux * r, by = y2 - uy * r;
    let cls = 'gedge';
    if (treeEdges.has(key)) cls += ' tree';
    if (pathEdges.has(key)) cls += ' path';
    if (relaxEdge && ((relaxEdge[0] === u && relaxEdge[1] === v) || (!g.directed && relaxEdge[0] === v && relaxEdge[1] === u))) cls += ' relax';
    const marker = cls.includes('path') ? 'url(#arrP)' : cls.includes('tree') ? 'url(#arrT)' : 'url(#arr)';
    s += '<line class="' + cls + '" x1="' + ax + '" y1="' + ay + '" x2="' + bx + '" y2="' + by + '"' + (g.directed ? ' marker-end="' + marker + '"' : '') + '/>';
    if (showWeights) {
      const mx = (x1 + x2) / 2 - uy * 10, my = (y1 + y2) / 2 + ux * 10;
      s += '<text class="gweight" x="' + mx + '" y="' + my + '">' + w + '</text>';
    }
  });
  nodes.forEach(n => {
    const [x, y] = pos[n];
    let cls = 'gnode';
    if (final.has(n)) cls += ' final';
    else if (current === n) cls += ' current';
    else if (frontier.has(n)) cls += ' frontier';
    else if (visited.has(n)) cls += ' visited';

    let style = '';
    if (o.nodeColor) style += 'fill:' + o.nodeColor(n) + ';';
    if (o.nodeStroke) style += 'stroke:' + o.nodeStroke(n) + ';';
    if (o.nodeStrokeWidth) style += 'stroke-width:' + o.nodeStrokeWidth(n) + ';';

    s += '<circle class="' + cls + '" cx="' + x + '" cy="' + y + '" r="20"' + (style ? ' style="' + style + '"' : '') + '/>';
    s += '<text class="glabel" x="' + x + '" y="' + y + '">' + esc(n) + '</text>';
    if (dist && dist.get(n) !== undefined && dist.get(n) !== Infinity) {
      s += '<text class="gdist" x="' + x + '" y="' + (y - 28) + '">' + dist.get(n) + '</text>';
    }
  });
  svg.innerHTML = s;
}

    '<div class="legend"><span><i></i>non visité</span><span><i class="f"></i>dans la file / pile</span><span><i class="v"></i>visité</span><span><i class="c"></i>courant</span><span><i class="t"></i>arête de l\'arbre</span></div>' +
    '<div class="verdict" id="w2-msg" aria-live="polite"></div>' +
    '<div class="gstats" id="w2-stats"></div>' +
    '<div id="w2-queue"></div>' +
    '<h3>Code Python</h3><div id="w2-code"></div>';
  const S = W2;
  $('#w2-tree-n').addEventListener('input', (e) => {

  });
  function stop() { if (S.timer) { clearInterval(S.timer); S.timer = null; } const b = $('#w2-play'); if (b) b.textContent = 'Lecture'; }
  function buildFrames() {
    const g = S.graph === 'tree' ? generateTree(S.treeN) : GRAPHS[S.graph];
    const adj = buildAdj(g);
    const frames = [];
    if (S.mode === 'bfs') {
      const queue = [S.start], dist = new Map([[S.start, 0]]), parent = new Map(), visited = new Set(), treeEdges = new Set();
      frames.push({ queue: queue.slice(), visited: new Set(visited), current: null, treeEdges: new Set(treeEdges), msg: 'File initiale : [' + S.start + ']. On retire le premier, on ajoute ses voisins non visités à la fin.' });
      while (queue.length) {
        const u = queue.shift();
        visited.add(u);
        const newV = [];
        for (const [v] of adj.get(u)) {
          if (!visited.has(v) && !queue.includes(v)) { queue.push(v); parent.set(v, u); dist.set(v, dist.get(u) + 1); treeEdges.add([u, v].sort().join('|')); newV.push(v); }
        }
        frames.push({ queue: queue.slice(), visited: new Set(visited), current: u, treeEdges: new Set(treeEdges), dist: new Map(dist), msg: 'On extrait ' + u + '. Voisins ajoutés à la file : ' + (newV.length ? newV.join(', ') : 'aucun (tous déjà visités ou dans la file).') });
      }
      frames.push({ queue: [], visited: new Set(visited), current: null, treeEdges: new Set(treeEdges), dist: new Map(dist), msg: 'Parcours terminé. Ordre des distances depuis ' + S.start + ' : ' + Array.from(dist.entries()).map(([k, v]) => k + ' (' + v + ')').join(', ') + '.' });
      return { frames, parent, dist, order: Array.from(visited) };
    } else {
      const stack = [S.start], seen = new Set(), treeEdges = new Set(), order = [];
      frames.push({ stack: stack.slice(), visited: new Set(seen), current: null, treeEdges: new Set(treeEdges), msg: 'Pile initiale : [' + S.start + ']. On retire le sommet en haut de la pile, on empile ses voisins non visités.' });
      while (stack.length) {
        const u = stack.pop();
        if (seen.has(u)) continue;
        seen.add(u); order.push(u);
        const newV = [];
        for (const [v] of adj.get(u)) {
          if (!seen.has(v)) { stack.push(v); treeEdges.add([u, v].sort().join('|')); newV.push(v); }
        }
        frames.push({ stack: stack.slice(), visited: new Set(seen), current: u, treeEdges: new Set(treeEdges), msg: 'On dépile ' + u + '. Voisins empilés : ' + (newV.length ? newV.reverse().join(', ') : 'aucun.') });
      }
      frames.push({ stack: [], visited: new Set(seen), current: null, treeEdges: new Set(treeEdges), msg: 'Parcours terminé. Ordre de visite : ' + order.join(' → ') + '.' });
      return { frames, parent: new Map(), dist: null, order };
    }
  }
  function render() {
    $('#w2-g').innerHTML = '';
    $('#w2-g').append(chipsRow([['simple', 'Non orienté'], ['oriente', 'Orienté'], ['cycle', 'Avec cycles'], ['tree', 'Arbre']], S.graph, v => { S.graph = v; S.start = v === 'tree' ? '1' : GRAPHS[v].nodes[0]; S.step = 0; S.frames = null; stop(); render(); }, 'Graphe'));
    const treeCtrl = $('#w2-tree-ctrl');
    if (S.graph === 'tree') treeCtrl.style.display = 'flex';
    else treeCtrl.style.display = 'none';

    $('#w2-s').innerHTML = '';
    $('#w2-s').append(chipsRow(g.nodes.map(n => [n, n]), S.start, v => { S.start = v; S.step = 0; S.frames = null; stop(); render(); }, 'Départ'));
    $('#w2-m').innerHTML = '';
    $('#w2-m').append(chipsRow([['bfs', 'Largeur (BFS)'], ['dfs', 'Profondeur (DFS)']], S.mode, v => { S.mode = v; S.step = 0; S.frames = null; stop(); render(); }, 'Algorithme'));
    if (!S.frames) S.frames = buildFrames();
    const f = S.frames.frames[S.step];
    const frontier = new Set(f.queue || f.stack || []);
    drawGraph($('#w2-svg'), g, { visited: f.visited, frontier, current: f.current, treeEdges: f.treeEdges, dist: f.dist });
    const last = S.step === S.frames.frames.length - 1;
    $('#w2-msg').className = 'verdict' + (last ? ' yes' : '');
    $('#w2-msg').innerHTML = '<b>Étape ' + S.step + ' / ' + (S.frames.frames.length - 1) + '.</b> ' + f.msg;
    $('#w2-stats').innerHTML = '';
    $('#w2-stats').append(stats([
      ['Structure', S.mode === 'bfs' ? 'file (FIFO)' : 'pile (LIFO)'],
      ['Contenu', (f.queue || f.stack || []).join(' , ') || '—'],
      ['Taille', String((f.queue || f.stack || []).length)],
      ['Visités', String(f.visited.size)]
    ]));
    $('#w2-queue').innerHTML = S.mode === 'bfs'
      ? '<p class="small">La <b>file</b> est lue de la gauche (tête) vers la droite (queue) : on retire en tête et on ajoute en queue.</p>'
      : '<p class="small">La <b>pile</b> est lue de la droite (sommet) vers la gauche : on dépile et on empile au même endroit.</p>';
    $('#w2-code').innerHTML = codeBlock(S.mode === 'bfs'
      ? 'from collections import deque\n\ndef bfs(G, s):\n    file = deque([s])\n    vus = {s}\n    while file:\n        u = file.popleft()\n        for v in G[u]:\n            if v not in vus:\n                vus.add(v)\n                file.append(v)\n    return vus'
      : 'def dfs(G, s):\n    pile = [s]\n    vus = set()\n    while pile:\n        u = pile.pop()\n        if u in vus:\n            continue\n        vus.add(u)\n        for v in G[u]:\n            if v not in vus:\n                pile.append(v)\n    return vus', f.current ? (S.mode === 'bfs' ? 8 : 4) : null);
    $('#w2-prev').disabled = S.step === 0;
    $('#w2-next').disabled = last;
  }
  $('#w2-prev').addEventListener('click', () => { stop(); if (S.step > 0) { S.step--; render(); } });
  $('#w2-next').addEventListener('click', () => { stop(); if (S.step < S.frames.frames.length - 1) { S.step++; render(); } });
  $('#w2-reset').addEventListener('click', () => { stop(); S.step = 0; render(); });
  $('#w2-play').addEventListener('click', () => {
    if (S.timer) { stop(); return; }
    if (S.step >= S.frames.frames.length - 1) S.step = 0;
    $('#w2-play').textContent = 'Pause';
    S.timer = setInterval(() => { if (S.step >= S.frames.frames.length - 1) { stop(); render(); return; } S.step++; render(); }, 800);
    render();
  });
  render();
}

/* ================= Atelier 3 : connexité et cycles ================= */
const W3 = { graph: 'cycle', start: '1' };
function mountW3(root) {
  root.innerHTML = '<h2>Connexité et détection de cycles</h2><p>Un parcours permet de tester deux propriétés fondamentales : la <b>connexité</b> (un seul parcours visite tous les sommets) et l\'existence de <b>cycles</b> (chemin qui revient à son point de départ).</p>' +
    '<div class="opts"><div class="fld"><span>Graphe</span><div id="w3-g"></div></div></div>' +
    '<div class="gwrap"><svg id="w3-svg" viewBox="0 0 640 360"></svg></div>' +
    '<div class="gstats" id="w3-stats"></div>' +
    '<div id="w3-comp"></div>' +
    '<h3>Code Python</h3><div id="w3-code"></div>';
  const S = W3;
  function render() {
    $('#w3-g').innerHTML = '';
    $('#w3-g').append(chipsRow([['simple', 'Non orienté'], ['cycle', 'Deux triangles'], ['oriente', 'Orienté']], S.graph, v => { S.graph = v; render(); }, 'Graphe'));
    const g = GRAPHS[S.graph];
    const comps = components(g), adj = buildAdj(g);
    const colors = ['#2e6da4', '#1e7a2e', '#9a5b00', '#7b4fc2', '#c0281f'];
    const compOf = new Map();
    comps.forEach((c, i) => c.forEach(n => compOf.set(n, i)));
    drawGraph($('#w3-svg'), g, {
      nodeColor: n => colors[(compOf.get(n) || 0) % colors.length] + '22',
      nodeStroke: n => colors[(compOf.get(n) || 0) % colors.length],
      nodeStrokeWidth: () => 2.5
    });
    const cyc = hasCycle(g);
    $('#w3-stats').innerHTML = '';
    $('#w3-stats').append(stats([
      ['Composantes connexes', String(comps.length)],
      ['Graphe connexe', comps.length === 1 ? 'oui' : 'non'],
      ['Cycle détecté', cyc ? 'oui' : 'non'],
      ['Sommets visités', String(g.nodes.length)]
    ]));
    let html = '<h3>Composantes connexes</h3>';
    comps.forEach((c, i) => { html += '<p><b style="color:' + colors[i % colors.length] + '">Composante ' + (i + 1) + '</b> : ' + c.join(', ') + ' (' + c.length + ' sommet' + (c.length > 1 ? 's' : '') + ').</p>'; });
    html += '<h3>Détection de cycle</h3><p>Un parcours en profondeur détecte un cycle quand il rencontre un voisin déjà visité qui n\'est pas le parent du sommet courant.</p>';
    if (cyc) {
      const seen = new Set(), parent = new Map();
      let cycleFound = null;
      const dfsCycle = (u, p) => {
        seen.add(u); parent.set(u, p);
        for (const v of adj.get(u).keys()) {
          if (!seen.has(v)) { const r = dfsCycle(v, u); if (r) return r; }
          else if (v !== p) { return { u, v }; }
        }
        return null;
      };
      for (const n of g.nodes) if (!seen.has(n)) { cycleFound = dfsCycle(n, null); if (cycleFound) break; }
      if (cycleFound) {
        const path = [cycleFound.v]; let cur = cycleFound.u;
        while (cur !== cycleFound.v && cur !== null) { path.push(cur); cur = parent.get(cur); }
        path.push(cycleFound.v);
        html += '<p class="verdict warn">Cycle trouvé : ' + path.join(' → ') + '.</p>';
      }
    } else html += '<p class="verdict yes">Aucun cycle : le graphe est une forêt (réunion d\'arbres).</p>';
    $('#w3-comp').innerHTML = html;
    $('#w3-code').innerHTML = codeBlock('def composantes(G):\n    vus = set()\n    comps = []\n    for s in G:\n        if s in vus:\n            continue\n        comp = []\n        pile = [s]\n        while pile:\n            u = pile.pop()\n            if u in vus:\n                continue\n            vus.add(u)\n            comp.append(u)\n            for v in G[u]:\n                if v not in vus:\n                    pile.append(v)\n        comps.append(comp)\n    return comps\n\ndef a_un_cycle(G):\n    vus = set()\n    def explore(u, parent):\n        vus.add(u)\n        for v in G[u]:\n            if v not in vus:\n                if explore(v, u):\n                    return True\n            elif v != parent:\n                return True\n        return False\n    for s in G:\n        if s not in vus and explore(s, None):\n            return True\n    return False');
  }
  render();
}

function mountW4(root) {

    '<div class="opts"><div class="fld"><span>Graphe</span><div id="w4-g"></div></div><div class="fld"><span>Source</span><div id="w4-s"></div></div><div class="fld"><span>Destination</span><div id="w4-t"></div></div></div>' +
    '<div class="files" style="margin:8px 0"><button class="btn" id="w4-prev" type="button">◀ Précédent</button><button class="btn pri" id="w4-next" type="button">Suivant ▶</button><button class="btn" id="w4-play" type="button">Lecture</button><button class="btn" id="w4-reset" type="button">Départ</button></div>' +
    '<div class="gwrap"><svg id="w4-svg" viewBox="0 0 720 380"></svg></div>' +
    '<div class="legend"><span><i></i>non atteint</span><span><i class="f"></i>en attente (file de priorité)</span><span><i class="v"></i>distance définitive</span><span><i class="c"></i>extrait</span><span><i class="r"></i>relâchement</span><span><i class="p"></i>plus court chemin</span></div>' +
    '<div class="verdict" id="w4-msg" aria-live="polite"></div>' +

    '<h3>File de priorité naïve</h3><p class="small">On peut se contenter d\'un parcours linéaire pour extraire le minimum : le coût est alors O(|S|²). Une vraie file de priorité (tas binaire) ramène à O((|S| + |A|) log |S|).</p>' +
    '<div id="w4-table"></div>' +

  const S = W4;

  function render() {
    $('#w4-g').innerHTML = '';
    $('#w4-g').append(chipsRow([['pondere', 'Pondéré'], ['oriente', 'Orienté'], ['heuristique', 'Pour A*']], S.graph, v => { S.graph = v; S.start = GRAPHS[v].nodes[0]; S.target = GRAPHS[v].nodes[GRAPHS[v].nodes.length - 1]; S.step = 0; S.frames = null; stop(); render(); }, 'Graphe'));
    $('#w4-s').innerHTML = '';
    $('#w4-s').append(chipsRow(GRAPHS[S.graph].nodes.map(n => [n, n]), S.start, v => { S.start = v; S.step = 0; S.frames = null; stop(); render(); }, 'Source'));
    $('#w4-t').innerHTML = '';
    $('#w4-t').append(chipsRow(GRAPHS[S.graph].nodes.map(n => [n, n]), S.target, v => { S.target = v; S.step = 0; S.frames = null; stop(); render(); }, 'Destination'));
    const g = GRAPHS[S.graph];
    if (!S.frames) S.frames = dijkstra(g, S.start);
    const steps = S.frames.steps;
    const idx = Math.min(S.step, steps.length - 1);
    const st = steps[idx];
    const visited = st.visited, current = st.u, dist = st.dist;
    const frontier = dijkstraFrontier(st, g.nodes);
    let pathEdges = new Set(), final = new Set();
    const lastStep = idx >= steps.length - 1;
    if (lastStep && S.target) {
      const p = pathTo(S.frames.parent, S.target);
      final = new Set(p);
      for (let i = 0; i < p.length - 1; i++) pathEdges.add([p[i], p[i + 1]].sort().join('|'));
    }
    const treeEdges = new Set();
    for (const [v, u] of st.parent) treeEdges.add([u, v].sort().join('|'));
    drawGraph($('#w4-svg'), g, { visited, frontier, current, dist, treeEdges, pathEdges, final, relaxEdge: st.phase === 'relax' ? [st.u, st.v] : null });
    const msg = st.phase === 'extract'
      ? 'On extrait <b>' + current + '</b> (distance provisoire ' + dist.get(current) + '). Sa distance devient définitive : c\'est le plus proche sommet non visité.'
      : 'Relâchement de l\'arête ' + st.u + ' → ' + st.v + ' (poids ' + st.w + ') : nouvelle distance de ' + st.v + ' = ' + dist.get(st.v) + '.';
    $('#w4-msg').className = 'verdict' + (lastStep ? ' yes' : '');

    $('#w4-stats').innerHTML = '';

    ]));

    g.nodes.forEach(n => {

      else if (visited.has(n)) state = 'définitif';
      else if (frontier.has(n)) state = 'en attente';
      else state = (d === Infinity || d === undefined) ? '∞' : 'non atteint';
      tbl += '<tr' + (n === current ? ' style="background:var(--accent-soft)"' : '') + '><td><b>' + esc(n) + '</b></td><td class="m">' + (d === Infinity || d === undefined ? '∞' : d) + '</td><td class="m">' + (parent || '—') + '</td><td>' + state + '</td></tr>';
    });

    $('#w4-prev').disabled = idx === 0;

    render();
  });
  render();
}

/* ================= Atelier 5 : Dijkstra vs A* ================= */

function mountW5(root) {

    '<div class="gwrap"><svg id="w5-svg" viewBox="0 0 660 360"></svg></div>' +
    '<div class="legend"><span><i></i>inconnu</span><span><i class="f"></i>dans la file</span><span><i class="v"></i>fermé</span><span><i class="c"></i>extrait</span><span><i class="p"></i>chemin final</span></div>' +
    '<div class="verdict" id="w5-msg" aria-live="polite"></div>' +
    '<div class="gstats" id="w5-stats"></div>' +
    '<div id="w5-table"></div>' +
    '<h3>Code Python</h3><div id="w5-code"></div>';
  const S = W5;
  function stop() { if (S.timer) { clearInterval(S.timer); S.timer = null; } const b = $('#w5-play'); if (b) b.textContent = 'Lecture'; }
  function render() {
    $('#w5-m').innerHTML = '';
    $('#w5-m').append(chipsRow([['dijkstra', 'Dijkstra'], ['astar', 'A*']], S.mode, v => { S.mode = v; S.step = 0; S.frames = null; stop(); render(); }, 'Algorithme'));
    const g = GRAPHS.heuristique;
    if (!S.frames) S.frames = S.mode === 'astar' ? astar(g, S.start, S.target) : dijkstra(g, S.start);
    const steps = S.frames.steps;
    const idx = Math.min(S.step, steps.length - 1);
    const st = steps[idx];
    const dist = st.dist;
    let open, closed, frontier;
    if (st.open) {
      open = st.open;
      closed = st.closed;
      frontier = open;
    } else {
      closed = st.visited || new Set();
      frontier = dijkstraFrontier(st, g.nodes);
      open = frontier;
    }
    const current = st.u;
    const lastStep = idx >= steps.length - 1;
    let pathEdges = new Set(), final = new Set();
    if (lastStep) {
      const p = pathTo(S.frames.parent, S.target);
      final = new Set(p);
      for (let i = 0; i < p.length - 1; i++) pathEdges.add([p[i], p[i + 1]].sort().join('|'));
    }
    drawGraph($('#w5-svg'), g, { visited: closed, frontier, current, dist, pathEdges, final, relaxEdge: st.phase === 'relax' ? [st.u, st.v] : null });
    const hval = n => g.heur ? (g.heur[n] || 0) : 0;
    let msg;
    if (st.phase === 'goal') {
      msg = 'Le but ' + S.target + ' est atteint : distance = ' + dist.get(S.target) + '.';
    } else if (st.phase === 'extract') {
      if (S.mode === 'astar') {
        msg = 'On extrait <b>' + current + '</b> (g = ' + dist.get(current) + ', h = ' + hval(current) + ', f = ' + (dist.get(current) + hval(current)) + ').';
      } else {
        msg = 'On extrait <b>' + current + '</b> (distance provisoire ' + dist.get(current) + ').';
      }
    } else {
      msg = 'Relâchement ' + st.u + ' → ' + st.v + ' (poids ' + st.w + ') : distance de ' + st.v + ' = ' + dist.get(st.v) + '.';
    }
    $('#w5-msg').className = 'verdict' + (lastStep ? ' yes' : '');
    $('#w5-msg').innerHTML = '<b>Étape ' + idx + ' / ' + (steps.length - 1) + '.</b> ' + msg;
    $('#w5-stats').innerHTML = '';
    $('#w5-stats').append(stats([
      ['Algorithme', S.mode === 'astar' ? 'A* (g + h)' : 'Dijkstra (g)'],
      ['File', String(open.size)],
      ['Fermés', String(closed.size)],
      ['Distance de ' + S.target, dist.get(S.target) === Infinity ? '∞' : String(dist.get(S.target))]
    ]));
    const showHF = S.mode === 'astar';
    let tbl = '<h3>État courant</h3><div class="dwrap"><table class="dt"><thead><tr><th>Sommet</th><th>g</th>' + (showHF ? '<th>h</th><th>f = g+h</th>' : '') + '<th>État</th></tr></thead><tbody>';
    g.nodes.forEach(n => {
      const d = dist.get(n);
      let state;
      if (final.has(n)) state = 'chemin final';
      else if (n === current) state = 'extrait';
      else if (closed.has(n)) state = 'fermé';
      else if (open.has(n)) state = 'dans la file';
      else state = (d === Infinity || d === undefined) ? '∞' : 'non atteint';
      let row = '<tr' + (n === current ? ' style="background:var(--accent-soft)"' : '') + '><td><b>' + esc(n) + '</b></td><td class="m">' + (d === Infinity || d === undefined ? '∞' : d) + '</td>';
      if (showHF) {
        const hv = hval(n);
        const f = (d === Infinity || d === undefined) ? Infinity : d + hv;
        row += '<td class="m">' + hv + '</td><td class="m">' + (f === Infinity ? '∞' : f) + '</td>';
      }
      row += '<td>' + state + '</td></tr>';
      tbl += row;
    });
    tbl += '</tbody></table></div>';
    
    // Tableau d'évolution
    tbl += '<h3>Tableau des distances (g)</h3>';
    tbl += buildHistoryTable(steps, g, S.start, S.frames.dist, S.frames.parent, idx);

    if (lastStep) {
      const p = pathTo(S.frames.parent, S.target);
      tbl += '<p class="verdict yes">Chemin trouvé : <b>' + p.join(' → ') + '</b>, longueur <b>' + S.frames.dist.get(S.target) + '</b>.</p>';
    }
    $('#w5-table').innerHTML = tbl;
    const codeDij = 'def dijkstra(G, s):\n    dist = {u: float("inf") for u in G}\n    dist[s] = 0\n    parent = {}\n    vus = set()\n    while len(vus) < len(G):\n        u = min((x for x in G if x not in vus), key=dist.get, default=None)\n        if u is None or dist[u] == float("inf"):\n            break\n        vus.add(u)\n        for v, w in G[u].items():\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n                parent[v] = u\n    return dist, parent';
    const codeAst = 'def astar(G, s, t, h):\n    dist = {u: float("inf") for u in G}\n    dist[s] = 0\n    parent = {}\n    ouvert = {s}\n    ferme = set()\n    while ouvert:\n        u = min(ouvert, key=lambda x: dist[x] + h[x])\n        if u == t:\n            break\n        ouvert.remove(u)\n        ferme.add(u)\n        for v, w in G[u].items():\n            if v in ferme:\n                continue\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n                parent[v] = u\n                ouvert.add(v)\n    return dist, parent';
    $('#w5-code').innerHTML = S.mode === 'astar' ? codeBlock(codeAst) : codeBlock(codeDij);
    $('#w5-prev').disabled = idx === 0;
    $('#w5-next').disabled = lastStep;
  }
  $('#w5-prev').addEventListener('click', () => { stop(); if (S.step > 0) { S.step--; render(); } });
  $('#w5-next').addEventListener('click', () => { stop(); if (S.step < S.frames.steps.length - 1) { S.step++; render(); } });
  $('#w5-reset').addEventListener('click', () => { stop(); S.step = 0; render(); });
  $('#w5-play').addEventListener('click', () => {
    if (S.timer) { stop(); return; }
    if (S.step >= S.frames.steps.length - 1) S.step = 0;
    $('#w5-play').textContent = 'Pause';
    S.timer = setInterval(() => { if (S.step >= S.frames.steps.length - 1) { stop(); render(); return; } S.step++; render(); }, 900);
    render();
  });
  render();
}

COURSE.push({ id: 'vocabulaire', t: 'Vocabulaire et notations', h: `
<p>Un graphe <b>G = (S, A)</b> est la donnée d'un ensemble de <b>sommets</b> S et d'un ensemble d'<b>arêtes</b> (ou <b>arcs</b>) A.</p>
<h3>Graphe non orienté</h3>
<ul><li><b>Arête</b> {u, v} : les deux extrémités sont reliées sans direction.</li><li><b>Degré</b> d(u) : nombre de voisins de u. On a Σ d(u) = 2|A|.</li><li><b>Chemin</b> : suite de sommets reliés par des arêtes.</li><li><b>Cycle</b> : chemin qui revient à son point de départ.</li><li><b>Connexe</b> : tout sommet est relié à tout autre par un chemin.</li></ul>
<h3>Graphe orienté</h3>
<ul><li><b>Arc</b> u → v : sens de u vers v.</li><li><b>Degré entrant</b> d₋(u) : nombre d'arcs qui arrivent à u. <b>Degré sortant</b> d₊(u) : nombre d'arcs qui partent de u.</li><li>Σ d₋(u) = Σ d₊(u) = |A|.</li></ul>
<h3>Pondération</h3>
<p>Chaque arête (ou arc) peut être étiquetée par un <b>poids</b> : une distance, un coût, une durée. Le graphe est alors dit <b>pondéré</b>.</p>
<h3>Représentations</h3>
<table class="ctable"><thead><tr><th>Représentation</th><th>Mémoire</th><th>Voisins de u</th><th>Arête u→v ?</th></tr></thead><tbody>
<tr><td>Listes d'adjacence</td><td>O(|S| + |A|)</td><td>O(degré(u))</td><td>O(degré(u))</td></tr>
<tr><td>Matrice d'adjacence</td><td>O(|S|²)</td><td>O(|S|)</td><td>O(1)</td></tr>
</tbody></table>
<pre class="code">G = {
    'A': ['B', 'C'],
    'B': ['A', 'D'],
    'C': ['A', 'D'],
    'D': ['B', 'C']
}

M = [[0, 1, 1, 0],
     [1, 0, 0, 1],

<div class="retain"><b>À retenir.</b> Un graphe se représente par ses sommets et ses arêtes. On choisit listes d'adjacence pour les graphes creux, matrice pour les graphes denses.</div>` });

COURSE.push({ id: 'parcours', t: 'Parcours BFS et DFS', h: `
<p>Parcourir un graphe, c'est visiter ses sommets en suivant ses arêtes. On distingue deux stratégies.</p>
<h3>Parcours en largeur (BFS)</h3>
<p>On utilise une <b>file</b> : on ajoute les voisins en queue et on extrait en tête. On explore d'abord tous les sommets à distance 1, puis 2, etc.</p>
<pre class="code">from collections import deque

def bfs(G, s):
    file = deque([s])
    vus = {s}
    while file:
        u = file.popleft()       # O(1)
        for v in G[u]:
            if v not in vus:
                vus.add(v)
                file.append(v)
    return vus</pre>
<p>Le BFS calcule la <b>distance en nombre d'arêtes</b> depuis s.</p>
<h3>Parcours en profondeur (DFS)</h3>
<p>On utilise une <b>pile</b> : on empile et on dépile au même endroit. On descend aussi loin que possible avant de revenir.</p>
<pre class="code">def dfs(G, s):
    pile = [s]
    vus = set()
    while pile:
        u = pile.pop()
        if u in vus:
            continue
        vus.add(u)
        for v in G[u]:
            if v not in vus:
                pile.append(v)
    return vus</pre>
<h3>File ou pile : coût</h3>
<p>Une liste Python peut servir de file, mais <code>pop(0)</code> est en O(n) : le BFS devient O(n²). <code>collections.deque</code> fournit <code>popleft()</code> en O(1).</p>
<div class="retain"><b>À retenir.</b> BFS = file ; DFS = pile. Le BFS donne les distances en nombre d'arêtes. <code>deque</code> évite le coût de <code>list.pop(0)</code>.</div>` });

COURSE.push({ id: 'connexite', t: 'Connexité et cycles', h: `
<h3>Composantes connexes</h3>
<p>Un parcours depuis un sommet visite exactement sa composante connexe. Pour trouver toutes les composantes, on recommence depuis chaque sommet non visité.</p>
<pre class="code">def composantes(G):
    vus = set()
    comps = []
    for s in G:
        if s in vus:
            continue
        comp = []
        pile = [s]
        while pile:
            u = pile.pop()
            if u in vus:
                continue
            vus.add(u)
            comp.append(u)
            for v in G[u]:
                if v not in vus:
                    pile.append(v)
        comps.append(comp)
    return comps</pre>
<h3>Détection de cycle</h3>
<p>Sur un graphe non orienté, un DFS détecte un cycle quand il rencontre un sommet déjà visité autre que son parent.</p>
<pre class="code">def a_un_cycle(G):
    vus = set()
    def explore(u, parent):
        vus.add(u)
        for v in G[u]:
            if v not in vus:
                if explore(v, u):
                    return True
            elif v != parent:
                return True
        return False
    for s in G:
        if s not in vus and explore(s, None):
            return True
    return False</pre>
<p>Un graphe non orienté connexe sans cycle est un <b>arbre</b> : il a exactement |S| − 1 arêtes.</p>
<div class="retain"><b>À retenir.</b> Le parcours permet de tester connexité et acyclicité en temps linéaire.</div>` });

COURSE.push({ id: 'dijkstra', t: 'Plus courts chemins : Dijkstra', h: `
<p>Dans un graphe pondéré à poids <b>positifs</b>, on cherche le chemin de poids minimal entre deux sommets.</p>
<h3>Principe</h3>
<p>On maintient pour chaque sommet une distance provisoire depuis la source. À chaque étape :</p>
<ol><li>extraire le sommet non visité de distance minimale ;</li><li>sa distance devient définitive ;</li><li>relâcher ses arêtes : pour chaque voisin v, si dist(u) + poids(u, v) < dist(v), mettre à jour dist(v).</li></ol>
<h3>Exemple</h3>
<pre class="code">A --4-- B
| \     |
2  5    10
|   \   |
C --3-- E --4-- D --11-- F</pre>
<p>Plus court chemin de A à D : A → C (2) → E (3) → D (4) = 9.</p>
<h3>Code Python</h3>
<pre class="code">def dijkstra(G, s):
    dist = {u: float("inf") for u in G}
    dist[s] = 0
    parent = {}
    vus = set()
    while len(vus) < len(G):
        # extraction du minimum : file de priorité naïve
        u = min((x for x in G if x not in vus), key=dist.get, default=None)
        if u is None or dist[u] == float("inf"):
            break
        vus.add(u)
        for v, w in G[u].items():
            if dist[u] + w < dist[v]:
                dist[v] = dist[u] + w
                parent[v] = u
    return dist, parent</pre>
<p>Avec une file de priorité (tas binaire), le coût est <b>O((|S| + |A|) log |S|)</b> ; avec l'extraction naïve en O(|S|), il est <b>O(|S|²)</b>.</p>
<div class="retain"><b>À retenir.</b> Dijkstra suppose des poids positifs. Chaque sommet est extrait une seule fois. Le résultat est un arbre des plus courts chemins.</div>` });

COURSE.push({ id: 'astar', t: 'A* et heuristique', h: `
<p>Quand on connaît une estimation de la distance au but (<b>heuristique</b> h), on peut orienter la recherche.</p>
<h3>Principe</h3>
<p>Pour chaque sommet x, on évalue <b>f(x) = g(x) + h(x)</b> : g(x) est la distance connue depuis la source, h(x) est l'estimation vers le but. On extrait le sommet de f minimal.</p>
<h3>Admissibilité</h3>
<p>Une heuristique est <b>admissible</b> si h(x) ≤ distance réelle de x au but. Alors A* trouve toujours un plus court chemin.</p>
<ul><li>Si h ≡ 0, A* se réduit à Dijkstra (f = g).</li><li>Si h est très pessimiste (grande), A* se comporte comme un parcours en largeur et perd l'avantage de l'heuristique.</li><li>Si h est très optimiste (trop petite), A* explore plus de sommets que nécessaire.</li></ul>
<h3>Code Python</h3>
<pre class="code">def astar(G, s, t, h):
    dist = {u: float("inf") for u in G}
    dist[s] = 0
    parent = {}
    ouvert = {s}
    ferme = set()
    while ouvert:
        u = min(ouvert, key=lambda x: dist[x] + h[x])
        if u == t:
            break
        ouvert.remove(u)
        ferme.add(u)
        for v, w in G[u].items():
            if v in ferme:
                continue
            if dist[u] + w < dist[v]:
                dist[v] = dist[u] + w
                parent[v] = u
                ouvert.add(v)
    return dist, parent</pre>
<p>Par rapport à Dijkstra, A* ferme en général moins de sommets : c'est l'intérêt de l'heuristique.</p>
<div class="retain"><b>À retenir.</b> A* = Dijkstra + heuristique. Une heuristique admissible garantit l'optimalité. h nulle redonne Dijkstra.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Sommet (ou nœud)</dt><dd>Élément d'un graphe.</dd>
<dt>Arête</dt><dd>Lien non orienté entre deux sommets.</dd>
<dt>Arc</dt><dd>Lien orienté entre deux sommets.</dd>
<dt>Degré</dt><dd>Nombre d'arêtes incidentes à un sommet (non orienté) ; d₋ et d₊ en orienté.</dd>
<dt>Chemin</dt><dd>Suite de sommets reliés par des arêtes ou arcs.</dd>
<dt>Cycle</dt><dd>Chemin qui revient à son point de départ.</dd>
<dt>Connexe</dt><dd>Graphe non orienté où tout sommet est relié à tout autre.</dd>
<dt>Composante connexe</dt><dd>Sous-ensemble maximal de sommets reliés entre eux.</dd>
<dt>Liste d'adjacence</dt><dd>Représentation où G[u] contient les voisins de u.</dd>
<dt>Matrice d'adjacence</dt><dd>Matrice M où M[u][v] vaut 1 (ou le poids) si l'arête existe.</dd>
<dt>File</dt><dd>Structure FIFO : on retire en tête, on ajoute en queue.</dd>
<dt>Pile</dt><dd>Structure LIFO : on ajoute et retire au même endroit.</dd>
<dt>BFS</dt><dd>Parcours en largeur, avec une file.</dd>
<dt>DFS</dt><dd>Parcours en profondeur, avec une pile.</dd>
<dt>Dijkstra</dt><dd>Algorithme des plus courts chemins à poids positifs.</dd>
<dt>A*</dt><dd>Dijkstra + heuristique h ; f = g + h.</dd>
<dt>Heuristique</dt><dd>Estimation de la distance restante au but ; admissible si elle ne surestime jamais.</dd>
</dl>` });

}

  UI.cur = id; AS.key = id; AS.tab = 'steps';

}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');

  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);

    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
